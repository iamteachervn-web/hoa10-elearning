<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai9-elearning-on-tap-chuong-2 bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai9-elearning-on-tap-chuong-2', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}

.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}

.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}

#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}

.xoay{display:none}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}

.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}

#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}

tạo nguyên tử", "muc": "hieu", "yccd": [1, 3], "sgk": ["HT3"], "hoi": "Nối mỗi đại lượng với đại lượng bằng nó.", "noi": "Bạn nối mỗi đại lượng ở bảng tuần hoàn với đại lượng bằng nó trong nguyên tử.", "giai": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng.", "vi_sao": "Đúng hết! Số Z = số hiệu nguyên tử = số proton = số electron; số thứ tự chu kì = số lớp electron; số thứ tự nhóm A = số electron lớp ngoài cùng.", "phai": ["Số neutron", "Số proton = số electron", "Số lớp electron", "Số electron lớp ngoài cùng"], "trai": [{"chu": "Số hiệu nguyên tử (số Z)"}, {"chu": "Số thứ tự chu kì"}, {"chu": "Số thứ tự nhóm A"}], "dap": [1, 2, 3], "hoi_id": "c4-hoi", "sai_id": "c4-sai", "vi_sao_id": "c4-vi-sao", "sai_rieng": {"0": "c4-sai-2"}}, {"ma": "c5", "loai": "chon", "ten": "Định luật tuần hoàn", "muc": "biet", "yccd": [3], "sgk": ["HT4"], "hoi": "Tính chất của các …(1)… và đơn chất cũng như thành phần và …(2)… của các hợp chất tạo nên từ các nguyên tố đó biến đổi tuần hoàn theo chiều tăng của …(3)… nguyên tử. Bộ từ điền đúng là", "noi": "Bạn chọn bộ từ điền đúng vào ba chỗ trống của định luật tuần hoàn.", "lua": [{"chu": "(1) nguyên tố · (2) tính chất · (3) khối lượng", "giai": "Chỗ (3) sai: bảng tuần hoàn hiện đại không xếp theo khối lượng nguyên tử.", "sai_id": "c5-sai-1"}, {"chu": "(1) nguyên tố · (2) tính chất · (3) điện tích hạt nhân", "dung": true}, {"chu": "(1) hợp chất · (2) khối lượng · (3) điện tích hạt nhân", "giai": "Đơn chất đi cùng nguyên tố ở chỗ (1); chỗ (2) nói về tính chất của hợp chất, không phải khối lượng.", "sai_id": "c5-sai-3"}, {"chu": "(1) nguyên tố · (2) tính chất · (3) số lớp electron", "giai": "Số lớp electron chỉ cho biết chu kì. Định luật nói theo chiều tăng điện tích hạt nhân.", "sai_id": "c5-sai-4"}], "vi_sao": "Tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "hoi_id": "c5-hoi", "vi_sao_id": "c5-vi-sao"}, {"ma": "c6", "loai": "trinh-bay", "ten": "Định luật tuần hoàn", "nen": "xanh-duong", "bo_cuc": "trich-dan", "sac": "trang-trong", "sgk": ["HT4"], "trich": "Tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất tạo nên từ các nguyên tố đó biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 43", "hinh": {"chu": "Định luật tuần hoàn"}, "dong": [{"sau": 20, "id": "c6-1"}, {"the": "nguyên tố · tính chất · **điện tích hạt nhân**", "id": "c6-2"}, {"the": "Vị trí → **dự đoán** tính chất", "id": "c6-3"}]}, {"ma": "c7", "loai": "keo-tha", "ten": "Xu hướng trong một chu kì", "muc": "hieu", "yccd": [2], "sgk": ["HT2"], "diem": 2, "hoi": "Trong một chu kì, đi từ trái sang phải, mỗi đại lượng tăng hay giảm?", "noi": "Phần hai: xu hướng biến đổi. Trong một chu kì, đi từ trái sang phải, mỗi đại lượng tăng hay giảm? Bạn xếp thẻ vào đúng nhóm.", "nhom": ["Tăng dần", "Giảm dần"], "the": [{"chu": "Độ âm điện", "nhom": 0}, {"chu": "Tính phi kim", "nhom": 0}, {"chu": "Tính acid của oxide, hydroxide", "nhom": 0}, {"chu": "Bán kính nguyên tử", "nhom": 1}, {"chu": "Tính kim loại", "nhom": 1}, {"chu": "Tính base của oxide, hydroxide", "nhom": 1}], "giai": "Trong chu kì, điện tích hạt nhân tăng mà số lớp electron không đổi, nên hạt nhân hút electron mạnh hơn: nguyên tử nhỏ lại, khó nhường, dễ nhận electron hơn.", "vi_sao": "Đúng hết! Trái sang phải: độ âm điện, tính phi kim, tính acid tăng; bán kính, tính kim loại, tính base giảm.", "hoi_id": "c7-hoi", "sai_id": "c7-sai", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "keo-tha", "ten": "Xu hướng trong một nhóm A", "muc": "hieu", "yccd": [2], "sgk": ["HT2"], "hoi": "Trong một nhóm A, đi từ trên xuống dưới, mỗi đại lượng tăng hay giảm?", "noi": "Còn trong một nhóm A, đi từ trên xuống dưới thì sao? Bạn xếp thẻ vào đúng nhóm.", "nhom": ["Tăng dần", "Giảm dần"], "the": [{"chu": "Bán kính nguyên tử", "nhom": 0}, {"chu": "Tính kim loại", "nhom": 0}, {"chu": "Độ âm điện", "nhom": 1}, {"chu": "Tính phi kim", "nhom": 1}], "giai": "Đi xuống trong nhóm, số lớp electron tăng nên electron ngoài cùng ở xa hạt nhân, bị hút yếu hơn.", "vi_sao": "Đúng hết! Trên xuống dưới: bán kính, tính kim loại tăng; độ âm điện, tính phi kim giảm.", "hoi_id": "c8-hoi", "sai_id": "c8-sai", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "trinh-bay", "ten": "Bản đồ xu hướng", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["HT2"], "hinh": {"anh": "b09-xu-huong.png", "chu": "Xu hướng biến đổi trong bảng tuần hoàn (tổng hợp theo SGK)"}, "dong": [{"the": "Chu kì: **trái → phải**", "id": "c9-1"}, {"the": "↑ độ âm điện, phi kim, acid · ↓ bán kính, kim loại, base", "id": "c9-2"}, {"the": "Nhóm A: ↑ bán kính, kim loại · ↓ độ âm điện, phi kim", "id": "c9-3"}, {"the": "Dưới trái: **kim loại** · Trên phải: **phi kim**", "id": "c9-4"}]}, {"ma": "c10", "loai": "trinh-bay", "ten": "Câu 1: đọc bảng rút gọn", "nen": "xanh-la", "bo_cuc": "luoi-4", "sgk": ["1"], "hinh": {"anh": "b09-cau1-bang.png", "chu": "Bảng tuần hoàn rút gọn của Câu 1 (vẽ lại theo SGK tr. 46)"}, "dong": [{"id": "c10-1"}, {"the": "Y, E, X, T: **cùng chu kì**", "id": "c10-2"}, {"the": "T, Q: **cùng nhóm**, Q ở dưới", "id": "c10-3"}, {"the": "Dùng **bản đồ xu hướng**", "id": "c10-4"}]}, {"ma": "c11", "loai": "keo-tha", "ten": "Câu 1 SGK: xét từng nhận xét", "muc": "van-dung", "yccd": [2], "sgk": ["1"], "diem": 2, "hoi": "Mỗi nhận xét về bảng rút gọn đúng hay sai?", "noi": "Bạn xét từng nhận xét của Câu 1, rồi xếp vào cột đúng hoặc sai.", "nhom": ["Đúng", "Sai"], "the": [{"chu": "(1) Giảm dần tính kim loại: Y, E, X", "nhom": 0}, {"chu": "(2) Tăng dần độ âm điện: Y, X, T", "nhom": 0}, {"chu": "(3) Tăng dần tính phi kim: T, Q", "nhom": 1}, {"chu": "(4) Giảm dần bán kính: Y, E, X, T", "nhom": 0}], "giai": "Y, E, X, T cùng chu kì, xếp từ trái sang phải. T và Q cùng nhóm, Q ở dưới nên tính phi kim của Q yếu hơn T.", "vi_sao": "Đúng hết! (1), (2), (4) theo đúng xu hướng trong chu kì. (3) sai: đi xuống trong nhóm, tính phi kim giảm, nên T mạnh hơn Q.", "hoi_id": "c11-hoi", "sai_id": "c11-sai", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Câu 1 SGK: chốt đáp án", "muc": "van-dung", "yccd": [2], "sgk": ["1"], "hoi": "Câu 1. Số nhận xét đúng là", "noi": "Vậy Câu 1 có bao nhiêu nhận xét đúng?", "lua": [{"chu": "A. 1", "giai": "Bạn đếm lại: chỉ có nhận xét (3) sai.", "sai_id": "c12-sai-1"}, {"chu": "B. 2", "giai": "Nhận xét (4) cũng đúng: trong chu kì, bán kính giảm từ trái sang phải.", "sai_id": "c12-sai-2"}, {"chu": "C. 3", "dung": true}, {"chu": "D. 4", "giai": "Nhận xét (3) sai: trong nhóm VIIA, Q ở dưới T nên tính phi kim yếu hơn T.", "sai_id": "c12-sai-4"}], "vi_sao": "Có 3 nhận xét đúng là (1), (2), (4). Đáp án C, đúng như SGV.", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "chon", "ten": "Câu 2 SGK: sulfur", "muc": "van-dung", "yccd": [3], "sgk": ["2"], "diem": 2, "hoi": "S thuộc nhóm VIA, chu kì 3. (1) S có 3 lớp electron và 10 electron p. (2) S có 5 electron hoá trị và 6 electron s. (3) Oxide cao nhất SO₃ là acidic oxide. (4) S có tính phi kim mạnh hơn nguyên tố Z = 8. (5) Hydroxide cao nhất H₂SO₄ có tính acid. Số phát biểu đúng là", "noi": "Câu 2. Bạn viết nháp cấu hình electron của sulfur, đọc năm phát biểu trên màn hình, rồi chọn số phát biểu đúng.", "lua": [{"chu": "A. 2", "giai": "Bạn xem lại (1): cấu hình 1s²2s²2p⁶3s²3p⁴ có 6 + 4 = 10 electron p, nên (1) đúng.", "sai_id": "c13-sai-1"}, {"chu": "B. 3", "dung": true}, {"chu": "C. 4", "giai": "S ở nhóm VIA có 6 electron hoá trị, không phải 5, nên (2) sai. Nguyên tố Z = 8 là O, cùng nhóm, ở trên S nên phi kim mạnh hơn S: (4) sai.", "sai_id": "c13-sai-3"}, {"chu": "D. 5", "giai": "Có hai phát biểu sai: (2) vì S có 6 electron hoá trị, (4) vì O phi kim mạnh hơn S.", "sai_id": "c13-sai-4"}], "vi_sao": "S: 1s²2s²2p⁶3s²3p⁴ có 3 lớp, 10 electron p, 6 electron s, 6 electron hoá trị. Đúng: (1), (3), (5). Sai: (2) và (4) vì O (Z = 8) phi kim mạnh hơn S. Đáp án B.", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Câu 3 SGK: oxide của X và Y", "muc": "van-dung", "yccd": [3], "sgk": ["3"], "diem": 2, "hoi": "X, Y cùng chu kì, oxide cao nhất là XO và YO₃. (1) X, Y thuộc 2 nhóm A kế tiếp. (2) X là kim loại, Y là phi kim. (3) XO là basic oxide, YO₃ là acidic oxide. (4) Hydroxide cao nhất của Y là Y(OH)₆, có tính base. Số phát biểu đúng là", "noi": "Câu 3. Từ công thức oxide cao nhất, bạn suy ra hoá trị, rồi nhóm của X và Y. Sau đó chọn số phát biểu đúng.", "lua": [{"chu": "A. 2", "dung": true}, {"chu": "B. 3", "giai": "Phát biểu (1) sai: XO cho X hoá trị II (nhóm IIA), YO₃ cho Y hoá trị VI (nhóm VIA), không kế tiếp nhau.", "sai_id": "c14-sai-2"}, {"chu": "C. 4", "giai": "Có hai phát biểu sai: (1) và (4). Y là phi kim nên hydroxide cao nhất có tính acid.", "sai_id": "c14-sai-3"}, {"chu": "D. 1", "giai": "Cả (2) và (3) đều đúng: X nhóm IIA là kim loại, XO là basic oxide; Y nhóm VIA là phi kim, YO₃ là acidic oxide.", "sai_id": "c14-sai-4"}], "vi_sao": "X nhóm IIA, Y nhóm VIA. Đúng: (2), (3). Sai: (1) vì hai nhóm không kế tiếp; (4) vì hydroxide cao nhất của Y có dạng H₂YO₄ và có tính acid. Đáp án A.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "trinh-bay", "ten": "Câu 4: borax", "nen": "cam", "bo_cuc": "trich-dan", "sgk": ["4"], "trich": "Borax (Na₂B₄O₇·10H₂O), còn gọi là hàn the, là khoáng chất dạng tinh thể.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 47", "hinh": {"chu": "Borax"}, "dong": [{"sau": 6, "id": "c15-1"}, {"the": "Hàn kim loại · thuỷ tinh · men sứ · bột giặt", "id": "c15-2"}, {"the": "Xét **Na, B, O**", "id": "c15-3"}]}, {"ma": "c16", "loai": "noi", "ten": "Câu 4a SGK: vị trí", "muc": "van-dung", "yccd": [3], "sgk": ["4"], "hoi": "Nối mỗi nguyên tố với vị trí của nó.", "noi": "Biết sodium có Z bằng mười một, bo có Z bằng năm, oxygen có Z bằng tám. Bạn viết nháp cấu hình, rồi nối mỗi nguyên tố với vị trí.", "giai": "Số lớp electron cho chu kì, số electron lớp ngoài cùng cho nhóm A.", "vi_sao": "Na: 1s²2s²2p⁶3s¹ → chu kì 3, nhóm IA. B: 1s²2s²2p¹ → chu kì 2, nhóm IIIA. O: 1s²2s²2p⁴ → chu kì 2, nhóm VIA.", "phai": ["Chu kì 2, nhóm IIIA", "Chu kì 3, nhóm IA", "Chu kì 2, nhóm VIA", "Chu kì 3, nhóm IIIA"], "trai": [{"chu": "Na (Z = 11)"}, {"chu": "B (Z = 5)"}, {"chu": "O (Z = 8)"}], "dap": [1, 0, 2], "hoi_id": "c16-hoi", "sai_id": "c16-sai", "vi_sao_id": "c16-vi-sao", "sai_rieng": {"3": "c16-sai-2"}}, {"ma": "c17", "loai": "chon", "ten": "Câu 4b SGK: bán kính", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hinh": {"anh": "b09-borax.png"}, "hoi": "Thứ tự bán kính nguyên tử tăng dần của Na, B, O là", "noi": "Bạn nhìn vị trí ba nguyên tố trong bảng. Thứ tự bán kính nguyên tử tăng dần là gì?", "lua": [{"chu": "O < B < Na", "dung": true}, {"chu": "Na < B < O", "giai": "Đây là thứ tự giảm dần. Na có 3 lớp electron nên bán kính lớn nhất.", "sai_id": "c17-sai-2"}, {"chu": "B < O < Na", "giai": "B và O cùng chu kì 2, O ở bên phải nên bán kính nhỏ hơn B.", "sai_id": "c17-sai-3"}, {"chu": "O < Na < B", "giai": "Na ở chu kì 3, nhiều lớp electron hơn B nên bán kính lớn hơn B.", "sai_id": "c17-sai-4"}], "vi_sao": "O và B cùng chu kì 2, bán kính giảm từ trái qua phải nên O < B. Na ở chu kì 3 có nhiều lớp electron hơn nên lớn nhất: O < B < Na.", "hoi_id": "c17-hoi", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "chon", "ten": "Câu 4c SGK: độ âm điện", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hoi": "Thứ tự độ âm điện giảm dần của Na, B, O là", "noi": "Còn độ âm điện, thứ tự giảm dần của ba nguyên tố là gì?", "lua": [{"chu": "Na > B > O", "giai": "Đây là thứ tự tăng dần. O là phi kim mạnh, độ âm điện lớn nhất.", "sai_id": "c18-sai-1"}, {"chu": "O > Na > B", "giai": "Na là kim loại mạnh, độ âm điện nhỏ nhất trong ba nguyên tố.", "sai_id": "c18-sai-2"}, {"chu": "O > B > Na", "dung": true}, {"chu": "B > O > Na", "giai": "B và O cùng chu kì, O ở bên phải nên độ âm điện lớn hơn B.", "sai_id": "c18-sai-4"}], "vi_sao": "Cùng chu kì 2: B < O. Na < Al (cùng chu kì 3) và Al < B (cùng nhóm IIIA) nên Na < B. Vậy O > B > Na.", "hoi_id": "c18-hoi", "vi_sao_id": "c18-vi-sao"}, {"ma": "c19", "loai": "chon", "ten": "Câu 5 SGK: cafein", "muc": "van-dung", "yccd": [2, 3], "sgk": ["5"], "hoi": "Cafein tạo nên từ C (Z = 6), N (Z = 7), O (Z = 8) và H. So sánh nào đúng cho C, N, O?", "noi": "Câu 5. Cafein, chất gây đắng trong cà phê và trà, tạo nên từ carbon, nitrogen, oxygen và hydrogen. So sánh nào đúng cho carbon, nitrogen và oxygen?", "lua": [{"chu": "Phi kim: C < N < O; độ âm điện: C < N < O; bán kính: C > N > O", "dung": true}, {"chu": "Phi kim: C > N > O; độ âm điện: C > N > O; bán kính: C < N < O", "giai": "C, N, O cùng chu kì 2, Z tăng thì tính phi kim và độ âm điện tăng, bán kính giảm. Bạn đang đảo ngược chiều.", "sai_id": "c19-sai-2"}, {"chu": "Phi kim: C < N < O; độ âm điện: C < N < O; bán kính: C < N < O", "giai": "Trong chu kì, Z tăng thì bán kính giảm, nên C > N > O.", "sai_id": "c19-sai-3"}, {"chu": "Ba nguyên tố như nhau vì cùng ở chu kì 2", "giai": "Cùng chu kì nhưng Z khác nhau nên tính chất biến đổi theo xu hướng.", "sai_id": "c19-sai-4"}], "vi_sao": "C (IVA), N (VA), O (VIA) cùng chu kì 2, Z tăng dần: tính phi kim C < N < O, độ âm điện C < N < O, bán kính C > N > O.", "hoi_id": "c19-hoi", "vi_sao_id": "c19-vi-sao"}, {"ma": "c20", "loai": "dien", "ten": "Câu 6a SGK: tìm Z", "muc": "van-dung", "yccd": [3], "sgk": ["6"], "hoi": "A, B đứng kế tiếp nhau trong cùng chu kì, tổng điện tích hạt nhân là 25. Z của A (nguyên tố đứng trước) bằng bao nhiêu?", "noi": "Câu 6. A và B đứng kế tiếp nhau trong cùng một chu kì, tổng điện tích hạt nhân là hai mươi lăm. Z của A, nguyên tố đứng trước, bằng bao nhiêu?", "dap": ["12", "mười hai", "muoi hai"], "giai": "Hai nguyên tố kế tiếp hơn kém nhau 1 đơn vị điện tích hạt nhân. Bạn đặt Z của A là x thì Z của B là x + 1.", "vi_sao": "x + (x + 1) = 25 nên x = 12. A là Mg (Z = 12), B là Al (Z = 13).", "hoi_id": "c20-hoi", "sai_id": "c20-sai", "vi_sao_id": "c20-vi-sao"}, {"ma": "c21", "loai": "chon", "ten": "Câu 6 SGK: vị trí và so sánh", "muc": "van-dung", "yccd": [2, 3], "sgk": ["6"], "hoi": "A là Mg (Z = 12), B là Al (Z = 13). Nhận định nào đúng?", "noi": "A là magnesium, B là aluminium. Nhận định nào đúng về vị trí và tính chất của hai nguyên tố?", "lua": [{"chu": "Mg: chu kì 3, nhóm IIA; Al: chu kì 3, nhóm IIIA; tính kim loại Mg > Al", "dung": true}, {"chu": "Mg: chu kì 3, nhóm IIA; Al: chu kì 3, nhóm IIIA; tính kim loại Mg < Al", "giai": "Trong một chu kì, tính kim loại giảm dần theo chiều tăng điện tích hạt nhân, nên Mg mạnh hơn Al.", "sai_id": "c21-sai-2"}, {"chu": "Mg: chu kì 2, nhóm IIA; Al: chu kì 2, nhóm IIIA", "giai": "Mg: 1s²2s²2p⁶3s² và Al: 1s²2s²2p⁶3s²3p¹ đều có 3 lớp electron nên ở chu kì 3.", "sai_id": "c21-sai-3"}, {"chu": "Mg và Al cùng nhóm IIA nên tính chất giống hệt nhau", "giai": "Al có 3 electron lớp ngoài cùng (3s²3p¹) nên ở nhóm IIIA.", "sai_id": "c21-sai-4"}], "vi_sao": "Mg 1s²2s²2p⁶3s²: chu kì 3, nhóm IIA. Al 1s²2s²2p⁶3s²3p¹: chu kì 3, nhóm IIIA. Cùng chu kì, Z tăng thì tính kim loại giảm: Mg > Al.", "hoi_id": "c21-hoi", "vi_sao_id": "c21-vi-sao"}, {"ma": "c22", "loai": "ghi-nho", "ten": "Điều cần nhớ", "sgk": ["HT1", "HT2", "HT3", "HT4"], "y": [{"chu": "Sắp xếp", "dam": "theo chiều tăng Z"}, {"chu": "Chu kì →", "dam": "ĐAĐ, phi kim, acid ↑"}, {"chu": "Nhóm A ↓", "dam": "Bán kính, kim loại ↑"}], "o_nha": "Câu 4a, 5a, 6a SGK tr. 47: viết vào vở cấu hình electron và vị trí của Na, B, O, C, N, Mg, Al; viết lời giải thích cho Câu 4b, 4c, 5b để đối chiếu ở tiết sau.", "dong": [{"id": "c22-1"}, {"id": "c22-2"}, {"id": "c22-3"}, {"id": "c22-4"}]}, {"ma": "ket", "loai": "ket-qua", "ten": "Kết quả"}], "dan_hinh": {"nhan-vat": {"ve": "Bạn La Bàn — đứng thẳng, mỉm cười", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat.png", "loai": "nhan-vat"}, "nhan-vat-m-ngam": {"ve": "Bạn La Bàn — miệng ngậm", "nguon": "Tranh minh hoạ AI (Gemini), ng 904, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Đến năm 2016, bảng có 118 nguyên tố, 7 chu kì, 18 cột chia thành 8 nhóm A và 8 nhóm B (nhóm VIIIB gồm 3 cột), tức 16 nhóm."}, "c4-hoi": {"d": 5.28, "s": "media/c4-hoi.mp3", "loai": "am", "chu": "Bạn nối mỗi đại lượng ở bảng tuần hoàn với đại lượng bằng nó trong nguyên tử."}, "c4-sai": {"d": 7.008, "s": "media/c4-sai.mp3", "loai": "am", "chu": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng."}, "c4-vi-sao": {"d": 12.216, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Số Z = số hiệu nguyên tử = số proton = số electron; số thứ tự chu kì = số lớp electron; số thứ tự nhóm A = số electron lớp ngoài cùng."}, "c4-sai-2": {"d": 6.528, "s": "media/c4-sai-2.mp3", "loai": "am", "chu": "Số neutron không suy ra được từ vị trí; các đồng vị khác số neutron vẫn ở cùng một ô."}, "c5-hoi": {"d": 4.728, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Bạn chọn bộ từ điền đúng vào ba chỗ trống của định luật tuần hoàn."}, "c5-sai-1": {"d": 6.072, "s": "media/c5-sai-1.mp3", "loai": "am", "chu": "Chỗ (3) sai: bảng tuần hoàn hiện đại không xếp theo khối lượng nguyên tử."}, "c5-sai-3": {"d": 7.92, "s": "media/c5-sai-3.mp3", "loai": "am", "chu": "Đơn chất đi cùng nguyên tố ở chỗ (1); chỗ (2) nói về tính chất của hợp chất, không phải khối lượng."}, "c5-sai-4": {"d": 6.984, "s": "media/c5-sai-4.mp3", "loai": "am", "chu": "Số lớp electron chỉ cho biết chu kì. Định luật nói theo chiều tăng điện tích hạt nhân."}, "c5-vi-sao": {"d": 8.64, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử."}, "c6-1": {"d": 4.464, "s": "media/c6-1.mp3", "loai": "am", "chu": "Bạn đọc thầm lại trọn vẹn định luật tuần hoàn trên màn hình nhé."}, "c6-2": {"d": 5.784, "s": "media/c6-2.mp3", "loai": "am", "chu": "Ba chỗ trống trong sách là: nguyên tố, tính chất, và điện tích hạt nhân."}, "c6-3": {"d": 5.592, "s": "media/c6-3.mp3", "loai": "am", "chu": "Nhờ định luật này, biết vị trí của nguyên tố là dự đoán được tính chất của nó."}, "c7-hoi": {"d": 10.968, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "Phần hai: xu hướng biến đổi. Trong một chu kì, đi từ trái sang phải, mỗi đại lượng tăng hay giảm? Bạn xếp thẻ vào đúng nhóm."}, "c7-sai": {"d": 11.232, "s": "media/c7-sai.mp3", "loai": "am", "chu": "Trong chu kì, điện tích hạt nhân tăng mà số lớp electron không đổi, nên hạt nhân hút electron mạnh hơn: nguyên tử nhỏ lại, khó nhường, dễ nhận electron hơn."}, "c7-vi-sao": {"d": 9.888, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Trái sang phải: độ âm điện, tính phi kim, tính acid tăng; bán kính, tính kim loại, tính base giảm."}, "c8-hoi": {"d": 6.96, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Còn trong một nhóm A, đi từ trên xuống dưới thì sao? Bạn xếp thẻ vào đúng nhóm."}, "c8-sai": {"d": 7.224, "s": "media/c8-sai.mp3", "loai": "am", "chu": "Đi xuống trong nhóm, số lớp electron tăng nên electron ngoài cùng ở xa hạt nhân, bị hút yếu hơn."}, "c8-vi-sao": {"d": 7.992, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Trên xuống dưới: bán kính, tính kim loại tăng; độ âm điện, tính phi kim giảm."}, "c9-1": {"d": 6.696, "s": "media/c9-1.mp3", "loai": "am", "chu": "Mình gom lại thành một bản đồ nhé. Kim tím chỉ chiều trái sang phải trong chu kì."}, "c9-2": {"d": 8.256, "s": "media/c9-2.mp3", "loai": "am", "chu": "Theo kim tím, độ âm điện, tính phi kim, tính acid tăng; bán kính, tính kim loại, tính base giảm."}, "c9-3": {"d": 7.728, "s": "media/c9-3.mp3", "loai": "am", "chu": "Kim cam chỉ chiều trên xuống dưới trong nhóm A: bán kính và tính kim loại tăng, độ âm điện và tính phi kim giảm."}, "c9-4": {"d": 6.36, "s": "media/c9-4.mp3", "loai": "am", "chu": "Mẹo nhớ: góc dưới bên trái là kim loại mạnh nhất, góc trên bên phải là phi kim mạnh nhất."}, "c10-1": {"d": 6.912, "s": "media/c10-1.mp3", "loai": "am", "chu": "Phần ba: luyện tập. Câu 1 cho bảng tuần hoàn rút gọn, chỉ có các nhóm A."}, "c10-2": {"d": 5.76, "s": "media/c10-2.mp3", "loai": "am", "chu": "Y, E, X, T nằm trên cùng một hàng, tức là cùng một chu kì."}, "c10-3": {"d": 4.512, "s": "media/c10-3.mp3", "loai": "am", "chu": "T và Q cùng cột nhóm VIIA, Q nằm dưới T."}, "c10-4": {"d": 3.984, "s": "media/c10-4.mp3", "loai": "am", "chu": "Bạn dùng bản đồ xu hướng để xét từng nhận xét nhé."}, "c11-hoi": {"d": 5.112, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Bạn xét từng nhận xét của Câu 1, rồi xếp vào cột đúng hoặc sai."}, "c11-sai": {"d": 10.704, "s": "media/c11-sai.mp3", "loai": "am", "chu": "Y, E, X, T cùng chu kì, xếp từ trái sang phải. T và Q cùng nhóm, Q ở dưới nên tính phi kim của Q yếu hơn T."}, "c11-vi-sao": {"d": 12.36, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! (1), (2), (4) theo đúng xu hướng trong chu kì. (3) sai: đi xuống trong nhóm, tính phi kim giảm, nên T mạnh hơn Q."}, "c12-hoi": {"d": 3.408, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Vậy Câu 1 có bao nhiêu nhận xét đúng?"}, "c12-sai-1": {"d": 4.464, "s": "media/c12-sai-1.mp3", "loai": "am", "chu": "Bạn đếm lại: chỉ có nhận xét (3) sai."}, "c12-sai-2": {"d": 6.264, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Nhận xét (4) cũng đúng: trong chu kì, bán kính giảm từ trái sang phải."}, "c12-sai-4": {"d": 7.176, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "Nhận xét (3) sai: trong nhóm VIIA, Q ở dưới T nên tính phi kim yếu hơn T."}, "c12-vi-sao": {"d": 8.136, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "Có 3 nhận xét đúng là (1), (2), (4). Đáp án C, đúng như SGV."}, "c13-hoi": {"d": 8.856, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Câu 2. Bạn viết nháp cấu hình electron của sulfur, đọc năm phát biểu trên màn hình, rồi chọn số phát biểu đúng."}, "c13-sai-1": {"d": 12.048, "s": "media/c13-sai-1.mp3", "loai": "am", "chu": "Bạn xem lại (1): cấu hình 1s²2s²2p⁶3s²3p⁴ có 6 + 4 = 10 electron p, nên (1) đúng."}, "c13-sai-3": {"d": 14.016, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "S ở nhóm VIA có 6 electron hoá trị, không phải 5, nên (2) sai. Nguyên tố Z = 8 là O, cùng nhóm, ở trên S nên phi kim mạnh hơn S: (4) sai."}, "c13-sai-4": {"d": 7.92, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Có hai phát biểu sai: (2) vì S có 6 electron hoá trị, (4) vì O phi kim mạnh hơn S."}, "c13-vi-sao": {"d": 24.048, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "S: 1s²2s²2p⁶3s²3p⁴ có 3 lớp, 10 electron p, 6 electron s, 6 electron hoá trị. Đúng: (1), (3), (5). Sai: (2) và (4) vì O (Z = 8) phi kim mạnh hơn S. Đáp án B."}, "c14-hoi": {"d": 9.024, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Câu 3. Từ công thức oxide cao nhất, bạn suy ra hoá trị, rồi nhóm của X và Y. Sau đó chọn số phát biểu đúng."}, "c14-sai-2": {"d": 9.912, "s": "media/c14-sai-2.mp3", "loai": "am", "chu": "Phát biểu (1) sai: XO cho X hoá trị II (nhóm IIA), YO₃ cho Y hoá trị VI (nhóm VIA), không kế tiếp nhau."}, "c14-sai-3": {"d": 8.928, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "Có hai phát biểu sai: (1) và (4). Y là phi kim nên hydroxide cao nhất có tính acid."}, "c14-sai-4": {"d": 11.76, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Cả (2) và (3) đều đúng: X nhóm IIA là kim loại, XO là basic oxide; Y nhóm VIA là phi kim, YO₃ là acidic oxide."}, "c14-vi-sao": {"d": 15.96, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "X nhóm IIA, Y nhóm VIA. Đúng: (2), (3). Sai: (1) vì hai nhóm không kế tiếp; (4) vì hydroxide cao nhất của Y có dạng H₂YO₄ và có tính acid. Đáp án A."}, "c15-1": {"d": 7.272, "s": "media/c15-1.mp3", "loai": "am", "chu": "Câu 4 nói về borax, còn gọi là hàn the. Bạn đọc thầm câu trên màn hình nhé."}, "c15-2": {"d": 7.632, "s": "media/c15-2.mp3", "loai": "am", "chu": "Borax được dùng làm sạch bề mặt kim loại trước khi hàn, chế tạo thuỷ tinh quang học, men đồ sứ và sản xuất bột giặt."}, "c15-3": {"d": 5.328, "s": "media/c15-3.mp3", "loai": "am", "chu": "Ta xét ba nguyên tố Na, B và O trong borax nhé."}, "c16-hoi": {"d": 11.112, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Biết sodium có Z bằng mười một, bo có Z bằng năm, oxygen có Z bằng tám. Bạn viết nháp cấu hình, rồi nối mỗi nguyên tố với vị trí."}, "c16-sai": {"d": 5.664, "s": "media/c16-sai.mp3", "loai": "am", "chu": "Số lớp electron cho chu kì, số electron lớp ngoài cùng cho nhóm A."}, "c16-vi-sao": {"d": 18.936, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "Na: 1s²2s²2p⁶3s¹ → chu kì 3, nhóm IA. B: 1s²2s²2p¹ → chu kì 2, nhóm IIIA. O: 1s²2s²2p⁴ → chu kì 2, nhóm VIA."}, "c16-sai-2": {"d": 10.392, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "Đây là vị trí của Al (Z = 13). B chỉ có 2 lớp electron: 1s²2s²2p¹."}, "c17-hoi": {"d": 6.816, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Bạn nhìn vị trí ba nguyên tố trong bảng. Thứ tự bán kính nguyên tử tăng dần là gì?"}, "c17-sai-2": {"d": 6.744, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Đây là thứ tự giảm dần. Na có 3 lớp electron nên bán kính lớn nhất."}, "c17-sai-3": {"d": 5.472, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "B và O cùng chu kì 2, O ở bên phải nên bán kính nhỏ hơn B."}, "c17-sai-4": {"d": 5.976, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Na ở chu kì 3, nhiều lớp electron hơn B nên bán kính lớn hơn B."}, "c17-vi-sao": {"d": 11.376, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "O và B cùng chu kì 2, bán kính giảm từ trái qua phải nên O < B. Na ở chu kì 3 có nhiều lớp electron hơn nên lớn nhất: O < B < Na."}, "c18-hoi": {"d": 4.728, "s": "media/c18-hoi.mp3", "loai": "am", "chu": "Còn độ âm điện, thứ tự giảm dần của ba nguyên tố là gì?"}, "c18-sai-1": {"d": 6.528, "s": "media/c18-sai-1.mp3", "loai": "am", "chu": "Đây là thứ tự tăng dần. O là phi kim mạnh, độ âm điện lớn nhất."}, "c18-sai-2": {"d": 5.088, "s": "media/c18-sai-2.mp3", "loai": "am", "chu": "Na là kim loại mạnh, độ âm điện nhỏ nhất trong ba nguyên tố."}, "c18-sai-4": {"d": 5.448, "s": "media/c18-sai-4.mp3", "loai": "am", "chu": "B và O cùng chu kì, O ở bên phải nên độ âm điện lớn hơn B."}, "c18-vi-sao": {"d": 13.32, "s": "media/c18-vi-sao.mp3", "loai": "am", "chu": "Cùng chu kì 2: B < O. Na < Al (cùng chu kì 3) và Al < B (cùng nhóm IIIA) nên Na < B. Vậy O > B > Na."}, "c19-hoi": {"d": 15.312, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Câu 5. Cafein, chất gây đắng trong cà phê và trà, tạo nên từ carbon, nitrogen, oxygen và hydrogen. So sánh nào đúng cho carbon, nitrogen và oxygen?"}, "c19-sai-2": {"d": 9.912, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "C, N, O cùng chu kì 2, Z tăng thì tính phi kim và độ âm điện tăng, bán kính giảm. Bạn đang đảo ngược chiều."}, "c19-sai-3": {"d": 6.024, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "Trong chu kì, Z tăng thì bán kính giảm, nên C > N > O."}, "c19-sai-4": {"d": 4.728, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Cùng chu kì nhưng Z khác nhau nên tính chất biến đổi theo xu hướng."}, "c19-vi-sao": {"d": 15.552, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "C (IVA), N (VA), O (VIA) cùng chu kì 2, Z tăng dần: tính phi kim C < N < O, độ âm điện C < N < O, bán kính C > N > O."}, "c20-hoi": {"d": 11.76, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Câu 6. A và B đứng kế tiếp nhau trong cùng một chu kì, tổng điện tích hạt nhân là hai mươi lăm. Z của A, nguyên tố đứng trước, bằng bao nhiêu?"}, "c20-sai": {"d": 9.048, "s": "media/c20-sai.mp3", "loai": "am", "chu": "Hai nguyên tố kế tiếp hơn kém nhau 1 đơn vị điện tích hạt nhân. Bạn đặt Z của A là x thì Z của B là x + 1."}, "c20-vi-sao": {"d": 11.184, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "x + (x + 1) = 25 nên x = 12. A là Mg (Z = 12), B là Al (Z = 13)."}, "c21-hoi": {"d": 8.952, "s": "media/c21-hoi.mp3", "loai": "am", "chu": "A là magnesium, B là aluminium. Nhận định nào đúng về vị trí và tính chất của hai nguyên tố?"}, "c21-sai-2": {"d": 7.056, "s": "media/c21-sai-2.mp3", "loai": "am", "chu": "Trong một chu kì, tính kim loại giảm dần theo chiều tăng điện tích hạt nhân, nên Mg mạnh hơn Al."}, "c21-sai-3": {"d": 15.288, "s": "media/c21-sai-3.mp3", "loai": "am", "chu": "Mg: 1s²2s²2p⁶3s² và Al: 1s²2s²2p⁶3s²3p¹ đều có 3 lớp electron nên ở chu kì 3."}, "c21-sai-4": {"d": 7.032, "s": "media/c21-sai-4.mp3", "loai": "am", "chu": "Al có 3 electron lớp ngoài cùng (3s²3p¹) nên ở nhóm IIIA."}, "c21-vi-sao": {"d": 19.08, "s": "media/c21-vi-sao.mp3", "loai": "am", "chu": "Mg 1s²2s²2p⁶3s²: chu kì 3, nhóm IIA. Al 1s²2s²2p⁶3s²3p¹: chu kì 3, nhóm IIIA. Cùng chu kì, Z tăng thì tính kim loại giảm: Mg > Al."}, "c22-1": {"d": 3.0, "s": "media/c22-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại Chương 2 nhé."}, "c22-2": {"d": 8.424, "s": "media/c22-2.mp3", "loai": "am", "chu": "Bảng tuần hoàn xếp theo chiều tăng điện tích hạt nhân: cùng số lớp electron thành chu kì, cùng số electron hoá trị thành nhóm."}, "c22-3": {"d": 9.6, "s": "media/c22-3.mp3", "loai": "am", "chu": "Trong chu kì sang phải: độ âm điện, phi kim, acid tăng. Trong nhóm A xuống dưới: bán kính, kim loại tăng."}, "c22-4": {"d": 10.008, "s": "media/c22-4.mp3", "loai": "am", "chu": "Vị trí, cấu hình electron và tính chất liên hệ chặt với nhau theo định luật tuần hoàn. Kim la bàn của bạn giờ đã chỉ đúng hướng rồi đấy!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 6.936, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã ôn xong Chương 2 Bảng tuần hoàn. Bạn bấm Chép kết quả để gửi cô Thơi nhé!"}}/*__MEDIA_HET__*/;
