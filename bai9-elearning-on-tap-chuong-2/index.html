<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai9-elearning-on-tap-chuong-2 bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai9-elearning-on-tap-chuong-2', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}
.o{position:absolute}
/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */
.cot{display:flex;flex-direction:column;gap:1.2cqw}
.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}
.the.dai{font-size:calc(1.85cqw*var(--co,1))}
.the b{color:var(--a1)}
.dap{background:var(--a2);border-radius:1.6cqw;padding:1cqw 2cqw;font:800 calc(3.8cqw*var(--co,1))/1.1 var(--f-hien);color:var(--muc);box-shadow:0 .6cqw 0 var(--a2d);text-align:center}
.lcd{background:#1B2238;border-radius:1.2cqw;border:.5cqw solid #3A4566;color:#7CF2B2;font:800 4.6cqw/1 "Consolas","Courier New",monospace;letter-spacing:.2cqw;display:grid;place-items:center;text-shadow:0 0 1cqw rgba(124,242,178,.6);padding:1.2cqw 2cqw;align-self:flex-start;font-variant-numeric:tabular-nums}
.bong{background:var(--a1);color:#fff;border-radius:99px;padding:.5cqw 1.6cqw;font:800 2.8cqw/1.2 var(--f-hien);box-shadow:0 .4cqw 0 var(--a1d);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tde2{font:700 3cqw/1.15 var(--f-hien);color:var(--a1)}
.hoi{font:800 2.9cqw/1.2 var(--f-hien);color:var(--chu-nen);text-wrap:balance}
.hoi.dai{font-size:2.4cqw}
.chu-to.emo{background:transparent!important;box-shadow:none!important;border:0!important}
.chu-to{font:800 7cqw/1.1 var(--f-hien);color:var(--chu);text-align:center;display:grid;place-items:center;background:var(--the);border-radius:2cqw;box-shadow:0 .6cqw 0 var(--bong);padding:2cqw}
.khung-anh{overflow:hidden;border-radius:1.4cqw;background:var(--the);box-shadow:0 .6cqw 0 var(--bong)}
.anh-trong{position:absolute;transform-origin:0 0;transition:transform .9s cubic-bezier(.45,0,.2,1)}
.anh-trong img{width:100%;height:100%;display:block}
.anh-trong svg{position:absolute;inset:0;width:100%;height:100%}
.nguon-anh{position:absolute;right:.6cqw;bottom:.5cqw;font:700 1.05cqw/1.2 var(--f-chu);color:var(--chu2);background:rgba(255,255,255,.85);border-radius:.6cqw;padding:.2cqw .6cqw;max-width:90%}
.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}
.khung-co.noi{box-shadow:0 0 0 .6cqw var(--a2),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent)}
.khung-co video,.khung-co img{width:100%;height:100%;object-fit:cover;display:block}
.chon{display:flex;flex-direction:column;gap:1.3cqw}
.nut-chon{font:800 2.7cqw/1.1 var(--f-hien);color:var(--chu);background:var(--the);border:.35cqw solid var(--chu);border-radius:1.4cqw;padding:1.1cqw 1.8cqw;text-align:left;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;gap:1.4cqw}
.nut-chon.dai{font-size:2.1cqw}
.chon.gon{gap:.8cqw}.chon.gon .nut-chon{font-size:1.9cqw;padding:.7cqw 1.4cqw}.chon.gon .nut-chon .ky{width:3.2cqw;height:3.2cqw;font-size:1.8cqw}
.nut-chon .ky{width:4cqw;height:4cqw;border-radius:50%;background:var(--a2);display:grid;place-items:center;font-size:2.2cqw;flex:none;color:var(--muc)}
.nut-chon:hover{transform:translateY(-.2cqw)}
.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-chon:focus-visible,.nut-sk:focus-visible,.the-n:focus-visible,.o-phai:focus-visible,.the-k:focus-visible,.nhom:focus-visible{outline:.4cqw solid var(--a1);outline-offset:.3cqw}
.nut-chon.dung{background:var(--a3t);border-color:var(--a3);box-shadow:0 .5cqw 0 var(--a3);color:var(--a3d)}
.nut-chon.dung .ky{background:var(--a3);color:#fff}
.nut-chon.sai{background:var(--a4t);border-color:var(--a4);box-shadow:0 .5cqw 0 var(--a4);color:var(--a4d);cursor:default;opacity:.85}
.nut-chon.sai .ky{background:var(--a4);color:#fff}
.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}
.nut-sk{font:800 2.3cqw/1 var(--f-hien);border-radius:1.2cqw;padding:1.1cqw 1.8cqw;border:.3cqw solid var(--chu);background:var(--the);color:var(--chu);cursor:pointer;box-shadow:0 .45cqw 0 var(--chu)}
.nut-sk.chinh{background:var(--a1);border-color:var(--a1d);color:#fff;box-shadow:0 .45cqw 0 var(--a1d)}
.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}
.the-n svg.dh{width:11cqw;height:11cqw}
.the-n img{max-width:100%;max-height:11cqw;object-fit:contain;border-radius:.8cqw}
.the-n .hd{font:800 1.9cqw/1.15 var(--f-hien);text-align:center;color:var(--chu)}
.the-n.chon-roi,.the-k.chon-roi{border-color:var(--a1);transform:translateY(-.6cqw);box-shadow:0 1cqw 0 color-mix(in srgb,var(--a1) 35%,transparent)}
.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}
.o-phai.lcd-k.khop{color:var(--a3d)}
.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}
.phu.toi{background:#2E3A6B;color:#FFE7A3}.phu.chieu{background:var(--a1t);color:var(--a1d)}
.the-k{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw;padding:.6cqw;cursor:grab;box-shadow:0 .45cqw 0 var(--chu);font:800 2cqw/1.15 var(--f-hien);color:var(--chu);text-align:center;touch-action:none;width:12cqw;min-height:8cqw}
.the-k svg.dh{width:7cqw;height:7cqw}
.the-k img{max-width:100%;max-height:7cqw;object-fit:contain}
.the-k.keo{cursor:grabbing;z-index:5;box-shadow:0 1.2cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent)}
.the-k.dat{cursor:default;border-color:var(--a3);box-shadow:0 .3cqw 0 var(--a3);width:10cqw;min-height:0;font-size:1.6cqw;padding:.4cqw}
.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}
.nhom .trong-nhom{display:flex;flex-wrap:wrap;gap:.4cqw;justify-content:center;align-content:flex-start;flex:1}
.nhom.sang{background:color-mix(in srgb,var(--a2) 35%,transparent)}
#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}
#tiep:focus-visible{outline:.4cqw solid var(--a2);outline-offset:.3cqw}
@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}
.dong-ket span:nth-child(even){font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.xoay{display:none}
@media (max-width:620px) and (orientation:portrait){.xoay{display:block;font:700 13px/1.4 var(--f-chu);color:var(--muted);text-align:center;padding:6px 0}}
#phude-dai{background:#0E1222;min-height:calc(2.7em + 18px);display:flex;align-items:center;justify-content:center;padding:8px 16px;font:700 clamp(14px,1.6vw,22px)/1.35 var(--f-chu)}
#phude{color:#FFF9EF;text-align:center;text-wrap:balance;max-width:60em}
#dk{background:var(--bar);color:var(--bar-fg);border-radius:0 0 14px 14px;display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
#dk button{background:transparent;color:inherit;border:0;font:800 16px/1 var(--f-chu);min-width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0 8px}
#dk button:hover:not([disabled]){background:rgba(255,255,255,.12)}
#dk button:focus-visible{outline:2px solid var(--sun)}
#dk button[disabled]{opacity:.35;cursor:default}
#dk button.bat{color:var(--sun)}
#thanh{flex:1 1 160px;min-width:120px;height:40px;display:flex;align-items:center;cursor:pointer;position:relative}
#thanh .ray{height:8px;width:100%;background:rgba(255,255,255,.18);border-radius:8px;position:relative}
#thanh .day{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:8px}
#thanh .num{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--coral)}
#thanh .moc{position:absolute;top:-3px;width:3px;height:14px;background:rgba(255,255,255,.45);border-radius:2px}
#thanh.khoa{cursor:default}
#nhan-thanh{font:700 13px/1.2 var(--f-chu);opacity:.85;position:absolute;left:0;top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#gio{font:700 13px/1 var(--f-chu);font-variant-numeric:tabular-nums;opacity:.85;min-width:84px;text-align:center}
.nho{font-size:13px!important}
@media (max-width:620px){#dk{gap:0;padding:4px 6px}#dk button{min-width:36px;height:38px;padding:0 6px}#gio{display:none}#thanh{flex:1 0 100%;order:9;height:30px}#nhan-thanh{font-size:12px}}
aside#ml{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
aside h2{font:800 15px/1.2 var(--f-hien);margin:0;letter-spacing:.02em}
#ds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#ds button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px;font:700 14px/1.25 var(--f-chu);color:var(--ink);cursor:pointer}
#ds button:hover:not([disabled]){background:color-mix(in srgb,var(--sun) 18%,transparent)}
#ds button:focus-visible{outline:2px solid var(--coral)}
#ds button.nay{background:color-mix(in srgb,var(--coral) 16%,transparent)}
#ds button[disabled]{opacity:.45;cursor:default}
#ds .kieu{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 12px/1 var(--f-chu);background:var(--paper);color:var(--muted)}
#ds .kieu.lam{background:color-mix(in srgb,var(--coral) 20%,transparent);color:var(--coral)}
#ds .tt{font:700 12px/1 var(--f-chu);color:var(--muted);font-variant-numeric:tabular-nums}
#ds .tt.ok{color:var(--mint)}
.cong[hidden]{display:none}
.cong{display:flex;align-items:center;gap:10px;font:700 13px/1.3 var(--f-chu);color:var(--muted);cursor:pointer}
.cong input{width:18px;height:18px;accent-color:var(--coral)}
details.ve{border-top:1px solid var(--line);padding-top:10px;font:500 13.5px/1.5 var(--f-chu);color:var(--ink)}
details.ve summary{font:800 14px/1.3 var(--f-hien);cursor:pointer}
details.ve p,details.ve ul{margin:8px 0}
details.ve ul{padding-left:18px}
details.ve b{font-weight:800}
.chan{font:700 12.5px/1.5 var(--f-chu);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:space-between}
.chan .nhap{color:var(--coral);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}
#stage.toi .tde2{color:color-mix(in srgb,var(--a1) 45%,#fff)}
#stage.toi .may{color:color-mix(in srgb,var(--chu-nen) 85%,transparent)!important;background:none!important}
.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}
.cot.kinh .trich{color:var(--chu);border-radius:1cqw;padding:1cqw 1.4cqw 1cqw 1.6cqw;text-shadow:none}
.trich{font:italic 400 calc(2.3cqw*var(--co,1))/1.4 var(--f-trich);color:var(--chu-nen);border-left:.5cqw solid var(--a1);padding:.3cqw 0 .3cqw 1.6cqw;text-shadow:0 0 .9cqw var(--halo)}
.trich b{color:var(--a1)}
.trich .ngoac{display:none}
.trich-nguon{font:700 calc(1.45cqw*var(--co,1))/1.3 var(--f-chu);font-style:normal;letter-spacing:.06em;margin-top:.8cqw;opacity:.8}
#stage[data-bc="trich-dan"] .trich{font-size:calc(3.5cqw*var(--co,1));line-height:1.35;border:0;padding:0 0 0 6.4cqw;position:relative;margin-bottom:1.2cqw}
#stage[data-bc="trich-dan"] .trich .ngoac{display:block;position:absolute;left:0;top:-1.4cqw;font:700 11cqw/1 var(--f-trich);font-style:normal;color:var(--a1);opacity:.85}
.tg-moc{text-align:center}
.tg-moc span{display:inline-block;background:var(--a1);color:#fff;border-radius:99px;padding:.45cqw 1.3cqw;font:800 calc(1.75cqw*var(--co,1))/1.2 var(--f-hien);box-shadow:0 .35cqw 0 var(--a1d);text-shadow:none}
.tg-cot .the{font-size:calc(1.75cqw*var(--co,1));text-align:center}
.tg-cot .dap{font-size:calc(2.4cqw*var(--co,1))}
.o-luoi{display:flex;flex-direction:column;gap:1cqw}
.o-luoi>.the,.o-luoi>.dap,.o-luoi>.lcd,.o-luoi>.trich{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.o-luoi>.the{font-size:calc(2.6cqw*var(--co,1));border-top:.7cqw solid var(--vien-o,var(--a1));padding:1.6cqw 2.2cqw}
.o-luoi>.dap{font-size:calc(3.4cqw*var(--co,1))}
.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}
.logo-truong img{height:3.6cqw;width:auto;display:block}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}
#stage[data-pc="so-tay"] .cot>.the{position:relative}
#stage[data-pc="so-tay"] .cot>.the::before{content:"";position:absolute;left:50%;top:-.8cqw;width:6.5cqw;height:1.6cqw;transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--a2) 55%,transparent);border-radius:.2cqw}
#stage[data-pc="so-tay"] .khung-anh{border-radius:.3cqw;border:.7cqw solid #fff;border-bottom-width:2.4cqw;box-shadow:0 .5cqw 1.4cqw var(--bong);transform:rotate(-1.4deg)}
#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}
#stage[data-pc="so-tay"] .dap{border-radius:.5cqw;transform:rotate(-1deg);box-shadow:0 .4cqw 1cqw var(--bong)}
#stage[data-pc="so-tay"] .nut-chon,#stage[data-pc="so-tay"] .nut-sk,#stage[data-pc="so-tay"] .o-phai,#stage[data-pc="so-tay"] .the-k{border-radius:.6cqw}
#stage[data-pc="so-tay"] .the-n{border-radius:.6cqw;box-shadow:0 .3cqw 1cqw var(--bong)}

/* --- Trang sách: giấy ngà, mực xanh, đỏ son, phẳng --- */
#stage[data-pc="trang-sach"] .the{background:color-mix(in srgb,var(--the) 55%,transparent);border-left:.45cqw solid var(--a1);border-radius:0 .5cqw .5cqw 0;box-shadow:none;font-weight:600}
#stage[data-pc="trang-sach"] .tde,#stage[data-pc="trang-sach"] .tieu-canh{font-weight:700;letter-spacing:-.01em}
#stage[data-pc="trang-sach"] .may{color:var(--a1);letter-spacing:.2em}
#stage[data-pc="trang-sach"] .dap{background:var(--chu);color:var(--nen);box-shadow:none;border-radius:.4cqw}
#stage[data-pc="trang-sach"] .khung-anh{border-radius:.3cqw;box-shadow:0 0 0 .5cqw var(--the),0 .5cqw 1.6cqw var(--bong)}
#stage[data-pc="trang-sach"] .chu-to{box-shadow:none;border:.2cqw solid var(--vien);border-radius:.4cqw;background:color-mix(in srgb,var(--the) 60%,transparent)}

: "biet", "yccd": [1], "sgk": ["HT1"], "hoi": "Nối mỗi mệnh đề với cụm từ điền vào chỗ trống.", "noi": "Phần một: cấu tạo bảng tuần hoàn. Bạn nối mỗi mệnh đề với cụm từ điền vào chỗ trống.", "giai": "Chu kì là hàng: các nguyên tố cùng số lớp electron. Nhóm là cột: các nguyên tố cùng số electron hoá trị.", "vi_sao": "Đúng hết! Các nguyên tố xếp theo chiều tăng điện tích hạt nhân; cùng số lớp electron xếp thành một hàng (chu kì); cùng số electron hoá trị xếp thành một cột (nhóm).", "phai": ["Khối lượng nguyên tử", "Số electron hoá trị", "Số lớp electron", "Điện tích hạt nhân"], "trai": [{"chu": "… tăng dần"}, {"chu": "Cùng … ⇒ cùng chu kì"}, {"chu": "Cùng … ⇒ cùng nhóm"}], "dap": [3, 2, 1], "hoi_id": "c2-hoi", "sai_id": "c2-sai", "vi_sao_id": "c2-vi-sao", "sai_rieng": {"0": "c2-sai-2"}}, {"ma": "c3", "loai": "chon", "ten": "Bảng tuần hoàn có gì?", "muc": "biet", "yccd": [1], "sgk": ["HT1"], "hoi": "Bảng tuần hoàn (đến năm 2016) có bao nhiêu nguyên tố, bao nhiêu chu kì, bao nhiêu nhóm?", "noi": "Bảng tuần hoàn, tính đến năm hai nghìn không trăm mười sáu, có bao nhiêu nguyên tố, bao nhiêu chu kì, bao nhiêu nhóm?", "lua": [{"chu": "118 nguyên tố, 7 chu kì, 18 nhóm", "giai": "Bảng có 18 cột nhưng nhóm VIIIB gồm 3 cột, nên chỉ có 16 nhóm.", "sai_id": "c3-sai-1"}, {"chu": "118 nguyên tố, 7 chu kì, 16 nhóm (8 nhóm A, 8 nhóm B)", "dung": true}, {"chu": "118 nguyên tố, 8 chu kì, 16 nhóm", "giai": "Bảng tuần hoàn hiện nay có 7 chu kì, ứng với 7 lớp electron.", "sai_id": "c3-sai-3"}, {"chu": "112 nguyên tố, 7 chu kì, 16 nhóm", "giai": "Đến năm 2016, bảng tuần hoàn có 118 nguyên tố.", "sai_id": "c3-sai-4"}], "vi_sao": "Đến năm 2016, bảng có 118 nguyên tố, 7 chu kì, 18 cột chia thành 8 nhóm A và 8 nhóm B (nhóm VIIIB gồm 3 cột), tức 16 nhóm.", "hoi_id": "c3-hoi", "vi_sao_id": "c3-vi-sao"}, {"ma": "c4", "loai": "noi", "ten": "Bảng tuần hoàn và cấu tạo nguyên tử", "muc": "hieu", "yccd": [1, 3], "sgk": ["HT3"], "hoi": "Nối mỗi đại lượng với đại lượng bằng nó.", "noi": "Bạn nối mỗi đại lượng ở bảng tuần hoàn với đại lượng bằng nó trong nguyên tử.", "giai": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng.", "vi_sao": "Đúng hết! Số Z = số hiệu nguyên tử = số proton = số electron; số thứ tự chu kì = số lớp electron; số thứ tự nhóm A = số electron lớp ngoài cùng.", "phai": ["Số neutron", "Số proton = số electron", "Số lớp electron", "Số electron lớp ngoài cùng"], "trai": [{"chu": "Số hiệu nguyên tử (số Z)"}, {"chu": "Số thứ tự chu kì"}, {"chu": "Số thứ tự nhóm A"}], "dap": [1, 2, 3], "hoi_id": "c4-hoi", "sai_id": "c4-sai", "vi_sao_id": "c4-vi-sao", "sai_rieng": {"0": "c4-sai-2"}}, {"ma": "c5", "loai": "chon", "ten": "Định luật tuần hoàn", "muc": "biet", "yccd": [3], "sgk": ["HT4"], "hoi": "Tính chất của các …(1)… và đơn chất cũng như thành phần và …(2)… của các hợp chất tạo nên từ các nguyên tố đó biến đổi tuần hoàn theo chiều tăng của …(3)… nguyên tử. Bộ từ điền đúng là", "noi": "Bạn chọn bộ từ điền đúng vào ba chỗ trống của định luật tuần hoàn.", "lua": [{"chu": "(1) nguyên tố · (2) tính chất · (3) khối lượng", "giai": "Chỗ (3) sai: bảng tuần hoàn hiện đại không xếp theo khối lượng nguyên tử.", "sai_id": "c5-sai-1"}, {"chu": "(1) nguyên tố · (2) tính chất · (3) điện tích hạt nhân", "dung": true}, {"chu": "(1) hợp chất · (2) khối lượng · (3) điện tích hạt nhân", "giai": "Đơn chất đi cùng nguyên tố ở chỗ (1); chỗ (2) nói về tính chất của hợp chất, không phải khối lượng.", "sai_id": "c5-sai-3"}, {"chu": "(1) nguyên tố · (2) tính chất · (3) số lớp electron", "giai": "Số lớp electron chỉ cho biết chu kì. Định luật nói theo chiều tăng điện tích hạt nhân.", "sai_id": "c5-sai-4"}], "vi_sao": "Tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "hoi_id": "c5-hoi", "vi_sao_id": "c5-vi-sao"}, {"ma": "c6", "loai": "trinh-bay", "ten": "Định luật tuần hoàn", "nen": "xanh-duong", "bo_cuc": "trich-dan", "sac": "trang-trong", "sgk": ["HT4"], "trich": "Tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất tạo nên từ các nguyên tố đó biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 43", "hinh": {"chu": "Định luật tuần hoàn"}, "dong": [{"sau": 20, "id": "c6-1"}, {"the": "nguyên tố · tính chất · **điện tích hạt nhân**", "id": "c6-2"}, {"the": "Vị trí → **dự đoán** tính chất", "id": "c6-3"}]}, {"ma": "c7", "loai": "keo-tha", "ten": "Xu hướng trong một chu kì", "muc": "hieu", "yccd": [2], "sgk": ["HT2"], "diem": 2, "hoi": "Trong một chu kì, đi từ trái sang phải, mỗi đại lượng tăng hay giảm?", "noi": "Phần hai: xu hướng biến đổi. Trong một chu kì, đi từ trái sang phải, mỗi đại lượng tăng hay giảm? Bạn xếp thẻ vào đúng nhóm.", "nhom": ["Tăng dần", "Giảm dần"], "the": [{"chu": "Độ âm điện", "nhom": 0}, {"chu": "Tính phi kim", "nhom": 0}, {"chu": "Tính acid của oxide, hydroxide", "nhom": 0}, {"chu": "Bán kính nguyên tử", "nhom": 1}, {"chu": "Tính kim loại", "nhom": 1}, {"chu": "Tính base của oxide, hydroxide", "nhom": 1}], "giai": "Trong chu kì, điện tích hạt nhân tăng mà số lớp electron không đổi, nên hạt nhân hút electron mạnh hơn: nguyên tử nhỏ lại, khó nhường, dễ nhận electron hơn.", "vi_sao": "Đúng hết! Trái sang phải: độ âm điện, tính phi kim, tính acid tăng; bán kính, tính kim loại, tính base giảm.", "hoi_id": "c7-hoi", "sai_id": "c7-sai", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "keo-tha", "ten": "Xu hướng trong một nhóm A", "muc": "hieu", "yccd": [2], "sgk": ["HT2"], "hoi": "Trong một nhóm A, đi từ trên xuống dưới, mỗi đại lượng tăng hay giảm?", "noi": "Còn trong một nhóm A, đi từ trên xuống dưới thì sao? Bạn xếp thẻ vào đúng nhóm.", "nhom": ["Tăng dần", "Giảm dần"], "the": [{"chu": "Bán kính nguyên tử", "nhom": 0}, {"chu": "Tính kim loại", "nhom": 0}, {"chu": "Độ âm điện", "nhom": 1}, {"chu": "Tính phi kim", "nhom": 1}], "giai": "Đi xuống trong nhóm, số lớp electron tăng nên electron ngoài cùng ở xa hạt nhân, bị hút yếu hơn.", "vi_sao": "Đúng hết! Trên xuống dưới: bán kính, tính kim loại tăng; độ âm điện, tính phi kim giảm.", "hoi_id": "c8-hoi", "sai_id": "c8-sai", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "trinh-bay", "ten": "Bản đồ xu hướng", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["HT2"], "hinh": {"anh": "b09-xu-huong.png", "chu": "Xu hướng biến đổi trong bảng tuần hoàn (tổng hợp theo SGK)"}, "dong": [{"the": "Chu kì: **trái → phải**", "id": "c9-1"}, {"the": "↑ độ âm điện, phi kim, acid · ↓ bán kính, kim loại, base", "id": "c9-2"}, {"the": "Nhóm A: ↑ bán kính, kim loại · ↓ độ âm điện, phi kim", "id": "c9-3"}, {"the": "Dưới trái: **kim loại** · Trên phải: **phi kim**", "id": "c9-4"}]}, {"ma": "c10", "loai": "trinh-bay", "ten": "Câu 1: đọc bảng rút gọn", "nen": "xanh-la", "bo_cuc": "luoi-4", "sgk": ["1"], "hinh": {"anh": "b09-cau1-bang.png", "chu": "Bảng tuần hoàn rút gọn của Câu 1 (vẽ lại theo SGK tr. 46)"}, "dong": [{"id": "c10-1"}, {"the": "Y, E, X, T: **cùng chu kì**", "id": "c10-2"}, {"the": "T, Q: **cùng nhóm**, Q ở dưới", "id": "c10-3"}, {"the": "Dùng **bản đồ xu hướng**", "id": "c10-4"}]}, {"ma": "c11", "loai": "keo-tha", "ten": "Câu 1 SGK: xét từng nhận xét", "muc": "van-dung", "yccd": [2], "sgk": ["1"], "diem": 2, "hoi": "Mỗi nhận xét về bảng rút gọn đúng hay sai?", "noi": "Bạn xét từng nhận xét của Câu 1, rồi xếp vào cột đúng hoặc sai.", "nhom": ["Đúng", "Sai"], "the": [{"chu": "(1) Giảm dần tính kim loại: Y, E, X", "nhom": 0}, {"chu": "(2) Tăng dần độ âm điện: Y, X, T", "nhom": 0}, {"chu": "(3) Tăng dần tính phi kim: T, Q", "nhom": 1}, {"chu": "(4) Giảm dần bán kính: Y, E, X, T", "nhom": 0}], "giai": "Y, E, X, T cùng chu kì, xếp từ trái sang phải. T và Q cùng nhóm, Q ở dưới nên tính phi kim của Q yếu hơn T.", "vi_sao": "Đúng hết! (1), (2), (4) theo đúng xu hướng trong chu kì. (3) sai: đi xuống trong nhóm, tính phi kim giảm, nên T mạnh hơn Q.", "hoi_id": "c11-hoi", "sai_id": "c11-sai", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Câu 1 SGK: chốt đáp án", "muc": "van-dung", "yccd": [2], "sgk": ["1"], "hoi": "Câu 1. Số nhận xét đúng là", "noi": "Vậy Câu 1 có bao nhiêu nhận xét đúng?", "lua": [{"chu": "A. 1", "giai": "Bạn đếm lại: chỉ có nhận xét (3) sai.", "sai_id": "c12-sai-1"}, {"chu": "B. 2", "giai": "Nhận xét (4) cũng đúng: trong chu kì, bán kính giảm từ trái sang phải.", "sai_id": "c12-sai-2"}, {"chu": "C. 3", "dung": true}, {"chu": "D. 4", "giai": "Nhận xét (3) sai: trong nhóm VIIA, Q ở dưới T nên tính phi kim yếu hơn T.", "sai_id": "c12-sai-4"}], "vi_sao": "Có 3 nhận xét đúng là (1), (2), (4). Đáp án C, đúng như SGV.", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "chon", "ten": "Câu 2 SGK: sulfur", "muc": "van-dung", "yccd": [3], "sgk": ["2"], "diem": 2, "hoi": "S thuộc nhóm VIA, chu kì 3. (1) S có 3 lớp electron và 10 electron p. (2) S có 5 electron hoá trị và 6 electron s. (3) Oxide cao nhất SO₃ là acidic oxide. (4) S có tính phi kim mạnh hơn nguyên tố Z = 8. (5) Hydroxide cao nhất H₂SO₄ có tính acid. Số phát biểu đúng là", "noi": "Câu 2. Bạn viết nháp cấu hình electron của lưu huỳnh, đọc năm phát biểu trên màn hình, rồi chọn số phát biểu đúng.", "lua": [{"chu": "A. 2", "giai": "Bạn xem lại (1): cấu hình 1s²2s²2p⁶3s²3p⁴ có 6 + 4 = 10 electron p, nên (1) đúng.", "sai_id": "c13-sai-1"}, {"chu": "B. 3", "dung": true}, {"chu": "C. 4", "giai": "S ở nhóm VIA có 6 electron hoá trị, không phải 5, nên (2) sai. Nguyên tố Z = 8 là O, cùng nhóm, ở trên S nên phi kim mạnh hơn S: (4) sai.", "sai_id": "c13-sai-3"}, {"chu": "D. 5", "giai": "Có hai phát biểu sai: (2) vì S có 6 electron hoá trị, (4) vì O phi kim mạnh hơn S.", "sai_id": "c13-sai-4"}], "vi_sao": "S: 1s²2s²2p⁶3s²3p⁴ có 3 lớp, 10 electron p, 6 electron s, 6 electron hoá trị. Đúng: (1), (3), (5). Sai: (2) và (4) vì O (Z = 8) phi kim mạnh hơn S. Đáp án B.", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Câu 3 SGK: oxide của X và Y", "muc": "van-dung", "yccd": [3], "sgk": ["3"], "diem": 2, "hoi": "X, Y cùng chu kì, oxide cao nhất là XO và YO₃. (1) X, Y thuộc 2 nhóm A kế tiếp. (2) X là kim loại, Y là phi kim. (3) XO là basic oxide, YO₃ là acidic oxide. (4) Hydroxide cao nhất của Y là Y(OH)₆, có tính base. Số phát biểu đúng là", "noi": "Câu 3. Từ công thức oxide cao nhất, bạn suy ra hoá trị, rồi nhóm của X và Y. Sau đó chọn số phát biểu đúng.", "lua": [{"chu": "A. 2", "dung": true}, {"chu": "B. 3", "giai": "Phát biểu (1) sai: XO cho X hoá trị II (nhóm IIA), YO₃ cho Y hoá trị VI (nhóm VIA), không kế tiếp nhau.", "sai_id": "c14-sai-2"}, {"chu": "C. 4", "giai": "Có hai phát biểu sai: (1) và (4). Y là phi kim nên hydroxide cao nhất có tính acid.", "sai_id": "c14-sai-3"}, {"chu": "D. 1", "giai": "Cả (2) và (3) đều đúng: X nhóm IIA là kim loại, XO là basic oxide; Y nhóm VIA là phi kim, YO₃ là acidic oxide.", "sai_id": "c14-sai-4"}], "vi_sao": "X nhóm IIA, Y nhóm VIA. Đúng: (2), (3). Sai: (1) vì hai nhóm không kế tiếp; (4) vì hydroxide cao nhất của Y có dạng H₂YO₄ và có tính acid. Đáp án A.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "trinh-bay", "ten": "Câu 4: borax", "nen": "cam", "bo_cuc": "trich-dan", "sgk": ["4"], "trich": "Borax (Na₂B₄O₇·10H₂O), còn gọi là hàn the, là khoáng chất dạng tinh thể.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 47", "hinh": {"chu": "Borax"}, "dong": [{"sau": 6, "id": "c15-1"}, {"the": "Hàn kim loại · thuỷ tinh · men sứ · bột giặt", "id": "c15-2"}, {"the": "Xét **Na, B, O**", "id": "c15-3"}]}, {"ma": "c16", "loai": "noi", "ten": "Câu 4a SGK: vị trí", "muc": "van-dung", "yccd": [3], "sgk": ["4"], "hoi": "Nối mỗi nguyên tố với vị trí của nó.", "noi": "Biết na-tri có Z bằng mười một, bo có Z bằng năm, ô-xi có Z bằng tám. Bạn viết nháp cấu hình, rồi nối mỗi nguyên tố với vị trí.", "giai": "Số lớp electron cho chu kì, số electron lớp ngoài cùng cho nhóm A.", "vi_sao": "Na: 1s²2s²2p⁶3s¹ → chu kì 3, nhóm IA. B: 1s²2s²2p¹ → chu kì 2, nhóm IIIA. O: 1s²2s²2p⁴ → chu kì 2, nhóm VIA.", "phai": ["Chu kì 2, nhóm IIIA", "Chu kì 3, nhóm IA", "Chu kì 2, nhóm VIA", "Chu kì 3, nhóm IIIA"], "trai": [{"chu": "Na (Z = 11)"}, {"chu": "B (Z = 5)"}, {"chu": "O (Z = 8)"}], "dap": [1, 0, 2], "hoi_id": "c16-hoi", "sai_id": "c16-sai", "vi_sao_id": "c16-vi-sao", "sai_rieng": {"3": "c16-sai-2"}}, {"ma": "c17", "loai": "chon", "ten": "Câu 4b SGK: bán kính", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hinh": {"anh": "b09-borax.png"}, "hoi": "Thứ tự bán kính nguyên tử tăng dần của Na, B, O là", "noi": "Bạn nhìn vị trí ba nguyên tố trong bảng. Thứ tự bán kính nguyên tử tăng dần là gì?", "lua": [{"chu": "O < B < Na", "dung": true}, {"chu": "Na < B < O", "giai": "Đây là thứ tự giảm dần. Na có 3 lớp electron nên bán kính lớn nhất.", "sai_id": "c17-sai-2"}, {"chu": "B < O < Na", "giai": "B và O cùng chu kì 2, O ở bên phải nên bán kính nhỏ hơn B.", "sai_id": "c17-sai-3"}, {"chu": "O < Na < B", "giai": "Na ở chu kì 3, nhiều lớp electron hơn B nên bán kính lớn hơn B.", "sai_id": "c17-sai-4"}], "vi_sao": "O và B cùng chu kì 2, bán kính giảm từ trái qua phải nên O < B. Na ở chu kì 3 có nhiều lớp electron hơn nên lớn nhất: O < B < Na.", "hoi_id": "c17-hoi", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "chon", "ten": "Câu 4c SGK: độ âm điện", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hoi": "Thứ tự độ âm điện giảm dần của Na, B, O là", "noi": "Còn độ âm điện, thứ tự giảm dần của ba nguyên tố là gì?", "lua": [{"chu": "Na > B > O", "giai": "Đây là thứ tự tăng dần. O là phi kim mạnh, độ âm điện lớn nhất.", "sai_id": "c18-sai-1"}, {"chu": "O > Na > B", "giai": "Na là kim loại mạnh, độ âm điện nhỏ nhất trong ba nguyên tố.", "sai_id": "c18-sai-2"}, {"chu": "O > B > Na", "dung": true}, {"chu": "B > O > Na", "giai": "B và O cùng chu kì, O ở bên phải nên độ âm điện lớn hơn B.", "sai_id": "c18-sai-4"}], "vi_sao": "Cùng chu kì 2: B < O. Na < Al (cùng chu kì 3) và Al < B (cùng nhóm IIIA) nên Na < B. Vậy O > B > Na.", "hoi_id": const MEDIA = /*__MEDIA__*/{"c1-1": {"d": 4.656, "s": "media/c1-1.mp3", "loai": "am", "chu": "Chào các bạn lớp Mười! Mình là La Bàn."}, "c1-2": {"d": 9.768, "s": "media/c1-2.mp3", "loai": "am", "chu": "Kim của mình luôn chỉ đúng chiều tăng, chiều giảm của các xu hướng trong bảng tuần hoàn. Hôm nay mình cùng cô Thơi ôn tập Chương 2 với các bạn nhé."}, "c1-3": {"d": 6.216, "s": "media/c1-3.mp3", "loai": "am", "chu": "Bài có hai phần: hệ thống hoá kiến thức, rồi luyện tập sáu câu hỏi trong sách giáo khoa."}, "c1-4": {"d": 4.992, "s": "media/c1-4.mp3", "loai": "am", "chu": "Bạn chuẩn bị giấy nháp và bút. Mình bắt đầu thôi!"}, "c2-hoi": {"d": 7.248, "s": "media/c2-hoi.mp3", "loai": "am", "chu": "Phần một: cấu tạo bảng tuần hoàn. Bạn nối mỗi mệnh đề với cụm từ điền vào chỗ trống."}, "c2-sai": {"d": 9.144, "s": "media/c2-sai.mp3", "loai": "am", "chu": "Chu kì là hàng: các nguyên tố cùng số lớp electron. Nhóm là cột: các nguyên tố cùng số electron hoá trị."}, "c2-vi-sao": {"d": 11.784, "s": "media/c2-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Các nguyên tố xếp theo chiều tăng điện tích hạt nhân; cùng số lớp electron xếp thành một hàng (chu kì); cùng số electron hoá trị xếp thành một cột (nhóm)."}, "c2-sai-2": {"d": 5.832, "s": "media/c2-sai-2.mp3", "loai": "am", "chu": "Bảng tuần hoàn hiện đại không xếp theo khối lượng nguyên tử mà theo chiều tăng điện tích hạt nhân."}, "c3-hoi": {"d": 7.92, "s": "media/c3-hoi.mp3", "loai": "am", "chu": "Bảng tuần hoàn, tính đến năm hai nghìn không trăm mười sáu, có bao nhiêu nguyên tố, bao nhiêu chu kì, bao nhiêu nhóm?"}, "c3-sai-1": {"d": 6.048, "s": "media/c3-sai-1.mp3", "loai": "am", "chu": "Bảng có 18 cột nhưng nhóm VIIIB gồm 3 cột, nên chỉ có 16 nhóm."}, "c3-sai-3": {"d": 5.352, "s": "media/c3-sai-3.mp3", "loai": "am", "chu": "Bảng tuần hoàn hiện nay có 7 chu kì, ứng với 7 lớp electron."}, "c3-sai-4": {"d": 5.64, "s": "media/c3-sai-4.mp3", "loai": "am", "chu": "Đến năm 2016, bảng tuần hoàn có 118 nguyên tố."}, "c3-vi-sao": {"d": 12.264, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Đến năm 2016, bảng có 118 nguyên tố, 7 chu kì, 18 cột chia thành 8 nhóm A và 8 nhóm B (nhóm VIIIB gồm 3 cột), tức 16 nhóm."}, "c4-hoi": {"d": 5.28, "s": "media/c4-hoi.mp3", "loai": "am", "chu": "Bạn nối mỗi đại lượng ở bảng tuần hoàn với đại lượng bằng nó trong nguyên tử."}, "c4-sai": {"d": 7.056, "s": "media/c4-sai.mp3", "loai": "am", "chu": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng."}, "c4-vi-sao": {"d": 11.208, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Số Z = số hiệu nguyên tử = số proton = số electron; số thứ tự chu kì = số lớp electron; số thứ tự nhóm A = số electron lớp ngoài cùng."}, "c4-sai-2": {"d": 6.552, "s": "media/c4-sai-2.mp3", "loai": "am", "chu": "Số neutron không suy ra được từ vị trí; các đồng vị khác số neutron vẫn ở cùng một ô."}, "c5-hoi": {"d": 4.728, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Bạn chọn bộ từ điền đúng vào ba chỗ trống của định luật tuần hoàn."}, "c5-sai-1": {"d": 6.072, "s": "media/c5-sai-1.mp3", "loai": "am", "chu": "Chỗ (3) sai: bảng tuần hoàn hiện đại không xếp theo khối lượng nguyên tử."}, "c5-sai-3": {"d": 7.92, "s": "media/c5-sai-3.mp3", "loai": "am", "chu": "Đơn chất đi cùng nguyên tố ở chỗ (1); chỗ (2) nói về tính chất của hợp chất, không phải khối lượng."}, "c5-sai-4": {"d": 6.96, "s": "media/c5-sai-4.mp3", "loai": "am", "chu": "Số lớp electron chỉ cho biết chu kì. Định luật nói theo chiều tăng điện tích hạt nhân."}, "c5-vi-sao": {"d": 8.64, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử."}, "c6-1": {"d": 4.464, "s": "media/c6-1.mp3", "loai": "am", "chu": "Bạn đọc thầm lại trọn vẹn định luật tuần hoàn trên màn hình nhé."}, "c6-2": {"d": 5.616, "s": "media/c6-2.mp3", "loai": "am", "chu": "Ba chỗ trống trong sách là: nguyên tố, tính chất, và điện tích hạt nhân."}, "c6-3": {"d": 5.592, "s": "media/c6-3.mp3", "loai": "am", "chu": "Nhờ định luật này, biết vị trí của nguyên tố là dự đoán được tính chất của nó."}, "c7-hoi": {"d": 10.968, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "Phần hai: xu hướng biến đổi. Trong một chu kì, đi từ trái sang phải, mỗi đại lượng tăng hay giảm? Bạn xếp thẻ vào đúng nhóm."}, "c7-sai": {"d": 11.184, "s": "media/c7-sai.mp3", "loai": "am", "chu": "Trong chu kì, điện tích hạt nhân tăng mà số lớp electron không đổi, nên hạt nhân hút electron mạnh hơn: nguyên tử nhỏ lại, khó nhường, dễ nhận electron hơn."}, "c7-vi-sao": {"d": 9.888, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Trái sang phải: độ âm điện, tính phi kim, tính acid tăng; bán kính, tính kim loại, tính base giảm."}, "c8-hoi": {"d": 6.96, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Còn trong một nhóm A, đi từ trên xuống dưới thì sao? Bạn xếp thẻ vào đúng nhóm."}, "c8-sai": {"d": 7.2, "s": "media/c8-sai.mp3", "loai": "am", "chu": "Đi xuống trong nhóm, số lớp electron tăng nên electron ngoài cùng ở xa hạt nhân, bị hút yếu hơn."}, "c8-vi-sao": {"d": 7.992, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Trên xuống dưới: bán kính, tính kim loại tăng; độ âm điện, tính phi kim giảm."}, "c9-1": {"d": 6.696, "s": "media/c9-1.mp3", "loai": "am", "chu": "Mình gom lại thành một bản đồ nhé. Kim tím chỉ chiều trái sang phải trong chu kì."}, "c9-2": {"d": 8.256, "s": "media/c9-2.mp3", "loai": "am", "chu": "Theo kim tím, độ âm điện, tính phi kim, tính acid tăng; bán kính, tính kim loại, tính base giảm."}, "c9-3": {"d": 7.728, "s": "media/c9-3.mp3", "loai": "am", "chu": "Kim cam chỉ chiều trên xuống dưới trong nhóm A: bán kính và tính kim loại tăng, độ âm điện và tính phi kim giảm."}, "c9-4": {"d": 6.36, "s": "media/c9-4.mp3", "loai": "am", "chu": "Mẹo nhớ: góc dưới bên trái là kim loại mạnh nhất, góc trên bên phải là phi kim mạnh nhất."}, "c10-1": {"d": 6.912, "s": "media/c10-1.mp3", "loai": "am", "chu": "Phần ba: luyện tập. Câu 1 cho bảng tuần hoàn rút gọn, chỉ có các nhóm A."}, "c10-2": {"d": 5.76, "s": "media/c10-2.mp3", "loai": "am", "chu": "Y, E, X, T nằm trên cùng một hàng, tức là cùng một chu kì."}, "c10-3": {"d": 4.728, "s": "media/c10-3.mp3", "loai": "am", "chu": "T và Q cùng cột nhóm VIIA, Q nằm dưới T."}, "c10-4": {"d": 3.984, "s": "media/c10-4.mp3", "loai": "am", "chu": "Bạn dùng bản đồ xu hướng để xét từng nhận xét nhé."}, "c11-hoi": {"d": 5.112, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Bạn xét từng nhận xét của Câu 1, rồi xếp vào cột đúng hoặc sai."}, "c11-sai": {"d": 10.704, "s": "media/c11-sai.mp3", "loai": "am", "chu": "Y, E, X, T cùng chu kì, xếp từ trái sang phải. T và Q cùng nhóm, Q ở dưới nên tính phi kim của Q yếu hơn T."}, "c11-vi-sao": {"d": 12.36, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! (1), (2), (4) theo đúng xu hướng trong chu kì. (3) sai: đi xuống trong nhóm, tính phi kim giảm, nên T mạnh hơn Q."}, "c12-hoi": {"d": 3.408, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Vậy Câu 1 có bao nhiêu nhận xét đúng?"}, "c12-sai-1": {"d": 4.464, "s": "media/c12-sai-1.mp3", "loai": "am", "chu": "Bạn đếm lại: chỉ có nhận xét (3) sai."}, "c12-sai-2": {"d": 6.264, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Nhận xét (4) cũng đúng: trong chu kì, bán kính giảm từ trái sang phải."}, "c12-sai-4": {"d": 7.392, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "Nhận xét (3) sai: trong nhóm VIIA, Q ở dưới T nên tính phi kim yếu hơn T."}, "c12-vi-sao": {"d": 8.136, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "Có 3 nhận xét đúng là (1), (2), (4). Đáp án C, đúng như SGV."}, "c13-hoi": {"d": 8.808, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Câu 2. Bạn viết nháp cấu hình electron của lưu huỳnh, đọc năm phát biểu trên màn hình, rồi chọn số phát biểu đúng."}, "c13-sai-1": {"d": 8.568, "s": "media/c13-sai-1.mp3", "loai": "am", "chu": "Bạn xem lại (1): cấu hình 1s²2s²2p⁶3s²3p⁴ có 6 + 4 = 10 electron p, nên (1) đúng."}, "c13-sai-3": {"d": 13.608, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "S ở nhóm VIA có 6 electron hoá trị, không phải 5, nên (2) sai. Nguyên tố Z = 8 là O, cùng nhóm, ở trên S nên phi kim mạnh hơn S: (4) sai."}, "c13-sai-4": {"d": 7.848, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Có hai phát biểu sai: (2) vì S có 6 electron hoá trị, (4) vì O phi kim mạnh hơn S."}, "c13-vi-sao": {"d": 19.392, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "S: 1s²2s²2p⁶3s²3p⁴ có 3 lớp, 10 electron p, 6 electron s, 6 electron hoá trị. Đúng: (1), (3), (5). Sai: (2) và (4) vì O (Z = 8) phi kim mạnh hơn S. Đáp án B."}, "c14-hoi": {"d": 9.024, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Câu 3. Từ công thức oxide cao nhất, bạn suy ra hoá trị, rồi nhóm của X và Y. Sau đó chọn số phát biểu đúng."}, "c14-sai-2": {"d": 9.768, "s": "media/c14-sai-2.mp3", "loai": "am", "chu": "Phát biểu (1) sai: XO cho X hoá trị II (nhóm IIA), YO₃ cho Y hoá trị VI (nhóm VIA), không kế tiếp nhau."}, "c14-sai-3": {"d": 8.496, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "Có hai phát biểu sai: (1) và (4). Y là phi kim nên hydroxide cao nhất có tính acid."}, "c14-sai-4": {"d": 11.4, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Cả (2) và (3) đều đúng: X nhóm IIA là kim loại, XO là basic oxide; Y nhóm VIA là phi kim, YO₃ là acidic oxide."}, "c14-vi-sao": {"d": 16.296, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "X nhóm IIA, Y nhóm VIA. Đúng: (2), (3). Sai: (1) vì hai nhóm không kế tiếp; (4) vì hydroxide cao nhất của Y có dạng H₂YO₄ và có tính acid. Đáp án A."}, "c15-1": {"d": 7.272, "s": "media/c15-1.mp3", "loai": "am", "chu": "Câu 4 nói về borax, còn gọi là hàn the. Bạn đọc thầm câu trên màn hình nhé."}, "c15-2": {"d": 7.584, "s": "media/c15-2.mp3", "loai": "am", "chu": "Borax được dùng làm sạch bề mặt kim loại trước khi hàn, chế tạo thuỷ tinh quang học, men đồ sứ và sản xuất bột giặt."}, "c15-3": {"d": 4.968, "s": "media/c15-3.mp3", "loai": "am", "chu": "Ta xét ba nguyên tố Na, B và O trong borax nhé."}, "c16-hoi": {"d": 10.68, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Biết na-tri có Z bằng mười một, bo có Z bằng năm, ô-xi có Z bằng tám. Bạn viết nháp cấu hình, rồi nối mỗi nguyên tố với vị trí."}, "c16-sai": {"d": 5.688, "s": "media/c16-sai.mp3", "loai": "am", "chu": "Số lớp electron cho chu kì, số electron lớp ngoài cùng cho nhóm A."}, "c16-vi-sao": {"d": 15.096, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "Na: 1s²2s²2p⁶3s¹ → chu kì 3, nhóm IA. B: 1s²2s²2p¹ → chu kì 2, nhóm IIIA. O: 1s²2s²2p⁴ → chu kì 2, nhóm VIA."}, "c16-sai-2": {"d": 8.472, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "Đây là vị trí của Al (Z = 13). B chỉ có 2 lớp electron: 1s²2s²2p¹."}, "c17-hoi": {"d": 6.816, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Bạn nhìn vị trí ba nguyên tố trong bảng. Thứ tự bán kính nguyên tử tăng dần là gì?"}, "c17-sai-2": {"d": 6.672, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Đây là thứ tự giảm dần. Na có 3 lớp electron nên bán kính lớn nhất."}, "c17-sai-3": {"d": 5.568, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "B và O cùng chu kì 2, O ở bên phải nên bán kính nhỏ hơn B."}, "c17-sai-4": {"d": 5.784, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Na ở chu kì 3, nhiều lớp electron hơn B nên bán kính lớn hơn B."}, "c17-vi-sao": {"d": 9.936, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "O và B cùng chu kì 2, bán kính giảm từ trái qua phải nên O < B. Na ở chu kì 3 có nhiều lớp electron hơn nên lớn nhất: O < B < Na."}, "c18-hoi": {"d": 4.728, "s": "media/c18-hoi.mp3", "loai": "am", "chu": "Còn độ âm điện, thứ tự giảm dần của ba nguyên tố là gì?"}, "c18-sai-1": {"d": 6.552, "s": "media/c18-sai-1.mp3", "loai": "am", "chu": "Đây là thứ tự tăng dần. O là phi kim mạnh, độ âm điện lớn nhất."}, "c18-sai-2": {"d": 4.848, "s": "media/c18-sai-2.mp3", "loai": "am", "chu": "Na là kim loại mạnh, độ âm điện nhỏ nhất trong ba nguyên tố."}, "c18-sai-4": {"d": 5.544, "s": "media/c18-sai-4.mp3", "loai": "am", "chu": "B và O cùng chu kì, O ở bên phải nên độ âm điện lớn hơn B."}, "c18-vi-sao": {"d": 10.104, "s": "media/c18-vi-sao.mp3", "loai": "am", "chu": "Cùng chu kì 2: B < O. Na < Al (cùng chu kì 3) và Al < B (cùng nhóm IIIA) nên Na < B. Vậy O > B > Na."}, "c19-hoi": {"d": 13.896, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Câu 5. Cafein, chất gây đắng trong cà phê và trà, tạo nên từ các-bon, ni-tơ, ô-xi và hi-đờ-rô. So sánh nào đúng cho các-bon, ni-tơ và ô-xi?"}, "c19-sai-2": {"d": 10.296, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "C, N, O cùng chu kì 2, Z tăng thì tính phi kim và độ âm điện tăng, bán kính giảm. Bạn đang đảo ngược chiều."}, "c19-sai-3": {"d": 5.568, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "Trong chu kì, Z tăng thì bán kính giảm, nên C > N > O."}, "c19-sai-4": {"d": 4.728, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Cùng chu kì nhưng Z khác nhau nên tính chất biến đổi theo xu hướng."}, "c19-vi-sao": {"d": 13.896, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "C (IVA), N (VA), O (VIA) cùng chu kì 2, Z tăng dần: tính phi kim C < N < O, độ âm điện C < N < O, bán kính C > N > O."}, "c20-hoi": {"d": 11.76, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Câu 6. A và B đứng kế tiếp nhau trong cùng một chu kì, tổng điện tích hạt nhân là hai mươi lăm. Z của A, nguyên tố đứng trước, bằng bao nhiêu?"}, "c20-sai": {"d": 9.072, "s": "media/c20-sai.mp3", "loai": "am", "chu": "Hai nguyên tố kế tiếp hơn kém nhau 1 đơn vị điện tích hạt nhân. Bạn đặt Z của A là x thì Z của B là x + 1."}, "c20-vi-sao": {"d": 9.648, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "x + (x + 1) = 25 nên x = 12. A là Mg (Z = 12), B là Al (Z = 13)."}, "c21-hoi": {"d": 7.728, "s": "media/c21-hoi.mp3", "loai": "am", "chu": "A là ma-giê, B là nhôm. Nhận định nào đúng về vị trí và tính chất của hai nguyên tố?"}, "c21-sai-2": {"d": 6.696, "s": "media/c21-sai-2.mp3", "loai": "am", "chu": "Trong một chu kì, tính kim loại giảm dần theo chiều tăng điện tích hạt nhân, nên Mg mạnh hơn Al."}, "c21-sai-3": {"d": 9.408, "s": "media/c21-sai-3.mp3", "loai": "am", "chu": "Mg: 1s²2s²2p⁶3s² và Al: 1s²2s²2p⁶3s²3p¹ đều có 3 lớp electron nên ở chu kì 3."}, "c21-sai-4": {"d": 6.264, "s": "media/c21-sai-4.mp3", "loai": "am", "chu": "Al có 3 electron lớp ngoài cùng (3s²3p¹) nên ở nhóm IIIA."}, "c21-vi-sao": {"d": 16.536, "s": "media/c21-vi-sao.mp3", "loai": "am", "chu": "Mg 1s²2s²2p⁶3s²: chu kì 3, nhóm IIA. Al 1s²2s²2p⁶3s²3p¹: chu kì 3, nhóm IIIA. Cùng chu kì, Z tăng thì tính kim loại giảm: Mg > Al."}, "c22-1": {"d": 3.0, "s": "media/c22-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại Chương 2 nhé."}, "c22-2": {"d": 8.376, "s": "media/c22-2.mp3", "loai": "am", "chu": "Bảng tuần hoàn xếp theo chiều tăng điện tích hạt nhân: cùng số lớp electron thành chu kì, cùng số electron hoá trị thành nhóm."}, "c22-3": {"d": 9.6, "s": "media/c22-3.mp3", "loai": "am", "chu": "Trong chu kì sang phải: độ âm điện, phi kim, acid tăng. Trong nhóm A xuống dưới: bán kính, kim loại tăng."}, "c22-4": {"d": 9.984, "s": "media/c22-4.mp3", "loai": "am", "chu": "Vị trí, cấu hình electron và tính chất liên hệ chặt với nhau theo định luật tuần hoàn. Kim la bàn của bạn giờ đã chỉ đúng hướng rồi đấy!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 6.768, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã ôn xong Chương 2 Bảng tuần hoàn. Bạn bấm Chép kết quả để gửi cô nhé!"}}/*__MEDIA_HET__*/;

/* ---------- màu: tiện ích + biến dẫn xuất (mực luôn đậm, chữ sáng cho nền tối) ---------- */
const hex2 = h => { h = String(h || "#000000").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

  if (!CANH_XEM[c.loai]){ P.rt.nhacLai && P.rt.nhacLai(); return; }
  if (P.chay){ P.chay = false; im(); P.nhip = -2; } else { if (P.t >= P.rt.tong - .05) P.t = 0; clearTimeout(P.hen); P.chay = true; P.nhip = -2; }
  capNut(); };
$("#b-lai").onclick = () => { if (P.i < 0) return; const c = CANH[P.i]; if (CANH_XEM[c.loai]){ tua(0); P.chay = true; capNut(); } else moCanh(P.i); };
$("#b-lui").onclick = () => { if (P.i > 0) moCanh(P.i - 1); };
$("#b-toi").onclick = () => { if (P.i < CANH.length - 1 && (P.xong.has(P.i) || P.coXem)) moCanh(P.i + 1); };
nutTiep.onclick = () => { if (P.i < CANH.length - 1) moCanh(P.i + 1); };
$("#b-cc").onclick = e => { P.cc = !P.cc; e.currentTarget.classList.toggle("bat", P.cc); e.currentTarget.setAttribute("aria-pressed", P.cc); phude.hidden = !pdHt || !P.cc; };
$("#b-toc").onclick = e => { const ds = [1, 1.25, .75]; P.toc = ds[(ds.indexOf(P.toc) + 1) % ds.length]; e.currentTarget.textContent = P.toc + "×"; if (dangNoi && dangNoi.a.playbackRate != null) dangNoi.a.playbackRate = P.toc; if (P.rt && P.rt.phim) P.rt.phim.playbackRate = P.toc; };

$("#co-xem").onchange = e => { P.coXem = e.target.checked; veMenu(); capNut(); };
const th = $("#thanh");
function tuaChuot(e){ const r = th.getBoundingClientRect(); tua((e.clientX - r.left) / r.width); }
th.addEventListener("pointerdown", e => { const c = CANH[P.i]; if (!c || !(CANH_XEM[c.loai] || c.loai === "phim")) return; th.setPointerCapture(e.pointerId); tuaChuot(e);
  const mv = ev => tuaChuot(ev), up = () => { th.removeEventListener("pointermove", mv); th.removeEventListener("pointerup", up); };
  th.addEventListener("pointermove", mv); th.addEventListener("pointerup", up); });
th.addEventListener("keydown", e => { if (!P.rt || !P.rt.tong) return; if (e.key === "ArrowRight") tua((P.t + 5) / P.rt.tong); if (e.key === "ArrowLeft") tua((P.t - 5) / P.rt.tong); });
document.addEventListener("keydown", e => { if (e.key === " " && !/INPUT|TEXTAREA|BUTTON|SELECT/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")){ e.preventDefault(); $("#b-chay").click(); } });
addEventListener("pagehide", () => { luu(); SC.dong(); });

(() => { const v = $("#ve-noi-dung"), dong = [];

  dong.push(`<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>`);
  const ng = [...(BAI.nguon || []), ...Object.entries(ANH).filter(([, a]) => a.nguon).map(([t, a]) => `Ảnh «${t}»: ${a.nguon}`)];
  if (ng.length) dong.push(`<p><b>Nguồn:</b></p><ul>${ng.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
  v.innerHTML = dong.join(""); })();
