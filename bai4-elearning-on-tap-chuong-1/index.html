<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai4-elearning-on-tap-chuong-1 bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai4-elearning-on-tap-chuong-1', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}
.mu{font-size:.62em;line-height:0;font-variant-numeric:lining-nums}sup.mu{vertical-align:.55em}sub.mu{vertical-align:-.2em}.obt{display:inline-flex;vertical-align:middle;margin:0 .15em}.obt>span{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.5em;border:.08em solid currentColor;margin-left:-.08em;font-size:1.25em;font-weight:900;letter-spacing:-.12em;font-family:"Segoe UI Symbol",var(--f-chu)}

.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}

.anh-tran{overflow:hidden}

.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}

#stage[data-pc="so-tay"] .khung-anh{border-radius:.3cqw;border:.7cqw solid #fff;border-bottom-width:2.4cqw;box-shadow:0 .5cqw 1.4cqw var(--bong);transform:rotate(-1.4deg)}
#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}
#stage[data-pc="so-tay"] .dap{border-radius:.5cqw;transform:rotate(-1deg);box-shadow:0 .4cqw 1cqw var(--bong)}
#stage[data-pc="so-tay"] .nut-chon,#stage[data-pc="so-tay"] .nut-sk,#stage[data-pc="so-tay"] .o-phai,#stage[data-pc="so-tay"] .the-k{border-radius:.6cqw}

-2.mp3", "loai": "am", "chu": "Số khối là tổng số proton và số neutron: A = Z + N."}, "c4-sai-3": {"d": 7.872, "s": "media/c4-sai-3.mp3", "loai": "am", "chu": "Chỉ lấy trung bình cộng khi hai đồng vị có phần trăm bằng nhau. Phải nhân với phần trăm của từng đồng vị."}, "c4-sai-4": {"d": 4.752, "s": "media/c4-sai-4.mp3", "loai": "am", "chu": "Số khối gồm proton và neutron, không tính electron."}, "c4-vi-sao": {"d": 13.272, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Số khối A = Z + N. Nguyên tử khối trung bình: Ā = (a·X + b·Y) : (a + b), với a, b là phần trăm số nguyên tử của đồng vị X, Y (a + b = 100)."}, "c5-hoi": {"d": 7.464, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Nhánh cấu hình electron có hai nguyên lí và một quy tắc. Bạn nối mỗi tên với nội dung đúng."}, "c5-sai": {"d": 7.344, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Vững bền nói về thứ tự điền; Pauli nói về một ô orbital; Hund nói về cách xếp trong một phân lớp."}, "c5-vi-sao": {"d": 13.656, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Vững bền: điền từ năng lượng thấp đến cao. Pauli: mỗi AO tối đa 2 e ngược chiều. Hund: trong phân lớp, số e độc thân là tối đa."}, "c5-sai-2": {"d": 5.352, "s": "media/c5-sai-2.mp3", "loai": "am", "chu": "Một orbital chỉ chứa tối đa 2 electron có chiều tự quay ngược nhau."}, "c6-1": {"d": 6.84, "s": "media/c6-1.mp3", "loai": "am", "chu": "Lớp n có n phân lớp và n bình phương orbital, với n không quá 4."}, "c6-2": {"d": 10.056, "s": "media/c6-2.mp3", "loai": "am", "chu": "Mỗi orbital chứa tối đa 2 electron, nên lớp K chứa tối đa 2, L chứa 8, M chứa 18, N chứa 32 electron."}, "c6-3": {"d": 7.488, "s": "media/c6-3.mp3", "loai": "am", "chu": "Orbital s hình cầu; phân lớp p có ba orbital px, py, pz hình số 8 nổi."}, "c6-4": {"d": 7.512, "s": "media/c6-4.mp3", "loai": "am", "chu": "Thứ tự năng lượng tăng dần: 1s 2s 2p 3s 3p 4s."}, "c7-hoi": {"d": 7.68, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "Nhánh cuối cùng: đặc điểm lớp electron ngoài cùng. Bạn xếp mỗi thẻ vào đúng loại nguyên tố."}, "c7-sai": {"d": 10.632, "s": "media/c7-sai.mp3", "loai": "am", "chu": "1, 2, 3 electron lớp ngoài cùng là kim loại (trừ H, He, B); 5, 6, 7 thường là phi kim; 8 là khí hiếm."}, "c7-vi-sao": {"d": 14.616, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Na, Mg, Al là kim loại; O, Cl là phi kim; Ar là khí hiếm. Nguyên tử có 4 electron lớp ngoài cùng có thể là kim loại hoặc phi kim."}, "c8-hoi": {"d": 8.16, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Phần luyện tập. Câu một: số proton, neutron và electron của ka-li ba mươi chín lần lượt là gì?"}, "c8-sai-1": {"d": 6.792, "s": "media/c8-sai-1.mp3", "loai": "am", "chu": "39 là số khối. Số electron bằng số proton, bằng 19."}, "c8-sai-2": {"d": 6.144, "s": "media/c8-sai-2.mp3", "loai": "am", "chu": "Số ở dưới là Z = số proton = 19; số neutron = 39 − 19 = 20."}, "c8-sai-4": {"d": 7.368, "s": "media/c8-sai-4.mp3", "loai": "am", "chu": "Thứ tự đề hỏi là proton, neutron, electron: 19, 20, 19."}, "c8-vi-sao": {"d": 7.68, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Z = 19 nên p = e = 19; N = A − Z = 39 − 19 = 20. Đáp án C."}, "c9-hoi": {"d": 5.448, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Câu hai: nguyên tử của nguyên tố nào có ba electron thuộc lớp ngoài cùng?"}, "c9-sai-1": {"d": 6.36, "s": "media/c9-sai-1.mp3", "loai": "am", "chu": "Na (Z = 11): 2, 8, 1 — chỉ có 1 electron lớp ngoài cùng."}, "c9-sai-2": {"d": 5.64, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "N (Z = 7): 2, 5 — có 5 electron lớp ngoài cùng."}, "c9-sai-4": {"d": 5.448, "s": "media/c9-sai-4.mp3", "loai": "am", "chu": "C (Z = 6): 2, 4 — có 4 electron lớp ngoài cùng."}, "c9-vi-sao": {"d": 13.512, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Al (Z = 13): 1s²2s²2p⁶3s²3p¹, lớp ngoài cùng 3s²3p¹ có 3 electron. Đáp án C."}, "c10-hoi": {"d": 12.0, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Câu ba: ka-li có mười chín electron. Ở trạng thái cơ bản, có bao nhiêu orbital chứa electron? Bạn viết cấu hình rồi đếm số ô nhé."}, "c10-sai-1": {"d": 7.896, "s": "media/c10-sai-1.mp3", "loai": "am", "chu": "Bạn đếm thiếu. Phân lớp p có 3 orbital: 2p có 3 ô, 3p có 3 ô."}, "c10-sai-2": {"d": 4.104, "s": "media/c10-sai-2.mp3", "loai": "am", "chu": "Bạn nhớ đếm cả ô 4s chứa 1 electron."}, "c10-sai-3": {"d": 6.576, "s": "media/c10-sai-3.mp3", "loai": "am", "chu": "Có 19 electron nhưng mỗi ô chứa tối đa 2 electron, nên không cần tới 11 ô."}, "c10-vi-sao": {"d": 18.264, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "1s²2s²2p⁶3s²3p⁶4s¹: các phân lớp s (1s, 2s, 3s, 4s) có 4 AO; 2p, 3p có 6 AO. Tổng 10 orbital. Đáp án D."}, "c11-hoi": {"d": 7.008, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Câu bốn: nguyên tử na-tri có Z bằng mười một. Cấu hình electron đúng là gì?"}, "c11-sai-1": {"d": 4.152, "s": "media/c11-sai-1.mp3", "loai": "am", "chu": "Cộng số mũ được 12, thừa 1 electron."}, "c11-sai-2": {"d": 4.008, "s": "media/c11-sai-2.mp3", "loai": "am", "chu": "Cộng số mũ được 10, thiếu 1 electron."}, "c11-sai-4": {"d": 5.616, "s": "media/c11-sai-4.mp3", "loai": "am", "chu": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền."}, "c11-vi-sao": {"d": 8.76, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Na có 11 electron: 2 + 2 + 6 + 1 = 11, điền đúng thứ tự năng lượng. Đáp án C."}, "c12-hoi": {"d": 10.416, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Câu năm: tổng số hạt của X là năm mươi tám, số hạt mang điện nhiều hơn số hạt không mang điện là mười tám. Bạn lập hệ phương trình rồi tìm X nhé."}, "c12-sai-1": {"d": 8.256, "s": "media/c12-sai-1.mp3", "loai": "am", "chu": "Cl có Z = 17. Bạn giải lại: 2p + n = 58 và 2p − n = 18."}, "c12-sai-2": {"d": 7.32, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Ca có Z = 20. Cộng hai phương trình: 4p = 76, p = 19."}, "c12-sai-4": {"d": 7.296, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "S có Z = 16. Số hạt mang điện gồm cả proton và electron: 2p."}, "c12-vi-sao": {"d": 12.96, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "2p + n = 58 và 2p − n = 18 → 4p = 76 → p = e = 19, n = 20. X là potassium (K). Đáp án C."}, "c13-hoi": {"d": 9.144, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Câu sáu: clo có Z bằng mười bảy. Bạn viết cấu hình và vẽ nháp ô orbital lớp ngoài cùng, rồi chọn đáp án."}, "c13-sai-2": {"d": 7.128, "s": "media/c13-sai-2.mp3", "loai": "am", "chu": "Lớp ngoài cùng là cả lớp thứ 3: 3s²3p⁵ có 2 + 5 = 7 electron."}, "c13-sai-3": {"d": 7.488, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "3p⁵ có 5 electron trong 3 ô: hai ô đủ đôi, chỉ một ô có 1 electron độc thân."}, "c13-sai-4": {"d": 8.304, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Cấu hình 1s²2s²2p⁶3s²3p⁵ có 3 lớp electron."}, "c13-vi-sao": {"d": 12.984, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "Cl: 1s²2s²2p⁶3s²3p⁵, 3 lớp, 7 electron lớp ngoài cùng; 3p⁵ xếp [[↑↓|↑↓|↑]] nên có 1 electron độc thân."}, "c14-hoi": {"d": 12.84, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Câu bảy: nguyên tử khối trung bình của va-na-đi là năm mươi phẩy chín chín bảy lăm. Đồng vị năm mươi chiếm không phẩy hai lăm phần trăm. Bạn tính số khối đồng vị còn lại nhé."}, "c14-sai": {"d": 12.84, "s": "media/c14-sai.mp3", "loai": "am", "chu": "Đồng vị còn lại chiếm 100 − 0,25 = 99,75%. Lập: (50 × 0,25 + A × 99,75) : 100 = 50,9975."}, "c14-vi-sao": {"d": 13.704, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "50 × 0,25 + 99,75 × A = 5099,75 → 99,75 × A = 5087,25 → A = 51. Đồng vị còn lại là ⁵¹V."}, "c15-hoi": {"d": 7.512, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Câu tám có hai cấu hình X và Y trên màn hình. Bạn xếp mỗi thông tin vào đúng nguyên tử nhé."}, "c15-sai": {"d": 7.968, "s": "media/c15-sai.mp3", "loai": "am", "chu": "Bạn cộng số mũ để ra số electron, đếm số lớp theo số lớn nhất đứng trước, xem số electron lớp ngoài cùng."}, "c15-vi-sao": {"d": 16.344, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! X: 19 e (Z = 19), 4 lớp, 6 phân lớp, 1 e ngoài cùng nên là kim loại. Y: 16 e (Z = 16), 3 lớp, 5 phân lớp, 6 e ngoài cùng nên là phi kim."}, "c16-hoi": {"d": 10.056, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Câu chín: X kết thúc ở ba pê một, dùng làm hợp kim nhẹ; Y kết thúc ở ba pê ba, có trong DNA. Nhận định nào đúng?"}, "c16-sai-2": {"d": 8.352, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "X có 3 electron lớp ngoài cùng (3s²3p¹) nên là kim loại; Y có 5 nên là phi kim."}, "c16-sai-3": {"d": 13.56, "s": "media/c16-sai-3.mp3", "loai": "am", "chu": "Viết đủ cấu hình: X là 1s²2s²2p⁶3s²3p¹ có 13 electron; Y là ...3p³ có 15 electron."}, "c16-sai-4": {"d": 4.776, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Khí hiếm có 8 electron lớp ngoài cùng; Y chỉ có 5."}, "c16-vi-sao": {"d": 22.032, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "X: 1s²2s²2p⁶3s²3p¹ (13 e, 3 e ngoài cùng, kim loại — aluminium). Y: 1s²2s²2p⁶3s²3p³ (15 e, 5 e ngoài cùng, phi kim — phosphorus)."}, "c17-hoi": {"d": 10.8, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Câu mười: tổng số hạt của X là bốn mươi chín, số hạt không mang điện bằng năm mươi ba phẩy một hai lăm phần trăm số hạt mang điện. Bạn tính số khối của X nhé."}, "c17-sai": {"d": 11.016, "s": "media/c17-sai.mp3", "loai": "am", "chu": "Lập hệ: 2p + n = 49 và n = 0,53125 × 2p. Thay vào: 2p × 1,53125 = 49."}, "c17-vi-sao": {"d": 12.528, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "2p = 49 : 1,53125 = 32 → p = e = 16, n = 17. Điện tích hạt nhân +16, số khối A = 16 + 17 = 33."}, "c18-1": {"d": 2.928, "s": "media/c18-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại Chương 1 nhé."}, "c18-2": {"d": 9.408, "s": "media/c18-2.mp3", "loai": "am", "chu": "Nguyên tử gồm hạt nhân chứa proton, neutron và vỏ chứa electron; số proton bằng số electron, số khối bằng Z cộng N."}, "c18-3": {"d": 8.712, "s": "media/c18-3.mp3", "loai": "am", "chu": "Electron điền theo nguyên lí vững bền, nguyên lí Pauli, quy tắc Hund; lớp ngoài cùng quyết định kim loại, phi kim hay khí hiếm."}, "c18-4": {"d": 7.944, "s": "media/c18-4.mp3", "loai": "am", "chu": "Bài toán số hạt: nhớ số hạt mang điện là 2p. Hẹn gặp bạn ở Chương 2 Bảng tuần hoàn nhé!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 6.96, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã ôn xong Chương 1 Cấu tạo nguyên tử. Bạn bấm Chép kết quả để gửi cô nhé!"}}/*__MEDIA_HET__*/;
