<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai4-elearning-on-tap-chuong-1 bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai4-elearning-on-tap-chuong-1', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}

.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}

.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}

#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}

.xoay{display:none}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}

.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}

#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}

t lại.", "Phần Hệ thống hoá SGV không có đáp án; bài lấy theo nội dung SGK Bài 1–3. Dòng «tối đa 2n² electron» suy từ «n² AO, mỗi AO 2 electron» (n ≤ 4).", "Câu 8 làm thành kéo thả (thông tin thuộc X hay Y); Câu 6, 10 làm thành câu chọn/điền, lời giải đầy đủ giao viết vào vở."], "loi_ket": "Bạn đã ôn xong Chương 1 Cấu tạo nguyên tử. Bạn bấm Chép kết quả để gửi cô Thơi nhé!", "canh": [{"ma": "c1", "loai": "mo-dau", "ten": "Chào bạn", "sgk": ["HT"], "minh_hoa": [{"chu": "Hạt nhân", "luc": 2}, {"chu": "Vỏ e", "luc": 2}, {"chu": "Nguyên tố", "luc": 2}], "dong": [{"id": "c1-1"}, {"id": "c1-2"}, {"id": "c1-3"}, {"id": "c1-4"}]}, {"ma": "c2", "loai": "trinh-bay", "ten": "Bản đồ Chương 1", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["HT"], "hinh": {"anh": "b04-so-do.png", "chu": "Khung sơ đồ hệ thống hoá (theo SGK tr. 26)"}, "dong": [{"the": "Nguyên tử = **hạt nhân + vỏ**", "id": "c2-1"}, {"the": "Hạt nhân: **p, n** · Vỏ: **e**", "id": "c2-2"}, {"the": "Cùng Z: **một nguyên tố**", "id": "c2-3"}, {"the": "Điền **từng nhánh**", "id": "c2-4"}]}, {"ma": "c3", "loai": "noi", "ten": "Nhánh hạt nhân và vỏ", "muc": "biet", "yccd": [1], "sgk": ["HT"], "hoi": "Nối mỗi hạt với điện tích của nó.", "noi": "Nhánh thứ nhất: các hạt cấu tạo nên nguyên tử. Bạn nối mỗi hạt với điện tích của nó.", "giai": "Proton mang điện dương, electron mang điện âm, neutron không mang điện.", "vi_sao": "Đúng hết! Proton +1, neutron 0, electron −1. Proton và neutron nặng khoảng 1 amu, electron chỉ khoảng 0,00055 amu.", "phai": ["+2", "+1", "−1", "0"], "trai": [{"chu": "Proton"}, {"chu": "Neutron"}, {"chu": "Electron"}], "dap": [1, 3, 2], "hoi_id": "c3-hoi", "sai_id": "c3-sai", "vi_sao_id": "c3-vi-sao", "sai_rieng": {"0": "c3-sai-2"}}, {"ma": "c4", "loai": "chon", "ten": "Nhánh nguyên tố hoá học", "muc": "hieu", "yccd": [1], "sgk": ["HT"], "hoi": "Công thức đúng cho nhánh nguyên tố hoá học là", "noi": "Nhánh nguyên tố hoá học có số khối và nguyên tử khối trung bình. Công thức nào đúng?", "lua": [{"chu": "A = Z + N; Ā = (a·X + b·Y) : (a + b)", "dung": true}, {"chu": "A = Z − N; Ā = (a·X + b·Y) : (a + b)", "giai": "Số khối là tổng số proton và số neutron: A = Z + N.", "sai_id": "c4-sai-2"}, {"chu": "A = Z + N; Ā = (X + Y) : 2", "giai": "Chỉ lấy trung bình cộng khi hai đồng vị có phần trăm bằng nhau. Phải nhân với phần trăm của từng đồng vị.", "sai_id": "c4-sai-3"}, {"chu": "A = Z + E; Ā = X + Y", "giai": "Số khối gồm proton và neutron, không tính electron.", "sai_id": "c4-sai-4"}], "vi_sao": "Số khối A = Z + N. Nguyên tử khối trung bình: Ā = (a·X + b·Y) : (a + b), với a, b là phần trăm số nguyên tử của đồng vị X, Y (a + b = 100).", "hoi_id": "c4-hoi", "vi_sao_id": "c4-vi-sao"}, {"ma": "c5", "loai": "noi", "ten": "Nhánh cấu hình electron", "muc": "biet", "yccd": [2], "sgk": ["HT"], "hoi": "Nối mỗi nguyên lí, quy tắc với nội dung của nó.", "noi": "Nhánh cấu hình electron có hai nguyên lí và một quy tắc. Bạn nối mỗi tên với nội dung đúng.", "giai": "Vững bền nói về thứ tự điền; Pauli nói về một ô orbital; Hund nói về cách xếp trong một phân lớp.", "vi_sao": "Đúng hết! Vững bền: điền từ năng lượng thấp đến cao. Pauli: mỗi AO tối đa 2 e ngược chiều. Hund: trong phân lớp, số e độc thân là tối đa.", "phai": ["2 e ngược chiều/AO", "Thấp → cao", "Độc thân tối đa", "3 e/AO"], "trai": [{"chu": "Nguyên lí vững bền"}, {"chu": "Nguyên lí Pauli"}, {"chu": "Quy tắc Hund"}], "dap": [1, 0, 2], "hoi_id": "c5-hoi", "sai_id": "c5-sai", "vi_sao_id": "c5-vi-sao", "sai_rieng": {"3": "c5-sai-2"}}, {"ma": "c6", "loai": "trinh-bay", "ten": "Bảng lớp electron", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["HT", "3"], "hinh": {"anh": "b04-bang-lop.png", "chu": "Lớp, phân lớp, số AO và số electron tối đa (theo SGK tr. 26)"}, "dong": [{"the": "Lớp n: **n phân lớp, n² AO**", "id": "c6-1"}, {"the": "K 2 · L 8 · M 18 · N 32", "id": "c6-2"}, {"the": "s: **hình cầu** · p: **số 8 nổi**", "id": "c6-3"}, {"the": "1s 2s 2p 3s 3p **4s**", "id": "c6-4"}]}, {"ma": "c7", "loai": "keo-tha", "ten": "Nhánh lớp ngoài cùng", "muc": "hieu", "yccd": [2], "sgk": ["HT"], "hoi": "Xếp mỗi số electron lớp ngoài cùng vào đúng loại nguyên tố.", "noi": "Nhánh cuối cùng: đặc điểm lớp electron ngoài cùng. Bạn xếp mỗi thẻ vào đúng loại nguyên tố.", "nhom": ["Kim loại", "Phi kim", "Khí hiếm"], "the": [{"chu": "1 e (Na)", "nhom": 0}, {"chu": "2 e (Mg)", "nhom": 0}, {"chu": "3 e (Al)", "nhom": 0}, {"chu": "6 e (O)", "nhom": 1}, {"chu": "7 e (Cl)", "nhom": 1}, {"chu": "8 e (Ar)", "nhom": 2}], "giai": "1, 2, 3 electron lớp ngoài cùng là kim loại (trừ H, He, B); 5, 6, 7 thường là phi kim; 8 là khí hiếm.", "vi_sao": "Đúng hết! Na, Mg, Al là kim loại; O, Cl là phi kim; Ar là khí hiếm. Nguyên tử có 4 electron lớp ngoài cùng có thể là kim loại hoặc phi kim.", "hoi_id": "c7-hoi", "sai_id": "c7-sai", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "chon", "ten": "Câu 1 SGK: potassium", "muc": "van-dung", "yccd": [3], "sgk": ["1"], "hoi": "Số proton, neutron và electron của {{39|19|K}} lần lượt là", "noi": "Phần luyện tập. Câu một: số proton, neutron và electron của potassium ba mươi chín lần lượt là gì?", "lua": [{"chu": "A. 19, 20, 39", "giai": "39 là số khối. Số electron bằng số proton, bằng 19.", "sai_id": "c8-sai-1"}, {"chu": "B. 20, 19, 39", "giai": "Số ở dưới là Z = số proton = 19; số neutron = 39 − 19 = 20.", "sai_id": "c8-sai-2"}, {"chu": "C. 19, 20, 19", "dung": true}, {"chu": "D. 19, 19, 20", "giai": "Thứ tự đề hỏi là proton, neutron, electron: 19, 20, 19.", "sai_id": "c8-sai-4"}], "vi_sao": "Z = 19 nên p = e = 19; N = A − Z = 39 − 19 = 20. Đáp án C.", "hoi_id": "c8-hoi", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "chon", "ten": "Câu 2 SGK: 3 e ngoài cùng", "muc": "van-dung", "yccd": [2, 3], "sgk": ["2"], "hoi": "Nguyên tử nào có 3 electron thuộc lớp ngoài cùng?", "noi": "Câu hai: nguyên tử của nguyên tố nào có ba electron thuộc lớp ngoài cùng?", "lua": [{"chu": "A. {{23|11|Na}}", "giai": "Na (Z = 11): 2, 8, 1 — chỉ có 1 electron lớp ngoài cùng.", "sai_id": "c9-sai-1"}, {"chu": "B. {{14|7|N}}", "giai": "N (Z = 7): 2, 5 — có 5 electron lớp ngoài cùng.", "sai_id": "c9-sai-2"}, {"chu": "C. {{27|13|Al}}", "dung": true}, {"chu": "D. {{12|6|C}}", "giai": "C (Z = 6): 2, 4 — có 4 electron lớp ngoài cùng.", "sai_id": "c9-sai-4"}], "vi_sao": "Al (Z = 13): 1s²2s²2p⁶3s²3p¹, lớp ngoài cùng 3s²3p¹ có 3 electron. Đáp án C.", "hoi_id": "c9-hoi", "vi_sao_id": "c9-vi-sao"}, {"ma": "c10", "loai": "chon", "ten": "Câu 3 SGK: số orbital của K", "muc": "van-dung", "yccd": [2, 3], "sgk": ["3"], "hoi": "Potassium có 19 electron. Ở trạng thái cơ bản, số orbital chứa electron là", "noi": "Câu ba: potassium có mười chín electron. Ở trạng thái cơ bản, có bao nhiêu orbital chứa electron? Bạn viết cấu hình rồi đếm số ô nhé.", "lua": [{"chu": "A. 8", "giai": "Bạn đếm thiếu. Phân lớp p có 3 orbital: 2p có 3 ô, 3p có 3 ô.", "sai_id": "c10-sai-1"}, {"chu": "B. 9", "giai": "Bạn nhớ đếm cả ô 4s chứa 1 electron.", "sai_id": "c10-sai-2"}, {"chu": "C. 11", "giai": "Có 19 electron nhưng mỗi ô chứa tối đa 2 electron, nên không cần tới 11 ô.", "sai_id": "c10-sai-3"}, {"chu": "D. 10", "dung": true}], "vi_sao": "1s²2s²2p⁶3s²3p⁶4s¹: các phân lớp s (1s, 2s, 3s, 4s) có 4 AO; 2p, 3p có 6 AO. Tổng 10 orbital. Đáp án D.", "hoi_id": "c10-hoi", "vi_sao_id": "c10-vi-sao"}, {"ma": "c11", "loai": "chon", "ten": "Câu 4 SGK: sodium", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hoi": "Nguyên tử sodium (Z = 11) có cấu hình electron là", "noi": "Câu bốn: nguyên tử sodium có Z bằng mười một. Cấu hình electron đúng là gì?", "lua": [{"chu": "A. 1s²2s²2p⁶3s²", "giai": "Cộng số mũ được 12, thừa 1 electron.", "sai_id": "c11-sai-1"}, {"chu": "B. 1s²2s²2p⁶", "giai": "Cộng số mũ được 10, thiếu 1 electron.", "sai_id": "c11-sai-2"}, {"chu": "C. 1s²2s²2p⁶3s¹", "dung": true}, {"chu": "D. 1s²2s²2p⁵3s²", "giai": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền.", "sai_id": "c11-sai-4"}], "vi_sao": "Na có 11 electron: 2 + 2 + 6 + 1 = 11, điền đúng thứ tự năng lượng. Đáp án C.", "hoi_id": "c11-hoi", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Câu 5 SGK: tìm X", "muc": "van-dung", "yccd": [3], "sgk": ["5"], "diem": 2, "hoi": "Tổng số hạt p, n, e của X là 58; số hạt mang điện nhiều hơn số hạt không mang điện là 18. X là", "noi": "Câu năm: tổng số hạt của X là năm mươi tám, số hạt mang điện nhiều hơn số hạt không mang điện là mười tám. Bạn lập hệ phương trình rồi tìm X nhé.", "lua": [{"chu": "A. Cl", "giai": "Cl có Z = 17. Bạn giải lại: 2p + n = 58 và 2p − n = 18.", "sai_id": "c12-sai-1"}, {"chu": "B. Ca", "giai": "Ca có Z = 20. Cộng hai phương trình: 4p = 76, p = 19.", "sai_id": "c12-sai-2"}, {"chu": "C. K", "dung": true}, {"chu": "D. S", "giai": "S có Z = 16. Số hạt mang điện gồm cả proton và electron: 2p.", "sai_id": "c12-sai-4"}], "vi_sao": "2p + n = 58 và 2p − n = 18 → 4p = 76 → p = e = 19, n = 20. X là potassium (K). Đáp án C.", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "chon", "ten": "Câu 6 SGK: chlorine", "muc": "van-dung", "yccd": [2], "sgk": ["6"], "hoi": "Chlorine (Z = 17) có số lớp electron, số e lớp ngoài cùng, số e độc thân lần lượt là", "noi": "Câu sáu: chlorine có Z bằng mười bảy. Bạn viết cấu hình và vẽ nháp ô orbital lớp ngoài cùng, rồi chọn đáp án.", "lua": [{"chu": "3 lớp; 7 e; 1 e độc thân", "dung": true}, {"chu": "3 lớp; 5 e; 1 e độc thân", "giai": "Lớp ngoài cùng là cả lớp thứ 3: 3s²3p⁵ có 2 + 5 = 7 electron.", "sai_id": "c13-sai-2"}, {"chu": "3 lớp; 7 e; 3 e độc thân", "giai": "3p⁵ có 5 electron trong 3 ô: hai ô đủ đôi, chỉ một ô có 1 electron độc thân.", "sai_id": "c13-sai-3"}, {"chu": "2 lớp; 7 e; 1 e độc thân", "giai": "Cấu hình 1s²2s²2p⁶3s²3p⁵ có 3 lớp electron.", "sai_id": "c13-sai-4"}], "vi_sao": "Cl: 1s²2s²2p⁶3s²3p⁵, 3 lớp, 7 electron lớp ngoài cùng; 3p⁵ xếp [[↑↓|↑↓|↑]] nên có 1 electron độc thân.", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "dien", "ten": "Câu 7 SGK: vanadium", "muc": "van-dung", "yccd": [3], "sgk": ["7"], "diem": 2, "hoi": "Ā(V) = 50,9975; -2.mp3", "loai": "am", "chu": "Số khối là tổng số proton và số neutron: A = Z + N."}, "c4-sai-3": {"d": 7.872, "s": "media/c4-sai-3.mp3", "loai": "am", "chu": "Chỉ lấy trung bình cộng khi hai đồng vị có phần trăm bằng nhau. Phải nhân với phần trăm của từng đồng vị."}, "c4-sai-4": {"d": 4.824, "s": "media/c4-sai-4.mp3", "loai": "am", "chu": "Số khối gồm proton và neutron, không tính electron."}, "c4-vi-sao": {"d": 14.712, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Số khối A = Z + N. Nguyên tử khối trung bình: Ā = (a·X + b·Y) : (a + b), với a, b là phần trăm số nguyên tử của đồng vị X, Y (a + b = 100)."}, "c5-hoi": {"d": 7.44, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Nhánh cấu hình electron có hai nguyên lí và một quy tắc. Bạn nối mỗi tên với nội dung đúng."}, "c5-sai": {"d": 7.416, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Vững bền nói về thứ tự điền; Pauli nói về một ô orbital; Hund nói về cách xếp trong một phân lớp."}, "c5-vi-sao": {"d": 13.656, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Vững bền: điền từ năng lượng thấp đến cao. Pauli: mỗi AO tối đa 2 e ngược chiều. Hund: trong phân lớp, số e độc thân là tối đa."}, "c5-sai-2": {"d": 5.304, "s": "media/c5-sai-2.mp3", "loai": "am", "chu": "Một orbital chỉ chứa tối đa 2 electron có chiều tự quay ngược nhau."}, "c6-1": {"d": 6.792, "s": "media/c6-1.mp3", "loai": "am", "chu": "Lớp n có n phân lớp và n bình phương orbital, với n không quá 4."}, "c6-2": {"d": 10.08, "s": "media/c6-2.mp3", "loai": "am", "chu": "Mỗi orbital chứa tối đa 2 electron, nên lớp K chứa tối đa 2, L chứa 8, M chứa 18, N chứa 32 electron."}, "c6-3": {"d": 7.536, "s": "media/c6-3.mp3", "loai": "am", "chu": "Orbital s hình cầu; phân lớp p có ba orbital px, py, pz hình số 8 nổi."}, "c6-4": {"d": 7.512, "s": "media/c6-4.mp3", "loai": "am", "chu": "Thứ tự năng lượng tăng dần: 1s 2s 2p 3s 3p 4s."}, "c7-hoi": {"d": 7.632, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "Nhánh cuối cùng: đặc điểm lớp electron ngoài cùng. Bạn xếp mỗi thẻ vào đúng loại nguyên tố."}, "c7-sai": {"d": 10.704, "s": "media/c7-sai.mp3", "loai": "am", "chu": "1, 2, 3 electron lớp ngoài cùng là kim loại (trừ H, He, B); 5, 6, 7 thường là phi kim; 8 là khí hiếm."}, "c7-vi-sao": {"d": 14.592, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Na, Mg, Al là kim loại; O, Cl là phi kim; Ar là khí hiếm. Nguyên tử có 4 electron lớp ngoài cùng có thể là kim loại hoặc phi kim."}, "c8-hoi": {"d": 8.616, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Phần luyện tập. Câu một: số proton, neutron và electron của potassium ba mươi chín lần lượt là gì?"}, "c8-sai-1": {"d": 6.816, "s": "media/c8-sai-1.mp3", "loai": "am", "chu": "39 là số khối. Số electron bằng số proton, bằng 19."}, "c8-sai-2": {"d": 7.176, "s": "media/c8-sai-2.mp3", "loai": "am", "chu": "Số ở dưới là Z = số proton = 19; số neutron = 39 − 19 = 20."}, "c8-sai-4": {"d": 7.392, "s": "media/c8-sai-4.mp3", "loai": "am", "chu": "Thứ tự đề hỏi là proton, neutron, electron: 19, 20, 19."}, "c8-vi-sao": {"d": 8.76, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Z = 19 nên p = e = 19; N = A − Z = 39 − 19 = 20. Đáp án C."}, "c9-hoi": {"d": 5.448, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Câu hai: nguyên tử của nguyên tố nào có ba electron thuộc lớp ngoài cùng?"}, "c9-sai-1": {"d": 6.456, "s": "media/c9-sai-1.mp3", "loai": "am", "chu": "Na (Z = 11): 2, 8, 1 — chỉ có 1 electron lớp ngoài cùng."}, "c9-sai-2": {"d": 5.472, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "N (Z = 7): 2, 5 — có 5 electron lớp ngoài cùng."}, "c9-sai-4": {"d": 5.64, "s": "media/c9-sai-4.mp3", "loai": "am", "chu": "C (Z = 6): 2, 4 — có 4 electron lớp ngoài cùng."}, "c9-vi-sao": {"d": 13.656, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Al (Z = 13): 1s²2s²2p⁶3s²3p¹, lớp ngoài cùng 3s²3p¹ có 3 electron. Đáp án C."}, "c10-hoi": {"d": 12.456, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Câu ba: potassium có mười chín electron. Ở trạng thái cơ bản, có bao nhiêu orbital chứa electron? Bạn viết cấu hình rồi đếm số ô nhé."}, "c10-sai-1": {"d": 7.896, "s": "media/c10-sai-1.mp3", "loai": "am", "chu": "Bạn đếm thiếu. Phân lớp p có 3 orbital: 2p có 3 ô, 3p có 3 ô."}, "c10-sai-2": {"d": 4.08, "s": "media/c10-sai-2.mp3", "loai": "am", "chu": "Bạn nhớ đếm cả ô 4s chứa 1 electron."}, "c10-sai-3": {"d": 6.6, "s": "media/c10-sai-3.mp3", "loai": "am", "chu": "Có 19 electron nhưng mỗi ô chứa tối đa 2 electron, nên không cần tới 11 ô."}, "c10-vi-sao": {"d": 18.264, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "1s²2s²2p⁶3s²3p⁶4s¹: các phân lớp s (1s, 2s, 3s, 4s) có 4 AO; 2p, 3p có 6 AO. Tổng 10 orbital. Đáp án D."}, "c11-hoi": {"d": 7.104, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Câu bốn: nguyên tử sodium có Z bằng mười một. Cấu hình electron đúng là gì?"}, "c11-sai-1": {"d": 4.152, "s": "media/c11-sai-1.mp3", "loai": "am", "chu": "Cộng số mũ được 12, thừa 1 electron."}, "c11-sai-2": {"d": 4.032, "s": "media/c11-sai-2.mp3", "loai": "am", "chu": "Cộng số mũ được 10, thiếu 1 electron."}, "c11-sai-4": {"d": 5.592, "s": "media/c11-sai-4.mp3", "loai": "am", "chu": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền."}, "c11-vi-sao": {"d": 8.952, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Na có 11 electron: 2 + 2 + 6 + 1 = 11, điền đúng thứ tự năng lượng. Đáp án C."}, "c12-hoi": {"d": 10.416, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Câu năm: tổng số hạt của X là năm mươi tám, số hạt mang điện nhiều hơn số hạt không mang điện là mười tám. Bạn lập hệ phương trình rồi tìm X nhé."}, "c12-sai-1": {"d": 8.976, "s": "media/c12-sai-1.mp3", "loai": "am", "chu": "Cl có Z = 17. Bạn giải lại: 2p + n = 58 và 2p − n = 18."}, "c12-sai-2": {"d": 7.992, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Ca có Z = 20. Cộng hai phương trình: 4p = 76, p = 19."}, "c12-sai-4": {"d": 7.536, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "S có Z = 16. Số hạt mang điện gồm cả proton và electron: 2p."}, "c12-vi-sao": {"d": 14.232, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "2p + n = 58 và 2p − n = 18 → 4p = 76 → p = e = 19, n = 20. X là potassium (K). Đáp án C."}, "c13-hoi": {"d": 9.336, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Câu sáu: chlorine có Z bằng mười bảy. Bạn viết cấu hình và vẽ nháp ô orbital lớp ngoài cùng, rồi chọn đáp án."}, "c13-sai-2": {"d": 7.128, "s": "media/c13-sai-2.mp3", "loai": "am", "chu": "Lớp ngoài cùng là cả lớp thứ 3: 3s²3p⁵ có 2 + 5 = 7 electron."}, "c13-sai-3": {"d": 7.416, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "3p⁵ có 5 electron trong 3 ô: hai ô đủ đôi, chỉ một ô có 1 electron độc thân."}, "c13-sai-4": {"d": 8.304, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Cấu hình 1s²2s²2p⁶3s²3p⁵ có 3 lớp electron."}, "c13-vi-sao": {"d": 13.056, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "Cl: 1s²2s²2p⁶3s²3p⁵, 3 lớp, 7 electron lớp ngoài cùng; 3p⁵ xếp [[↑↓|↑↓|↑]] nên có 1 electron độc thân."}, "c14-hoi": {"d": 13.008, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Câu bảy: nguyên tử khối trung bình của vanadium là năm mươi phẩy chín chín bảy lăm. Đồng vị năm mươi chiếm không phẩy hai lăm phần trăm. Bạn tính số khối đồng vị còn lại nhé."}, "c14-sai": {"d": 13.512, "s": "media/c14-sai.mp3", "loai": "am", "chu": "Đồng vị còn lại chiếm 100 − 0,25 = 99,75%. Lập: (50 × 0,25 + A × 99,75) : 100 = 50,9975."}, "c14-vi-sao": {"d": 14.28, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "50 × 0,25 + 99,75 × A = 5099,75 → 99,75 × A = 5087,25 → A = 51. Đồng vị còn lại là ⁵¹V."}, "c15-hoi": {"d": 7.512, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Câu tám có hai cấu hình X và Y trên màn hình. Bạn xếp mỗi thông tin vào đúng nguyên tử nhé."}, "c15-sai": {"d": 8.04, "s": "media/c15-sai.mp3", "loai": "am", "chu": "Bạn cộng số mũ để ra số electron, đếm số lớp theo số lớn nhất đứng trước, xem số electron lớp ngoài cùng."}, "c15-vi-sao": {"d": 16.776, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! X: 19 e (Z = 19), 4 lớp, 6 phân lớp, 1 e ngoài cùng nên là kim loại. Y: 16 e (Z = 16), 3 lớp, 5 phân lớp, 6 e ngoài cùng nên là phi kim."}, "c16-hoi": {"d": 10.056, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Câu chín: X kết thúc ở ba pê một, dùng làm hợp kim nhẹ; Y kết thúc ở ba pê ba, có trong DNA. Nhận định nào đúng?"}, "c16-sai-2": {"d": 8.328, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "X có 3 electron lớp ngoài cùng (3s²3p¹) nên là kim loại; Y có 5 nên là phi kim."}, "c16-sai-3": {"d": 13.608, "s": "media/c16-sai-3.mp3", "loai": "am", "chu": "Viết đủ cấu hình: X là 1s²2s²2p⁶3s²3p¹ có 13 electron; Y là ...3p³ có 15 electron."}, "c16-sai-4": {"d": 4.752, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Khí hiếm có 8 electron lớp ngoài cùng; Y chỉ có 5."}, "c16-vi-sao": {"d": 22.272, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "X: 1s²2s²2p⁶3s²3p¹ (13 e, 3 e ngoài cùng, kim loại — aluminium). Y: 1s²2s²2p⁶3s²3p³ (15 e, 5 e ngoài cùng, phi kim — phosphorus)."}, "c17-hoi": {"d": 10.8, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Câu mười: tổng số hạt của X là bốn mươi chín, số hạt không mang điện bằng năm mươi ba phẩy một hai lăm phần trăm số hạt mang điện. Bạn tính số khối của X nhé."}, "c17-sai": {"d": 11.64, "s": "media/c17-sai.mp3", "loai": "am", "chu": "Lập hệ: 2p + n = 49 và n = 0,53125 × 2p. Thay vào: 2p × 1,53125 = 49."}, "c17-vi-sao": {"d": 13.584, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "2p = 49 : 1,53125 = 32 → p = e = 16, n = 17. Điện tích hạt nhân +16, số khối A = 16 + 17 = 33."}, "c18-1": {"d": 2.928, "s": "media/c18-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại Chương 1 nhé."}, "c18-2": {"d": 9.264, "s": "media/c18-2.mp3", "loai": "am", "chu": "Nguyên tử gồm hạt nhân chứa proton, neutron và vỏ chứa electron; số proton bằng số electron, số khối bằng Z cộng N."}, "c18-3": {"d": 8.712, "s": "media/c18-3.mp3", "loai": "am", "chu": "Electron điền theo nguyên lí vững bền, nguyên lí Pauli, quy tắc Hund; lớp ngoài cùng quyết định kim loại, phi kim hay khí hiếm."}, "c18-4": {"d": 7.944, "s": "media/c18-4.mp3", "loai": "am", "chu": "Bài toán số hạt: nhớ số hạt mang điện là 2p. Hẹn gặp bạn ở Chương 2 Bảng tuần hoàn nhé!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 7.128, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã ôn xong Chương 1 Cấu tạo nguyên tử. Bạn bấm Chép kết quả để gửi cô Thơi nhé!"}}/*__MEDIA_HET__*/;

/* ---------- màu: tiện ích + biến dẫn xuất (mực luôn đậm, chữ sáng cho nền tối) ---------- */
const hex2 = h => { h = String(h || "#000000").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
