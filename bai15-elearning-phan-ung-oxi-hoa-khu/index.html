<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai15-elearning-phan-ung-oxi-hoa-khu bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai15-elearning-phan-ung-oxi-hoa-khu', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}
.kh{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:middle}.kh-az{display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:.6em;line-height:1.02;margin-right:.06em;font-variant-numeric:tabular-nums}.sox{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;line-height:1.05}.sox-so{font-size:.55em;line-height:1;margin-bottom:.06em;color:var(--a4);font-variant-numeric:lining-nums}.mu{font-size:.62em;line-height:0;font-variant-numeric:lining-nums}sup.mu{vertical-align:.55em}sub.mu{vertical-align:-.2em}.obt{display:inline-flex;vertical-align:middle;margin:0 .15em}.obt>span{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.5em;border:.08em solid currentColor;margin-left:-.08em;font-size:1.25em;font-weight:900;letter-spacing:-.12em;font-family:"Segoe UI Symbol",var(--f-chu)}

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.dap{background:var(--a2);border-radius:1.6cqw;padding:1cqw 2cqw;font:800 calc(3.8cqw*var(--co,1))/1.1 var(--f-hien);color:var(--muc);box-shadow:0 .6cqw 0 var(--a2d);text-align:center}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tde2{font:700 3cqw/1.15 var(--f-hien);color:var(--a1)}
.hoi{font:800 2.9cqw/1.2 var(--f-hien);color:var(--chu-nen);text-wrap:balance}

.nguon-anh{position:absolute;right:.6cqw;bottom:.5cqw;font:700 1.05cqw/1.2 var(--f-chu);color:var(--chu2);background:rgba(255,255,255,.85);border-radius:.6cqw;padding:.2cqw .6cqw;max-width:90%}
.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:hover{transform:translateY(-.2cqw)}
.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}
.nut-sk{font:800 2.3cqw/1 var(--f-hien);border-radius:1.2cqw;padding:1.1cqw 1.8cqw;border:.3cqw solid var(--chu);background:var(--the);color:var(--chu);cursor:pointer;box-shadow:0 .45cqw 0 var(--chu)}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}
.o-phai.lcd-k.khop{color:var(--a3d)}
.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat{cursor:default;border-color:var(--a3);box-shadow:0 .3cqw 0 var(--a3);width:10cqw;min-height:0;font-size:1.6cqw;padding:.4cqw}
.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}
.nhom .trong-nhom{display:flex;flex-wrap:wrap;gap:.4cqw;justify-content:center;align-content:flex-start;flex:1}
.nhom.sang{background:color-mix(in srgb,var(--a2) 35%,transparent)}
#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}
.dong-ket span:nth-child(even){font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.xoay{display:none}
@media (max-width:620px) and (orientation:portrait){.xoay{display:block;font:700 13px/1.4 var(--f-chu);color:var(--muted);text-align:center;padding:6px 0}}
#phude-dai{background:#0E1222;min-height:calc(2.7em + 18px);display:flex;align-items:center;justify-content:center;padding:8px 16px;font:700 clamp(14px,1.6vw,22px)/1.35 var(--f-chu)}

#dk{background:var(--bar);color:var(--bar-fg);border-radius:0 0 14px 14px;display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}

@media (max-width:620px){#dk{gap:0;padding:4px 6px}#dk button{min-width:36px;height:38px;padding:0 6px}#gio{display:none}#thanh{flex:1 0 100%;order:9;height:30px}#nhan-thanh{font-size:12px}}
aside#ml{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}
#stage.toi .tde2{color:color-mix(in srgb,var(--a1) 45%,#fff)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}
.cot.kinh .trich{color:var(--chu);border-radius:1cqw;padding:1cqw 1.4cqw 1cqw 1.6cqw;text-shadow:none}
.trich{font:italic 400 calc(2.3cqw*var(--co,1))/1.4 var(--f-trich);color:var(--chu-nen);border-left:.5cqw solid var(--a1);padding:.3cqw 0 .3cqw 1.6cqw;text-shadow:0 0 .9cqw var(--halo)}
.trich b{color:var(--a1)}
.trich .ngoac{display:none}
.trich-nguon{font:700 calc(1.45cqw*var(--co,1))/1.3 var(--f-chu);font-style:normal;letter-spacing:.06em;margin-top:.8cqw;opacity:.8}
#stage[data-bc="trich-dan"] .trich{font-size:calc(3.5cqw*var(--co,1));line-height:1.35;border:0;padding:0 0 0 6.4cqw;position:relative;margin-bottom:1.2cqw}
#stage[data-bc="trich-dan"] .trich .ngoac{display:block;position:absolute;left:0;top:-1.4cqw;font:700 11cqw/1 var(--f-trich);font-style:normal;color:var(--a1);opacity:.85}
.tg-moc{text-align:center}
.tg-moc span{display:inline-block;background:var(--a1);color:#fff;border-radius:99px;padding:.45cqw 1.3cqw;font:800 calc(1.75cqw*var(--co,1))/1.2 var(--f-hien);box-shadow:0 .35cqw 0 var(--a1d);text-shadow:none}
.tg-cot .the{font-size:calc(1.75cqw*var(--co,1));text-align:center}
.tg-cot .dap{font-size:calc(2.4cqw*var(--co,1))}
.o-luoi{display:flex;flex-direction:column;gap:1cqw}

.o-luoi>.the{font-size:calc(2.6cqw*var(--co,1));border-top:.7cqw solid var(--vien-o,var(--a1));padding:1.6cqw 2.2cqw}
.o-luoi>.dap{font-size:calc(3.4cqw*var(--co,1))}
.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}
.logo-truong img{height:3.6cqw;width:auto;display:block}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}
#stage[data-pc="so-tay"] .cot>.the{position:relative}
#stage[data-pc="so-tay"] .cot>.the::before{content:"";position:absolute;left:50%;top:-.8cqw;width:6.5cqw;height:1.6cqw;transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--a2) 55%,transparent);border-radius:.2cqw}
#stage[data-pc="so-tay"] .khung-anh{border-radius:.3cqw;border:.7cqw solid #fff;border-bottom-width:2.4cqw;box-shadow:0 .5cqw 1.4cqw var(--bong);transform:rotate(-1.4deg)}
#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}
#stage[data-pc="so-tay"] .dap{border-radius:.5cqw;transform:rotate(-1deg);box-shadow:0 .4cqw 1cqw var(--bong)}
#stage[data-pc="so-tay"] .nut-chon,#stage[data-pc="so-tay"] .nut-sk,#stage[data-pc="so-tay"] .o-phai,#stage[data-pc="so-tay"] .the-k{border-radius:.6cqw}

ản ứng oxi hoá khử, chất có số oxi hoá tăng lên là chất gì?", "lua": [{"chu": "chất oxi hoá", "giai": "Chất oxi hoá nhận electron nên số oxi hoá giảm.", "sai_id": "c8-sai-1"}, {"chu": "chất khử", "dung": true}, {"chu": "chất xúc tác", "giai": "Chất xúc tác không thay đổi sau phản ứng.", "sai_id": "c8-sai-3"}, {"chu": "sản phẩm", "giai": "Câu hỏi nói về chất tham gia nhường hay nhận electron.", "sai_id": "c8-sai-4"}], "vi_sao": "Chất khử nhường electron nên số oxi hoá tăng (C: 0 → +4). Chất oxi hoá nhận electron nên số oxi hoá giảm (O: 0 → −2).", "hoi_id": "c8-hoi", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "chon", "ten": "Thí nghiệm: đinh sắt và CuSO₄", "muc": "hieu", "yccd": [2], "sgk": ["TN"], "hoi": "Fe + CuSO₄ ⟶ FeSO₄ + Cu. Chất khử và chất oxi hoá là", "noi": "Thí nghiệm một: cho đinh sắt vào dung dịch đồng sun phát. Sắt cộng đồng sun phát tạo ra sắt hai sun phát và đồng. Chất khử, chất oxi hoá là gì?", "lua": [{"chu": "Fe là chất khử, CuSO₄ là chất oxi hoá", "dung": true}, {"chu": "Fe là chất oxi hoá, CuSO₄ là chất khử", "giai": "Fe từ 0 lên +2: nhường electron nên là chất khử.", "sai_id": "c9-sai-2"}, {"chu": "Cả hai đều là chất khử", "giai": "Có chất nhường thì phải có chất nhận: Cu từ +2 xuống 0 là nhận electron.", "sai_id": "c9-sai-3"}, {"chu": "Không phải phản ứng oxi hoá – khử", "giai": "Fe và Cu đều thay đổi số oxi hoá, nên đây là phản ứng oxi hoá – khử.", "sai_id": "c9-sai-4"}], "vi_sao": "{{Fe|0}} ⟶ {{Fe|+2}} + 2e: Fe là chất khử. {{Cu|+2}} + 2e ⟶ {{Cu|0}}: CuSO₄ là chất oxi hoá.", "hoi_id": "c9-hoi", "vi_sao_id": "c9-vi-sao"}, {"ma": "c10", "loai": "chon", "ten": "Thí nghiệm: đinh sắt và H₂SO₄", "muc": "hieu", "yccd": [2], "sgk": ["TN"], "hoi": "Fe + H₂SO₄ (loãng) ⟶ FeSO₄ + H₂. Chất oxi hoá là", "noi": "Thí nghiệm hai: cho đinh sắt vào dung dịch a-xít sun-phu-ric loãng, tạo ra sắt hai sun phát và khí hát hai. Chất oxi hoá là gì?", "lua": [{"chu": "Fe", "giai": "Fe từ 0 lên +2 là nhường electron: Fe là chất khử.", "sai_id": "c10-sai-1"}, {"chu": "H₂SO₄ (ion H⁺ nhận electron)", "dung": true}, {"chu": "FeSO₄", "giai": "FeSO₄ là sản phẩm, không phải chất tham gia.", "sai_id": "c10-sai-3"}, {"chu": "H₂", "giai": "H₂ là sản phẩm tạo thành khi H⁺ nhận electron.", "sai_id": "c10-sai-4"}], "vi_sao": "{{H|+1}} nhận electron thành {{H₂|0}}: H₂SO₄ là chất oxi hoá. Fe nhường 2 electron: Fe là chất khử.", "hoi_id": "c10-hoi", "vi_sao_id": "c10-vi-sao"}, {"ma": "c11", "loai": "trinh-bay", "ten": "Phản ứng oxi hoá – khử", "nen": "xanh-la", "bo_cuc": "trich-dan", "sgk": ["2"], "trich": "Phản ứng oxi hoá – khử là phản ứng hoá học xảy ra đồng thời quá trình nhường electron và quá trình nhận electron.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 74", "dong": [{"sau": 14, "id": "c11-1"}, {"the": "Dấu hiệu: **số oxi hoá thay đổi**", "id": "c11-2"}, {"the": "Fe(OH)₂ + O₂ + H₂O ⟶ Fe(OH)₃", "id": "c11-3"}]}, {"ma": "c12", "loai": "chon", "ten": "Câu 2a SGK: nguyên tử đổi số oxi hoá", "muc": "van-dung", "yccd": [2], "sgk": ["2"], "hoi": "Fe(OH)₂ + O₂ + H₂O ⟶ Fe(OH)₃. Nguyên tử nào thay đổi số oxi hoá?", "noi": "Câu hai a: trong phản ứng này, nguyên tử nào thay đổi số oxi hoá?", "lua": [{"chu": "Fe (+2 → +3) và O trong O₂ (0 → −2)", "dung": true}, {"chu": "Chỉ có Fe (+2 → +3)", "giai": "Có chất nhường thì phải có chất nhận: O trong O₂ từ 0 xuống −2.", "sai_id": "c12-sai-2"}, {"chu": "Fe và H", "giai": "H luôn là +1 ở cả hai vế, không đổi.", "sai_id": "c12-sai-3"}, {"chu": "Không có nguyên tử nào", "giai": "Fe từ +2 lên +3 nên có thay đổi số oxi hoá.", "sai_id": "c12-sai-4"}], "vi_sao": "{{Fe|+2}} ⟶ {{Fe|+3}} + 1e (quá trình oxi hoá); {{O₂|0}} + 4e ⟶ 2{{O|−2}} (quá trình khử). Cân bằng: 4Fe(OH)₂ + O₂ + 2H₂O ⟶ 4Fe(OH)₃.", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "trinh-bay", "ten": "Thăng bằng electron", "nen": "kem", "bo_cuc": "chia-doi", "sgk": ["3", "6"], "hinh": {"anh": "b15-thang-bang.png", "chu": "Lập phương trình NH₃ + O₂ theo 4 bước (theo SGK tr. 74–75)"}, "dong": [{"the": "e **nhường** = e **nhận**", "id": "c13-1"}, {"the": "{{N|−3}} ⟶ {{N|+2}} · {{O₂|0}} ⟶ {{O|−2}}", "id": "c13-2"}, {"the": "N nhường **5e** · O₂ nhận **4e**", "id": "c13-3"}, {"the": "4NH₃ + 5O₂ ⟶ 4NO + 6H₂O", "id": "c13-4"}]}, {"ma": "c14", "loai": "chon", "ten": "Câu 3 SGK: phản ứng nào?", "muc": "hieu", "yccd": [2], "sgk": ["3"], "hoi": "Phản ứng nào là phản ứng oxi hoá – khử? a) Al(OH)₃ ⟶ Al₂O₃ + H₂O · b) C + CO₂ ⟶ CO", "noi": "Câu ba: trong hai phản ứng trên màn hình, phản ứng nào là phản ứng oxi hoá khử?", "lua": [{"chu": "Chỉ phản ứng a", "giai": "Trong a, Al luôn +3, O luôn −2, H luôn +1: không đổi số oxi hoá.", "sai_id": "c14-sai-1"}, {"chu": "Chỉ phản ứng b", "dung": true}, {"chu": "Cả a và b", "giai": "Phản ứng a không có nguyên tử nào đổi số oxi hoá.", "sai_id": "c14-sai-3"}, {"chu": "Không phản ứng nào", "giai": "Trong b, C đơn chất từ 0 lên +2 nên có thay đổi số oxi hoá.", "sai_id": "c14-sai-4"}], "vi_sao": "Phản ứng b: {{C|0}} và {{C|+4}} trong CO₂ cùng về {{C|+2}} trong CO, có thay đổi số oxi hoá. Phản ứng a không có.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "dien", "ten": "Câu 3b SGK: hệ số CO", "muc": "van-dung", "yccd": [3], "sgk": ["3"], "hoi": "Cân bằng C + CO₂ ⟶ ?CO. Hệ số đứng trước CO là", "noi": "Bạn lập phương trình các-bon tác dụng với các-bon đi-ô-xít tạo ra các-bon mô-nô-xít bằng thăng bằng electron. Gõ hệ số đứng trước CO nhé.", "dap": ["2", "hai"], "giai": "C nhường 2e (0 → +2), C trong CO₂ nhận 2e (+4 → +2). Hệ số C và CO₂ đều là 1.", "vi_sao": "{{C|0}} ⟶ {{C|+2}} + 2e; {{C|+4}} + 2e ⟶ {{C|+2}}. C + CO₂ ⟶ 2CO: C là chất khử, CO₂ là chất oxi hoá.", "hoi_id": "c15-hoi", "sai_id": "c15-sai", "vi_sao_id": "c15-vi-sao"}, {"ma": "c16", "loai": "chon", "ten": "Câu 6 SGK: đèn xì acetylene", "muc": "van-dung", "yccd": [3], "sgk": ["6"], "diem": 2, "hoi": "C₂H₂ + O₂ ⟶ CO₂ + H₂O. Phương trình đã cân bằng là", "noi": "Câu sáu: đèn xì đốt a-xê-ti-len. Bạn lập phương trình bằng thăng bằng electron, nhớ C trong C₂H₂ có số oxi hoá ng a-xít nitric bằng bao nhiêu? Gõ cả dấu nhé."}, "c4-sai": {"d": 7.296, "s": "media/c4-sai.mp3", "loai": "am", "chu": "H là +1, O là −2. Lập: (+1) + x + (−2)·3 = 0."}, "c4-vi-sao": {"d": 8.64, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "(+1) + x + (−2)·3 = 0 → x = +5. N trong HNO₃ có số oxi hoá +5."}, "c5-hoi": {"d": 5.448, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Câu một a: bạn nối mỗi chất với số oxi hoá của sắt trong chất đó."}, "c5-sai": {"d": 9.096, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Fe là đơn chất. Trong hợp chất, dùng O −2, nhóm OH có tổng −1, rồi cho tổng số oxi hoá bằng 0."}, "c5-vi-sao": {"d": 15.336, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Fe: 0; FeO: +2; Fe(OH)₃: +3 (Fe₂O₃ cũng +3); Fe₃O₄: 3x − 8 = 0 → +8/3 (số oxi hoá trung bình)."}, "c5-sai-2": {"d": 10.176, "s": "media/c5-sai-2.mp3", "loai": "am", "chu": "Không chất nào ở đây cho Fe số oxi hoá +4. Với Fe₃O₄: 3x + (−2)·4 = 0 → x = +8/3."}, "c6-hoi": {"d": 6.432, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Câu một b: bạn tính số oxi hoá của lưu huỳnh trong mỗi chất, rồi xếp vào đúng nhóm."}, "c6-sai": {"d": 7.992, "s": "media/c6-sai.mp3", "loai": "am", "chu": "S đơn chất là 0. Trong hợp chất: H +1, Na +1, O −2, tổng bằng 0."}, "c6-vi-sao": {"d": 11.4, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! H₂S: −2; S: 0; SO₂ và Na₂SO₃: +4; SO₃ và H₂SO₄: +6."}, "c7-1": {"d": 7.2, "s": "media/c7-1.mp3", "loai": "am", "chu": "Đưa mẩu than nóng đỏ vào bình khí oxygen, than cháy sáng: C + O₂ tạo ra CO₂."}, "c7-2": {"d": 8.448, "s": "media/c7-2.mp3", "loai": "am", "chu": "Nguyên tử C nhường 4 electron, số oxi hoá tăng từ 0 lên cộng 4. C là chất khử."}, "c7-3": {"d": 8.952, "s": "media/c7-3.mp3", "loai": "am", "chu": "Phân tử O₂ nhận 4 electron, số oxi hoá giảm từ 0 xuống trừ 2. O₂ là chất oxi hoá."}, "c7-4": {"d": 9.36, "s": "media/c7-4.mp3", "loai": "am", "chu": "Chất khử nhường electron, đó là quá trình oxi hoá. Chất oxi hoá nhận electron, đó là quá trình khử."}, "c8-hoi": {"d": 5.592, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Trong phản ứng oxi hoá khử, chất có số oxi hoá tăng lên là chất gì?"}, "c8-sai-1": {"d": 4.632, "s": "media/c8-sai-1.mp3", "loai": "am", "chu": "Chất oxi hoá nhận electron nên số oxi hoá giảm."}, "c8-sai-3": {"d": 3.336, "s": "media/c8-sai-3.mp3", "loai": "am", "chu": "Chất xúc tác không thay đổi sau phản ứng."}, "c8-sai-4": {"d": 4.272, "s": "media/c8-sai-4.mp3", "loai": "am", "chu": "Câu hỏi nói về chất tham gia nhường hay nhận electron."}, "c8-vi-sao": {"d": 11.904, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Chất khử nhường electron nên số oxi hoá tăng (C: 0 → +4). Chất oxi hoá nhận electron nên số oxi hoá giảm (O: 0 → −2)."}, "c9-hoi": {"d": 11.712, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Thí nghiệm một: cho đinh sắt vào dung dịch đồng sun phát. Sắt cộng đồng sun phát tạo ra sắt hai sun phát và đồng. Chất khử, chất oxi hoá là gì?"}, "c9-sai-2": {"d": 4.8, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "Fe từ 0 lên +2: nhường electron nên là chất khử."}, "c9-sai-3": {"d": 5.832, "s": "media/c9-sai-3.mp3", "loai": "am", "chu": "Có chất nhường thì phải có chất nhận: Cu từ +2 xuống 0 là nhận electron."}, "c9-sai-4": {"d": 6.144, "s": "media/c9-sai-4.mp3", "loai": "am", "chu": "Fe và Cu đều thay đổi số oxi hoá, nên đây là phản ứng oxi hoá – khử."}, "c9-vi-sao": {"d": 8.4, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "{{Fe|0}} ⟶ {{Fe|+2}} + 2e: Fe là chất khử. {{Cu|+2}} + 2e ⟶ {{Cu|0}}: CuSO₄ là chất oxi hoá."}, "c10-hoi": {"d": 10.104, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Thí nghiệm hai: cho đinh sắt vào dung dịch a-xít sun-phu-ric loãng, tạo ra sắt hai sun phát và khí hát hai. Chất oxi hoá là gì?"}, "c10-sai-1": {"d": 5.208, "s": "media/c10-sai-1.mp3", "loai": "am", "chu": "Fe từ 0 lên +2 là nhường electron: Fe là chất khử."}, "c10-sai-3": {"d": 4.008, "s": "media/c10-sai-3.mp3", "loai": "am", "chu": "FeSO₄ là sản phẩm, không phải chất tham gia."}, "c10-sai-4": {"d": 4.224, "s": "media/c10-sai-4.mp3", "loai": "am", "chu": "H₂ là sản phẩm tạo thành khi H⁺ nhận electron."}, "c10-vi-sao": {"d": 9.648, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "{{H|+1}} nhận electron thành {{H₂|0}}: H₂SO₄ là chất oxi hoá. Fe nhường 2 electron: Fe là chất khử."}, "c11-1": {"d": 2.664, "s": "media/c11-1.mp3", "loai": "am", "chu": "Bạn đọc thầm định nghĩa nhé."}, "c11-2": {"d": 6.648, "s": "media/c11-2.mp3", "loai": "am", "chu": "Dấu hiệu nhận biết phản ứng oxi hoá – khử là có sự thay đổi số oxi hoá của các nguyên tử."}, "c11-3": {"d": 11.544, "s": "media/c11-3.mp3", "loai": "am", "chu": "Ví dụ, trong không khí ẩm, Fe(OH)₂ màu trắng xanh chuyển dần sang Fe(OH)₃ màu nâu đỏ. Bạn thử tìm nguyên tử nào đổi số oxi hoá nhé."}, "c12-hoi": {"d": 5.544, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Câu hai a: trong phản ứng này, nguyên tử nào thay đổi số oxi hoá?"}, "c12-sai-2": {"d": 5.28, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Có chất nhường thì phải có chất nhận: O trong O₂ từ 0 xuống −2."}, "c12-sai-3": {"d": 4.104, "s": "media/c12-sai-3.mp3", "loai": "am", "chu": "H luôn là +1 ở cả hai vế, không đổi."}, "c12-sai-4": {"d": 4.536, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "Fe từ +2 lên +3 nên có thay đổi số oxi hoá."}, "c12-vi-sao": {"d": 13.608, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "{{Fe|+2}} ⟶ {{Fe|+3}} + 1e (quá trình oxi hoá); {{O₂|0}} + 4e ⟶ 2{{O|−2}} (quá trình khử). Cân bằng: 4Fe(OH)₂ + O₂ + 2H₂O ⟶ 4Fe(OH)₃."}, "c13-1": {"d": 6.144, "s": "media/c13-1.mp3", "loai": "am", "chu": "Nguyên tắc: tổng số electron chất khử nhường bằng tổng số electron chất oxi hoá nhận."}, "c13-2": {"d": 10.104, "s": "media/c13-2.mp3", "loai": "am", "chu": "Bước 1: tìm nguyên tố đổi số oxi hoá. Trong NH₃, N từ trừ 3 lên cộng 2; O₂ từ 0 xuống trừ 2."}, "c13-3": {"d": 7.752, "s": "media/c13-3.mp3", "loai": "am", "chu": "Bước 2: viết quá trình. N nhường 5 electron, mỗi O₂ nhận 4 electron."}, "c13-4": {"d": 13.416, "s": "media/c13-4.mp3", "loai": "am", "chu": "Bước 3: nhân N với 4, nhân O₂ với 5 để cùng 20 electron. Bước 4: đặt hệ số, được 4NH₃ + 5O₂ tạo ra 4NO + 6H₂O."}, "c14-hoi": {"d": 6.144, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Câu ba: trong hai phản ứng trên màn hình, phản ứng nào là phản ứng oxi hoá khử?"}, "c14-sai-1": {"d": 6.72, "s": "media/c14-sai-1.mp3", "loai": "am", "chu": "Trong a, Al luôn +3, O luôn −2, H luôn +1: không đổi số oxi hoá."}, "c14-sai-3": {"d": 4.296, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "Phản ứng a không có nguyên tử nào đổi số oxi hoá."}, "c14-sai-4": {"d": 5.592, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Trong b, C đơn chất từ 0 lên +2 nên có thay đổi số oxi hoá."}, "c14-vi-sao": {"d": 9.336, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "Phản ứng b: {{C|0}} và {{C|+4}} trong CO₂ cùng về {{C|+2}} trong CO, có thay đổi số oxi hoá. Phản ứng a không có."}, "c15-hoi": {"d": 10.056, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Bạn lập phương trình các-bon tác dụng với các-bon đi-ô-xít tạo ra các-bon mô-nô-xít bằng thăng bằng electron. Gõ hệ số đứng trước CO nhé."}, "c15-sai": {"d": 10.344, "s": "media/c15-sai.mp3", "loai": "am", "chu": "C nhường 2e (0 → +2), C trong CO₂ nhận 2e (+4 → +2). Hệ số C và CO₂ đều là 1."}, "c15-vi-sao": {"d": 9.0, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "{{C|0}} ⟶ {{C|+2}} + 2e; {{C|+4}} + 2e ⟶ {{C|+2}}. C + CO₂ ⟶ 2CO: C là chất khử, CO₂ là chất oxi hoá."}, "c16-hoi": {"d": 10.392, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Câu sáu: đèn xì đốt a-xê-ti-len. Bạn lập phương trình bằng thăng bằng electron, nhớ C trong C₂H₂ có số oxi hoá trừ 1."}, "c16-sai-1": {"d": 5.16, "s": "media/c16-sai-1.mp3", "loai": "am", "chu": "Vế trái chỉ có 2 O, vế phải có 5 O: chưa cân bằng."}, "c16-sai-3": {"d": 4.8, "s": "media/c16-sai-3.mp3", "loai": "am", "chu": "Vế phải có 4·2 + 2 = 10 O, nên cần 5O₂."}, "c16-sai-4": {"d": 8.16, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Số electron: 2C nhường 10e, mỗi O₂ nhận 4e → nhân C₂H₂ với 2, O₂ với 5."}, "c16-vi-sao": {"d": 13.464, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "2{{C|−1}} ⟶ 2{{C|+4}} + 10e (×2); {{O₂|0}} + 4e ⟶ 2{{O|−2}} (×5). Chất khử C₂H₂, chất oxi hoá O₂: 2C₂H₂ + 5O₂ ⟶ 4CO₂ + 2H₂O."}, "c17-hoi": {"d": 9.264, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Câu bảy, cũng là phản ứng đầu bài: ép e hai ô ba cộng xê ô tạo ra sắt và xê ô hai. Nhận định nào đúng?"}, "c17-sai-2": {"d": 5.544, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "2Fe nhận 6e, mỗi CO chỉ nhường 2e: cần 3CO."}, "c17-sai-3": {"d": 5.832, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "C trong CO từ +2 lên +4: nhường electron nên CO là chất khử."}, "c17-sai-4": {"d": 6.288, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Fe từ +3 xuống 0 là nhận electron: Fe₂O₃ là chất oxi hoá."}, "c17-vi-sao": {"d": 14.064, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "2{{Fe|+3}} + 6e ⟶ 2{{Fe|0}} (×1); {{C|+2}} ⟶ {{C|+4}} + 2e (×3). Fe₂O₃ + 3CO ⟶ 2Fe + 3CO₂: Fe₂O₃ là chất oxi hoá, CO là chất khử."}, "c18-1": {"d": 9.192, "s": "media/c18-1.mp3", "loai": "am", "chu": "Sự cháy là phản ứng oxi hoá – khử ở nhiệt độ cao giữa chất cháy và chất oxi hoá, thường là oxygen. Như mình đây!"}, "c18-2": {"d": 8.064, "s": "media/c18-2.mp3", "loai": "am", "chu": "Vật dụng bằng thép bị oxi hoá trong không khí ẩm tạo gỉ sắt. Nước ta nóng ẩm nên han gỉ rất phổ biến."}, "c18-3": {"d": 7.416, "s": "media/c18-3.mp3", "loai": "am", "chu": "Sản xuất sulfuric acid đi từ sulfur, qua SO₂, SO₃ rồi đến H₂SO₄."}, "c18-4": {"d": 11.184, "s": "media/c18-4.mp3", "loai": "am", "chu": "Ca dao có câu: Lúa chiêm lấp ló đầu bờ, hễ nghe tiếng sấm phất cờ mà lên. Tia sét giúp N₂ phản ứng với O₂, cuối cùng tạo đạm cho lúa."}, "c19-hoi": {"d": 5.952, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Câu bốn: bạn xếp mỗi quá trình oxi hoá khử vào nhóm có lợi hoặc có hại nhé."}, "c19-sai": {"d": 7.032, "s": "media/c19-sai.mp3", "loai": "am", "chu": "Có lợi là phục vụ đời sống, sản xuất; có hại là làm hư hỏng, gây ô nhiễm, thiệt hại."}, "c19-vi-sao": {"d": 10.968, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Có lợi: đốt nhiên liệu, quang hợp, sản xuất hoá chất. Có hại: ăn mòn kim loại, ôi thiu thức ăn, cháy rừng."}, "c20-hoi": {"d": 6.696, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Câu năm: trong chuỗi sản xuất a-xít sun-phu-ric, phản ứng nào không phải phản ứng oxi hoá khử?"}, "c20-sai-1": {"d": 4.416, "s": "media/c20-sai-1.mp3", "loai": "am", "chu": "S từ 0 lên +4: có thay đổi số oxi hoá."}, "c20-sai-2": {"d": 4.728, "s": "media/c20-sai-2.mp3", "loai": "am", "chu": "S từ +4 lên +6: có thay đổi số oxi hoá."}, "c20-sai-4": {"d": 6.552, "s": "media/c20-sai-4.mp3", "loai": "am", "chu": "Fe, S và O đều thay đổi số oxi hoá: đây là phản ứng oxi hoá – khử."}, "c20-vi-sao": {"d": 12.888, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "SO₃ + H₂O ⟶ H₂SO₄: S vẫn +6, O vẫn −2, H vẫn +1 — không đổi số oxi hoá. Các phản ứng còn lại đều là oxi hoá – khử."}, "c21-hoi": {"d": 7.944, "s": "media/c21-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Bản chất và dấu hiệu của phản ứng oxi hoá khử là gì?"}, "c21-sai-2": {"d": 5.616, "s": "media/c21-sai-2.mp3", "loai": "am", "chu": "Phản ứng Fe + CuSO₄ không có O₂ tham gia vẫn là oxi hoá – khử."}, "c21-sai-3": {"d": 6.672, "s": "media/c21-sai-3.mp3", "loai": "am", "chu": "Toả nhiệt, phát sáng là dấu hiệu của sự cháy, không phải của mọi phản ứng oxi hoá – khử."}, "c21-sai-4": {"d": 6.864, "s": "media/c21-sai-4.mp3", "loai": "am", "chu": "Số nguyên tử mỗi nguyên tố luôn bảo toàn. Dấu hiệu là số oxi hoá thay đổi."}, "c21-vi-sao": {"d": 12.768, "s": "media/c21-vi-sao.mp3", "loai": "am", "chu": "Phản ứng oxi hoá – khử xảy ra đồng thời quá trình nhường và nhận electron; dấu hiệu là có sự thay đổi số oxi hoá. Lập phương trình bằng thăng bằng electron: e nhường = e nhận."}, "c22-1": {"d": 2.736, "s": "media/c22-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại bài nhé."}, "c22-2": {"d": 9.48, "s": "media/c22-2.mp3", "loai": "am", "chu": "Số oxi hoá là điện tích quy ước, tính theo bốn quy tắc: đơn chất bằng 0, H cộng 1, O trừ 2, tổng trong phân tử bằng 0."}, "c22-3": {"d": 9.48, "s": "media/c22-3.mp3", "loai": "am", "chu": "Chất khử nhường electron, chất oxi hoá nhận electron. Phản ứng oxi hoá – khử có sự thay đổi số oxi hoá."}, "c22-4": {"d": 9.192, "s": "media/c22-4.mp3", "loai": "am", "chu": "Lập phương trình bằng thăng bằng electron: electron nhường bằng electron nhận. Lần sau nhìn ngọn lửa, nhớ đến mình nhé!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 7.08, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong phản ứng oxi hoá – khử. Bạn bấm Chép kết quả để gửi cô nhé!"}}/*__MEDIA_HET__*/;
