<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai3-elearning-lop-vo-electron bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai3-elearning-lop-vo-electron', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}
.mu{font-size:.62em;line-height:0;font-variant-numeric:lining-nums}sup.mu{vertical-align:.55em}sub.mu{vertical-align:-.2em}.obt{display:inline-flex;vertical-align:middle;margin:0 .15em}.obt>span{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.5em;border:.08em solid currentColor;margin-left:-.08em;font-size:1.25em;font-weight:900;letter-spacing:-.12em;font-family:"Segoe UI Symbol",var(--f-chu)}

.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}

.anh-tran{overflow:hidden}

.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}

#stage[data-pc="so-tay"] .khung-anh{border-radius:.3cqw;border:.7cqw solid #fff;border-bottom-width:2.4cqw;box-shadow:0 .5cqw 1.4cqw var(--bong);transform:rotate(-1.4deg)}
#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}
#stage[data-pc="so-tay"] .dap{border-radius:.5cqw;transform:rotate(-1deg);box-shadow:0 .4cqw 1cqw var(--bong)}
#stage[data-pc="so-tay"] .nut-chon,#stage[data-pc="so-tay"] .nut-sk,#stage[data-pc="so-tay"] .o-phai,#stage[data-pc="so-tay"] .the-k{border-radius:.6cqw}

 động thế nào?", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["1"], "hinh": {"anh": "b03-mo-hinh.png", "chu": "Mô hình hành tinh và mô hình hiện đại (vẽ lại theo Hình 3.1, 3.2 SGK)"}, "dong": [{"the": "Mô hình **hành tinh**", "id": "c2-1"}, {"the": "Chưa giải thích **đủ**", "id": "c2-2"}, {"the": "Hiện đại: **không có quỹ đạo**", "id": "c2-3"}, {"the": "Orbital (AO): xác suất **≈ 90%**", "id": "c2-4"}]}, {"ma": "c3", "loai": "chon", "ten": "Câu 1 SGK: mô hình hiện đại", "muc": "hieu", "yccd": [1], "sgk": ["1"], "hoi": "Theo mô hình hiện đại, electron trong nguyên tử chuyển động", "noi": "Theo mô hình hiện đại, electron trong nguyên tử chuyển động như thế nào?", "lua": [{"chu": "trên quỹ đạo tròn xác định", "giai": "Đó là mô hình hành tinh cũ. Mô hình hiện đại không dùng quỹ đạo.", "sai_id": "c3-sai-1"}, {"chu": "rất nhanh, không theo quỹ đạo xác định", "dung": true}, {"chu": "đứng yên quanh hạt nhân", "giai": "Electron chuyển động rất nhanh, không đứng yên.", "sai_id": "c3-sai-3"}, {"chu": "trên quỹ đạo bầu dục như hành tinh", "giai": "Quỹ đạo bầu dục cũng là mô hình hành tinh, không phải mô hình hiện đại.", "sai_id": "c3-sai-4"}], "vi_sao": "Electron chuyển động rất nhanh, không theo quỹ đạo xác định, tạo thành đám mây electron. Vùng có xác suất tìm thấy electron khoảng 90% là orbital.", "hoi_id": "c3-hoi", "vi_sao_id": "c3-vi-sao"}, {"ma": "c4", "loai": "trinh-bay", "ten": "Hình dạng orbital", "nen": "kem", "bo_cuc": "chia-doi", "sgk": ["2", "3"], "hinh": {"anh": "b03-orbital.png", "chu": "Hình dạng orbital s và p (vẽ lại theo Hình 3.3 SGK)"}, "dong": [{"the": "Orbital **s, p, d, f**", "id": "c4-1"}, {"the": "s: **hình cầu** · p: **số 8 nổi**", "id": "c4-2"}, {"the": "1 AO = 1 **ô orbital**", "id": "c4-3"}, {"the": "Tối đa **2 e ngược chiều** (Pauli)", "id": "c4-4"}]}, {"ma": "c5", "loai": "chon", "ten": "Câu 2 SGK: orbital s", "muc": "biet", "yccd": [2], "sgk": ["2"], "tim_trong_doan": true, "hoi": "Orbital s có dạng", "noi": "Orbital s có dạng gì?", "lua": [{"chu": "A. hình tròn", "giai": "Orbital là vùng không gian ba chiều, nên là hình cầu chứ không phải hình tròn phẳng.", "sai_id": "c5-sai-1"}, {"chu": "B. hình số tám nổi", "giai": "Hình số tám nổi là orbital p.", "sai_id": "c5-sai-2"}, {"chu": "C. hình cầu", "dung": true}, {"chu": "D. hình bầu dục", "giai": "Quỹ đạo bầu dục thuộc mô hình hành tinh cũ.", "sai_id": "c5-sai-4"}], "vi_sao": "Các orbital s có dạng hình cầu. Đáp án C.", "hoi_id": "c5-hoi", "vi_sao_id": "c5-vi-sao"}, {"ma": "c6", "loai": "chon", "ten": "Câu 3 SGK: định hướng AO p", "muc": "hieu", "yccd": [2], "sgk": ["3"], "hinh": {"anh": "b03-orbital.png"}, "hoi": "Ba AO p định hướng trong không gian thế nào?", "noi": "Bạn quan sát hình. Ba orbital p định hướng trong không gian thế nào?", "lua": [{"chu": "Cùng một hướng", "giai": "Ba AO p nằm theo ba hướng khác nhau, không trùng nhau.", "sai_id": "c6-sai-1"}, {"chu": "Theo ba trục x, y, z", "dung": true}, {"chu": "Không có hướng", "giai": "Không có hướng là đặc điểm của AO s hình cầu.", "sai_id": "c6-sai-3"}, {"chu": "Chỉ theo trục x và y", "giai": "Có 3 AO p: px, py, pz, ứng với cả ba trục.", "sai_id": "c6-sai-4"}], "vi_sao": "Phân lớp p có 3 AO hình số 8 nổi, định hướng theo ba trục vuông góc: px theo trục x, py theo trục y, pz theo trục z.", "hoi_id": "c6-hoi", "vi_sao_id": "c6-vi-sao"}, {"ma": "c7", "loai": "dien", "ten": "Một ô orbital chứa mấy electron?", "muc": "biet", "yccd": [2], "sgk": ["2"], "hoi": "Một orbital chứa tối đa bao nhiêu electron?", "noi": "Một orbital chứa tối đa bao nhiêu electron? Bạn gõ số vào ô nhé.", "dap": ["2", "hai"], "don_vi": "electron", "giai": "Bạn nhớ lại nguyên lí Pauli về chiều tự quay.", "vi_sao": "Mỗi orbital chứa tối đa 2 electron có chiều tự quay ngược nhau (nguyên lí Pauli).", "hoi_id": "c7-hoi", "sai_id": "c7-sai", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "trinh-bay", "ten": "Lớp và phân lớp", "nen": "xanh-la", "bo_cuc": "trai-phai", "sgk": ["4", "5"], "hinh": {"anh": "b03-lop.png", "chu": "Lớp, phân lớp và số orbital (tổng hợp theo SGK tr. 22–23)"}, "dong": [{"the": "n = 1, 2, 3… · **K, L, M, N…**", "id": "c8-1"}, {"the": "Cùng lớp: năng lượng **gần bằng nhau**", "id": "c8-2"}, {"the": "Cùng phân lớp: năng lượng **bằng nhau**", "id": "c8-3"}, {"the": "Số phân lớp = **n**", "id": "c8-4"}, {"the": "Lớp n có **n² AO**", "id": "c8-5"}]}, {"ma": "c9", "loai": "keo-tha", "ten": "Phân lớp thuộc lớp nào?", "muc": "hieu", "yccd": [3], "sgk": ["4"], "hoi": "Xếp mỗi phân lớp vào đúng lớp của nó.", "noi": "Bạn xếp mỗi phân lớp vào đúng lớp của nó nhé.", "nhom": ["Lớp K (n = 1)", "Lớp L (n = 2)", "Lớp M (n = 3)"], "the": [{"chu": "1s", "nhom": 0}, {"chu": "2s", "nhom": 1}, {"chu": "2p", "nhom": 1}, {"chu": "3s", "nhom": 2}, {"chu": "3p", "nhom": 2}, {"chu": "3d", "nhom": 2}], "giai": "Con số đứng trước phân lớp chính là số thứ tự lớp n.", "vi_sao": "Đúng hết! Lớp K có 1s; lớp L có 2s, 2p; lớp M có 3s, 3p, 3d. Số phân lớp bằng n.", "hoi_id": "c9-hoi", "sai_id": "c9-sai", "vi_sao_id": "c9-vi-sao"}, {"ma": "c10", "loai": "noi", "ten": "Câu 4 SGK: electron tối đa", "muc": "van-dung", "yccd": [2, 3], "sgk": ["4"], "hoi": "Nối mỗi phân lớp với số electron tối đa.", "noi": "Mỗi ô orbital chứa tối đa hai electron. Bạn nối mỗi phân lớp với số electron tối đa của nó.", "giai": "Số electron tối đa = số AO × 2. Phân lớp s có 1 AO, p có 3 AO, d có 5 AO.", "vi_sao": "Đúng hết! s: 1 × 2 = 2; p: 3 × 2 = 6; d: 5 × 2 = 10.", "phai": ["10 electron", "6 electron", "2 electron", "3 electron"], "trai": [{"chu": "Phân lớp s"}, {"chu": "Phân lớp p"}, {"chu": "Phân lớp d"}], "dap": [2, 1, 0], "hoi_id": "c10-hoi", "sai_id": "c10-sai", "vi_sao_id": "c10-vi-sao", "sai_rieng": {"3": "c10-sai-2"}}, {"ma": "c11", "loai": "chon", "ten": "Câu 5 SGK: lớp L và M", "muc": "van-dung", "yccd": [3], "sgk": ["5"], "hoi": "Tổng số electron tối đa trong mỗi lớp L và M lần lượt là", "noi": "Tổng số electron tối đa có trong mỗi lớp L và M lần lượt là bao nhiêu?", "lua": [{"chu": "A. 2 và 8", "giai": "2 là của lớp K. Lớp L có 4 AO nên chứa tối đa 8 electron.", "sai_id": "c11-sai-1"}, {"chu": "B. 8 và 10", "giai": "Lớp M có 3s, 3p, 3d: 1 + 3 + 5 = 9 AO, chứa tối đa 18 electron.", "sai_id": "c11-sai-2"}, {"chu": "C. 8 và 18", "dung": true}, {"chu": "D. 18 và 32", "giai": "18 là của lớp M, 32 là của lớp N. Đề hỏi lớp L và M.", "sai_id": "c11-sai-4"}], "vi_sao": "Lớp L: 1 + 3 = 4 AO → 4 × 2 = 8 electron. Lớp M: 1 + 3 + 5 = 9 AO → 9 × 2 = 18 electron. Đáp án C.", "hoi_id": "c11-hoi", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "trinh-bay", "ten": "Cấu hình electron", "nen": "cam", "bo_cuc": "chia-doi", "sgk": ["6"], "hinh": {"anh": "b03-ki-hieu.png", "chu": "Cấu hình electron của hydrogen (vẽ lại theo Hình 3.4 SGK)"}, "dong": [{"the": "Electron ở **lớp nào, phân lớp nào**", "id": "c12-1"}, {"the": "1s¹: lớp · phân lớp · **số e**", "id": "c12-2"}, {"the": "Thấp → cao: **nguyên lí vững bền**", "id": "c12-3"}, {"the": "Độc thân tối đa: **quy tắc Hund**", "id": "c12-4"}]}, {"ma": "c13", "loai": "trinh-bay", "ten": "Viết cấu hình theo 3 bước", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["6"], "hinh": {"anh": "b03-vung-ben.png", "chu": "Thứ tự năng lượng các phân lớp (nguyên lí vững bền)"}, "dong": [{"the": "Đếm e → xếp thứ tự → **điền e**", "id": "c13-1"}, {"the": "O: **1s²2s²2p⁴** · (2, 6)", "id": "c13-2"}, {"the": "O: nguyên tố **p**", "id": "c13-3"}, {"the": "K: [Ar]4s¹ · nguyên tố **s**", "id": "c13-4"}]}, {"ma": "c14", "loai": "chon", "ten": "Câu 6 SGK: Z = 16", "muc": "van-dung", "yccd": [4], "sgk": ["6"], "hoi": "Cấu hình electron của nguyên tử có Z = 16 là", "noi": "Cấu hình electron của nguyên tử có Z bằng mười sáu là gì? Bạn đếm tổng số electron của từng đáp án nhé.", "lua": [{"chu": "A. 1s²2s²2p⁶3s²3p³", "giai": "Cộng các số mũ: 2 + 2 + 6 + 2 + 3 = 15, thiếu 1 electron.", "sai_id": "c14-sai-1"}, {"chu": "B. 1s²2s²2p⁶3s²3p⁵", "giai": "Cộng các số mũ được 17, thừa 1 electron.", "sai_id": "c14-sai-2"}, {"chu": "C. 1s²2s²2p⁶3s²3p⁴", "dung": true}, {"chu": "D. 1s²2s²2p⁵3s²3p⁵", "giai": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền.", "sai_id": "c14-sai-4"}], "vi_sao": "Z = 16 có 16 electron: 2 + 2 + 6 + 2 + 4 = 16, điền đúng thứ tự năng lượng. Đáp án C (nguyên tố sulfur).", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "trinh-bay", "ten": "Cấu hình theo ô orbital", "nen": "xanh-duong", "bo_cuc": "chia-doi", "sgk": ["7", "8"], "hinh": {"anh": "b03-o-nitrogen.png", "chu": "Cấu hình electron của nitrogen theo ô orbital (theo ví dụ SGK tr. 24)"}, "dong": [{"the": "N: **1s²2s²2p³**", "id": "c15-1"}, {"the": "Ô đủ 2 e: **ngược chiều**", "id": "c15-2"}, {"the": "2p³: **3 e độc thân** (Hund)", "id": "c15-3"}]}, {"ma": "c16", "loai": "chon", "ten": "Câu 7 SGK: Z = 8", "muc": "van-dung", "yccd": [4], "sgk": ["7"], "diem": 2, "hoi": "Ô orbital của nguyên tử Z = 8 (1s²2s²2p⁴) là", "noi": "Nguyên tử có Z bằng tám, cấu hình một ét hai, hai ét hai, hai pê bốn. Sơ đồ ô orbital nào đúng?", "lua": [{"chu": "[[↑↓]] [[↑↓]] [[↑↓|↑↓| ]]", "giai": "2p⁴ phải điền mỗi ô một electron trước (quy tắc Hund), rồi mới ghép đôi: còn 2 electron độc thân.", "sai_id": "c16-sai-1"}, {"chu": "[[↑↓]] [[↑↓]] [[↑↓|↑|↑]]", "dung": true}, {"chu": "[[↑↑]] [[↑↓]] [[↑↓|↑|↑]]", "giai": "Hai electron trong một ô phải ngược chiều nhau (nguyên lí Pauli).", "sai_id": "c16-sai-3"}, {"chu": "[[↑↓]] [[↑↓]] [[↑|↑|↑]]", "giai": "Sơ đồ này chỉ có 7 electron, là của nitrogen. Z = 8 cần thêm 1 electron ở 2p.", "sai_id": "c16-sai-4"}], "vi_sao": "1s, 2s đủ đôi; 2p có 4 electron: điền 3 ô mỗi ô một mũi tên lên, electron thứ tư ghép ngược chiều vào ô đầu. Còn 2 electron độc thân.", "hoi_id": "c16-hoi", "vi_sao_id": "c16-vi-sao"}, {"ma": "c17", "loai": "chon", "ten": "Câu 7 SGK: Z = 11", "muc": "van-dung", "yccd": [4], "sgk": ["7"], "hoi": "Ô orbital của nguyên tử Z = 11 (1s²2s²2p⁶3s¹) là", "noi": "Nguyên tử có Z bằng mười một. Sơ đồ ô orbital nào đúng?", "lua": [{"chu": "[[↑↓]] [[↑↓]] [[↑↓|↑↓|↑↓]] [[↑]]", "dung": true}, {"chu": "[[↑↓]] [[↑↓]] [[↑↓|↑↓|↑]] [[↑↓]]", "giai": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền.", "sai_id": "c17-sai-2"}, {"chu": "[[↑↓]] [[↑↓]] [[↑↓|↑↓|↑↓]] [[↓]]", "giai": "Ô chỉ có 1 electron thì vẽ mũi tên đi lên.", "sai_id": "c17-sai-3"}, {"chu": "[[↑↓]] [[↑↓|↑↓|↑↓]] [[↑]]", "giai": "Sơ đồ này bỏ mất ô 2s, chỉ có 9 electron.", "sai_id": "c17-sai-4"}], "vi_sao": "11 electron: 1s², 2s², 2p⁶ đủ đôi, còn 1 electron ở 3s vẽ một mũi tên đi lên.", "hoi_id": "c17-hoi", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "trinh-bay", "ten": "Lớp electron ngoài cùng", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["9"], "hinh": {"anh": "b03-ngoai-cung.png", "chu": "Số electron lớp ngoài cùng và loại nguyên tố (theo SGK tr. 25)"}, "dong": [{"the": "Lớp ngoài cùng **quyết định** tính chất", "id": "c18-1"}, {"the": "1, 2, 3 e: **kim loại**", "id": "c18-2"}, {"the": "5, 6, 7 e: **phi kim**", "id": "c18-3"}, {"the": "8 e: **khí hiếm** (He có 2)", "id": "c18-4"}]}, {"ma": "c19", "loai": "keo-tha", "ten": "Kim loại, phi kim hay khí hiếm?", "muc": "van-dung", "yccd": [5], "sgk": ["9"], "diem": 2, "hoi": "Xếp mỗi nguyên tố (cấu hình theo lớp) vào đúng nhóm.", "noi": "Bạn nhìn số electron lớp ngoài cùng, rồi xếp mỗi nguyên tố vào đúng nhóm nhé.", "nhom": ["Kim loại", "Phi kim", "Khí hiếm"], "the": [{"chu": "Na (2, 8, 1)", "nhom": 0}, {"chu": "Al (2, 8, 3)", "nhom": 0}, {"chu": "N (2, 5)", "nhom": 1}, {"chu": "S (2, 8, 6)", "nhom": 1}, {"chu": "Ne (2, 8)", "nhom": 2}, {"chu": "Ar (2, 8, 8)", "nhom": 2}], "giai": "Số cuối cùng trong ngoặc là số electron lớp ngoài cùng.", "vi_sao": "Đúng hết! Na (1 e), Al (3 e): kim loại. N (5 e), S (6 e): phi kim. Ne, Ar (8 e): khí hiếm.", "hoi_id": "c19-hoi", "sai_id": "c19-sai", "vi_sao_id": "c19-vi-sao"}, {"ma": "c20", "loai": "dien", "ten": "Câu 8 SGK: silicon", "muc": "van-dung", "yccd": [4], "sgk": ["8"], "hoi": "Silicon (Z = 14) có cấu hình 1s²2s²2p⁶3s²3p². Biểu diễn theo ô orbital, nguyên tử Si có bao nhiêu electron độc thân?", "noi": "Si-lic có Z bằng mười bốn. Bạn vẽ nháp ô orbital, rồi cho biết nguyên tử si-lic có bao nhiêu electron độc thân.", "dap": ["2", "hai"], "don_vi": "electron độc thân", "giai": "Các ô 1s, 2s, 2p, 3s đều đủ đôi. Bạn xem 2 electron 3p xếp vào 3 ô theo quy tắc Hund.", "vi_sao": "Si: [[↑↓]] [[↑↓]] [[↑↓|↑↓|↑↓]] [[↑↓]] [[↑|↑| ]]. Phần 1s²2s²2p⁶3s² theo nguyên lí vững bền và Pauli; 3p² theo quy tắc Hund nên có 2 electron độc thân.", "hoi_id": "c20-hoi", "sai_id": "c20-sai", "vi_sao_id": "c20-vi-sao"}, {"ma": "c21", "loai": "chon", "ten": "Câu 9 SGK: chlorine", "muc": "van-dung", "yccd": [4, 5], "sgk": ["9"], "hoi": "Chlorine (Z = 17): 1s²2s²2p⁶3s²3p⁵. Chlorine là phi kim vì", "noi": "Clo có Z bằng mười bảy. Vì sao clo là phi kim?", "lua": [{"chu": "có 7 e ngoài cùng, dễ nhận thêm e", "dung": true}, {"chu": "có 1 e ngoài cùng, dễ nhường e", "giai": "Lớp ngoài cùng của Cl là 3s²3p⁵: 2 + 5 = 7 electron, không phải 1.", "sai_id": "c21-sai-2"}, {"chu": "có 8 e ngoài cùng, rất bền", "giai": "8 electron ngoài cùng là khí hiếm. Cl có 7 electron.", "sai_id": "c21-sai-3"}, {"chu": "vì có 3 lớp electron", "giai": "Số lớp chỉ cho biết chu kì. Tính chất phụ thuộc số electron lớp ngoài cùng.", "sai_id": "c21-sai-4"}], "vi_sao": "Cl có 7 electron lớp ngoài cùng (3s²3p⁵), sắp bão hoà, dễ nhận thêm 1 electron, nên chlorine là phi kim.", "hoi_id": "c21-hoi", "vi_sao_id": "c21-vi-sao"}, {"ma": "c22", "loai": "chon", "ten": "Trả lời câu hỏi đầu bài", "muc": "hieu", "yccd": [1, 4], "sgk": ["MD"], "hoi": "Electron chuyển động và sắp xếp trong nguyên tử thế nào?", "noi": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Electron chuyển động và sắp xếp trong nguyên tử thế nào?", "lua": [{"chu": "Theo quỹ đạo tròn; xếp tuỳ ý", "giai": "Electron không chạy theo quỹ đạo xác định, và sắp xếp theo các nguyên lí, quy tắc.", "sai_id": "c22-sai-1"}, {"chu": "Không theo quỹ đạo; xếp tuỳ ý", "giai": "Electron sắp xếp theo nguyên lí vững bền, nguyên lí Pauli và quy tắc Hund.", "sai_id": "c22-sai-2"}, {"chu": "Không theo quỹ đạo; vững bền, P ectron. Vùng có xác suất tìm thấy electron khoảng 90% là orbital."}, "c4-1": {"d": 7.2, "s": "media/c4-1.mp3", "loai": "am", "chu": "Dựa vào hình dạng và sự định hướng, orbital được chia thành orbital s, p, d, f."}, "c4-2": {"d": 6.6, "s": "media/c4-2.mp3", "loai": "am", "chu": "Orbital s có dạng hình cầu. Orbital p có dạng hình số 8 nổi."}, "c4-3": {"d": 5.376, "s": "media/c4-3.mp3", "loai": "am", "chu": "Mỗi AO được biểu diễn bằng một ô vuông, gọi là ô orbital."}, "c4-4": {"d": 7.632, "s": "media/c4-4.mp3", "loai": "am", "chu": "Một orbital chứa tối đa 2 electron có chiều tự quay ngược nhau. Đó là nguyên lí Pauli."}, "c5-hoi": {"d": 2.856, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Orbital s có dạng gì?"}, "c5-sai-1": {"d": 5.856, "s": "media/c5-sai-1.mp3", "loai": "am", "chu": "Orbital là vùng không gian ba chiều, nên là hình cầu chứ không phải hình tròn phẳng."}, "c5-sai-2": {"d": 3.504, "s": "media/c5-sai-2.mp3", "loai": "am", "chu": "Hình số tám nổi là orbital p."}, "c5-sai-4": {"d": 3.528, "s": "media/c5-sai-4.mp3", "loai": "am", "chu": "Quỹ đạo bầu dục thuộc mô hình hành tinh cũ."}, "c5-vi-sao": {"d": 5.208, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Các orbital s có dạng hình cầu. Đáp án C."}, "c6-hoi": {"d": 6.096, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Bạn quan sát hình. Ba orbital p định hướng trong không gian thế nào?"}, "c6-sai-1": {"d": 4.512, "s": "media/c6-sai-1.mp3", "loai": "am", "chu": "Ba AO p nằm theo ba hướng khác nhau, không trùng nhau."}, "c6-sai-3": {"d": 3.936, "s": "media/c6-sai-3.mp3", "loai": "am", "chu": "Không có hướng là đặc điểm của AO s hình cầu."}, "c6-sai-4": {"d": 5.832, "s": "media/c6-sai-4.mp3", "loai": "am", "chu": "Có 3 AO p: px, py, pz, ứng với cả ba trục."}, "c6-vi-sao": {"d": 9.144, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Phân lớp p có 3 AO hình số 8 nổi, định hướng theo ba trục vuông góc: px theo trục x, py theo trục y, pz theo trục z."}, "c7-hoi": {"d": 6.648, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "Một orbital chứa tối đa bao nhiêu electron? Bạn gõ số vào ô nhé."}, "c7-sai": {"d": 3.936, "s": "media/c7-sai.mp3", "loai": "am", "chu": "Bạn nhớ lại nguyên lí Pauli về chiều tự quay."}, "c7-vi-sao": {"d": 6.504, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Mỗi orbital chứa tối đa 2 electron có chiều tự quay ngược nhau (nguyên lí Pauli)."}, "c8-1": {"d": 11.208, "s": "media/c8-1.mp3", "loai": "am", "chu": "Electron sắp xếp thành từng lớp, đánh số n bằng 1 đến 7 từ trong ra ngoài, tên là K, L, M, N, O, P, Q."}, "c8-2": {"d": 7.872, "s": "media/c8-2.mp3", "loai": "am", "chu": "Lớp gần hạt nhân bị hút mạnh hơn nên năng lượng thấp hơn. Electron cùng lớp có năng lượng gần bằng nhau."}, "c8-3": {"d": 7.2, "s": "media/c8-3.mp3", "loai": "am", "chu": "Mỗi lớp chia thành các phân lớp s, p, d, f. Electron cùng phân lớp có năng lượng bằng nhau."}, "c8-4": {"d": 6.072, "s": "media/c8-4.mp3", "loai": "am", "chu": "Số phân lớp trong mỗi lớp bằng số thứ tự lớp n, với n không quá 4."}, "c8-5": {"d": 9.744, "s": "media/c8-5.mp3", "loai": "am", "chu": "Phân lớp s có 1 AO, p có 3, d có 5, f có 7. Lớp thứ n có n bình phương AO."}, "c9-hoi": {"d": 3.792, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Bạn xếp mỗi phân lớp vào đúng lớp của nó nhé."}, "c9-sai": {"d": 4.536, "s": "media/c9-sai.mp3", "loai": "am", "chu": "Con số đứng trước phân lớp chính là số thứ tự lớp n."}, "c9-vi-sao": {"d": 12.408, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Lớp K có 1s; lớp L có 2s, 2p; lớp M có 3s, 3p, 3d. Số phân lớp bằng n."}, "c10-hoi": {"d": 8.448, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Mỗi ô orbital chứa tối đa hai electron. Bạn nối mỗi phân lớp với số electron tối đa của nó."}, "c10-sai": {"d": 9.216, "s": "media/c10-sai.mp3", "loai": "am", "chu": "Số electron tối đa = số AO × 2. Phân lớp s có 1 AO, p có 3 AO, d có 5 AO."}, "c10-vi-sao": {"d": 7.416, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! s: 1 × 2 = 2; p: 3 × 2 = 6; d: 5 × 2 = 10."}, "c10-sai-2": {"d": 7.248, "s": "media/c10-sai-2.mp3", "loai": "am", "chu": "3 là số AO của phân lớp p. Mỗi AO chứa 2 electron, nên p chứa tối đa 3 × 2 = 6."}, "c11-hoi": {"d": 5.904, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Tổng số electron tối đa có trong mỗi lớp L và M lần lượt là bao nhiêu?"}, "c11-sai-1": {"d": 5.976, "s": "media/c11-sai-1.mp3", "loai": "am", "chu": "2 là của lớp K. Lớp L có 4 AO nên chứa tối đa 8 electron."}, "c11-sai-2": {"d": 8.52, "s": "media/c11-sai-2.mp3", "loai": "am", "chu": "Lớp M có 3s, 3p, 3d: 1 + 3 + 5 = 9 AO, chứa tối đa 18 electron."}, "c11-sai-4": {"d": 7.248, "s": "media/c11-sai-4.mp3", "loai": "am", "chu": "18 là của lớp M, 32 là của lớp N. Đề hỏi lớp L và M."}, "c11-vi-sao": {"d": 12.696, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Lớp L: 1 + 3 = 4 AO → 4 × 2 = 8 electron. Lớp M: 1 + 3 + 5 = 9 AO → 9 × 2 = 18 electron. Đáp án C."}, "c12-1": {"d": 5.808, "s": "media/c12-1.mp3", "loai": "am", "chu": "Cấu hình electron cho biết electron phân bố trên các phân lớp thuộc các lớp khác nhau."}, "c12-2": {"d": 9.24, "s": "media/c12-2.mp3", "loai": "am", "chu": "Hydrogen có cấu hình 1s¹: số 1 đầu là lớp thứ nhất, chữ s là phân lớp, số 1 nhỏ phía trên là số electron trong phân lớp."}, "c12-3": {"d": 7.584, "s": "media/c12-3.mp3", "loai": "am", "chu": "Electron lần lượt chiếm các orbital có năng lượng từ thấp đến cao. Đó là nguyên lí vững bền."}, "c12-4": {"d": 12.504, "s": "media/c12-4.mp3", "loai": "am", "chu": "Trong cùng phân lớp, electron phân bố sao cho số electron độc thân là tối đa, cùng chiều tự quay. Đó là quy tắc Hund. Mình rất thích ở một mình trước đấy!"}, "c13-1": {"d": 15.456, "s": "media/c13-1.mp3", "loai": "am", "chu": "Bước 1, xác định số electron. Bước 2, viết thứ tự phân lớp theo năng lượng tăng dần: 1s 2s 2p 3s 3p 4s. Bước 3, điền electron."}, "c13-2": {"d": 11.904, "s": "media/c13-2.mp3", "loai": "am", "chu": "Ví dụ oxygen có 8 electron: 1s²2s²2p⁴, viết gọn là [He]2s²2p⁴, hay theo lớp là 2, 6."}, "c13-3": {"d": 6.144, "s": "media/c13-3.mp3", "loai": "am", "chu": "Electron cuối cùng của oxygen điền vào phân lớp p, nên oxygen là nguyên tố p."}, "c13-4": {"d": 17.016, "s": "media/c13-4.mp3", "loai": "am", "chu": "Potassium có 19 electron: 1s²2s²2p⁶3s²3p⁶4s¹. Phân lớp 4s được điền trước 3d. Electron cuối vào 4s, nên K là nguyên tố s."}, "c14-hoi": {"d": 8.496, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Cấu hình electron của nguyên tử có Z bằng mười sáu là gì? Bạn đếm tổng số electron của từng đáp án nhé."}, "c14-sai-1": {"d": 6.432, "s": "media/c14-sai-1.mp3", "loai": "am", "chu": "Cộng các số mũ: 2 + 2 + 6 + 2 + 3 = 15, thiếu 1 electron."}, "c14-sai-2": {"d": 4.248, "s": "media/c14-sai-2.mp3", "loai": "am", "chu": "Cộng các số mũ được 17, thừa 1 electron."}, "c14-sai-4": {"d": 5.616, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền."}, "c14-vi-sao": {"d": 11.304, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "Z = 16 có 16 electron: 2 + 2 + 6 + 2 + 4 = 16, điền đúng thứ tự năng lượng. Đáp án C (nguyên tố sulfur)."}, "c15-1": {"d": 6.144, "s": "media/c15-1.mp3", "loai": "am", "chu": "Nitrogen có Z bằng 7, cấu hình 1s²2s²2p³."}, "c15-2": {"d": 9.792, "s": "media/c15-2.mp3", "loai": "am", "chu": "Ô 1s và ô 2s đủ 2 electron, vẽ hai mũi tên ngược chiều, mũi tên đi lên viết trước. Đó là nguyên lí Pauli."}, "c15-3": {"d": 10.152, "s": "media/c15-3.mp3", "loai": "am", "chu": "Ba electron 2p xếp vào ba ô, mỗi ô một mũi tên đi lên, để số electron độc thân là tối đa. Đó là quy tắc Hund."}, "c16-hoi": {"d": 9.216, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Nguyên tử có Z bằng tám, cấu hình một ét hai, hai ét hai, hai pê bốn. Sơ đồ ô orbital nào đúng?"}, "c16-sai-1": {"d": 8.208, "s": "media/c16-sai-1.mp3", "loai": "am", "chu": "2p⁴ phải điền mỗi ô một electron trước (quy tắc Hund), rồi mới ghép đôi: còn 2 electron độc thân."}, "c16-sai-3": {"d": 5.016, "s": "media/c16-sai-3.mp3", "loai": "am", "chu": "Hai electron trong một ô phải ngược chiều nhau (nguyên lí Pauli)."}, "c16-sai-4": {"d": 8.592, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Sơ đồ này chỉ có 7 electron, là của nitrogen. Z = 8 cần thêm 1 electron ở 2p."}, "c16-vi-sao": {"d": 12.672, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "1s, 2s đủ đôi; 2p có 4 electron: điền 3 ô mỗi ô một mũi tên lên, electron thứ tư ghép ngược chiều vào ô đầu. Còn 2 electron độc thân."}, "c17-hoi": {"d": 5.904, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Nguyên tử có Z bằng mười một. Sơ đồ ô orbital nào đúng?"}, "c17-sai-2": {"d": 5.616, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "2p chưa đủ 6 electron đã điền sang 3s: sai nguyên lí vững bền."}, "c17-sai-3": {"d": 4.2, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "Ô chỉ có 1 electron thì vẽ mũi tên đi lên."}, "c17-sai-4": {"d": 4.728, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Sơ đồ này bỏ mất ô 2s, chỉ có 9 electron."}, "c17-vi-sao": {"d": 10.008, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "11 electron: 1s², 2s², 2p⁶ đủ đôi, còn 1 electron ở 3s vẽ một mũi tên đi lên."}, "c18-1": {"d": 5.232, "s": "media/c18-1.mp3", "loai": "am", "chu": "Các electron lớp ngoài cùng quyết định tính chất hoá học cơ bản của nguyên tố."}, "c18-2": {"d": 7.464, "s": "media/c18-2.mp3", "loai": "am", "chu": "Có 1, 2, 3 electron lớp ngoài cùng là kim loại, trừ H, He, B."}, "c18-3": {"d": 9.696, "s": "media/c18-3.mp3", "loai": "am", "chu": "Có 5, 6, 7 electron lớp ngoài cùng thường là phi kim. Có 4 electron thì có thể là kim loại hoặc phi kim."}, "c18-4": {"d": 8.16, "s": "media/c18-4.mp3", "loai": "am", "chu": "Có 8 electron lớp ngoài cùng rất bền vững, đó là khí hiếm. Riêng helium có 2 electron."}, "c19-hoi": {"d": 5.808, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Bạn nhìn số electron lớp ngoài cùng, rồi xếp mỗi nguyên tố vào đúng nhóm nhé."}, "c19-sai": {"d": 4.176, "s": "media/c19-sai.mp3", "loai": "am", "chu": "Số cuối cùng trong ngoặc là số electron lớp ngoài cùng."}, "c19-vi-sao": {"d": 14.688, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Na (1 e), Al (3 e): kim loại. N (5 e), S (6 e): phi kim. Ne, Ar (8 e): khí hiếm."}, "c20-hoi": {"d": 9.36, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Si-lic có Z bằng mười bốn. Bạn vẽ nháp ô orbital, rồi cho biết nguyên tử si-lic có bao nhiêu electron độc thân."}, "c20-sai": {"d": 10.032, "s": "media/c20-sai.mp3", "loai": "am", "chu": "Các ô 1s, 2s, 2p, 3s đều đủ đôi. Bạn xem 2 electron 3p xếp vào 3 ô theo quy tắc Hund."}, "c20-vi-sao": {"d": 12.744, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "Si: [[↑↓]] [[↑↓]] [[↑↓|↑↓|↑↓]] [[↑↓]] [[↑|↑| ]]. Phần 1s²2s²2p⁶3s² theo nguyên lí vững bền và Pauli; 3p² theo quy tắc Hund nên có 2 electron độc thân."}, "c21-hoi": {"d": 5.352, "s": "media/c21-hoi.mp3", "loai": "am", "chu": "Clo có Z bằng mười bảy. Vì sao clo là phi kim?"}, "c21-sai-2": {"d": 7.368, "s": "media/c21-sai-2.mp3", "loai": "am", "chu": "Lớp ngoài cùng của Cl là 3s²3p⁵: 2 + 5 = 7 electron, không phải 1."}, "c21-sai-3": {"d": 6.288, "s": "media/c21-sai-3.mp3", "loai": "am", "chu": "8 electron ngoài cùng là khí hiếm. Cl có 7 electron."}, "c21-sai-4": {"d": 6.48, "s": "media/c21-sai-4.mp3", "loai": "am", "chu": "Số lớp chỉ cho biết chu kì. Tính chất phụ thuộc số electron lớp ngoài cùng."}, "c21-vi-sao": {"d": 10.536, "s": "media/c21-vi-sao.mp3", "loai": "am", "chu": "Cl có 7 electron lớp ngoài cùng (3s²3p⁵), sắp bão hoà, dễ nhận thêm 1 electron, nên chlorine là phi kim."}, "c22-hoi": {"d": 7.584, "s": "media/c22-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Electron chuyển động và sắp xếp trong nguyên tử thế nào?"}, "c22-sai-1": {"d": 5.976, "s": "media/c22-sai-1.mp3", "loai": "am", "chu": "Electron không chạy theo quỹ đạo xác định, và sắp xếp theo các nguyên lí, quy tắc."}, "c22-sai-2": {"d": 5.64, "s": "media/c22-sai-2.mp3", "loai": "am", "chu": "Electron sắp xếp theo nguyên lí vững bền, nguyên lí Pauli và quy tắc Hund."}, "c22-sai-4": {"d": 6.36, "s": "media/c22-sai-4.mp3", "loai": "am", "chu": "Mô hình hiện đại không dùng quỹ đạo; ngoài Pauli còn có nguyên lí vững bền và quy tắc Hund."}, "c22-vi-sao": {"d": 14.064, "s": "media/c22-vi-sao.mp3", "loai": "am", "chu": "Electron chuyển động rất nhanh, không theo quỹ đạo xác định. Electron xếp từ năng lượng thấp đến cao (vững bền), tối đa 2 e ngược chiều mỗi ô (Pauli), độc thân tối đa trong phân lớp (Hund)."}, "c23-1": {"d": 3.384, "s": "media/c23-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại ba ý của bài nhé."}, "c23-2": {"d": 9.576, "s": "media/c23-2.mp3", "loai": "am", "chu": "Orbital là vùng tìm thấy electron khoảng 90%; s hình cầu, p hình số 8 nổi; mỗi orbital tối đa 2 electron ngược chiều."}, "c23-3": {"d": 10.464, "s": "media/c23-3.mp3", "loai": "am", "chu": "Lớp n có n phân lớp và n bình phương orbital. Electron điền theo nguyên lí vững bền, nguyên lí Pauli và quy tắc Hund."}, "c23-4": {"d": 12.312, "s": "media/c23-4.mp3", "loai": "am", "chu": "Lớp ngoài cùng có 1, 2, 3 electron là kim loại, 5, 6, 7 là phi kim, 8 là khí hiếm. Nhớ nhé, quay đều như mình là sẽ nhớ lâu!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 7.176, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong cấu trúc lớp vỏ electron. Bạn bấm Chép kết quả để gửi cô nhé!"}}/*__MEDIA_HET__*/;

const hex2 = h => { h = String(h || "#000000").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
