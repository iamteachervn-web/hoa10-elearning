<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai7-elearning-oxide-hydroxide bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai7-elearning-oxide-hydroxide', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}

.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}

.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}

#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}

.xoay{display:none}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}

.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}

#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}

c dụng với nước.", "giai": "Basic oxide tác dụng với nước tạo base; acidic oxide tác dụng với nước tạo acid. Bạn nhớ cân bằng số nguyên tử hai vế.", "vi_sao": "Đúng hết! Na₂O + H₂O → 2NaOH; P₂O₅ + 3H₂O → 2H₃PO₄; SO₃ + H₂O → H₂SO₄.", "phai": ["2NaOH", "2H₃PO₄", "NaOH₂", "H₂SO₄"], "trai": [{"chu": "Na₂O + H₂O"}, {"chu": "P₂O₅ + 3H₂O"}, {"chu": "SO₃ + H₂O"}], "dap": [0, 1, 3], "hoi_id": "c9-hoi", "sai_id": "c9-sai", "vi_sao_id": "c9-vi-sao", "sai_rieng": {"2": "c9-sai-2"}}, {"ma": "c10", "loai": "chon", "ten": "Dự đoán: oxide của aluminium", "muc": "van-dung", "yccd": [1], "sgk": ["TN1"], "hoi": "Al đứng giữa Mg và Si trong chu kì 3. Al₂O₃ có tính chất gì?", "noi": "Aluminium đứng giữa magnesium và silicon trong chu kì ba. Bạn dự đoán tính chất của Al₂O₃.", "lua": [{"chu": "Base mạnh hơn MgO", "giai": "Trong chu kì, tính base giảm dần theo Z. Al đứng sau Mg nên tính base yếu hơn.", "sai_id": "c10-sai-1"}, {"chu": "Lưỡng tính", "dung": true}, {"chu": "Acid mạnh hơn P₂O₅", "giai": "Al đứng trước P nên tính acid yếu hơn P₂O₅.", "sai_id": "c10-sai-3"}, {"chu": "Không acid, không base", "giai": "Al₂O₃ có cả tính acid và tính base, gọi là oxide lưỡng tính.", "sai_id": "c10-sai-4"}], "vi_sao": "Đứng giữa basic oxide (MgO) và acidic oxide (SiO₂), Al₂O₃ là oxide lưỡng tính; Al(OH)₃ là hydroxide lưỡng tính.", "hoi_id": "c10-hoi", "vi_sao_id": "c10-vi-sao"}, {"ma": "c11", "loai": "trinh-bay", "ten": "Thí nghiệm 2", "nen": "xanh-la", "bo_cuc": "trich-dan", "sgk": ["TN2"], "trich": "Thêm từng giọt dung dịch Na₂CO₃ vào ống nghiệm chứa dung dịch HNO₃.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 41", "hinh": {"chu": "Acid nào mạnh hơn?"}, "dong": [{"the": "HNO₃ (N, Z = 7) · H₂CO₃ (C, Z = 6)", "id": "c11-1"}, {"sau": 3, "id": "c11-2"}, {"the": "Xem phim · **quan sát** hiện tượng", "id": "c11-3"}]}, {"ma": "c12", "loai": "phim", "ten": "Phim: muối với acid", "sgk": ["TN2"], "tep": "tn2-na2co3-hno3.mp4", "phim_id": "phim-c12"}, {"ma": "c13", "loai": "chon", "ten": "So sánh hai acid", "muc": "van-dung", "yccd": [1, 2], "sgk": ["TN2"], "hoi": "Na₂CO₃ + 2HNO₃ → 2NaNO₃ + CO₂↑ + H₂O. Kết luận nào đúng?", "noi": "Phản ứng tạo ra muối, khí CO₂ và nước. Kết luận nào đúng?", "lua": [{"chu": "HNO₃ mạnh hơn H₂CO₃, vì acid mạnh đẩy acid yếu ra khỏi muối", "dung": true}, {"chu": "H₂CO₃ mạnh hơn HNO₃, vì sinh ra khí CO₂", "giai": "Khí CO₂ thoát ra vì H₂CO₃ bị đẩy ra khỏi muối rồi phân huỷ. Acid bị đẩy ra là acid yếu hơn.", "sai_id": "c13-sai-2"}, {"chu": "Hai acid mạnh như nhau, vì đều ở chu kì 2", "giai": "Cùng chu kì nhưng N (Z = 7) đứng sau C (Z = 6) nên hydroxide của N có tính acid mạnh hơn.", "sai_id": "c13-sai-3"}, {"chu": "Không so sánh được, vì không có quỳ tím", "giai": "Phản ứng giữa muối và acid đã cho biết acid nào mạnh hơn: acid mạnh đẩy acid yếu ra khỏi muối.", "sai_id": "c13-sai-4"}], "vi_sao": "HNO₃ đẩy được H₂CO₃ ra khỏi muối Na₂CO₃ (H₂CO₃ phân huỷ thành CO₂ và H₂O). Vậy HNO₃ mạnh hơn H₂CO₃, đúng xu hướng: C → N, Z tăng, tính acid tăng.", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "trinh-bay", "ten": "Xu hướng trong chu kì 3", "nen": "cam", "bo_cuc": "trai-phai", "sgk": ["MD", "2", "3"], "hinh": {"anh": "b07-bang-7-2-doc.png", "chu": "Bảng 7.2 (vẽ lại theo SGK tr. 41)"}, "dong": [{"the": "Basic oxide → **lưỡng tính** → acidic oxide", "id": "c14-1"}, {"the": "NaOH mạnh · Mg(OH)₂ yếu · Al(OH)₃ lưỡng tính", "id": "c14-2"}, {"the": "H₂SiO₃ → HClO₄: acid **tăng dần**", "id": "c14-3"}, {"the": "IA: **base mạnh** · VIIA: **acid mạnh**", "id": "c14-4"}]}, {"ma": "c15", "loai": "chon", "ten": "Câu 2 SGK", "muc": "van-dung", "yccd": [1], "sgk": ["2"], "hoi": "Trong các chất dưới đây, chất nào có tính acid yếu nhất?", "noi": "Trong các chất dưới đây, chất nào có tính acid yếu nhất?", "lua": [{"chu": "H₂SO₄", "giai": "S đứng sau Si trong chu kì 3, nên H₂SO₄ có tính acid mạnh hơn H₂SiO₃.", "sai_id": "c15-sai-1"}, {"chu": "HClO₄", "giai": "Cl đứng cuối chu kì 3: HClO₄ có tính acid mạnh nhất, không phải yếu nhất.", "sai_id": "c15-sai-2"}, {"chu": "H₃PO₄", "giai": "P đứng sau Si nên H₃PO₄ có tính acid mạnh hơn H₂SiO₃.", "sai_id": "c15-sai-3"}, {"chu": "H₂SiO₃", "dung": true}], "vi_sao": "Si, P, S, Cl cùng chu kì 3, Z tăng thì tính acid của hydroxide tăng. Si đứng đầu nên H₂SiO₃ có tính acid yếu nhất.", "hoi_id": "c15-hoi", "vi_sao_id": "c15-vi-sao"}, {"ma": "c16", "loai": "chon", "ten": "Câu 3 SGK", "muc": "van-dung", "yccd": [1], "sgk": ["3"], "hoi": "Dãy gồm các chất có tính base tăng dần là", "noi": "Dãy gồm các chất có tính base tăng dần là gì?", "lua": [{"chu": "Al(OH)₃, Mg(OH)₂, NaOH", "dung": true}, {"chu": "NaOH, Mg(OH)₂, Al(OH)₃", "giai": "Đây là dãy tính base giảm dần. Đề hỏi tăng dần.", "sai_id": "c16-sai-2"}, {"chu": "Mg(OH)₂, Al(OH)₃, NaOH", "giai": "Al(OH)₃ lưỡng tính, có tính base yếu hơn Mg(OH)₂, nên phải đứng đầu.", "sai_id": "c16-sai-3"}, {"chu": "Al(OH)₃, NaOH, Mg(OH)₂", "giai": "NaOH là base mạnh nhất trong ba chất, phải đứng cuối dãy tăng dần.", "sai_id": "c16-sai-4"}], "vi_sao": "Đi ngược chu kì 3 từ Al về Na, tính base tăng: Al(OH)₃ < Mg(OH)₂ < NaOH.", "hoi_id": "c16-hoi", "vi_sao_id": "c16-vi-sao"}, {"ma": "c17", "loai": "keo-tha", "ten": "Base hay acid?", "muc": "hieu", "yccd": [1], "sgk": ["MD"], "diem": 2, "hoi": "Giấy quỳ đổi màu thế nào trong dung dịch của mỗi chất? Xếp thẻ vào đúng nhóm.", "noi": "Nếu nhúng mình vào dung dịch của mỗi chất, mình sẽ đổi sang màu gì? Bạn xếp thẻ vào đúng nhóm nhé.", "nhom": ["Quỳ hoá xanh (base)", "Quỳ hoá đỏ (acid)"], "the": [{"chu": "NaOH", "nhom": 0}, {"chu": "KOH", "nhom": 0}, {"chu": "H₂SO₄", "nhom": 1}, {"chu": "HNO₃", "nhom": 1}, {"chu": "HClO₄", "nhom": 1}], "giai": "Hydroxide của kim loại nhóm IA là base mạnh. Hydroxide của phi kim ở cuối chu kì là acid.", "vi_sao": "Đúng hết! NaOH, KOH (nhóm IA) là base mạnh: quỳ hoá xanh. H₂SO₄, HNO₃, HClO₄ là acid mạnh: quỳ hoá đỏ.", "hoi_id": "c17-hoi", "sai_id": "c17-sai", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "chon", "ten": "Câu 4 SGK", "muc": "hieu", "yccd": [1] const MEDIA = /*__MEDIA__*/{"c1-1": {"d": 5.928, "s": "media/c1-1.mp3", "loai": "am", "chu": "Chào các bạn lớp Mười! Mình là Quỳ, một mẩu giấy quỳ tím."}, "c1-2": {"d": 9.432, "s": "media/c1-2.mp3", "loai": "am", "chu": "Gặp acid, mình đỏ mặt. Gặp base, mình xanh mặt. Hôm nay mình cùng cô Thơi dẫn các bạn học Bài 7 nhé."}, "c1-3": {"d": 6.216, "s": "media/c1-3.mp3", "loai": "am", "chu": "Trong một chu kì, tính chất của các oxide và hydroxide biến đổi theo xu hướng nào?"}, "c1-4": {"d": 4.104, "s": "media/c1-4.mp3", "loai": "am", "chu": "Cuối bài, bạn sẽ tự trả lời được câu hỏi này."}, "c2-1": {"d": 7.56, "s": "media/c2-1.mp3", "loai": "am", "chu": "Đi từ trái qua phải trong một chu kì, hoá trị cao nhất của nguyên tố nhóm A với oxygen tăng từ I đến VII."}, "c2-2": {"d": 4.392, "s": "media/c2-2.mp3", "loai": "am", "chu": "Trừ chu kì 1 và nguyên tố fluorine ở chu kì 2."}, "c2-3": {"d": 5.832, "s": "media/c2-3.mp3", "loai": "am", "chu": "Vì vậy, thành phần của các oxide và hydroxide lặp lại theo chu kì."}, "c2-4": {"d": 6.672, "s": "media/c2-4.mp3", "loai": "am", "chu": "Bạn so sánh hai hàng chu kì 2 và chu kì 3: cùng một cột, công thức có dạng giống nhau."}, "c2-5": {"d": 8.64, "s": "media/c2-5.mp3", "loai": "am", "chu": "Ví dụ, nhóm IA có Li₂O và Na₂O, nhóm IIIA có B₂O₃ và Al₂O₃."}, "c3-hoi": {"d": 6.24, "s": "media/c3-hoi.mp3", "loai": "am", "chu": "Bạn nhớ hoá trị cao nhất bằng số thứ tự nhóm A, rồi xếp mỗi công thức vào đúng nhóm."}, "c3-sai": {"d": 12.024, "s": "media/c3-sai.mp3", "loai": "am", "chu": "Bạn tính hoá trị của nguyên tố trong oxide: O có hoá trị II. Ví dụ N₂O₅: 2 nguyên tử N gánh 5 × 2 = 10, mỗi N hoá trị V."}, "c3-vi-sao": {"d": 17.28, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Nhóm IIA hoá trị II: BeO, Mg(OH)₂. Nhóm VA hoá trị V: N₂O₅, H₃PO₄. Nhóm VIA hoá trị VI: SO₃, H₂SO₄."}, "c4-hoi": {"d": 7.032, "s": "media/c4-hoi.mp3", "loai": "am", "chu": "Gallium thuộc nhóm ba A. Oxide và hydroxide ứng với hoá trị cao nhất của gallium là gì?"}, "c4-sai-1": {"d": 5.256, "s": "media/c4-sai-1.mp3", "loai": "am", "chu": "Ga ở nhóm IIIA nên có hoá trị cao nhất là III, không phải II."}, "c4-sai-3": {"d": 8.4, "s": "media/c4-sai-3.mp3", "loai": "am", "chu": "Oxide đúng. Nhưng Ga cùng nhóm với Al nên hydroxide viết giống Al(OH)₃."}, "c4-sai-4": {"d": 5.496, "s": "media/c4-sai-4.mp3", "loai": "am", "chu": "Ga hoá trị III, O hoá trị II: công thức oxide là Ga₂O₃."}, "c4-vi-sao": {"d": 14.424, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Ga ở nhóm IIIA, hoá trị cao nhất III, cùng nhóm với Al. Oxide Ga₂O₃ (như Al₂O₃), hydroxide Ga(OH)₃ (như Al(OH)₃)."}, "c5-hoi": {"d": 7.464, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Selenium thuộc nhóm sáu A. Oxide và hydroxide ứng với hoá trị cao nhất của selenium là gì?"}, "c5-sai-1": {"d": 7.176, "s": "media/c5-sai-1.mp3", "loai": "am", "chu": "Trong SeO₂, Se mới có hoá trị IV. Hoá trị cao nhất của nhóm VIA là VI."}, "c5-sai-2": {"d": 7.224, "s": "media/c5-sai-2.mp3", "loai": "am", "chu": "Oxide đúng. Nhưng Se cùng nhóm với S nên hydroxide viết giống H₂SO₄."}, "c5-sai-4": {"d": 5.28, "s": "media/c5-sai-4.mp3", "loai": "am", "chu": "Trong Se₂O₃, Se có hoá trị III, không đúng với nhóm VIA."}, "c5-vi-sao": {"d": 10.656, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Se ở nhóm VIA, hoá trị cao nhất VI, cùng nhóm với S. Oxide SeO₃ (như SO₃), hydroxide H₂SeO₄ (như H₂SO₄)."}, "c6-1": {"d": 3.72, "s": "media/c6-1.mp3", "loai": "am", "chu": "Bạn đọc thầm cách làm thí nghiệm trên màn hình nhé."}, "c6-2": {"d": 7.752, "s": "media/c6-2.mp3", "loai": "am", "chu": "Ba nguyên tố Na, Mg, P cùng ở chu kì 3, điện tích hạt nhân tăng dần."}, "c6-3": {"d": 7.608, "s": "media/c6-3.mp3", "loai": "am", "chu": "Bây giờ mình xem phim. Đến phần dự đoán, bạn dừng lại nghĩ xem mình sẽ đổi sang màu gì nhé!"}, "c8-1": {"d": 6.576, "s": "media/c8-1.mp3", "loai": "am", "chu": "Na₂O tan hoàn toàn, mình chuyển xanh đậm: dung dịch NaOH có tính base mạnh."}, "c8-2": {"d": 5.136, "s": "media/c8-2.mp3", "loai": "am", "chu": "MgO tan một phần, mình chỉ xanh nhạt: tính base yếu hơn."}, "c8-3": {"d": 6.84, "s": "media/c8-3.mp3", "loai": "am", "chu": "P₂O₅ tan hoàn toàn, mình đỏ mặt luôn: dung dịch H₃PO₄ có tính acid."}, "c8-4": {"d": 6.192, "s": "media/c8-4.mp3", "loai": "am", "chu": "Vậy từ Na đến P, tính base giảm dần, tính acid tăng dần."}, "c9-hoi": {"d": 5.76, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Bạn viết nháp phương trình, rồi nối mỗi oxide với sản phẩm khi tác dụng với nước."}, "c9-sai": {"d": 9.792, "s": "media/c9-sai.mp3", "loai": "am", "chu": "Basic oxide tác dụng với nước tạo base; acidic oxide tác dụng với nước tạo acid. Bạn nhớ cân bằng số nguyên tử hai vế."}, "c9-vi-sao": {"d": 10.296, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Na₂O + H₂O → 2NaOH; P₂O₅ + 3H₂O → 2H₃PO₄; SO₃ + H₂O → H₂SO₄."}, "c9-sai-2": {"d": 8.928, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "Na hoá trị I nên công thức base là NaOH. Na₂O có 2 nguyên tử Na, tạo 2NaOH."}, "c10-hoi": {"d": 9.216, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Aluminium đứng giữa magnesium và silicon trong chu kì ba. Bạn dự đoán tính chất của Al₂O₃."}, "c10-sai-1": {"d": 7.44, "s": "media/c10-sai-1.mp3", "loai": "am", "chu": "Trong chu kì, tính base giảm dần theo Z. Al đứng sau Mg nên tính base yếu hơn."}, "c10-sai-3": {"d": 4.656, "s": "media/c10-sai-3.mp3", "loai": "am", "chu": "Al đứng trước P nên tính acid yếu hơn P₂O₅."}, "c10-sai-4": {"d": 5.856, "s": "media/c10-sai-4.mp3", "loai": "am", "chu": "Al₂O₃ có cả tính acid và tính base, gọi là oxide lưỡng tính."}, "c10-vi-sao": {"d": 12.432, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "Đứng giữa basic oxide (MgO) và acidic oxide (SiO₂), Al₂O₃ là oxide lưỡng tính; Al(OH)₃ là hydroxide lưỡng tính."}, "c11-1": {"d": 8.088, "s": "media/c11-1.mp3", "loai": "am", "chu": "Thí nghiệm 2 so sánh hai acid của chu kì 2: HNO₃ của nitrogen và H₂CO₃ của carbon."}, "c11-2": {"d": 3.12, "s": "media/c11-2.mp3", "loai": "am", "chu": "Bạn đọc thầm cách làm trên màn hình."}, "c11-3": {"d": 5.928, "s": "media/c11-3.mp3", "loai": "am", "chu": "Mình cùng xem phim nhé. Bạn để ý xem có hiện tượng gì xảy ra."}, "c13-hoi": {"d": 6.168, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Phản ứng tạo ra muối, khí CO₂ và nước. Kết luận nào đúng?"}, "c13-sai-2": {"d": 9.336, "s": "media/c13-sai-2.mp3", "loai": "am", "chu": "Khí CO₂ thoát ra vì H₂CO₃ bị đẩy ra khỏi muối rồi phân huỷ. Acid bị đẩy ra là acid yếu hơn."}, "c13-sai-3": {"d": 9.312, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "Cùng chu kì nhưng N (Z = 7) đứng sau C (Z = 6) nên hydroxide của N có tính acid mạnh hơn."}, "c13-sai-4": {"d": 6.984, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Phản ứng giữa muối và acid đã cho biết acid nào mạnh hơn: acid mạnh đẩy acid yếu ra khỏi muối."}, "c13-vi-sao": {"d": 17.184, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "HNO₃ đẩy được H₂CO₃ ra khỏi muối Na₂CO₃ (H₂CO₃ phân huỷ thành CO₂ và H₂O). Vậy HNO₃ mạnh hơn H₂CO₃, đúng xu hướng: C → N, Z tăng, tính acid tăng."}, "c14-1": {"d": 10.848, "s": "media/c14-1.mp3", "loai": "am", "chu": "Bảng 7.2 cho thấy cả chu kì 3: từ Na₂O, MgO là basic oxide, đến Al₂O₃ lưỡng tính, rồi các acidic oxide."}, "c14-2": {"d": 8.112, "s": "media/c14-2.mp3", "loai": "am", "chu": "Hydroxide cũng vậy: NaOH base mạnh, Mg(OH)₂ base yếu, Al(OH)₃ lưỡng tính."}, "c14-3": {"d": 9.744, "s": "media/c14-3.mp3", "loai": "am", "chu": "Sau đó tính acid tăng dần: H₂SiO₃ yếu, H₃PO₄ trung bình, H₂SO₄ mạnh, HClO₄ rất mạnh."}, "c14-4": {"d": 8.328, "s": "media/c14-4.mp3", "loai": "am", "chu": "Hydroxide nhóm IA thể hiện tính base mạnh, hydroxide nhóm VIIA thể hiện tính acid mạnh, trừ fluorine."}, "c15-hoi": {"d": 4.344, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Trong các chất dưới đây, chất nào có tính acid yếu nhất?"}, "c15-sai-1": {"d": 7.416, "s": "media/c15-sai-1.mp3", "loai": "am", "chu": "S đứng sau Si trong chu kì 3, nên H₂SO₄ có tính acid mạnh hơn H₂SiO₃."}, "c15-sai-2": {"d": 6.792, "s": "media/c15-sai-2.mp3", "loai": "am", "chu": "Cl đứng cuối chu kì 3: HClO₄ có tính acid mạnh nhất, không phải yếu nhất."}, "c15-sai-3": {"d": 6.408, "s": "media/c15-sai-3.mp3", "loai": "am", "chu": "P đứng sau Si nên H₃PO₄ có tính acid mạnh hơn H₂SiO₃."}, "c15-vi-sao": {"d": 12.456, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "Si, P, S, Cl cùng chu kì 3, Z tăng thì tính acid của hydroxide tăng. Si đứng đầu nên H₂SiO₃ có tính acid yếu nhất."}, "c16-hoi": {"d": 3.72, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Dãy gồm các chất có tính base tăng dần là gì?"}, "c16-sai-2": {"d": 5.136, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "Đây là dãy tính base giảm dần. Đề hỏi tăng dần."}, "c16-sai-3": {"d": 8.328, "s": "media/c16-sai-3.mp3", "loai": "am", "chu": "Al(OH)₃ lưỡng tính, có tính base yếu hơn Mg(OH)₂, nên phải đứng đầu."}, "c16-sai-4": {"d": 5.232, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "NaOH là base mạnh nhất trong ba chất, phải đứng cuối dãy tăng dần."}, "c16-vi-sao": {"d": 10.776, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "Đi ngược chu kì 3 từ Al về Na, tính base tăng: Al(OH)₃ < Mg(OH)₂ < NaOH."}, "c17-hoi": {"d": 7.824, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Nếu nhúng mình vào dung dịch của mỗi chất, mình sẽ đổi sang màu gì? Bạn xếp thẻ vào đúng nhóm nhé."}, "c17-sai": {"d": 8.736, "s": "media/c17-sai.mp3", "loai": "am", "chu": "Hydroxide của kim loại nhóm IA là base mạnh. Hydroxide của phi kim ở cuối chu kì là acid."}, "c17-vi-sao": {"d": 14.352, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! NaOH, KOH (nhóm IA) là base mạnh: quỳ hoá xanh. H₂SO₄, HNO₃, HClO₄ là acid mạnh: quỳ hoá đỏ."}, "c18-hoi": {"d": 5.616, "s": "media/c18-hoi.mp3", "loai": "am", "chu": "Đại lượng hay tính chất nào không biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân?"}, "c18-sai-1": {"d": 7.752, "s": "media/c18-sai-1.mp3", "loai": "am", "chu": "Tính kim loại, phi kim lặp lại sau mỗi chu kì: đầu chu kì là kim loại mạnh, cuối chu kì là phi kim mạnh."}, "c18-sai-2": {"d": 4.632, "s": "media/c18-sai-2.mp3", "loai": "am", "chu": "Bài này vừa học: tính acid – base lặp lại theo chu kì."}, "c18-sai-4": {"d": 6.456, "s": "media/c18-sai-4.mp3", "loai": "am", "chu": "Cấu hình electron lớp ngoài cùng lặp lại sau mỗi chu kì, chính là nguyên nhân của sự tuần hoàn."}, "c18-vi-sao": {"d": 8.64, "s": "media/c18-vi-sao.mp3", "loai": "am", "chu": "Khối lượng nguyên tử nhìn chung tăng dần theo điện tích hạt nhân, không lặp lại. Các tính chất còn lại đều biến đổi tuần hoàn."}, "c19-hoi": {"d": 10.704, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Trong một chu kì, theo chiều tăng điện tích hạt nhân, tính chất của oxide và hydroxide biến đổi thế nào?"}, "c19-sai-2": {"d": 10.032, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "Bạn nhớ lại thí nghiệm: Na₂O làm quỳ xanh đậm, P₂O₅ làm quỳ đỏ. Đi về cuối chu kì, tính acid tăng."}, "c19-sai-3": {"d": 4.488, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "Tính base và tính acid biến đổi ngược chiều nhau trong chu kì."}, "c19-sai-4": {"d": 7.8, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Trong chu kì 3, từ NaOH base mạnh đến HClO₄ acid rất mạnh: tính chất thay đổi rõ rệt."}, "c19-vi-sao": {"d": 8.712, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Trong một chu kì, theo chiều tăng điện tích hạt nhân, tính base của oxide và hydroxide giảm dần, đồng thời tính acid tăng dần."}, "c20-1": {"d": 3.384, "s": "media/c20-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại ba ý của bài nhé."}, "c20-2": {"d": 9.048, "s": "media/c20-2.mp3", "loai": "am", "chu": "Trong chu kì, hoá trị cao nhất với oxygen tăng từ I đến VII, nên thành phần oxide, hydroxide lặp lại theo chu kì."}, "c20-3": {"d": 7.296, "s": "media/c20-3.mp3", "loai": "am", "chu": "Theo chiều tăng điện tích hạt nhân, tính base của oxide và hydroxide giảm dần, tính acid tăng dần."}, "c20-4": {"d": 8.064, "s": "media/c20-4.mp3", "loai": "am", "chu": "Acid mạnh đẩy acid yếu ra khỏi muối. Nhớ nhé: gặp acid mình đỏ, gặp base mình xanh!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 9.048, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong xu hướng biến đổi của oxide và hydroxide trong chu kì. Bạn bấm Chép kết quả để gửi cô Thơi nhé!"}, "phim-c7": {"d": 127.53, "s": "media/phim-c7.mp4", "loai": "phim", "chu": "", "poster": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAIcA8ADASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAECAwQFBgcI/8QAVhAAAgEDAgQEAwMGCAYRAwUAAAECAwQRBRIGEyExB0FRYRQicQgVgTJVkZSh0RZCUpOxsrPBFyNiZHKSJCYnMzQ1N0NFVGVzdHWCwvA2RKNjhKLD0v/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACsRAQEBAQABAwQABQQDAAAAAAABEQI
