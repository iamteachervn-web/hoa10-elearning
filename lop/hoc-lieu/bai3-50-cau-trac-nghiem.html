<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài 3 – 50 câu trắc nghiệm</title>
<style>
/* =========================================================
   KHUÔN ĐỀ LUYỆN TẬP TỰ CHẤM (3 phần dạng đề mới)
   Làm đề mới: chép file này, sửa khối  const DE = {...}  bên dưới.
   ========================================================= */
:root{--bg:#f5f3fb;--card:#fff;--ink:#1d1830;--mute:#615a78;--line:#ddd7ee;--pri:#6d28d9;--pri2:#efe8fd;
  --ok:#15803d;--okbg:#e5f6ea;--bad:#c62828;--badbg:#fdecea;--warn:#a15c00;--warnbg:#fff3df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13101c;--card:#1c1828;--ink:#ece8f6;--mute:#a59dbd;--line:#352d4d;--pri:#b794ff;--pri2:#2b2245;--ok:#4ade80;--okbg:#12301d;--bad:#f87171;--badbg:#3a1616;--warn:#fbbf24;--warnbg:#3a2a0e}}
:root[data-theme="dark"]{--bg:#13101c;--card:#1c1828;--ink:#ece8f6;--mute:#a59dbd;--line:#352d4d;--pri:#b794ff;--pri2:#2b2245;--ok:#4ade80;--okbg:#12301d;--bad:#f87171;--badbg:#3a1616;--warn:#fbbf24;--warnbg:#3a2a0e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
header{background:linear-gradient(120deg,#4c1d95,#6d28d9);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header .w{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1;min-width:200px}
header a{color:#fff;font-size:14px;opacity:.9}
.clock{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-weight:600}
.clock.het{background:#fbbf24;color:#3b2400}
.draft{background:#fff4d6;color:#7a4b00;text-align:center;font-size:14px;padding:5px 12px}
main{max-width:820px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
h2{font-size:18px;margin:22px 0 4px;color:var(--pri)}
.sub{color:var(--mute);font-size:14.5px;margin:0 0 6px}
.cau{font-weight:600}.cau b.n{color:var(--pri)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer;background:var(--card)}
.opt input{margin-top:5px;accent-color:var(--pri);width:18px;height:18px}
.opt.chon{border-color:var(--pri);background:var(--pri2)}
.opt.dung{border-color:var(--ok);background:var(--okbg)}
.opt.sai{border-color:var(--bad);background:var(--badbg)}
table.ds{width:100%;border-collapse:collapse;margin-top:8px}
table.ds td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:middle}
table.ds td.y{width:100%}
.ds .nut{display:flex;gap:6px}
.ds label{border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-weight:600}
.ds input{display:none}
.ds input:checked+span{color:var(--pri)}
.ds label:has(input:checked){border-color:var(--pri);background:var(--pri2)}
tr.dung td.y{color:var(--ok)} tr.sai td.y{color:var(--bad)}
input.t,select.t{font-size:17px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;max-width:260px}
input.t:focus,select.t:focus{outline:2px solid var(--pri);border-color:var(--pri)}
textarea.t{width:100%;max-width:none;min-height:140px;font-family:Consolas,monospace;font-size:14px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:10px 18px;font-size:17px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.giai{margin-top:8px;padding:8px 12px;border-left:4px solid var(--pri);background:var(--pri2);border-radius:6px;font-size:15.5px}
.kq{font-size:15px;font-weight:600;margin-top:6px}
.kq.dung{color:var(--ok)} .kq.sai{color:var(--bad)}
.err{color:var(--bad);min-height:1.4em;font-size:15px}
.diem{font-size:44px;font-weight:800;color:var(--pri);line-height:1}
.ma{font-family:Consolas,monospace;font-size:18px;background:var(--pri2);border:1px dashed var(--pri);padding:8px 12px;border-radius:8px;word-break:break-all}
.small{font-size:14.5px}.muted{color:var(--mute)}
table.gv{border-collapse:collapse;width:100%;font-size:15px}
table.gv th,table.gv td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.gv th{background:var(--pri2)}
.bar{display:inline-block;height:10px;background:var(--pri);border-radius:5px;vertical-align:middle}
sub,sup{font-size:.7em}
.cau img,.opt img{display:block;margin:6px 0;background:#fff;border-radius:6px}
.hai{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.hai figure{margin:0;text-align:center;font-weight:400;font-size:14.5px}
.ds-sai{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ds-sai span{border:1px solid var(--bad);color:var(--bad);border-radius:999px;padding:1px 10px;font-size:14px}
.ve{position:fixed;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mute);text-decoration:none;opacity:.9}
@media print{header,.ve,.row,.draft{display:none}}
</style>
</head>

    {q:'Sự phân bố electron trên các phân lớp thuộc các lớp electron dựa vào nguyên lí hay quy tắc nào sau đây?', o:['Nguyên lí vững bền và nguyên lí Pauli.','Nguyên lí vững bền và quy tắc Hund.','Nguyên lí Pauli và quy tắc Hund.','Nguyên lí vững bền và quy tắc Pauli.'], a:0,
     e:'Electron điền vào các phân lớp theo thứ tự năng lượng tăng dần (nguyên lí vững bền), mỗi orbital chứa tối đa 2 electron (nguyên lí Pauli). Quy tắc Hund dùng để xếp electron trong cùng một phân lớp.'},
    {q:'Các electron được điền theo thứ tự phân mức năng lượng nào sau đây?', o:['1s, 2s, 2p, 3s, 3p, 3d, 4s, …','1s, 2s, 2p, 3s, 3p, 4s, 3d, …','1s, 2s, 3s, 4s, 2p, 3p, 3d, …','1s, 2s, 2p, 3s, 4s, 3p, 3d, …'], a:1,
     e:'Phân lớp 4s có năng lượng thấp hơn 3d nên được điền trước 3d.'},
    {q:'Nếu 5 electron được điền vào 3 AO thì số lượng electron độc thân là', o:['0','1','2','5'], a:1,
     e:'Theo quy tắc Hund, 3 electron đầu chiếm 3 AO, 2 electron sau ghép đôi: [↑↓][↑↓][↑] → 1 electron độc thân.'},
    {q:'Silicon (Si) là chất bán dẫn quan trọng, được sử dụng rộng rãi trong chế tạo các vi mạch và thiết bị điện tử. Ở trạng thái cơ bản, cấu hình electron của nguyên tử Si (số hiệu nguyên tử bằng 14) là', o:['1s²2s²2p⁶3s²3p¹','1s²2s²2p⁶3s³3p¹','1s²2s²2p⁶3p²3s²','1s²2s²2p⁶3s²3p²'], a:3,
     e:'14 electron: 1s² 2s² 2p⁶ 3s² 3p². Phân lớp s chứa tối đa 2 electron nên 3s³ sai; 3s phải viết trước 3p.'},
    {q:'Calcium là nguyên tố đóng vai trò thiết yếu trong việc hình thành và bảo vệ xương, răng ở người. Trong công nghiệp, hợp chất của calcium được dùng để sản xuất xi măng, thạch cao. Ở trạng thái cơ bản, cấu hình electron của nguyên tử Ca (số hiệu nguyên tử Z = 20) là', o:['1s²2s²2p⁶3s²3p⁶4s¹','1s²2s²2p⁶3s²3p⁶4s²','1s²2s²2p⁶3s²3p⁶3d²','1s²2s²2p⁶3s²3p⁵4s²4p¹'], a:1,
     e:'Sau 3p⁶ (18 electron), 2 electron còn lại điền vào 4s (năng lượng thấp hơn 3d) → 1s²2s²2p⁶3s²3p⁶4s².'},
    {q:'Cấu hình electron nào sau đây <b>không</b> phải là của khí hiếm?', o:['1s²2s²2p⁶','1s²2s²2p⁶3s²3p⁶','1s²2s²2p⁶3s²3d⁶','1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶'], a:2,
     e:'Cấu hình C bỏ qua 3p để điền 3d, sai thứ tự nên không phải cấu hình của khí hiếm. A là Ne, B là Ar, D là Kr.'},
    {q:'Ở trạng thái cơ bản, nguyên tử của nguyên tố nào sau đây có 1 electron ở lớp ngoài cùng?', o:['Ca (Z = 20)','Na (Z = 11)','Al (Z = 13)','Fe (Z = 26)'], a:1,
     e:'Na: 1s²2s²2p⁶3s¹ → 1 electron lớp ngoài cùng. Ca, Fe có 4s² (2 electron); Al có 3s²3p¹ (3 electron).'},
    {q:'Dựa vào mô hình nguyên tử Rutherford – Bohr, hãy cho biết phát biểu nào sau đây đúng?', o:['Số lượng electron tối đa trên các lớp là như nhau.','Năng lượng của các electron trên các phân lớp khác nhau có thể bằng nhau.','Khi quay quanh hạt nhân theo một quỹ đạo xác định, năng lượng của electron là không đổi.','Electron ở gần hạt nhân nhất có năng lượng cao nhất.'], a:2,
     e:'Theo Bohr, electron chuyển động trên một quỹ đạo xác định thì có năng lượng xác định, không đổi. Electron gần hạt nhân nhất có năng lượng thấp nhất; số electron tối đa của mỗi lớp khác nhau (2n²).'},
    {q:'Phát biểu nào sau đây <b>không</b> đúng?', o:['Electron càng ở xa hạt nhân thì có năng lượng càng thấp.','Số lượng electron tối đa trong một phân lớp luôn là một số chẵn.','Phân lớp p có nhiều orbital hơn phân lớp s.','Số electron tối đa trên phân lớp p gấp ba lần số electron tối đa trên phân lớp s.'], a:0,
     e:'Electron càng xa hạt nhân thì năng lượng càng cao. B đúng (2, 6, 10, 14); C đúng (3 > 1); D đúng (6 = 3 × 2).'},
    {q:'Cho cấu hình electron nguyên tử của các nguyên tố:<br>(X): 1s² 2s² 2p⁶ 3s² 3p¹ &nbsp;&nbsp; (Y): 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹<br>(Z): 1s² 2s² 2p⁶ 3s² 3p⁵ &nbsp;&nbsp; (T): 1s² 2s² 2p⁶ 3s²<br>Dựa vào đặc điểm electron lớp ngoài cùng, nguyên tố nào là phi kim?', o:['T','X','Z','Y'], a:2,

    {q:'Nguyên tử của nguyên tố Y có 14 electron ở lớp thứ ba. Thứ tự các lớp và phân lớp electron theo chiều tăng của năng lượng là: 1s 2s 2p 3s 3p 4s 3d… Cấu hình electron của nguyên tử Y là', o:['1s²2s²2p⁶3s²3p⁶4s²3d⁶','1s²2s²2p⁶3s²3p⁶3d⁶4s²','1s²2s²2p⁶3s²3p⁶3d⁸','1s²2s²2p⁶3s²3p⁶3d⁶'], a:1,
     e:'Lớp 3 có 14 electron: 3s²3p⁶3d⁶; vì 4s điền trước 3d nên còn có 4s². Cấu hình viết theo thứ tự lớp: 1s²2s²2p⁶3s²3p⁶3d⁶4s² (Fe). Phương án A đúng thứ tự điền nhưng không phải cách viết cấu hình electron.'},
    {q:'Nguyên tố natri (sodium, Na) có số hiệu nguyên tử là 11. Ở trạng thái cơ bản, cấu hình electron của ion Na<sup>+</sup> là', o:['1s²2s²2p⁶3s¹','1s²2s²2p⁶','1s²2s²2p⁵','1s²2s²2p⁶3s²'], a:1,
     e:'Na: 1s²2s²2p⁶3s¹, nhường 1 electron lớp ngoài cùng → Na<sup>+</sup>: 1s²2s²2p⁶.'},
    {q:'Ion X<sup>2−</sup> có cấu hình electron ở trạng thái cơ bản 1s²2s²2p⁶. Nguyên tố X là', o:['Ne (Z = 10)','O (Z = 8)','Mg (Z = 12)','F (Z = 9)'], a:1,
     e:'X<sup>2−</sup> có 10 electron; X nhận 2 electron mới thành X<sup>2−</sup> → X có 8 electron → O.'},
    {q:'Số proton, neutron và electron của <sup>52</sup><sub>24</sub>Cr<sup>3+</sup> lần lượt là', o:['24, 28, 24','24, 28, 21','24, 30, 21','24, 28, 27'], a:1,
     e:'p = 24; n = 52 − 24 = 28; ion 3+ mất 3 electron → e = 24 − 3 = 21.'},
    {q:'Ion O<sup>2−</sup> không có cùng số electron với nguyên tử hoặc ion nào sau đây?', o:['Ne','F<sup>−</sup>','Cl<sup>−</sup>','Mg<sup>2+</sup>'], a:2,
     e:'O<sup>2−</sup> có 8 + 2 = 10 electron. Ne, F<sup>−</sup> (9 + 1), Mg<sup>2+</sup> (12 − 2) đều có 10 electron; Cl<sup>−</sup> có 17 + 1 = 18 electron.'},
    {q:'Ion nào sau đây không có cấu hình electron của khí hiếm?', o:['Na<sup>+</sup>','Al<sup>3+</sup>','Cl<sup>−</sup>','Fe<sup>2+</sup>'], a:3,
     e:'Na<sup>+</sup>, Al<sup>3+</sup> giống Ne; Cl<sup>−</sup> giống Ar. Fe<sup>2+</sup>: [Ar]3d⁶, không phải cấu hình khí hiếm.'},
    {q:'Cho biết Z<sub>Fe</sub> = 26, Z<sub>Al</sub> = 13. Cấu hình electron của ion Al<sup>3+</sup> và Fe<sup>2+</sup> lần lượt là', o:['1s²2s²2p⁶ và 1s²2s²2p⁶3s²3p⁶3d⁶','1s²2s²2p⁶3s²3p¹ và 1s²2s²2p⁶3s²3p⁶3d⁶4s²','1s²2s²2p⁶3s²3p⁶3d⁵ và 1s²2s²2p⁶','1s²2s²2p⁶3s²3p⁴ và 1s²2s²2p⁶3s²3p⁶3d⁸4s²'], a:0,
     e:'Al (…3s²3p¹) mất 3 electron lớp ngoài cùng → 1s²2s²2p⁶. Fe (…3d⁶4s²) mất 2 electron 4s ở lớp ngoài cùng trước → 1s²2s²2p⁶3s²3p⁶3d⁶.'},
    {q:'Cho nguyên tử R có tổng số hạt cơ bản là 46, số hạt mang điện nhiều hơn số hạt không mang điện là 14. Cấu hình electron nguyên tử của R là', o:['[Ne]3s²3p³','[Ne]3s²3p⁵','[Ar]3d¹4s²','[Ar]4s²'], a:0,
     e:'2Z + N = 46 và 2Z − N = 14 → Z = 15 (P): [Ne]3s²3p³.'},
    {q:'Trong cơ thể người, ion Mg<sup>2+</sup> (Z = 12) là một vi chất quan trọng, tham gia cấu trúc tế bào, tổng hợp protein, hoạt hoá enzyme điều chỉnh phản ứng sinh hoá,... Tổng số hạt proton và electron của ion Mg<sup>2+</sup> là', o:['26','22','24','20'], a:1,
     e:'p = 12; e = 12 − 2 = 10 → p + e = 22.'},
    {q:'Trong các nguyên tử N (Z = 7), O (Z = 8), F (Z = 9) và Ne (Z = 10), nguyên tử có nhiều electron độc thân nhất là', o:['N','O','F','Ne'], a:0,
     e:'N có 2p³: [↑][↑][↑] → 3 electron độc thân; O có 2, F có 1, Ne có 0.'},
    {q:'Cho các phát biểu sau:<br>(a) Số lượng orbital trong các phân lớp 1s, 2s, 3s là bằng nhau.<br>(b) Số lượng orbital trong các phân lớp 3s, 3p, 3d là bằng nhau.<br>(c) Các electron trên các phân lớp 1s, 2s, 3s có năng lượng bằng nhau.<br>(d) Các electron trên các phân lớp 3s, 3p, 3d có năng lượng bằng nhau.<br>(e) Số lượng electron tối đa trong một lớp là 2n².<br>(g) Số lượng các orbital trong một phân lớp (s, p, d, f) luôn là một số lẻ.<br>Số phát biểu đúng là', o:['5','2','3','4'], a:2,
     e:'Đúng: (a) mỗi phân lớp s có 1 orbital; (e); (g) 1, 3, 5, 7. Sai: (b) lần lượt 1, 3, 5 orbital; (c), (d) năng lượng khác nhau. → 3 phát biểu đúng.'},
    {q:'Cho các phát biểu về nguyên tử <sup>52</sup><sub>24</sub>X:<br>(1) X có tổng các hạt mang điện nhiều hơn số hạt không mang điện là 20.<br>(2) X có số hạt neutron nhiều hơn proton là 4.<br>(3) X có 4 lớp electron.<br>(4) Cấu hình electron của X là [Ar]3d⁴4s².<br>(5) X là kim loại.<br>Số phát biểu đúng là', o:['3','2','4','1'], a:2,
     e:'p = e = 24, n = 28. (1) 48 − 28 = 20 ✔. (2) 28 − 24 = 4 ✔. (3) có electron ở lớp 4 ✔. (4) Sai: X là chromium, cấu hình [Ar]3d⁵4s¹. (5) ✔. → 4 phát biểu đúng.'},
    {q:'Nguyên tử Fe có kí hiệu <sup>56</sup><sub>26</sub>Fe. Cho các phát biểu sau về Fe:<br>(1) Nguyên tử của nguyên tố Fe có 8 electron ở lớp ngoài cùng.<br>(2) Nguyên tử của nguyên tố Fe có 30 neutron ở trong hạt nhân.<br>(3) Fe là một phi kim.<br>(4) Fe là nguyên tố d.<br>Trong các phát biểu trên, phát biểu nào là đúng?', o:['(1), (2), (3) và (4)','(1), (2) và (4)','(2) và (4)','(2), (3) và (4)'], a:2,
     e:'Fe: [Ar]3d⁶4s² → lớp ngoài cùng (4s²) có 2 electron, (1) sai; n = 56 − 26 = 30, (2) đúng; Fe là kim loại, (3) sai; electron cuối cùng điền vào 3d nên Fe là nguyên tố d, (4) đúng.'},
    {q:'Nguyên tử R tạo được cation R<sup>+</sup>. Cấu hình electron ở phân lớp ngoài cùng của R<sup>+</sup> (ở trạng thái cơ bản) là 2p⁶. Tổng số hạt mang điện trong nguyên tử R là', o:['10','11','22','23'], a:2,
     e:'R<sup>+</sup>: 1s²2s²2p⁶ (10 electron) → R có 11 electron (Na) → p + e = 11 + 11 = 22.'},
    {q:'Một ion M<sup>3+</sup> có tổng số hạt proton, neutron, electron là 79, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 19. Cấu hình electron của nguyên tử M là', o:['[Ar]3d⁵4s¹','[Ar]3d⁶4s²','[Ar]3d⁶4s¹','[Ar]3d³4s²'], a:1,
     e:'Ion M<sup>3+</sup>: (2Z − 3) + N = 79 và (2Z − 3) − N = 19 → 4Z − 6 = 98 → Z = 26 (Fe): [Ar]3d⁶4s².'},
    {q:'Nguyên tố X được sử dụng rộng rãi để chống đóng băng và khử băng như một chất bảo quản. Nguyên tố Y là nguyên tố thiết yếu cho các cơ thể sống, đồng thời nó được sử dụng nhiều trong việc sản xuất phân bón. Nguyên tử của nguyên tố X có electron ở mức năng lượng cao nhất là 3p. Nguyên tử nguyên tố Y có một electron ở lớp ngoài cùng là 4s. Nguyên tử X và Y có số electron hơn kém nhau là 2. Nguyên tử X và Y lần lượt là', o:['khí hiếm và kim loại','kim loại và khí hiếm','kim loại và kim loại','phi kim và kim loại'], a:3,
     e:'Y có 1 electron lớp ngoài cùng ở 4s và dùng làm phân bón → K (Z = 19), kim loại. X kém Y 2 electron, electron cuối ở 3p → Z = 17 (Cl: 3s²3p⁵), phi kim.'},

    {q:'Xét các phát biểu về orbital nguyên tử.', y:[
      ['Orbital 1s có dạng hình cầu, orbital 2s có dạng hình số tám nổi.', false],
      ['Trong một nguyên tử, năng lượng của electron thuộc AO 1s thấp hơn năng lượng của electron thuộc AO 2s.', true],
      ['Trong một nguyên tử, năng lượng của electron thuộc AO 2s thấp hơn năng lượng của electron thuộc AO 2p.', true],
      ['Trong một nguyên tử, năng lượng của electron thuộc AO 2s gần bằng năng lượng của electron thuộc AO 2p.', true]],
     e:'a) Sai: mọi orbital s đều hình cầu. b) Đúng: lớp 1 gần hạt nhân hơn. c) Đúng: trong cùng một lớp, năng lượng phân lớp s thấp hơn p. d) Đúng: 2s và 2p cùng thuộc lớp L nên năng lượng gần bằng nhau (gần bằng, không phải bằng).'},
    {q:'Xét các phát biểu về electron trong lớp và phân lớp electron.', y:[
      ['Electron trong cùng một lớp có năng lượng bằng nhau.', false],
      ['Electron trong cùng một phân lớp có năng lượng bằng nhau.', true],
      ['Electron ở các phân lớp 1s, 2s, 3s có năng lượng bằng nhau.', false],
      ['Electron ở lớp bên ngoài có năng lượng thấp hơn electron ở lớp bên trong.', false]],
     e:'a) Sai: electron trong cùng một lớp chỉ có năng lượng gần bằng nhau. b) Đúng. c) Sai: năng lượng tăng dần 1s < 2s < 3s. d) Sai: lớp ngoài có năng lượng cao hơn.'},
    {q:'Xét các phát biểu về lớp electron.', y:[
      ['Số phân lớp electron có trong lớp N là 4.', true],
      ['Số phân lớp electron có trong lớp M là 4.', false],
      ['Số orbital có trong lớp N là 9.', false],
      ['Số orbital có trong lớp M là 8.', false]],
     e:'Lớp thứ n có n phân lớp và n² orbital. Lớp N (n = 4): 4 phân lớp, 16 orbital. Lớp M (n = 3): 3 phân lớp, 9 orbital.'},

      ['Có cùng mức năng lượng.', true],
      ['Khác nhau về mức năng lượng.', false],
      ['Có hình dạng không phụ thuộc vào đặc điểm mỗi phân lớp.', false]],
     e:'Các orbital trong cùng một phân lớp có cùng năng lượng và cùng hình dạng (do phân lớp quyết định: s hình cầu, p hình số tám nổi) nhưng định hướng khác nhau (VD p<sub>x</sub>, p<sub>y</sub>, p<sub>z</sub>).'},
    {q:'X là một trong những thành phần điều chế nước Javel tẩy trắng quần áo, sợi vải. Y là một khoáng chất có ý nghĩa quan trọng đối với sự phát triển của hệ xương khớp. Anion X<sup>−</sup> và cation Y<sup>2+</sup> đều có cấu hình electron lớp ngoài cùng là 3s²3p⁶.', y:[
      ['Cấu hình electron của X là [Ar]4s¹.', false],
      ['Cấu hình electron của Y là [Ar]4s².', true],
      ['Ở trạng thái cơ bản, nguyên tử của nguyên tố X có 1 electron độc thân.', true],
      ['Ở trạng thái cơ bản, nguyên tử của nguyên tố Y có 2 electron độc thân.', false]],
     e:'X<sup>−</sup> có 18 electron → X có 17 electron (Cl): [Ne]3s²3p⁵. Y<sup>2+</sup> có 18 electron → Y có 20 electron (Ca): [Ar]4s². a) Sai. b) Đúng. c) Đúng: 3p⁵ có 1 electron độc thân. d) Sai: 4s² đã ghép đôi, không có electron độc thân.'},
    {q:'Nguyên tử của nguyên tố X có 4 lớp electron, có mức năng lượng cao nhất ở phân lớp 3d, phân lớp ngoài cùng đã bão hoà electron.', y:[
      ['X có 2 electron ở lớp ngoài cùng.', true],
      ['Tổng số electron s và electron p của X là 20.', true],
      ['Có 8 cấu hình electron thoả mãn đặc điểm của X.', true],
      ['Cấu hình electron của X là 1s²2s²2p⁶3s²3p⁶4s².', false]],
     e:'X: 1s²2s²2p⁶3s²3p⁶3d<sup>x</sup>4s², lớp ngoài cùng 4s² → 2 electron (a đúng). Electron s: 2 + 2 + 2 + 2 = 8; electron p: 6 + 6 = 12 → 20 (b đúng). x = 1, 2, 3, 5, 6, 7, 8, 10 (trừ Cr 3d⁵4s¹ và Cu 3d¹⁰4s¹ có 4s chưa bão hoà) → 8 cấu hình (c đúng). d) Sai: cấu hình này không có electron 3d.'},
    {q:'Nguyên tố X được dùng để chế tạo hợp kim nhẹ, bền, dùng trong nhiều lĩnh vực: hàng không, ô tô, xây dựng, hàng tiêu dùng,... Nguyên tố Y ở dạng YO<sub>4</sub><sup>3−</sup> đóng vai trò quan trọng trong các phân tử sinh học như DNA và RNA. Các tế bào sống sử dụng YO<sub>4</sub><sup>3−</sup> để vận chuyển năng lượng. Nguyên tử của nguyên tố X có cấu hình electron kết thúc ở phân lớp 3p¹. Nguyên tử của nguyên tố Y có cấu hình electron kết thúc ở phân lớp 3p³.', y:[
      ['Cấu hình electron của X là [Ne]3s²3p¹.', true],
      ['Cấu hình electron của Y là [Ne]3s²3p⁵.', false],
      ['X là kim loại.', true],
      ['Y là phi kim.', true]],
     e:'X: [Ne]3s²3p¹ (Al, 3 electron lớp ngoài cùng → kim loại). Y: [Ne]3s²3p³ (P, 5 electron lớp ngoài cùng → phi kim). b) Sai vì [Ne]3s²3p⁵ là chlorine.'},
  ],
  p3: [
    {q:'Lớp M có số orbital tối đa bằng bao nhiêu?', a:['9'],
     e:'Lớp M (n = 3) có n² = 9 orbital: 1 (3s) + 3 (3p) + 5 (3d).'},
    {q:'Số phân lớp bão hoà trong các phân lớp: 1s², 2s², 2p³, 3d¹⁰, 3p⁴ là bao nhiêu?', a:['3'],
     e:'Phân lớp bão hoà: s², p⁶, d¹⁰ → 1s², 2s², 3d¹⁰ → 3 phân lớp.'},
    {q:'Nguyên tử của nguyên tố X có cấu hình electron đã xây dựng đến phân lớp 3d². Tổng số electron của nguyên tử nguyên tố X là bao nhiêu?', a:['22'],
     e:'Thứ tự điền: 1s²2s²2p⁶3s²3p⁶4s²3d² (4s điền trước 3d) → 2 + 2 + 6 + 2 + 6 + 2 + 2 = 22.'},
    {q:'Tổng số hạt neutron, proton, electron trong ion <sup>35</sup><sub>17</sub>Cl<sup>−</sup> là bao nhiêu?', a:['53'],
     e:'p = 17; n = 35 − 17 = 18; e = 17 + 1 = 18 → 17 + 18 + 18 = 53.'},
    {q:'Nguyên tử của nguyên tố potassium có 19 electron. Ở trạng thái cơ bản, potassium có số orbital chứa electron là bao nhiêu?', a:['10'],

     e:'M<sup>3+</sup>: [Ar]3d³ (21 electron) → M có 24 electron (Cr): [Ar]3d⁵4s¹ → 5 + 1 = 6 electron độc thân.'},
    {q:'Cấu hình electron của chromium Cr (Z = 24) là 1s²2s²2p⁶3s²3p⁶3d⁵4s¹. Hãy cho biết nguyên tử chromium ở trạng thái cơ bản có bao nhiêu electron chưa ghép đôi (hay electron độc thân)?', a:['6'],
     e:'3d⁵: 5 electron độc thân (mỗi orbital 1 electron) + 4s¹: 1 electron độc thân → 6.'},
    {q:'Nguyên tố X là một nguyên tố thiết yếu trong cơ thể sinh vật, có mặt trong xương, răng và tất cả các tế bào sống. Nguyên tử của nguyên tố X có 3 lớp electron và có 3 electron độc thân. Xác định số hiệu nguyên tử của X.', a:['15'],
     e:'3 lớp electron, 3 electron độc thân → 3p³: 1s²2s²2p⁶3s²3p³ → Z = 15 (phosphorus).'},
    {q:'Cho các cấu hình electron sau:<br>(1) 1s²2s²2p³<br>(2) 1s²2s²2p⁶3s²3p⁶4s¹<br>(3) 1s²2s²2p⁶3s²3p¹<br>(4) 1s²2s²2p⁴<br>(5) 1s²2s²2p⁶3s²3p⁶3d⁵4s²<br>(6) 1s²2s²2p⁶3s²3p⁵<br>(7) 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁵<br>(8) 1s²2s²2p⁶3s²3p²<br>(9) 1s²2s²2p⁶3s¹<br>Hãy sắp xếp các cấu hình electron nguyên tử của nguyên tố kim loại theo số thứ tự tăng dần (ví dụ 12, 134, …)', a:['2359'],
     e:'Kim loại: (2) 4s¹, (3) 3s²3p¹, (9) 3s¹ có 1–3 electron lớp ngoài cùng; (5) là nguyên tố d (Mn). Phi kim: (1), (4), (6), (7) có 5–7 electron lớp ngoài cùng; (8) có 4 electron lớp ngoài cùng, ở chu kì nhỏ → phi kim. → 2359.'},
    {q:'Cho 6 nguyên tố có số hiệu nguyên tử lần lượt là 10, 13, 16, 18, 19 và 20. Trong số các nguyên tố trên có bao nhiêu nguyên tố kim loại?', a:['3'],
     e:'Z = 13 (3s²3p¹), 19 (4s¹), 20 (4s²) là kim loại; Z = 16 là phi kim; Z = 10, 18 là khí hiếm → 3.'},
    {q:'Cho các phát biểu sau đây về mô hình nguyên tử hiện đại:<br>(1) Theo mô hình nguyên tử hiện đại, electron chuyển động không theo những quỹ đạo xác định trong cả khu vực không gian xung quanh hạt nhân.<br>(2) Tất cả các AO nguyên tử đều có hình dạng giống nhau.<br>(3) Mỗi AO nguyên tử chỉ có thể chứa được 1 electron.<br>(4) Các electron s chuyển động trong các AO có hình số tám nổi.<br>Hãy sắp xếp các phát biểu <b>sai</b> trong các phát biểu trên theo số thứ tự tăng dần (ví dụ 12, 134, …)', a:['234'],
     e:'(1) đúng. (2) sai: AO s hình cầu, AO p hình số tám nổi. (3) sai: mỗi AO chứa tối đa 2 electron. (4) sai: AO s hình cầu. → 234.'},
    {q:'Cho các phát biểu sau:<br>(1) Phân lớp d có tối đa 10 electron.<br>(2) Phân lớp đã điền số electron tối đa được gọi là phân lớp electron bão hoà.<br>(3) Nguyên tử nguyên tố kim loại thường có 1 hoặc 2 hoặc 3 electron ở lớp ngoài cùng.<br>(4) Nguyên tử nguyên tố khí hiếm thường có 5 hoặc 6 hoặc 7 electron ở lớp ngoài cùng.<br>(5) Các electron trên cùng một lớp có mức năng lượng bằng nhau.<br>(6) Ở trạng thái cơ bản, nguyên tử trung hoà điện.<br>Hãy sắp xếp các phát biểu <b>đúng</b> trong các phát biểu trên theo số thứ tự tăng dần (ví dụ 12, 134, …)', a:['1236'],
     e:'(1), (2), (3), (6) đúng. (4) sai: khí hiếm có 8 electron lớp ngoài cùng (riêng He có 2). (5) sai: chỉ gần bằng nhau. → 1236.'},
  ],
};

/* =========================================================
   PHẦN CHẠY — không cần sửa
   ========================================================= */
const KEY='de_'+DE.ma+'_v1';
const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=store.get(KEY)||{lop:'',ma:'',lan:1,tl:{},batDau:0,nop:null};
const save=()=>store.set(KEY,S);
const N1=DE.p1.length,N2=DE.p2.length,N3=DE.p3.length;
const DIEM_TOI_DA=N1*0.25+N2*1+N3*0.25;
const L='ABCD';
document.title=DE.ten; $('#tieude').textContent=DE.ten;
if(!BAN_NHAP) $('#draft').remove();
let timer=null;

const fmt=x=>(Math.round(x*100)/100).toString().replace('.',',');
const chuan=s=>String(s||'').trim().replace(/\s+/g,'').replace('.',',').toLowerCase();

/* ---------- màn bắt đầu ---------- */
function batDau(){
  $('#clock').hidden=true;
  $('#app').innerHTML=`
  <div class="card">
    <p style="margin-top:0">Đề gồm <b>${N1}</b> câu nhiều lựa chọn · <b>${N2}</b> câu đúng/sai · <b>${N3}</b> câu trả lời ngắn${DE.phut?` · thời gian gợi ý <b>${DE.phut} phút</b>`:''}.</p>
    <label class="small muted" for="lop">Lớp</label><br>
    <select class="t" id="lop"><option value="">— chọn lớp —</option>${DE.lop.map(l=>`<option ${l===S.lop?'selected':''}>${l}</option>`).join('')}</select>
    <br><br><label class="small muted" for="ma">Mã học sinh (cô đã phát, VD HS05) — <b>không ghi họ tên</b></label><br>
    <input class="t" id="ma" placeholder="HS05" autocomplete="off" autocapitalize="characters" value="${S.ma||''}">
    <div class="err" id="err"></div>
    <div class="row"><button class="btn" id="go">${Object.keys(S.tl).length?'Làm tiếp':'Bắt đầu làm bài'}</button></div>
  </div>
  <p class="small muted">Bài đang làm được lưu trên máy này; lỡ tắt trang, mở lại vẫn làm tiếp được.</p>`;
  $('#go').onclick=()=>{
    const lop=$('#lop').value, ma=$('#ma').value.trim().toUpperCase();
    if(!lop) return $('#err').textContent='Em chọn lớp nhé.';
    if(!/^HS\d{1,4}$/.test(ma)) return $('#err').textContent='Mã học sinh có dạng HS + số, VD HS05.';
    S.lop=lop; S.ma=ma; if(!S.batDau) S.batDau=Date.now(); save(); lamBai();
  };
}

/* ---------- màn làm bài ---------- */
function lamBai(xem){
  const kq=xem?S.nop:null;
  let h=`<p class="small muted" style="margin:0">Lớp <b>${S.lop}</b> · <b>${S.ma}</b> · lần ${S.lan}</p>`;
  h+=`<h2>Phần I. Câu trắc nghiệm nhiều phương án lựa chọn</h2><p class="sub">Mỗi câu chọn một phương án.</p>`;
  DE.p1.forEach((c,i)=>{
    const k='a'+i, chon=S.tl[k];
    h+=`<div class="card"><div class="cau"><b class="n">Câu ${i+1}.</b> ${c.q}</div>`+
      c.o.map((o,j)=>{ let cls=chon===j?' chon':''; if(kq){ if(j===c.a) cls=' dung'; else if(chon===j) cls=' sai'; }
        return `<label class="opt${cls}"><input type="radio" name="${k}" value="${j}" ${chon===j?'checked':''} ${kq?'disabled':''}><span><b>${L[j]}.</b> ${o}</span></label>`; }).join('')+
      (kq?`<div class="kq ${chon===c.a?'dung':'sai'}">${chon===c.a?'✔ Đúng':'✘ '+(chon==null?'Chưa chọn':'Sai')+' — đáp án '+L[c.a]}</div><div class="giai">${c.e}</div>`:'')+`</div>`;
  });
  h+=`<h2>Phần II. Câu trắc nghiệm đúng sai</h2><p class="sub">Mỗi ý a), b), c), d) chọn Đúng hoặc Sai.</p>`;
  DE.p2.forEach((c,i)=>{
    h+=`<div class="card"><div class="cau"><b class="n">Câu ${N1+i+1}.</b> ${c.q}</div><table class="ds">`+
      c.y.map(([y,d],j)=>{ const k='b'+i+'_'+j, chon=S.tl[k]; let cls=''; if(kq) cls=(chon===d)?'dung':'sai';
        return `<tr class="${cls}"><td class="y"><b>${'abcd'[j]})</b> ${y}${kq&&chon!==d?` <i>(đáp án: ${d?'Đúng':'Sai'})</i>`:''}</td><td><div class="nut">
          <label><input type="radio" name="${k}" value="1" ${chon===true?'checked':''} ${kq?'disabled':''}><span>Đúng</span></label>
          <label><input type="radio" name="${k}" value="0" ${chon===false?'checked':''} ${kq?'disabled':''}><span>Sai</span></label></div></td></tr>`; }).join('')+
      `</table>${kq?`<div class="kq">Đúng ${kq.p2[i]}/4 ý → ${fmt(diemDS(kq.p2[i]))} điểm</div><div class="giai">${c.e}</div>`:''}</div>`;
  });
  h+=`<h2>Phần III. Câu trắc nghiệm trả lời ngắn</h2><p class="sub">Gõ kết quả là một số (dùng dấu phẩy cho số thập phân).</p>`;
  DE.p3.forEach((c,i)=>{
    const k='c'+i, v=S.tl[k]||'', dung=c.a.map(chuan).includes(chuan(v));
    h+=`<div class="card"><div class="cau"><b class="n">Câu ${N1+N2+i+1}.</b> ${c.q}</div>
      <div class="row"><input class="t" name="${k}" inputmode="numeric" placeholder="Đáp số" value="${String(v).replace(/"/g,'&quot;')}" ${kq?'disabled':''}></div>`+
      (kq?`<div class="kq ${dung?'dung':'sai'}">${dung?'✔ Đúng':'✘ '+(v?'Sai':'Chưa trả lời')+' — đáp số '+c.a[0]}</div><div class="giai">${c.e}</div>`:'')+`</div>`;
  });
  if(!kq) h+=`<div class="err" id="err"></div><div class="row"><button class="btn" id="nop">📤 Nộp bài</button></div>`;
  else h+=`<div class="row"><button class="btn ghost" id="lenTren">↑ Về kết quả</button></div>`;
  $('#app').innerHTML=h; scrollTo(0,0);
  if(kq){ $('#lenTren').onclick=ketQua; return; }
  $('#app').addEventListener('change',ghi); $('#app').addEventListener('input',ghi);
  $('#nop').onclick=nopBai;
  demGio();
}
function ghi(e){
  const t=e.target; if(!t.name) return;
  if(t.name[0]==='a') S.tl[t.name]=+t.value;
  else if(t.name[0]==='b') S.tl[t.name]=t.value==='1';
  else S.tl[t.name]=t.value;
  if(t.type==='radio') t.closest('.card').querySelectorAll(`input[name="${t.name}"]`).forEach(r=>r.closest('.opt')?.classList.toggle('chon',r.checked));
  save();
}
function demGio(){
  clearInterval(timer); if(!DE.phut) return;
  const c=$('#clock'); c.hidden=false;
  const tick=()=>{ const con=DE.phut*60-Math.floor((Date.now()-S.batDau)/1000);
    if(con<=0){ c.textContent='⏰ Hết giờ gợi ý'; c.classList.add('het'); return; }
    c.textContent='⏱ '+Math.floor(con/60)+':'+String(con%60).padStart(2,'0'); };
  tick(); timer=setInterval(tick,1000);
}
const diemDS=n=>[0,0.1,0.25,0.5,1][n];

/* ---------- chấm ---------- */
function nopBai(){
  const thieu=[];
  DE.p1.forEach((c,i)=>{ if(S.tl['a'+i]==null) thieu.push(i+1); });
  DE.p2.forEach((c,i)=>c.y.forEach((y,j)=>{ if(S.tl['b'+i+'_'+j]==null) thieu.push((N1+i+1)+'abcd'[j]); }));
  DE.p3.forEach((c,i)=>{ if(!String(S.tl['c'+i]||'').trim()) thieu.push(N1+N2+i+1); });
  if(thieu.length && !confirm('Em còn bỏ trống câu: '+thieu.join(', ')+'.\nVẫn nộp bài?')) return;
  let diem=0; const p2=[], sai=[]; let d1=0,d3=0;
  DE.p1.forEach((c,i)=>{ if(S.tl['a'+i]===c.a){diem+=0.25;d1++;} else sai.push(i+1); });
  DE.p2.forEach((c,i)=>{ let n=0; c.y.forEach(([y,dd],j)=>{ if(S.tl['b'+i+'_'+j]===dd) n++; }); p2.push(n); diem+=diemDS(n); if(n<4) sai.push(N1+i+1); });
  DE.p3.forEach((c,i)=>{ if(c.a.map(chuan).includes(chuan(S.tl['c'+i]))){diem+=0.25;d3++;} else sai.push(N1+N2+i+1); });
  S.nop={diem,p2,d1,d3,sai,phut:Math.max(1,Math.round((Date.now()-S.batDau)/60000)),luc:new Date().toLocaleString('vi-VN')};
  save(); clearInterval(timer); ketQua();
}
function ketQua(){
  const k=S.nop; $('#clock').hidden=true;
  const thang10=k.diem/DIEM_TOI_DA*10, dsDu=k.p2.filter(n=>n===4).length;
  $('#app').innerHTML=`
  <div class="card" style="text-align:center">
    <p class="muted small" style="margin:0">${DE.ten}</p>
    <p style="margin:4px 0"><b>Lớp ${S.lop} · ${S.ma}</b> · lần ${S.lan} · ${k.phut} phút · nộp lúc ${k.luc}</p>
    <div class="diem">${fmt(thang10)}<span style="font-size:20px"> / 10</span></div>
    <p class="muted small">(${fmt(k.diem)} / ${fmt(DIEM_TOI_DA)} điểm theo cách tính của đề, quy đổi thang 10 — chỉ để em tự luyện)</p>
    <table class="gv" style="margin-top:8px">
      <tr><th>Phần</th><th>Kết quả</th></tr>
      <tr><td>I. Nhiều lựa chọn</td><td>${k.d1}/${N1} câu đúng</td></tr>
      <tr><td>II. Đúng/sai</td><td>${dsDu}/${N2} câu đúng cả 4 ý</td></tr>
      <tr><td>III. Trả lời ngắn</td><td>${k.d3}/${N3} câu đúng</td></tr>
    </table>
    ${k.sai.length?`<p class="small" style="margin:10px 0 0">Câu cần xem lại:</p><div class="ds-sai" style="justify-content:center">${k.sai.map(n=>'<span>'+n+'</span>').join('')}</div>`:'<p class="kq dung">Đúng hết, giỏi lắm!</p>'}
  </div>
  <div class="card small">📸 <b>Nộp bài:</b> em <b>chụp màn hình khung kết quả ở trên</b> (có lớp, mã học sinh, điểm) và gửi cô theo hướng dẫn trên lớp. Không cần ghi họ tên.</div>
  <div class="row"><button class="btn ghost" id="xem">🔍 Xem lời giải từng câu</button><button class="btn ghost" id="lai">↻ Làm lại (lần ${S.lan+1})</button></div>`;
  $('#xem').onclick=()=>lamBai(true);
  $('#lai').onclick=()=>{ if(!confirm('Làm lại từ đầu? Kết quả lần này sẽ được thay bằng lần mới.')) return;
    S={lop:S.lop,ma:S.ma,lan:S.lan+1,tl:{},batDau:Date.now(),nop:null}; save(); lamBai(); };
  scrollTo(0,0);
}

function route(){ if(S.nop) return ketQua(); if(S.ma&&S.batDau) return lamBai(); batDau(); }
addEventListener('hashchange',route);
route();
</script>
