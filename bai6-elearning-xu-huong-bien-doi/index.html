<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai6-elearning-xu-huong-bien-doi bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai6-elearning-xu-huong-bien-doi', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}
.o{position:absolute}
/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */
.cot{display:flex;flex-direction:column;gap:1.2cqw}
.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}
.the.dai{font-size:calc(1.85cqw*var(--co,1))}
.the b{color:var(--a1)}
.dap{background:var(--a2);border-radius:1.6cqw;padding:1cqw 2cqw;font:800 calc(3.8cqw*var(--co,1))/1.1 var(--f-hien);color:var(--muc);box-shadow:0 .6cqw 0 var(--a2d);text-align:center}
.lcd{background:#1B2238;border-radius:1.2cqw;border:.5cqw solid #3A4566;color:#7CF2B2;font:800 4.6cqw/1 "Consolas","Courier New",monospace;letter-spacing:.2cqw;display:grid;place-items:center;text-shadow:0 0 1cqw rgba(124,242,178,.6);padding:1.2cqw 2cqw;align-self:flex-start;font-variant-numeric:tabular-nums}
.bong{background:var(--a1);color:#fff;border-radius:99px;padding:.5cqw 1.6cqw;font:800 2.8cqw/1.2 var(--f-hien);box-shadow:0 .4cqw 0 var(--a1d);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tde2{font:700 3cqw/1.15 var(--f-hien);color:var(--a1)}
.hoi{font:800 2.9cqw/1.2 var(--f-hien);color:var(--chu-nen);text-wrap:balance}
.hoi.dai{font-size:2.4cqw}
.chu-to.emo{background:transparent!important;box-shadow:none!important;border:0!important}
.chu-to{font:800 7cqw/1.1 var(--f-hien);color:var(--chu);text-align:center;display:grid;place-items:center;background:var(--the);border-radius:2cqw;box-shadow:0 .6cqw 0 var(--bong);padding:2cqw}
.khung-anh{overflow:hidden;border-radius:1.4cqw;background:var(--the);box-shadow:0 .6cqw 0 var(--bong)}
.anh-trong{position:absolute;transform-origin:0 0;transition:transform .9s cubic-bezier(.45,0,.2,1)}
.anh-trong img{width:100%;height:100%;display:block}
.anh-trong svg{position:absolute;inset:0;width:100%;height:100%}
.nguon-anh{position:absolute;right:.6cqw;bottom:.5cqw;font:700 1.05cqw/1.2 var(--f-chu);color:var(--chu2);background:rgba(255,255,255,.85);border-radius:.6cqw;padding:.2cqw .6cqw;max-width:90%}
.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}
.khung-co.noi{box-shadow:0 0 0 .6cqw var(--a2),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent)}
.khung-co video,.khung-co img{width:100%;height:100%;object-fit:cover;display:block}
.chon{display:flex;flex-direction:column;gap:1.3cqw}
.nut-chon{font:800 2.7cqw/1.1 var(--f-hien);color:var(--chu);background:var(--the);border:.35cqw solid var(--chu);border-radius:1.4cqw;padding:1.1cqw 1.8cqw;text-align:left;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;gap:1.4cqw}
.nut-chon.dai{font-size:2.1cqw}
.chon.gon{gap:.8cqw}.chon.gon .nut-chon{font-size:1.9cqw;padding:.7cqw 1.4cqw}.chon.gon .nut-chon .ky{width:3.2cqw;height:3.2cqw;font-size:1.8cqw}
.nut-chon .ky{width:4cqw;height:4cqw;border-radius:50%;background:var(--a2);display:grid;place-items:center;font-size:2.2cqw;flex:none;color:var(--muc)}
.nut-chon:hover{transform:translateY(-.2cqw)}
.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-chon:focus-visible,.nut-sk:focus-visible,.the-n:focus-visible,.o-phai:focus-visible,.the-k:focus-visible,.nhom:focus-visible{outline:.4cqw solid var(--a1);outline-offset:.3cqw}
.nut-chon.dung{background:var(--a3t);border-color:var(--a3);box-shadow:0 .5cqw 0 var(--a3);color:var(--a3d)}
.nut-chon.dung .ky{background:var(--a3);color:#fff}
.nut-chon.sai{background:var(--a4t);border-color:var(--a4);box-shadow:0 .5cqw 0 var(--a4);color:var(--a4d);cursor:default;opacity:.85}
.nut-chon.sai .ky{background:var(--a4);color:#fff}
.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}
.nut-sk{font:800 2.3cqw/1 var(--f-hien);border-radius:1.2cqw;padding:1.1cqw 1.8cqw;border:.3cqw solid var(--chu);background:var(--the);color:var(--chu);cursor:pointer;box-shadow:0 .45cqw 0 var(--chu)}
.nut-sk.chinh{background:var(--a1);border-color:var(--a1d);color:#fff;box-shadow:0 .45cqw 0 var(--a1d)}
.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}
.the-n svg.dh{width:11cqw;height:11cqw}
.the-n img{max-width:100%;max-height:11cqw;object-fit:contain;border-radius:.8cqw}
.the-n .hd{font:800 1.9cqw/1.15 var(--f-hien);text-align:center;color:var(--chu)}
.the-n.chon-roi,.the-k.chon-roi{border-color:var(--a1);transform:translateY(-.6cqw);box-shadow:0 1cqw 0 color-mix(in srgb,var(--a1) 35%,transparent)}
.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}
.o-phai.lcd-k.khop{color:var(--a3d)}
.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}
.phu.toi{background:#2E3A6B;color:#FFE7A3}.phu.chieu{background:var(--a1t);color:var(--a1d)}
.the-k{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw;padding:.6cqw;cursor:grab;box-shadow:0 .45cqw 0 var(--chu);font:800 2cqw/1.15 var(--f-hien);color:var(--chu);text-align:center;touch-action:none;width:12cqw;min-height:8cqw}
.the-k svg.dh{width:7cqw;height:7cqw}
.the-k img{max-width:100%;max-height:7cqw;object-fit:contain}
.the-k.keo{cursor:grabbing;z-index:5;box-shadow:0 1.2cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent)}
.the-k.dat{cursor:default;border-color:var(--a3);box-shadow:0 .3cqw 0 var(--a3);width:10cqw;min-height:0;font-size:1.6cqw;padding:.4cqw}
.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}
.nhom .trong-nhom{display:flex;flex-wrap:wrap;gap:.4cqw;justify-content:center;align-content:flex-start;flex:1}
.nhom.sang{background:color-mix(in srgb,var(--a2) 35%,transparent)}
#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}
#tiep:focus-visible{outline:.4cqw solid var(--a2);outline-offset:.3cqw}
@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}
.dong-ket span:nth-child(even){font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.xoay{display:none}
@media (max-width:620px) and (orientation:portrait){.xoay{display:block;font:700 13px/1.4 var(--f-chu);color:var(--muted);text-align:center;padding:6px 0}}
#phude-dai{background:#0E1222;min-height:calc(2.7em + 18px);display:flex;align-items:center;justify-content:center;padding:8px 16px;font:700 clamp(14px,1.6vw,22px)/1.35 var(--f-chu)}
#phude{color:#FFF9EF;text-align:center;text-wrap:balance;max-width:60em}
#dk{background:var(--bar);color:var(--bar-fg);border-radius:0 0 14px 14px;display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
#dk button{background:transparent;color:inherit;border:0;font:800 16px/1 var(--f-chu);min-width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0 8px}
#dk button:hover:not([disabled]){background:rgba(255,255,255,.12)}
#dk button:focus-visible{outline:2px solid var(--sun)}
#dk button[disabled]{opacity:.35;cursor:default}
#dk button.bat{color:var(--sun)}
#thanh{flex:1 1 160px;min-width:120px;height:40px;display:flex;align-items:center;cursor:pointer;position:relative}
#thanh .ray{height:8px;width:100%;background:rgba(255,255,255,.18);border-radius:8px;position:relative}
#thanh .day{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:8px}
#thanh .num{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--coral)}
#thanh .moc{position:absolute;top:-3px;width:3px;height:14px;background:rgba(255,255,255,.45);border-radius:2px}
#thanh.khoa{cursor:default}
#nhan-thanh{font:700 13px/1.2 var(--f-chu);opacity:.85;position:absolute;left:0;top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#gio{font:700 13px/1 var(--f-chu);font-variant-numeric:tabular-nums;opacity:.85;min-width:84px;text-align:center}
.nho{font-size:13px!important}
@media (max-width:620px){#dk{gap:0;padding:4px 6px}#dk button{min-width:36px;height:38px;padding:0 6px}#gio{display:none}#thanh{flex:1 0 100%;order:9;height:30px}#nhan-thanh{font-size:12px}}
aside#ml{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
aside h2{font:800 15px/1.2 var(--f-hien);margin:0;letter-spacing:.02em}
#ds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#ds button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px;font:700 14px/1.25 var(--f-chu);color:var(--ink);cursor:pointer}
#ds button:hover:not([disabled]){background:color-mix(in srgb,var(--sun) 18%,transparent)}
#ds button:focus-visible{outline:2px solid var(--coral)}
#ds button.nay{background:color-mix(in srgb,var(--coral) 16%,transparent)}
#ds button[disabled]{opacity:.45;cursor:default}
#ds .kieu{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 12px/1 var(--f-chu);background:var(--paper);color:var(--muted)}
#ds .kieu.lam{background:color-mix(in srgb,var(--coral) 20%,transparent);color:var(--coral)}
#ds .tt{font:700 12px/1 var(--f-chu);color:var(--muted);font-variant-numeric:tabular-nums}
#ds .tt.ok{color:var(--mint)}
.cong[hidden]{display:none}
.cong{display:flex;align-items:center;gap:10px;font:700 13px/1.3 var(--f-chu);color:var(--muted);cursor:pointer}
.cong input{width:18px;height:18px;accent-color:var(--coral)}
details.ve{border-top:1px solid var(--line);padding-top:10px;font:500 13.5px/1.5 var(--f-chu);color:var(--ink)}
details.ve summary{font:800 14px/1.3 var(--f-hien);cursor:pointer}
details.ve p,details.ve ul{margin:8px 0}
details.ve ul{padding-left:18px}
details.ve b{font-weight:800}
.chan{font:700 12.5px/1.5 var(--f-chu);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:space-between}
.chan .nhap{color:var(--coral);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}
#stage.toi .tde2{color:color-mix(in srgb,var(--a1) 45%,#fff)}
#stage.toi .may{color:color-mix(in srgb,var(--chu-nen) 85%,transparent)!important;background:none!important}
.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}
.cot.kinh .trich{color:var(--chu);border-radius:1cqw;padding:1cqw 1.4cqw 1cqw 1.6cqw;text-shadow:none}
.trich{font:italic 400 calc(2.3cqw*var(--co,1))/1.4 var(--f-trich);color:var(--chu-nen);border-left:.5cqw solid var(--a1);padding:.3cqw 0 .3cqw 1.6cqw;text-shadow:0 0 .9cqw var(--halo)}
.trich b{color:var(--a1)}
.trich .ngoac{display:none}
.trich-nguon{font:700 calc(1.45cqw*var(--co,1))/1.3 var(--f-chu);font-style:normal;letter-spacing:.06em;margin-top:.8cqw;opacity:.8}
#stage[data-bc="trich-dan"] .trich{font-size:calc(3.5cqw*var(--co,1));line-height:1.35;border:0;padding:0 0 0 6.4cqw;position:relative;margin-bottom:1.2cqw}
#stage[data-bc="trich-dan"] .trich .ngoac{display:block;position:absolute;left:0;top:-1.4cqw;font:700 11cqw/1 var(--f-trich);font-style:normal;color:var(--a1);opacity:.85}
.tg-moc{text-align:center}
.tg-moc span{display:inline-block;background:var(--a1);color:#fff;border-radius:99px;padding:.45cqw 1.3cqw;font:800 calc(1.75cqw*var(--co,1))/1.2 var(--f-hien);box-shadow:0 .35cqw 0 var(--a1d);text-shadow:none}
.tg-cot .the{font-size:calc(1.75cqw*var(--co,1));text-align:center}
.tg-cot .dap{font-size:calc(2.4cqw*var(--co,1))}
.o-luoi{display:flex;flex-direction:column;gap:1cqw}
.o-luoi>.the,.o-luoi>.dap,.o-luoi>.lcd,.o-luoi>.trich{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.o-luoi>.the{font-size:calc(2.6cqw*var(--co,1));border-top:.7cqw solid var(--vien-o,var(--a1));padding:1.6cqw 2.2cqw}
.o-luoi>.dap{font-size:calc(3.4cqw*var(--co,1))}
.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}
.logo-truong img{height:3.6cqw;width:auto;display:block}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}
#stage[data-pc="so-tay"] .cot>.the{position:relative}
#stage[data-pc="so-tay"] .cot>.the::before{content:"";position:absolute;left:50%;top:-.8cqw;width:6.5cqw;height:1.6cqw;transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--a2) 55%,transparent);border-radius:.2cqw}
#stage[data-pc="so-tay"] .khung-anh{border-radius:.3cqw;border:.7cqw solid #fff;border-bottom-width:2.4cqw;box-shadow:0 .5cqw 1.4cqw var(--bong);transform:rotate(-1.4deg)}
#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}
#stage[data-pc="so-tay"] .dap{border-radius:.5cqw;transform:rotate(-1deg);box-shadow:0 .4cqw 1cqw var(--bong)}
#stage[data-pc="so-tay"] .nut-chon,#stage[data-pc="so-tay"] .nut-sk,#stage[data-pc="so-tay"] .o-phai,#stage[data-pc="so-tay"] .the-k{border-radius:.6cqw}
#stage[data-pc="so-tay"] .the-n{border-radius:.6cqw;box-shadow:0 .3cqw 1cqw var(--bong)}

/* --- Trang sách: giấy ngà, mực xanh, đỏ son, phẳng --- */
#stage[data-pc="trang-sach"] .the{background:color-mix(in srgb,var(--the) 55%,transparent);border-left:.45cqw solid var(--a1);border-radius:0 .5cqw .5cqw 0;box-shadow:none;font-weight:600}
#stage[data-pc="trang-sach"] .tde,#stage[data-pc="trang-sach"] .tieu-canh{font-weight:700;letter-spacing:-.01em}
#stage[data-pc="trang-sach"] .may{color:var(--a1);letter-spacing:.2em}
#stage[data-pc="trang-sach"] .dap{background:var(--chu);color:var(--nen);box-shadow:none;border-radius:.4cqw}
#stage[data-pc="trang-sach"] .khung-anh{border-radius:.3cqw;box-shadow:0 0 0 .5cqw var(--the),0 .5cqw 1.6cqw var(--bong)}
#stage[data-pc="trang-sach"] .chu-to{box-shadow:none;border:.2cqw solid var(--vien);border-radius:.4cqw;background:color-mix(in srgb,var(--the) 60%,transparent)}

số lớp electron khác nhau, nên bán kính khác nhau.", "sai_id": "c7-sai-3"}, {"chu": "K lớn hơn Li, vì K có nhiều electron lớp ngoài cùng hơn", "giai": "Li và K đều có 1 electron lớp ngoài cùng. K lớn hơn vì có nhiều lớp electron hơn.", "sai_id": "c7-sai-4"}], "vi_sao": "Li và K cùng nhóm IA. K có 4 lớp electron, Li có 2 lớp; lực hút giữa hạt nhân với electron ngoài cùng của K yếu hơn, nên bán kính K lớn hơn Li.", "hoi_id": "c7-hoi", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "chon", "ten": "Câu 3b SGK", "muc": "van-dung", "yccd": [1], "sgk": ["3"], "hoi": "So sánh bán kính nguyên tử của calcium (Z = 20) và selenium (Z = 34).", "noi": "So sánh bán kính nguyên tử của can-xi, Z bằng hai mươi, và xê-len, Z bằng ba mươi tư.", "lua": [{"chu": "Se lớn hơn Ca, vì Se có nhiều electron hơn", "giai": "Ca và Se cùng chu kì 4, cùng 4 lớp electron. Nhiều electron hơn nhưng điện tích hạt nhân Se cũng lớn hơn nhiều, hút mạnh hơn.", "sai_id": "c8-sai-1"}, {"chu": "Ca lớn hơn Se, vì cùng chu kì 4 mà Se có điện tích hạt nhân lớn hơn", "dung": true}, {"chu": "Bằng nhau, vì cùng có 4 lớp electron", "giai": "Cùng số lớp, nhưng điện tích hạt nhân khác nhau nên lực hút khác nhau, bán kính khác nhau.", "sai_id": "c8-sai-3"}, {"chu": "Ca lớn hơn Se, vì Ca có nhiều lớp electron hơn", "giai": "Ca và Se cùng chu kì 4 nên có cùng 4 lớp electron.", "sai_id": "c8-sai-4"}], "vi_sao": "Ca và Se cùng chu kì 4. Se có điện tích hạt nhân +34, lớn hơn Ca (+20), hút electron lớp ngoài cùng mạnh hơn, nên bán kính Se nhỏ hơn Ca.", "hoi_id": "c8-hoi", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "trinh-bay", "ten": "Độ âm điện", "nen": "cam", "bo_cuc": "trich-dan", "sgk": ["4"], "trich": "Độ âm điện của nguyên tử (χ) là đại lượng đặc trưng cho khả năng hút electron của nguyên tử một nguyên tố hoá học khi tạo thành liên kết hoá học.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 36", "hinh": {"chu": "Khả năng hút electron"}, "dong": [{"sau": 6, "id": "c9-1"}, {"the": "χ **nhỏ** → dễ **nhường** e", "id": "c9-2"}, {"the": "χ **lớn** → dễ **nhận** e", "id": "c9-3"}, {"the": "Thang độ âm điện **Pauling**", "id": "c9-4"}]}, {"ma": "c10", "loai": "trinh-bay", "ten": "Xu hướng độ âm điện", "nen": "xanh-la", "bo_cuc": "trai-phai", "sgk": ["4", "5"], "hinh": {"anh": "b06-bang-6-2-net.png", "chu": "Bảng 6.2. Giá trị độ âm điện tương đối theo L. C. Pauling"}, "dong": [{"the": "Chu kì: điện tích hạt nhân **tăng**", "id": "c10-1"}, {"the": "Chu kì: χ **tăng dần** →", "id": "c10-2"}, {"the": "Nhóm A: χ **giảm dần** ↓", "id": "c10-3"}, {"the": "Lớn nhất: **F (3,98)**", "id": "c10-4"}]}, {"ma": "c11", "loai": "chon", "ten": "Câu 4 SGK", "muc": "hieu", "yccd": [2], "sgk": ["4"], "hoi": "Độ âm điện tăng dần: Ca < Mg < P < S. Vì sao Ca có độ âm điện nhỏ hơn Mg?", "noi": "Độ âm điện tăng dần theo dãy can-xi, ma-giê, phốt-pho, lưu huỳnh. Vì sao can-xi có độ âm điện nhỏ hơn ma-giê?", "lua": [{"chu": "Ca, Mg cùng nhóm IIA; Ca nhiều lớp electron hơn nên lực hút yếu hơn", "dung": true}, {"chu": "Ca, Mg cùng chu kì; Ca có điện tích hạt nhân lớn hơn", "giai": "Mg ở chu kì 3, Ca ở chu kì 4, nên không cùng chu kì. Chúng cùng nhóm IIA.", "sai_id": "c11-sai-2"}, {"chu": "Ca có ít electron lớp ngoài cùng hơn Mg", "giai": "Ca và Mg cùng nhóm IIA, đều có 2 electron lớp ngoài cùng.", "sai_id": "c11-sai-3"}, {"chu": "Ca là phi kim còn Mg là kim loại", "giai": "Ca và Mg đều là kim loại nhóm IIA.", "sai_id": "c11-sai-4"}], "vi_sao": "Ca (4 lớp electron) ở dưới Mg (3 lớp) trong nhóm IIA. Lực hút giữa hạt nhân với electron ngoài cùng của Ca yếu hơn, nên độ âm điện Ca < Mg. Còn Mg, P, S cùng chu kì 3, điện tích hạt nhân tăng nên χ tăng.", "hoi_id": "c11-hoi", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Câu 5a SGK", "muc": "van-dung", "yccd": [1], "sgk": ["5"], "hoi": "Almelec chứa Al (Z = 13), Mg (Z = 12), Si (Z = 14). Thứ tự tăng dần bán kính nguyên tử là", "noi": "Hợp kim al-mê-léc chứa nhôm, ma-giê và si-lic. Thứ tự tăng dần bán kính nguyên tử là gì?", "lua": [{"chu": "Si < Al < Mg", "dung": true}, {"chu": "Mg < Al < Si", "giai": "Bạn đang xếp ngược. Cùng chu kì 3, điện tích hạt nhân tăng thì bán kính giảm: Si (Z = 14) nhỏ nhất.", "sai_id": "c12-sai-2"}, {"chu": "Al < Si < Mg", "giai": "Si có Z lớn hơn Al nên bán kính Si nhỏ hơn Al.", "sai_id": "c12-sai-3"}, {"chu": "Al < Mg < Si", "giai": "Trong chu kì 3, bán kính giảm theo chiều Z tăng: Mg (12) > Al (13) > Si (14).", "sai_id": "c12-sai-4"}], "vi_sao": "Mg, Al, Si cùng chu kì 3. Điện tích hạt nhân tăng từ Mg đến Si nên bán kính giảm: Si < Al < Mg.", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "chon", "ten": "Câu 5b SGK", "muc": "van-dung", "yccd": [2], "sgk": ["5"], "hoi": "Thứ tự giảm dần độ âm điện của Al, Mg, Si là", "noi": "Thứ tự giảm dần độ âm điện của nhôm, ma-giê và si-lic là gì?", "lua": [{"chu": "Mg > Al > Si", "giai": "Trong một chu kì, độ âm điện tăng theo chiều Z tăng, nên Mg có độ âm điện nhỏ nhất.", "sai_id": "c13-sai-1"}, {"chu": "Si > Al > Mg", "dung": true}, {"chu": "Al > Si > Mg", "giai": "Si đứng sau Al trong chu kì 3 nên độ âm điện Si lớn hơn Al.", "sai_id": "c13-sai-3"}, {"chu": "Si > Mg > Al", "giai": "Mg đứng trước Al trong chu kì 3 nên độ âm điện Mg nhỏ hơn Al.", "sai_id": "c13-sai-4"}], "vi_sao": "Cùng chu kì 3, điện tích hạt nhân tăng thì độ âm điện tăng: Si (1,90) > Al (1,61) > Mg (1,31).", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "trinh-bay", "ten": "Tính kim loại, tính phi kim", "nen": "kem", "bo_cuc": "trich-dan", "sgk": ["TN"], "trich": "Tính kim loại là tính chất của một nguyên tố mà nguyên tử của nó dễ nhường electron để trở thành ion dương.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 38", "hinh": {"chu": "Nhường hay nhận electron"}, "dong": [{"sau": 5, "id": "c14-1"}, {"the": "Dễ **nhường** e → kim loại **mạnh**", "id": "c14-2"}, {"the": "Dễ **nhận** e → phi kim **mạnh**", "id": "c14-3"}, {"the": "Xem phim **thí nghiệm**", "id": "c14-4"}]}, {"ma": "c15", "loai": "phim", "ten": "Phim: hai thí nghiệm tr. 38", "sgk": ["TN"], "tep": "tn-bai6-tr38.mp4", "phim_id": "phim-c15"}, {"ma": "c16", "loai": "trinh-bay", "ten": "Xu hướng kim loại, phi kim", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["TN", "6", "7"], "hinh": {"anh": "b06-chu-ki-3-net.png", "chu": "Tính kim loại, phi kim của các nguyên tố chu kì 3 (SGK tr. 39)"}, "dong": [{"the": "Chu kì: bán kính giảm → **hút mạnh hơn**", "id": "c16-1"}, {"the": "Chu kì: kim loại **giảm**, phi kim **tăng** →", "id": "c16-2"}, {"the": "Nhóm A: bán kính tăng → **hút yếu hơn**", "id": "c16-3"}, {"the": "Nhóm A: kim loại **tăng**, phi kim **giảm** ↓", "id": "c16-4"}, {"the": "IA: Li → Cs · VIIA: F → I", "id": "c16-5"}]}, {"ma": "c17", "loai": "chon", "ten": "Dự đoán: K với nước", "muc": "van-dung", "yccd": [2], "sgk": ["TN"], "hoi": "Potassium (K) đứng dưới sodium (Na) trong nhóm IA. Dự đoán K phản ứng với nước thế nào so với Na?", "noi": "Pô-tát-xi-um đứng dưới sô-đi-um trong nhóm một A. Bạn dự đoán pô-tát-xi-um phản ứng với nước thế nào so với sô-đi-um?", "lua": [{"chu": "Mãnh liệt hơn Na, vì tính kim loại của K mạnh hơn", "dung": true}, {"chu": "Yếu hơn Na, vì K có điện tích hạt nhân lớn hơn", "giai": "Trong nhóm A, tuy điện tích hạt nhân tăng nhưng bán kính tăng nhanh hơn, nên K nhường electron dễ hơn Na.", "sai_id": "c17-sai-2"}, {"chu": "Giống hệt Na, vì cùng có 1 electron lớp ngoài cùng", "giai": "Cùng nhóm nên tính chất tương tự, nhưng mức độ khác nhau: tính kim loại tăng dần từ trên xuống.", "sai_id": "c17-sai-3"}, {"chu": "Không phản ứng, vì K đứng dưới Mg", "giai": "K ở nhóm IA, là kim loại kiềm. Kim loại kiềm phản ứng với nước mãnh liệt.", "sai_id": "c17-sai-4"}], "vi_sao": "Trong nhóm IA, từ Na xuống K, bán kính tăng, K dễ nhường electron hơn: tính kim loại K mạnh hơn Na, nên phản ứng với nước mãnh liệt hơn.", "hoi_id": "c17-hoi", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "chon", "ten": "Dự đoán: bromine với KI", "muc": "van-dung", "yccd": [2], "sgk": ["TN"], "hinh": {"anh": "b06-hinh-6-5-net.png"}, "hoi": "Chlorine đẩy được iodine ra khỏi dung dịch KI. Nếu thay bằng nước bromine thì sao?", "noi": "Ở hình bên, clo đẩy được i-ốt ra khỏi dung dịch ka i. Nếu thay bằng nước brôm thì sao?", "lua": [{"chu": "Bromine cũng đẩy được iodine, vì tính phi kim Br mạnh hơn I", "dung": true}, {"chu": "Không đẩy được, vì bromine ở dưới chlorine", "giai": "Bromine ở dưới chlorine nhưng vẫn ở trên iodine trong nhóm VIIA, nên phi kim Br vẫn mạnh hơn I.", "sai_id": "c18-sai-2"}, {"chu": "Iodine đẩy bromine ra", "giai": "Chất phi kim mạnh hơn mới đẩy được chất yếu hơn ra khỏi muối. I yếu hơn Br.", "sai_id": "c18-sai-3"}, {"chu": "Không xảy ra gì, vì chỉ chlorine mới phản ứng", "giai": "Theo xu hướng nhóm VIIA: F > Cl > Br > I. Phi kim đứng trên mạnh hơn phi kim đứng dưới.", "sai_id": "c18-sai-4"}], "vi_sao": "Trong nhóm VIIA, tính phi kim giảm từ F đến I. Br đứng trên I nên tính phi kim mạnh hơn, đẩy được iodine ra khỏi dung dịch KI, dung dịch cũng chuyển màu.", "hoi_id": "c18-hoi", "vi_sao_id": "c18-vi-sao"}, {"ma": "c19", "loai": "chon", "ten": "Câu 6 SGK", "muc": "van-dung", "yccd": [2], "sgk": ["6"], "hoi": "Thứ tự giảm dần tính kim loại của Ba, Mg, Ca, Sr là", "noi": "Thứ tự giảm dần tính kim loại của ba-ri, ma-giê, can-xi, stron-ti là gì?", "lua": [{"chu": "Mg > Ca > Sr > Ba", "giai": "Bạn đang xếp ngược. Trong nhóm IIA, tính kim loại tăng từ trên xuống: Ba mạnh nhất.", "sai_id": "c19-sai-1"}, {"chu": "Ba > Sr > Ca > Mg", "dung": true}, {"chu": "Ba > Ca > Sr > Mg", "giai": "Sr (chu kì 5) ở dưới Ca (chu kì 4), nên tính kim loại Sr mạnh hơn Ca.", "sai_id": "c19-sai-3"}, {"chu": "Ca > Mg > Ba > Sr", "giai": "Bốn nguyên tố cùng nhóm IIA. Bạn xếp theo vị trí từ dưới lên: Ba, Sr, Ca, Mg.", "sai_id": "c19-sai-4"}], "vi_sao": "Mg, Ca, Sr, Ba cùng nhóm IIA, từ trên xuống. Bán kính tăng nhanh, lực hút với electron ngoài cùng giảm, càng dễ nhường electron: Ba > Sr > Ca > Mg.", "hoi_id": "c19-hoi", "vi_sao_id": "c19-vi-sao"}, {"ma": "c20", "loai": "chon", "ten": "Câu 7 SGK", "muc": "van-dung", "yccd": [2], "sgk": ["7"], "hoi": "Trong các nguyên tố O, F, Cl, Se, nguyên tố có tính phi kim mạnh nhất là", "noi": "Trong các nguyên tố ô-xi, flo, clo, xê-len, nguyên tố nào có tính phi kim mạnh nhất?", "lua": [{"chu": "O", "giai": "O và F cùng chu kì 2, F đứng sau O nên phi kim F mạnh hơn.", "sai_id": "c20-sai-1"}, {"chu": "F", "dung": true}, {"chu": "Se", "giai": "Se ở chu kì 4, phía dưới O trong nhóm VIA, nên phi kim yếu hơn O.", "sai_id": "c20-sai-3"}, {"chu": "Cl", "giai": "Cl ở dưới F trong nhóm VIIA, nên phi kim yếu hơn F.", "sai_id": "c20-sai-4"}], "vi_sao": "F ở góc trên bên phải (chu kì 2, nhóm VIIA): đứng sau O trong chu kì, đứng trên Cl trong nhóm. Nên F có tính phi kim mạnh nhất.", "hoi_id": "c20-hoi", "vi_sao_id": "c20-vi-sao"}, {"ma": "c21", "loai": "keo-tha", "ten": "Chu kì hay nhóm?", "muc": "hieu", "yccd": [1, 2], "sgk": ["MD"], "diem": 2, "hoi": "Theo chiều tăng điện tích hạt nhân, xu hướng nào đúng trong chu kì, xu hướng nào đúng trong nhóm A?", "noi": "Theo chiều tăng của điện tích hạt nhân, bạn xếp mỗi xu hướng vào đúng chỗ: trong một chu kì, hay trong một nhóm A.", "nhom": ["Trong một chu kì", "Trong một nhóm A"], "the": [{"chu": "Bán kính giảm dần", "nhom": 0}, {"chu": "Độ âm điện tăng dần", "nhom": 0}, {"chu": "Tính phi kim tăng dần", "nhom": 0}, {"chu": "Bán kính tăng dần", "nhom": 1}, {"chu": "Độ âm điện giảm dần", "nhom": 1}, {"chu": "Tính kim loại tăng dần", "nhom": 1}], "giai": "Bạn nhớ một mẹo: trong chu kì, nguyên tử co lại nên hút electron mạnh hơn. Trong nhóm, nguyên tử phình to nên hút yếu hơn.", "vi_sao": "Đúng hết! Trong chu kì: bán kính giảm, độ âm điện tăng, phi kim tăng. Trong nhóm A: bán kính tăng, độ âm điện giảm, kim loại tăng.", "hoi_id": "c21-hoi", "sai_id": "c21-sai", "vi_sao_id": "c21-vi-sao"}, {"ma": "c22", "loai": "chon", "ten": "Trả lời câu hỏi đầu bài", "muc": "hieu", "yccd": [1, 2], "sgk": ["MD"], "hoi": "Nguyên nhân sâu xa khiến tính chất các nguyên tố biến đổi tuần hoàn là gì?", "n "am", "chu": "Số 2 là số electron ở phân lớp s. Bạn nhớ cộng cả electron ở phân lớp p."}, "c4-hoi": {"d": 6.312, "s": "media/c4-hoi.mp3", "loai": "am", "chu": "Bạn viết nháp cấu hình electron, rồi nối mỗi nguyên tố với vị trí trong bảng tuần hoàn."}, "c4-sai": {"d": 7.704, "s": "media/c4-sai.mp3", "loai": "am", "chu": "Số lớp electron cho biết chu kì. Số electron lớp ngoài cùng cho biết số thứ tự nhóm A."}, "c4-vi-sao": {"d": 23.088, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Chính xác! Z = 8: 1s²2s²2p⁴, chu kì 2, nhóm VIA. Z = 11: [Ne]3s¹, chu kì 3, nhóm IA. Z = 17: [Ne]3s²3p⁵, chu kì 3, nhóm VIIA. Z = 20: [Ar]4s², chu kì 4, nhóm IIA."}, "c4-sai-2": {"d": 8.448, "s": "media/c4-sai-2.mp3", "loai": "am", "chu": "Đó là vị trí của Mg (Z = 12). Z = 20 có 4 lớp electron nên ở chu kì 4."}, "c5-hoi": {"d": 5.592, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Nguyên tử ốc-xi-gen, Z bằng tám, có bao nhiêu electron hoá trị?"}, "c5-sai": {"d": 11.28, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Bạn viết cấu hình 1s²2s²2p⁴. Với nguyên tố nhóm A, electron hoá trị là electron lớp ngoài cùng: cộng electron 2s và 2p."}, "c5-vi-sao": {"d": 14.28, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng! Cấu hình 1s²2s²2p⁴: lớp ngoài cùng có 2 + 4 = 6 electron hoá trị. Tương tự, Z = 11 có 1, Z = 17 có 7, Z = 20 có 2 electron hoá trị."}, "c6-1": {"d": 5.76, "s": "media/c6-1.mp3", "loai": "am", "chu": "Bán kính nguyên tử phụ thuộc vào lực hút giữa hạt nhân với các electron lớp ngoài cùng."}, "c6-2": {"d": 5.736, "s": "media/c6-2.mp3", "loai": "am", "chu": "Lực hút tăng thì bán kính giảm. Lực hút giảm thì bán kính tăng."}, "c6-3": {"d": 7.752, "s": "media/c6-3.mp3", "loai": "am", "chu": "Trong một chu kì, số lớp electron không đổi, điện tích hạt nhân tăng, lực hút tăng: bán kính giảm dần."}, "c6-4": {"d": 6.312, "s": "media/c6-4.mp3", "loai": "am", "chu": "Trong một nhóm A, đi từ trên xuống, số lớp electron tăng: bán kính tăng dần."}, "c6-5": {"d": 6.624, "s": "media/c6-5.mp3", "loai": "am", "chu": "Bạn thấy trên hình: quả cầu lớn nhất ở góc dưới bên trái, nhỏ nhất ở góc trên bên phải."}, "c7-hoi": {"d": 7.128, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "So sánh bán kính nguyên tử của li-thi-um, Z bằng ba, và pô-tát-xi-um, Z bằng mười chín."}, "c7-sai-2": {"d": 9.984, "s": "media/c7-sai-2.mp3", "loai": "am", "chu": "Li và K cùng nhóm IA. Trong một nhóm, số lớp electron mới là yếu tố quyết định: K có 4 lớp, Li chỉ có 2 lớp."}, "c7-sai-3": {"d": 6.336, "s": "media/c7-sai-3.mp3", "loai": "am", "chu": "Cùng số electron lớp ngoài cùng nhưng số lớp electron khác nhau, nên bán kính khác nhau."}, "c7-sai-4": {"d": 7.824, "s": "media/c7-sai-4.mp3", "loai": "am", "chu": "Li và K đều có 1 electron lớp ngoài cùng. K lớn hơn vì có nhiều lớp electron hơn."}, "c7-vi-sao": {"d": 12.12, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Li và K cùng nhóm IA. K có 4 lớp electron, Li có 2 lớp; lực hút giữa hạt nhân với electron ngoài cùng của K yếu hơn, nên bán kính K lớn hơn Li."}, "c8-hoi": {"d": 7.128, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "So sánh bán kính nguyên tử của can-xi, Z bằng hai mươi, và xê-len, Z bằng ba mươi tư."}, "c8-sai-1": {"d": 10.056, "s": "media/c8-sai-1.mp3", "loai": "am", "chu": "Ca và Se cùng chu kì 4, cùng 4 lớp electron. Nhiều electron hơn nhưng điện tích hạt nhân Se cũng lớn hơn nhiều, hút mạnh hơn."}, "c8-sai-3": {"d": 6.096, "s": "media/c8-sai-3.mp3", "loai": "am", "chu": "Cùng số lớp, nhưng điện tích hạt nhân khác nhau nên lực hút khác nhau, bán kính khác nhau."}, "c8-sai-4": {"d": 4.68, "s": "media/c8-sai-4.mp3", "loai": "am", "chu": "Ca và Se cùng chu kì 4 nên có cùng 4 lớp electron."}, "c8-vi-sao": {"d": 12.624, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Ca và Se cùng chu kì 4. Se có điện tích hạt nhân +34, lớn hơn Ca (+20), hút electron lớp ngoài cùng mạnh hơn, nên bán kính Se nhỏ hơn Ca."}, "c9-1": {"d": 3.888, "s": "media/c9-1.mp3", "loai": "am", "chu": "Bạn đọc thầm định nghĩa độ âm điện trên màn hình nhé."}, "c9-2": {"d": 5.376, "s": "media/c9-2.mp3", "loai": "am", "chu": "Khi tham gia liên kết, nguyên tử có độ âm điện nhỏ dễ nhường electron."}, "c9-3": {"d": 4.08, "s": "media/c9-3.mp3", "loai": "am", "chu": "Nguyên tử có độ âm điện lớn dễ nhận electron."}, "c9-4": {"d": 4.824, "s": "media/c9-4.mp3", "loai": "am", "chu": "Bảng giá trị độ âm điện thường dùng do nhà hoá học Pauling thiết lập."}, "c10-1": {"d": 6.768, "s": "media/c10-1.mp3", "loai": "am", "chu": "Trong một chu kì, từ trái sang phải, điện tích hạt nhân và số electron lớp ngoài cùng tăng."}, "c10-2": {"d": 5.88, "s": "media/c10-2.mp3", "loai": "am", "chu": "Lực hút giữa hạt nhân với electron lớp ngoài cùng tăng, nên độ âm điện tăng dần."}, "c10-3": {"d": 7.584, "s": "media/c10-3.mp3", "loai": "am", "chu": "Trong một nhóm A, từ trên xuống, số lớp electron tăng, lực hút giảm, nên độ âm điện giảm dần."}, "c10-4": {"d": 6.12, "s": "media/c10-4.mp3", "loai": "am", "chu": "Vì vậy, fluorine ở góc trên bên phải có độ âm điện lớn nhất: 3,98."}, "c11-hoi": {"d": 2.64, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Độ âm điện tăng dần theo dãy can-xi, ma-giê, phốt-pho, lưu huỳnh. Vì sao can-xi có độ âm điện nhỏ hơn ma-giê?"}, "c11-sai-2": {"d": 7.992, "s": "media/c11-sai-2.mp3", "loai": "am", "chu": "Mg ở chu kì 3, Ca ở chu kì 4, nên không cùng chu kì. Chúng cùng nhóm IIA."}, "c11-sai-3": {"d": 5.592, "s": "media/c11-sai-3.mp3", "loai": "am", "chu": "Ca và Mg cùng nhóm IIA, đều có 2 electron lớp ngoài cùng."}, "c11-sai-4": {"d": 4.128, "s": "media/c11-sai-4.mp3", "loai": "am", "chu": "Ca và Mg đều là kim loại nhóm IIA."}, "c11-vi-sao": {"d": 17.856, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Ca (4 lớp electron) ở dưới Mg (3 lớp) trong nhóm IIA. Lực hút giữa hạt nhân với electron ngoài cùng của Ca yếu hơn, nên độ âm điện Ca < Mg. Còn Mg, P, S cùng chu kì 3, điện tích hạt nhân tăng nên χ tăng."}, "c12-hoi": {"d": 7.944, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Hợp kim al-mê-léc chứa nhôm, ma-giê và si-lic. Thứ tự tăng dần bán kính nguyên tử là gì?"}, "c12-sai-2": {"d": 9.024, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Bạn đang xếp ngược. Cùng chu kì 3, điện tích hạt nhân tăng thì bán kính giảm: Si (Z = 14) nhỏ nhất."}, "c12-sai-3": {"d": 4.44, "s": "media/c12-sai-3.mp3", "loai": "am", "chu": "Si có Z lớn hơn Al nên bán kính Si nhỏ hơn Al."}, "c12-sai-4": {"d": 9.144, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "Trong chu kì 3, bán kính giảm theo chiều Z tăng: Mg (12) > Al (13) > Si (14)."}, "c12-vi-sao": {"d": 9.888, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "Mg, Al, Si cùng chu kì 3. Điện tích hạt nhân tăng từ Mg đến Si nên bán kính giảm: Si < Al < Mg."}, "c13-hoi": {"d": 5.256, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Thứ tự giảm dần độ âm điện của nhôm, ma-giê và si-lic là gì?"}, "c13-sai-1": {"d": 6.552, "s": "media/c13-sai-1.mp3", "loai": "am", "chu": "Trong một chu kì, độ âm điện tăng theo chiều Z tăng, nên Mg có độ âm điện nhỏ nhất."}, "c13-sai-3": {"d": 4.92, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "Si đứng sau Al trong chu kì 3 nên độ âm điện Si lớn hơn Al."}, "c13-sai-4": {"d": 5.472, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Mg đứng trước Al trong chu kì 3 nên độ âm điện Mg nhỏ hơn Al."}, "c13-vi-sao": {"d": 10.512, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "Cùng chu kì 3, điện tích hạt nhân tăng thì độ âm điện tăng: Si (1,90) > Al (1,61) > Mg (1,31)."}, "c14-1": {"d": 4.08, "s": "media/c14-1.mp3", "loai": "am", "chu": "Bạn đọc thầm khái niệm tính kim loại trên màn hình nhé."}, "c14-2": {"d": 5.736, "s": "media/c14-2.mp3", "loai": "am", "chu": "Nguyên tử càng dễ nhường electron để thành ion dương, tính kim loại càng mạnh."}, "c14-3": {"d": 7.176, "s": "media/c14-3.mp3", "loai": "am", "chu": "Ngược lại, tính phi kim là tính chất của nguyên tố mà nguyên tử dễ nhận electron để trở thành ion âm."}, "c14-4": {"d": 8.304, "s": "media/c14-4.mp3", "loai": "am", "chu": "Bây giờ mình cùng xem phim hai thí nghiệm trong SGK trang 38. Bạn dừng lại dự đoán khi phim hỏi nhé."}, "c16-1": {"d": 5.736, "s": "media/c16-1.mp3", "loai": "am", "chu": "Trong một chu kì, điện tích hạt nhân tăng, bán kính giảm, lực hút tăng."}, "c16-2": {"d": 7.368, "s": "media/c16-2.mp3", "loai": "am", "chu": "Nguyên tử khó nhường electron hơn, dễ nhận electron hơn: tính kim loại giảm, tính phi kim tăng."}, "c16-3": {"d": 5.472, "s": "media/c16-3.mp3", "loai": "am", "chu": "Trong một nhóm A, bán kính tăng nhanh và chiếm ưu thế, lực hút giảm."}, "c16-4": {"d": 5.736, "s": "media/c16-4.mp3", "loai": "am", "chu": "Nguyên tử dễ nhường electron hơn: tính kim loại tăng, tính phi kim giảm."}, "c16-5": {"d": 10.032, "s": "media/c16-5.mp3", "loai": "am", "chu": "Ví dụ: nhóm IA từ Li đến Cs, tính kim loại tăng. Nhóm VIIA từ F đến I, tính phi kim giảm."}, "c17-hoi": {"d": 7.896, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Pô-tát-xi-um đứng dưới sô-đi-um trong nhóm một A. Bạn dự đoán pô-tát-xi-um phản ứng với nước thế nào so với sô-đi-um?"}, "c17-sai-2": {"d": 7.2, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Trong nhóm A, tuy điện tích hạt nhân tăng nhưng bán kính tăng nhanh hơn, nên K nhường electron dễ hơn Na."}, "c17-sai-3": {"d": 6.576, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "Cùng nhóm nên tính chất tương tự, nhưng mức độ khác nhau: tính kim loại tăng dần từ trên xuống."}, "c17-sai-4": {"d": 6.888, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "K ở nhóm IA, là kim loại kiềm. Kim loại kiềm phản ứng với nước mãnh liệt."}, "c17-vi-sao": {"d": 10.176, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "Trong nhóm IA, từ Na xuống K, bán kính tăng, K dễ nhường electron hơn: tính kim loại K mạnh hơn Na, nên phản ứng với nước mãnh liệt hơn."}, "c18-hoi": {"d": 6.36, "s": "media/c18-hoi.mp3", "loai": "am", "chu": "Ở hình bên, clo đẩy được i-ốt ra khỏi dung dịch ka i. Nếu thay bằng nước brôm thì sao?"}, "c18-sai-2": {"d": 7.848, "s": "media/c18-sai-2.mp3", "loai": "am", "chu": "Bromine ở dưới chlorine nhưng vẫn ở trên iodine trong nhóm VIIA, nên phi kim Br vẫn mạnh hơn I."}, "c18-sai-3": {"d": 6.888, "s": "media/c18-sai-3.mp3", "loai": "am", "chu": "Chất phi kim mạnh hơn mới đẩy được chất yếu hơn ra khỏi muối. I yếu hơn Br."}, "c18-sai-4": {"d": 7.704, "s": "media/c18-sai-4.mp3", "loai": "am", "chu": "Theo xu hướng nhóm VIIA: F > Cl > Br > I. Phi kim đứng trên mạnh hơn phi kim đứng dưới."}, "c18-vi-sao": {"d": 10.632, "s": "media/c18-vi-sao.mp3", "loai": "am", "chu": "Trong nhóm VIIA, tính phi kim giảm từ F đến I. Br đứng trên I nên tính phi kim mạnh hơn, đẩy được iodine ra khỏi dung dịch KI, dung dịch cũng chuyển màu."}, "c19-hoi": {"d": 6.48, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Thứ tự giảm dần tính kim loại của ba-ri, ma-giê, can-xi, stron-ti là gì?"}, "c19-sai-1": {"d": 7.224, "s": "media/c19-sai-1.mp3", "loai": "am", "chu": "Bạn đang xếp ngược. Trong nhóm IIA, tính kim loại tăng từ trên xuống: Ba mạnh nhất."}, "c19-sai-3": {"d": 7.272, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "Sr (chu kì 5) ở dưới Ca (chu kì 4), nên tính kim loại Sr mạnh hơn Ca."}, "c19-sai-4": {"d": 9.336, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Bốn nguyên tố cùng nhóm IIA. Bạn xếp theo vị trí từ dưới lên: Ba, Sr, Ca, Mg."}, "c19-vi-sao": {"d": 14.4, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Mg, Ca, Sr, Ba cùng nhóm IIA, từ trên xuống. Bán kính tăng nhanh, lực hút với electron ngoài cùng giảm, càng dễ nhường electron: Ba > Sr > Ca > Mg."}, "c20-hoi": {"d": 6.984, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Trong các nguyên tố ô-xi, flo, clo, xê-len, nguyên tố nào có tính phi kim mạnh nhất?"}, "c20-sai-1": {"d": 5.592, "s": "media/c20-sai-1.mp3", "loai": "am", "chu": "O và F cùng chu kì 2, F đứng sau O nên phi kim F mạnh hơn."}, "c20-sai-3": {"d": 5.88, "s": "media/c20-sai-3.mp3", "loai": "am", "chu": "Se ở chu kì 4, phía dưới O trong nhóm VIA, nên phi kim yếu hơn O."}, "c20-sai-4": {"d": 5.424, "s": "media/c20-sai-4.mp3", "loai": "am", "chu": "Cl ở dưới F trong nhóm VIIA, nên phi kim yếu hơn F."}, "c20-vi-sao": {"d": 10.92, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "F ở góc trên bên phải (chu kì 2, nhóm VIIA): đứng sau O trong chu kì, đứng trên Cl trong nhóm. Nên F có tính phi kim mạnh nhất."}, "c21-hoi": {"d": 7.704, "s": "media/c21-hoi.mp3", "loai": "am", "chu": "Theo chiều tăng của điện tích hạt nhân, bạn xếp mỗi xu hướng vào đúng chỗ: trong một chu kì, hay trong một nhóm A."}, "c21-sai": {"d": 9.864, "s": "media/c21-sai.mp3", "loai": "am", "chu": "Bạn nhớ một mẹo: trong chu kì, nguyên tử co lại nên hút electron mạnh hơn. Trong nhóm, nguyên tử phình to nên hút yếu hơn."}, "c21-vi-sao": {"d": 12.264, "s": "media/c21-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Trong chu kì: bán kính giảm, độ âm điện tăng, phi kim tăng. Trong nhóm A: bán kính tăng, độ âm điện giảm, kim loại tăng."}, "c22-hoi": {"d": 8.304, "s": "media/c22-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Nguyên nhân sâu xa khiến tính chất các nguyên tố biến đổi tuần hoàn là gì?"}, "c22-sai-2": {"d": 6.216, "s": "media/c22-sai-2.mp3", "loai": "am", "chu": "Khối lượng tăng đều chứ không lặp lại, nên không giải thích được sự lặp lại tuần hoàn của tính chất."}, "c22-sai-3": {"d": 5.64, "s": "media/c22-sai-3.mp3", "loai": "am", "chu": "Tính chất hoá học do electron lớp ngoài cùng quyết định, không phải số neutron."}, "c22-sai-4": {"d": 4.608, "s": "media/c22-sai-4.mp3", "loai": "am", "chu": "Số lớp electron tăng dần theo chu kì, không bằng nhau."}, "c22-vi-sao": {"d": 14.088, "s": "media/c22-vi-sao.mp3", "loai": "am", "chu": "Khi điện tích hạt nhân tăng, cấu hình electron lớp ngoài cùng lặp lại sau mỗi chu kì. Cùng với sự thay đổi lực hút giữa hạt nhân và electron ngoài cùng, các tính chất biến đổi theo xu hướng trong chu kì và trong nhóm."}, "c23-1": {"d": 4.2, "s": "media/c23-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại theo chiều tăng của điện tích hạt nhân nhé."}, "c23-2": {"d": 5.448, "s": "media/c23-2.mp3", "loai": "am", "chu": "Trong một chu kì: bán kính nguyên tử giảm dần, độ âm điện tăng dần."}, "c23-3": {"d": 9.168, "s": "media/c23-3.mp3", "loai": "am", "chu": "Trong một chu kì: tính kim loại giảm dần, tính phi kim tăng dần. Số electron hoá trị nhóm A tăng từ 1 đến 8."}, "c23-4": {"d": 8.16, "s": "media/c23-4.mp3", "loai": "am", "chu": "Trong một nhóm A: bán kính nguyên tử tăng dần, độ âm điện giảm dần, tính kim loại tăng dần và tính phi kim giảm dần."}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 7.728, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong xu hướng biến đổi tính chất trong bảng tuần hoàn. Bạn bấm Chép kết quả để gửi cô nhé!"}, "phim-c15": {"d": 145.792, "s": "media/phim-c15.mp4", "loai": "phim", "chu": "", "poster": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQ const hex2 = h => { h = String(h || "#000000").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const ra16 = (r, g, b) => "#" + [r, g, b].map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0")).join("").toUpperCase();
const mau16 = (a, b, p) => { const x = hex2(a), y = hex2(b); return ra16(...x.map((v, i) => v * (1 - p) + y[i] * p)); };
function sangDo(h){ const c = hex2(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
function hsl(h){ const [r, g, b] = hex2(h).map(x => x / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn), hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [hh * 60, s, l]; }
