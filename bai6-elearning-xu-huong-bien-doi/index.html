<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai6-elearning-xu-huong-bien-doi bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai6-elearning-xu-huong-bien-doi', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}

.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}

.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}

#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}

.xoay{display:none}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}

.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}

#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}

ố quyết định: K có 4 lớp, Li chỉ có 2 lớp.", "sai_id": "c7-sai-2"}, {"chu": "Bằng nhau, vì cùng có 1 electron lớp ngoài cùng", "giai": "Cùng số electron lớp ngoài cùng nhưng số lớp electron khác nhau, nên bán kính khác nhau.", "sai_id": "c7-sai-3"}, {"chu": "K lớn hơn Li, vì K có nhiều electron lớp ngoài cùng hơn", "giai": "Li và K đều có 1 electron lớp ngoài cùng. K lớn hơn vì có nhiều lớp electron hơn.", "sai_id": "c7-sai-4"}], "vi_sao": "Li và K cùng nhóm IA. K có 4 lớp electron, Li có 2 lớp; lực hút giữa hạt nhân với electron ngoài cùng của K yếu hơn, nên bán kính K lớn hơn Li.", "hoi_id": "c7-hoi", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "chon", "ten": "Câu 3b SGK", "muc": "van-dung", "yccd": [1], "sgk": ["3"], "hoi": "So sánh bán kính nguyên tử của calcium (Z = 20) và selenium (Z = 34).", "noi": "So sánh bán kính nguyên tử của calcium, Z bằng hai mươi, và selenium, Z bằng ba mươi tư.", "lua": [{"chu": "Se lớn hơn Ca, vì Se có nhiều electron hơn", "giai": "Ca và Se cùng chu kì 4, cùng 4 lớp electron. Nhiều electron hơn nhưng điện tích hạt nhân Se cũng lớn hơn nhiều, hút mạnh hơn.", "sai_id": "c8-sai-1"}, {"chu": "Ca lớn hơn Se, vì cùng chu kì 4 mà Se có điện tích hạt nhân lớn hơn", "dung": true}, {"chu": "Bằng nhau, vì cùng có 4 lớp electron", "giai": "Cùng số lớp, nhưng điện tích hạt nhân khác nhau nên lực hút khác nhau, bán kính khác nhau.", "sai_id": "c8-sai-3"}, {"chu": "Ca lớn hơn Se, vì Ca có nhiều lớp electron hơn", "giai": "Ca và Se cùng chu kì 4 nên có cùng 4 lớp electron.", "sai_id": "c8-sai-4"}], "vi_sao": "Ca và Se cùng chu kì 4. Se có điện tích hạt nhân +34, lớn hơn Ca (+20), hút electron lớp ngoài cùng mạnh hơn, nên bán kính Se nhỏ hơn Ca.", "hoi_id": "c8-hoi", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "trinh-bay", "ten": "Độ âm điện", "nen": "cam", "bo_cuc": "trich-dan", "sgk": ["4"], "trich": "Độ âm điện của nguyên tử (χ) là đại lượng đặc trưng cho khả năng hút electron của nguyên tử một nguyên tố hoá học khi tạo thành liên kết hoá học.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 36", "hinh": {"chu": "Khả năng hút electron"}, "dong": [{"sau": 6, "id": "c9-1"}, {"the": "χ **nhỏ** → dễ **nhường** e", "id": "c9-2"}, {"the": "χ **lớn** → dễ **nhận** e", "id": "c9-3"}, {"the": "Thang độ âm điện **Pauling**", "id": "c9-4"}]}, {"ma": "c10", "loai": "trinh-bay", "ten": "Xu hướng độ âm điện", "nen": "xanh-la", "bo_cuc": "trai-phai", "sgk": ["4", "5"], "hinh": {"anh": "b06-bang-6-2-ve.png", "chu": "Bảng 6.2. Độ âm điện theo L. C. Pauling"}, "dong": [{"the": "Chu kì: điện tích hạt nhân **tăng**", "id": "c10-1"}, {"the": "Chu kì: χ **tăng dần** →", "id": "c10-2"}, {"the": "Nhóm A: χ **giảm dần** ↓", "id": "c10-3"}, {"the": "Lớn nhất: **F (3,98)**", "id": "c10-4"}]}, {"ma": "c11", "loai": "chon", "ten": "Câu 4 SGK", "muc": "hieu", "yccd": [2], "sgk": ["4"], "hoi": "Độ âm điện tăng dần: Ca < Mg < P < S. Vì sao Ca có độ âm điện nhỏ hơn Mg?", "noi": "Độ âm điện tăng dần theo dãy calcium, magnesium, phosphorus, sulfur. Vì sao calcium có độ âm điện nhỏ hơn magnesium?", "lua": [{"chu": "Ca, Mg cùng nhóm IIA; Ca nhiều lớp electron hơn nên lực hút yếu hơn", "dung": true}, {"chu": "Ca, Mg cùng chu kì; Ca có điện tích hạt nhân lớn hơn", "giai": "Mg ở chu kì 3, Ca ở chu kì 4, nên không cùng chu kì. Chúng cùng nhóm IIA.", "sai_id": "c11-sai-2"}, {"chu": "Ca có ít electron lớp ngoài cùng hơn Mg", "giai": "Ca và Mg cùng nhóm IIA, đều có 2 electron lớp ngoài cùng.", "sai_id": "c11-sai-3"}, {"chu": "Ca là phi kim còn Mg là kim loại", "giai": "Ca và Mg đều là kim loại nhóm IIA.", "sai_id": "c11-sai-4"}], "vi_sao": "Ca (4 lớp electron) ở dưới Mg (3 lớp) trong nhóm IIA. Lực hút giữa hạt nhân với electron ngoài cùng của Ca yếu hơn, nên độ âm điện Ca < Mg. Còn Mg, P, S cùng chu kì 3, điện tích hạt nhân tăng nên χ tăng.", "hoi_id": "c11-hoi", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Câu 5a SGK", "muc": "van-dung", "yccd": [1], "sgk": ["5"], "hoi": "Almelec chứa Al (Z = 13), Mg (Z = 12), Si (Z = 14). Thứ tự tăng dần bán kính nguyên tử là", "noi": "Hợp kim almelec chứa aluminium, magnesium và silicon. Thứ tự tăng dần bán kính nguyên tử là gì?", "lua": [{"chu": "Si < Al < Mg", "dung": true}, {"chu": "Mg < Al < Si", "giai": "Bạn đang xếp ngược. Cùng chu kì 3, điện tích hạt nhân tăng thì bán kính giảm: Si (Z = 14) nhỏ nhất.", "sai_id": "c12-sai-2"}, {"chu": "Al < Si < Mg", "giai": "Si có Z lớn hơn Al nên bán kính Si nhỏ hơn Al.", "sai_id": "c12-sai-3"}, {"chu": "Al < Mg < Si", "giai": "Trong chu kì 3, bán kính giảm theo chiều Z tăng: Mg (12) > Al (13) > Si (14).", "sai_id": "c12-sai-4"}], "vi_sao": "Mg, Al, Si cùng chu kì 3. Điện tích hạt nhân tăng từ Mg đến Si nên bán kính giảm: Si < Al < Mg.", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "chon", "ten": "Câu 5b SGK", "muc": "van-dung", "yccd": [2], "sgk": ["5"], "hoi": "Thứ tự giảm dần độ âm điện của Al, Mg, Si là", "noi": "Thứ tự giảm dần độ âm điện của aluminium, magnesium và silicon là gì?", "lua": [{"chu": "Mg > Al > Si", "giai": "Trong một chu kì, độ âm điện tăng theo chiều Z tăng, nên Mg có độ âm điện nhỏ nhất.", "sai_id": "c13-sai-1"}, {"chu": "Si > Al > Mg", "dung": true}, {"chu": "Al > Si > Mg", "giai": "Si đứng sau Al trong chu kì 3 nên độ âm điện Si lớn hơn Al.", "sai_id": "c13-sai-3"}, {"chu": "Si > Mg > Al", "giai": "Mg đứng trước Al trong chu kì 3 nên độ âm điện Mg nhỏ hơn Al.", "sai_id": "c13-sai-4"}], "vi_sao": "Cùng chu kì 3, điện tích hạt nhân tăng thì độ âm điện tăng: Si (1,90) > Al (1,61) > Mg (1,31).", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "trinh-bay", "ten": "Tính kim loại, tính phi kim", "nen": "kem", "bo_cuc": "trich-dan", "sgk": ["TN"], "trich": "Tính kim loại là tính chất của một nguyên tố mà nguyên tử của nó dễ nhường electron để trở thành ion dương.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 38", "hinh": {"chu": "Nhường hay nhận electron"}, "dong": [{"sau": 5, "id": "c14-1"}, {"the": "Dễ **nhường** e → kim ao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "chon", "ten": "Dự đoán: bromine với KI", "muc": "van-dung", "yccd": [2], "sgk": ["TN"], "hinh": {"anh": "b06-hinh-6-5-net.png"}, "hoi": "Thay nước chlorine bằng nước bromine thì sao?", "noi": "Ở hình bên, chlorine đẩy được iodine ra khỏi dung dịch KI. Nếu thay bằng nước bromine thì sao?", "lua": [{"chu": "Có, Br > I", "dung": true}, {"chu": "Không đẩy được", "giai": "Bromine ở dưới chlorine nhưng vẫn ở trên iodine trong nhóm VIIA, nên phi kim Br vẫn mạnh hơn I.", "sai_id": "c18-sai-2"}, {"chu": "I đẩy Br ra", "giai": "Chất phi kim mạnh hơn mới đẩy được chất yếu hơn ra khỏi muối. I yếu hơn Br.", "sai_id": "c18-sai-3"}, {"chu": "Không phản ứng", "giai": "Theo xu hướng nhóm VIIA: F > Cl > Br > I. Phi kim đứng trên mạnh hơn phi kim đứng dưới.", "sai_id": "c18-sai-4"}], "vi_sao": "Trong nhóm VIIA, tính phi kim giảm từ F đến I. Br đứng trên I nên tính phi kim mạnh hơn, đẩy được iodine ra khỏi dung dịch KI, dung dịch cũng chuyển màu.", "hoi_id": "c18-hoi", "vi_sao_id": "c18-vi-sao"}, {"ma": "c19", "loai": "chon", "ten": "Câu 6 SGK", "muc": "van-dung", "yccd": [2], "sgk": ["6"], "hoi": "Thứ tự giảm dần tính kim loại của Ba, Mg, Ca, Sr là", "noi": "Thứ tự giảm dần tính kim loại của barium, magnesium, calcium, strontium là gì?", "lua": [{"chu": "Mg > Ca > Sr > Ba", "giai": "Bạn đang xếp ngược. Trong nhóm IIA, tính kim loại tăng từ trên xuống: Ba mạnh nhất.", "sai_id": "c19-sai-1"}, {"chu": "Ba > Sr > Ca > Mg", "dung": true}, {"chu": "Ba > Ca > Sr > Mg", "giai": "Sr (chu kì 5) ở dưới Ca (chu kì 4), nên tính kim loại Sr mạnh hơn Ca.", "sai_id": "c19-sai-3"}, {"chu": "Ca > Mg > Ba > Sr", "giai": "Bốn nguyên tố cùng nhóm IIA. Bạn xếp theo vị trí từ dưới lên: Ba, Sr, Ca, Mg.", "sai_id": "c19-sai-4"}], "vi_sao": "Mg, Ca, Sr, Ba cùng nhóm IIA, từ trên xuống. Bán kính tăng nhanh, lực hút với electron ngoài cùng giảm, càng dễ nhường electron: Ba > Sr > Ca > Mg.", "hoi_id": "c19-hoi", "vi_sao_id": "c19-vi-sao"}, {"ma": "c20", "loai": "chon", "ten": "Câu 7 SGK", "muc": "van-dung", "yccd": [2], "sgk": ["7"], "hoi": "Trong các nguyên tố O, F, Cl, Se, nguyên tố có tính phi kim mạnh nhất là", "noi": "Trong các nguyên tố oxygen, fluorine, chlorine, selenium, nguyên tố nào có tính phi kim mạnh nhất?", "lua": [{"chu": "O", "giai": "O và F cùng chu kì 2, F đứng sau O nên phi kim F mạnh hơn.", "sai_id": "c20-sai-1"}, {"chu": "F", "dung": true}, {"chu": "Se", "giai": "Se ở chu kì 4, phía dưới O trong nhóm VIA, nên phi kim yếu hơn O.", "sai_id": "c20-sai-3"}, {"chu": "Cl", "giai": "Cl ở dưới F trong nhóm VIIA, nên phi kim yếu hơn F.", "sai_id": "c20-sai-4"}], "vi_sao": "F ở góc trên bên phải (chu kì 2, nhóm VIIA): đứng sau O trong chu kì, đứng trên Cl trong nhóm. Nên F có tính phi kim mạnh nhất.", "hoi_id": "c20-hoi", "vi_sao_id": "c20-vi-sao"}, {"ma": "c21", "loai": "keo-tha", "ten": "Chu kì hay nhóm?", "muc": "hieu", "yccd": [1, 2], "sgk": ["MD"], "diem": 2, "hoi": "Theo chiều tăng điện tích hạt nhân, xu hướng nào đúng trong chu kì, xu hướng nào đúng trong nhóm A?", "noi": "Theo chiều tăng của điện tích hạt nhân, bạn xếp mỗi xu hướng vào đúng chỗ: trong một chu kì, hay trong một nhóm A.", "nhom": ["Trong một chu kì", "Trong một nhóm A"], "the": [{"chu": "Bán kính giảm dần", "nhom": 0}, {"chu": "Độ âm điện tăng dần", "nhom": 0}, {"chu": "Tính phi kim tăng dần", "nhom": 0}, {"chu": "Bán kính tăng dần", "nhom": 1}, {"chu": "Độ âm điện giảm dần", "nhom": 1}, {"chu": "Tính kim loại tăng dần", "nhom": 1}], "giai": "Bạn nhớ một mẹo: trong chu kì, nguyên tử co lại nên hút electron mạnh hơn. Trong nhóm, nguyên tử phình to nên hút yếu hơn.", "vi_sao": "Đúng hết! Trong chu kì: bán kính giảm, độ âm điện tăng, phi kim tăng. Trong nhóm A: bán kính tăng, độ âm điện giảm, kim loại tăng.", "hoi_id": "c21-hoi", "sai_id": "c21-sai", "vi_sao_id": "c21-vi-sao"}, {"ma": "c22", "loai": "chon", "ten": "Trả lời câu hỏi đầu bài", "muc": "hieu", "yccd": [1, 2], "sgk": ["MD"], "hoi": "Nguyên nhân sâu xa khiến tính chất các nguyên tố biến const MEDIA = /*__MEDIA__*/{"c1-1": {"d": 7.872, "s": "media/c1-1.mp3", "loai": "am", "chu": "Chào các bạn lớp Mười! Mình là Neo, hôm nay cùng cô Thơi và các bạn khám phá bảng tuần hoàn nhé."}, "c1-2": {"d": 6.264, "s": "media/c1-2.mp3", "loai": "am", "chu": "Bài 6: Xu hướng biến đổi một số tính chất của nguyên tử trong một chu kì và trong một nhóm."}, "c1-3": {"d": 9.072, "s": "media/c1-3.mp3", "loai": "am", "chu": "Khi đi từ trái sang phải, hay từ trên xuống dưới bảng tuần hoàn, tính chất của nguyên tử thay đổi theo xu hướng nào? Vì sao?"}, "c1-4": {"d": 7.968, "s": "media/c1-4.mp3", "loai": "am", "chu": "Mình sẽ tìm hiểu bốn tính chất: cấu hình electron, bán kính, độ âm điện, tính kim loại và phi kim."}, "c2-1": {"d": 3.528, "s": "media/c2-1.mp3", "loai": "am", "chu": "Nhóm A gồm các nguyên tố s và p."}, "c2-2": {"d": 7.272, "s": "media/c2-2.mp3", "loai": "am", "chu": "Nguyên tử các nguyên tố cùng nhóm A có số electron lớp ngoài cùng bằng nhau, trừ He trong nhóm VIIIA."}, "c2-3": {"d": 5.208, "s": "media/c2-3.mp3", "loai": "am", "chu": "Vì vậy, các nguyên tố cùng nhóm A có tính chất hoá học tương tự nhau."}, "c2-4": {"d": 5.664, "s": "media/c2-4.mp3", "loai": "am", "chu": "Sau mỗi chu kì, cấu hình electron lớp ngoài cùng lặp lại một cách tuần hoàn."}, "c2-5": {"d": 4.632, "s": "media/c2-5.mp3", "loai": "am", "chu": "Đó chính là nguyên nhân khiến tính chất các nguyên tố biến đổi tuần hoàn."}, "c3-hoi": {"d": 6.984, "s": "media/c3-hoi.mp3", "loai": "am", "chu": "Dựa vào cấu hình electron lớp ngoài cùng, bạn nối mỗi nguyên tố với số electron lớp ngoài cùng nhé."}, "c3-sai": {"d": 11.184, "s": "media/c3-sai.mp3", "loai": "am", "chu": "Bạn cộng số mũ của phân lớp s và p ở lớp ngoài cùng. Ví dụ Al: 3s²3p¹ có 2 + 1 = 3 electron."}, "c3-vi-sao": {"d": 15.696, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Cộng số electron s và p lớp ngoài cùng: Li 1, Al 3, Si 4, Se 6, Br 7. Tương tự, Ca có 2, P có 5, Ar có 8."}, "c3-sai-2": {"d": 6.36, "s": "media/c3-sai-2.mp3", "loai": "am", "chu": "Số 2 là số electron ở phân lớp s. Bạn nhớ cộng cả electron ở phân lớp p."}, "c4-hoi": {"d": 6.312, "s": "media/c4-hoi.mp3", "loai": "am", "chu": "Bạn viết nháp cấu hình electron, rồi nối mỗi nguyên tố với vị trí trong bảng tuần hoàn."}, "c4-sai": {"d": 7.752, "s": "media/c4-sai.mp3", "loai": "am", "chu": "Số lớp electron cho biết chu kì. Số electron lớp ngoài cùng cho biết số thứ tự nhóm A."}, "c4-vi-sao": {"d": 23.184, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Chính xác! Z = 8: 1s²2s²2p⁴, chu kì 2, nhóm VIA. Z = 11: [Ne]3s¹, chu kì 3, nhóm IA. Z = 17: [Ne]3s²3p⁵, chu kì 3, nhóm VIIA. Z = 20: [Ar]4s², chu kì 4, nhóm IIA."}, "c4-sai-2": {"d": 8.928, "s": "media/c4-sai-2.mp3", "loai": "am", "chu": "Đó là vị trí của Mg (Z = 12). Z = 20 có 4 lớp electron nên ở chu kì 4."}, "c5-hoi": {"d": 5.496, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Nguyên tử oxygen, Z bằng tám, có bao nhiêu electron hoá trị?"}, "c5-sai": {"d": 12.624, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Bạn viết cấu hình 1s²2s²2p⁴. Với nguyên tố nhóm A, electron hoá trị là electron lớp ngoài cùng: cộng electron 2s và 2p."}, "c5-vi-sao": {"d": 16.44, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng! Cấu hình 1s²2s²2p⁴: lớp ngoài cùng có 2 + 4 = 6 electron hoá trị. Tương tự, Z = 11 có 1, Z = 17 có 7, Z = 20 có 2 electron hoá trị."}, "c6-1": {"d": 5.736, "s": "media/c6-1.mp3", "loai": "am", "chu": "Bán kính nguyên tử phụ thuộc vào lực hút giữa hạt nhân với các electron lớp ngoài cùng."}, "c6-2": {"d": 5.736, "s": "media/c6-2.mp3", "loai": "am", "chu": "Lực hút tăng thì bán kính giảm. Lực hút giảm thì bán kính tăng."}, "c6-3": {"d": 7.8, "s": "media/c6-3.mp3", "loai": "am", "chu": "Trong một chu kì, số lớp electron không đổi, điện tích hạt nhân tăng, lực hút tăng: bán kính giảm dần."}, "c6-4": {"d": 6.264, "s": "media/c6-4.mp3", "loai": "am", "chu": "Trong một nhóm A, đi từ trên xuống, số lớp electron tăng: bán kính tăng dần."}, "c6-5": {"d": 6.624, "s": "media/c6-5.mp3", "loai": "am", "chu": "Bạn thấy trên hình: quả cầu lớn nhất ở góc dưới bên trái, nhỏ nhất ở góc trên bên phải."}, "c7-hoi": {"d": 7.2, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "So sánh bán kính nguyên tử của lithium, Z bằng ba, và potassium, Z bằng mười chín."}, "c7-sai-2": {"d": 9.432, "s": "media/c7-sai-2.mp3", "loai": "am", "chu": "Li và K cùng nhóm IA. Trong một nhóm, số lớp electron mới là yếu tố quyết định: K có 4 lớp, Li chỉ có 2 lớp."}, "c7-sai-3": {"d": 6.336, "s": "media/c7-sai-3.mp3", "loai": "am", "chu": "Cùng số electron lớp ngoài cùng nhưng số lớp electron khác nhau, nên bán kính khác nhau."}, "c7-sai-4": {"d": 8.136, "s": "media/c7-sai-4.mp3", "loai": "am", "chu": "Li và K đều có 1 electron lớp ngoài cùng. K lớn hơn vì có nhiều lớp electron hơn."}, "c7-vi-sao": {"d": 12.144, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Li và K cùng nhóm IA. K có 4 lớp electron, Li có 2 lớp; lực hút giữa hạt nhân với electron ngoài cùng của K yếu hơn, nên bán kính K lớn hơn Li."}, "c8-hoi": {"d": 7.56, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "So sánh bán kính nguyên tử của calcium, Z bằng hai mươi, và selenium, Z bằng ba mươi tư."}, "c8-sai-1": {"d": 10.416, "s": "media/c8-sai-1.mp3", "loai": "am", "chu": "Ca và Se cùng chu kì 4, cùng 4 lớp electron. Nhiều electron hơn nhưng điện tích hạt nhân Se cũng lớn hơn nhiều, hút mạnh hơn."}, "c8-sai-3": {"d": 6.096, "s": "media/c8-sai-3.mp3", "loai": "am", "chu": "Cùng số lớp, nhưng điện tích hạt nhân khác nhau nên lực hút khác nhau, bán kính khác nhau."}, "c8-sai-4": {"d": 5.016, "s": "media/c8-sai-4.mp3", "loai": "am", "chu": "Ca và Se cùng chu kì 4 nên có cùng 4 lớp electron."}, "c8-vi-sao": {"d": 13.416, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Ca và Se cùng chu kì 4. Se có điện tích hạt nhân +34, lớn hơn Ca (+20), hút electron lớp ngoài cùng mạnh hơn, nên bán kính Se nhỏ hơn Ca."}, "c9-1": {"d": 3.888, "s": "media/c9-1.mp3", "loai": "am", "chu": "Bạn đọc thầm định nghĩa độ âm điện trên màn hình nhé."}, "c9-2": {"d": 5.352, "s": "media/c9-2.mp3", "loai": "am", "chu": "Khi tham gia liên kết, nguyên tử có độ âm điện nhỏ dễ nhường electron."}, "c9-3": {"d": 4.128, "s": "media/c9-3.mp3", "loai": "am", "chu": "Nguyên tử có độ âm điện lớn dễ nhận electron."}, "c9-4": {"d": 4.824, "s": "media/c9-4.mp3", "loai": "am", "chu": "Bảng giá trị độ âm điện thường dùng do nhà hoá học Pauling thiết lập."}, "c10-1": {"d": 6.696, "s": "media/c10-1.mp3", "loai": "am", "chu": "Trong một chu kì, từ trái sang phải, điện tích hạt nhân và số electron lớp ngoài cùng tăng."}, "c10-2": {"d": 5.952, "s": "media/c10-2.mp3", "loai": "am", "chu": "Lực hút giữa hạt nhân với electron lớp ngoài cùng tăng, nên độ âm điện tăng dần."}, "c10-3": {"d": 7.56, "s": "media/c10-3.mp3", "loai": "am", "chu": "Trong một nhóm A, từ trên xuống, số lớp electron tăng, lực hút giảm, nên độ âm điện giảm dần."}, "c10-4": {"d": 6.288, "s": "media/c10-4.mp3", "loai": "am", "chu": "Vì vậy, fluorine ở góc trên bên phải có độ âm điện lớn nhất: 3,98."}, "c11-hoi": {"d": 11.232, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Độ âm điện tăng dần theo dãy calcium, magnesium, phosphorus, sulfur. Vì sao calcium có độ âm điện nhỏ hơn magnesium?"}, "c11-sai-2": {"d": 8.16, "s": "media/c11-sai-2.mp3", "loai": "am", "chu": "Mg ở chu kì 3, Ca ở chu kì 4, nên không cùng chu kì. Chúng cùng nhóm IIA."}, "c11-sai-3": {"d": 5.832, "s": "media/c11-sai-3.mp3", "loai": "am", "chu": "Ca và Mg cùng nhóm IIA, đều có 2 electron lớp ngoài cùng."}, "c11-sai-4": {"d": 4.296, "s": "media/c11-sai-4.mp3", "loai": "am", "chu": "Ca và Mg đều là kim loại nhóm IIA."}, "c11-vi-sao": {"d": 18.504, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Ca (4 lớp electron) ở dưới Mg (3 lớp) trong nhóm IIA. Lực hút giữa hạt nhân với electron ngoài cùng của Ca yếu hơn, nên độ âm điện Ca < Mg. Còn Mg, P, S cùng chu kì 3, điện tích hạt nhân tăng nên χ tăng."}, "c12-hoi": {"d": 9.144, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Hợp kim almelec chứa aluminium, magnesium và silicon. Thứ tự tăng dần bán kính nguyên tử là gì?"}, "c12-sai-2": {"d": 9.408, "s": "media/c12-sai-2.mp3", "loai": "am", "chu": "Bạn đang xếp ngược. Cùng chu kì 3, điện tích hạt nhân tăng thì bán kính giảm: Si (Z = 14) nhỏ nhất."}, "c12-sai-3": {"d": 5.472, "s": "media/c12-sai-3.mp3", "loai": "am", "chu": "Si có Z lớn hơn Al nên bán kính Si nhỏ hơn Al."}, "c12-sai-4": {"d": 10.584, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "Trong chu kì 3, bán kính giảm theo chiều Z tăng: Mg (12) > Al (13) > Si (14)."}, "c12-vi-sao": {"d": 11.616, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "Mg, Al, Si cùng chu kì 3. Điện tích hạt nhân tăng từ Mg đến Si nên bán kính giảm: Si < Al < Mg."}, "c13-hoi": {"d": 6.432, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Thứ tự giảm dần độ âm điện của aluminium, magnesium và silicon là gì?"}, "c13-sai-1": {"d": 6.576, "s": "media/c13-sai-1.mp3", "loai": "am", "chu": "Trong một chu kì, độ âm điện tăng theo chiều Z tăng, nên Mg có độ âm điện nhỏ nhất."}, "c13-sai-3": {"d": 5.88, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "Si đứng sau Al trong chu kì 3 nên độ âm điện Si lớn hơn Al."}, "c13-sai-4": {"d": 5.856, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Mg đứng trước Al trong chu kì 3 nên độ âm điện Mg nhỏ hơn Al."}, "c13-vi-sao": {"d": 11.928, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "Cùng chu kì 3, điện tích hạt nhân tăng thì độ âm điện tăng: Si (1,90) > Al (1,61) > Mg (1,31)."}, "c14-1": {"d": 4.08, "s": "media/c14-1.mp3", "loai": "am", "chu": "Bạn đọc thầm khái niệm tính kim loại trên màn hình nhé."}, "c14-2": {"d": 5.76, "s": "media/c14-2.mp3", "loai": "am", "chu": "Nguyên tử càng dễ nhường electron để thành ion dương, tính kim loại càng mạnh."}, "c14-3": {"d": 7.176, "s": "media/c14-3.mp3", "loai": "am", "chu": "Ngược lại, tính phi kim là tính chất của nguyên tố mà nguyên tử dễ nhận electron để trở thành ion âm."}, "c14-4": {"d": 8.304, "s": "media/c14-4.mp3", "loai": "am", "chu": "Bây giờ mình cùng xem phim hai thí nghiệm trong SGK trang 38. Bạn dừng lại dự đoán khi phim hỏi nhé."}, "c16-1": {"d": 5.736, "s": "media/c16-1.mp3", "loai": "am", "chu": "Trong một chu kì, điện tích hạt nhân tăng, bán kính giảm, lực hút tăng."}, "c16-2": {"d": 7.32, "s": "media/c16-2.mp3", "loai": "am", "chu": "Nguyên tử khó nhường electron hơn, dễ nhận electron hơn: tính kim loại giảm, tính phi kim tăng."}, "c16-3": {"d": 5.472, "s": "media/c16-3.mp3", "loai": "am", "chu": "Trong một nhóm A, bán kính tăng nhanh và chiếm ưu thế, lực hút giảm."}, "c16-4": {"d": 5.712, "s": "media/c16-4.mp3", "loai": "am", "chu": "Nguyên tử dễ nhường electron hơn: tính kim loại tăng, tính phi kim giảm."}, "c16-5": {"d": 10.776, "s": "media/c16-5.mp3", "loai": "am", "chu": "Ví dụ: nhóm IA từ Li đến Cs, tính kim loại tăng. Nhóm VIIA từ F đến I, tính phi kim giảm."}, "c17-hoi": {"d": 7.92, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Potassium đứng dưới sodium trong nhóm một A. Bạn dự đoán potassium phản ứng với nước thế nào so với sodium?"}, "c17-sai-2": {"d": 7.464, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Trong nhóm A, tuy điện tích hạt nhân tăng nhưng bán kính tăng nhanh hơn, nên K nhường electron dễ hơn Na."}, "c17-sai-3": {"d": 6.576, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "Cùng nhóm nên tính chất tương tự, nhưng mức độ khác nhau: tính kim loại tăng dần từ trên xuống."}, "c17-sai-4": {"d": 7.032, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "K ở nhóm IA, là kim loại kiềm. Kim loại kiềm phản ứng với nước mãnh liệt."}, "c17-vi-sao": {"d": 10.776, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "Trong nhóm IA, từ Na xuống K, bán kính tăng, K dễ nhường electron hơn: tính kim loại K mạnh hơn Na, nên phản ứng với nước mãnh liệt hơn."}, "c18-hoi": {"d": 6.96, "s": "media/c18-hoi.mp3", "loai": "am", "chu": "Ở hình bên, chlorine đẩy được iodine ra khỏi dung dịch KI. Nếu thay bằng nước bromine thì sao?"}, "c18-sai-2": {"d": 7.704, "s": "media/c18-sai-2.mp3", "loai": "am", "chu": "Bromine ở dưới chlorine nhưng vẫn ở trên iodine trong nhóm VIIA, nên phi kim Br vẫn mạnh hơn I."}, "c18-sai-3": {"d": 6.888, "s": "media/c18-sai-3.mp3", "loai": "am", "chu": "Chất phi kim mạnh hơn mới đẩy được chất yếu hơn ra khỏi muối. I yếu hơn Br."}, "c18-sai-4": {"d": 8.424, "s": "media/c18-sai-4.mp3", "loai": "am", "chu": "Theo xu hướng nhóm VIIA: F > Cl > Br > I. Phi kim đứng trên mạnh hơn phi kim đứng dưới."}, "c18-vi-sao": {"d": 10.8, "s": "media/c18-vi-sao.mp3", "loai": "am", "chu": "Trong nhóm VIIA, tính phi kim giảm từ F đến I. Br đứng trên I nên tính phi kim mạnh hơn, đẩy được iodine ra khỏi dung dịch KI, dung dịch cũng chuyển màu."}, "c19-hoi": {"d": 7.2, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Thứ tự giảm dần tính kim loại của barium, magnesium, calcium, strontium là gì?"}, "c19-sai-1": {"d": 7.368, "s": "media/c19-sai-1.mp3", "loai": "am", "chu": "Bạn đang xếp ngược. Trong nhóm IIA, tính kim loại tăng từ trên xuống: Ba mạnh nhất."}, "c19-sai-3": {"d": 7.632, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "Sr (chu kì 5) ở dưới Ca (chu kì 4), nên tính kim loại Sr mạnh hơn Ca."}, "c19-sai-4": {"d": 8.424, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Bốn nguyên tố cùng nhóm IIA. Bạn xếp theo vị trí từ dưới lên: Ba, Sr, Ca, Mg."}, "c19-vi-sao": {"d": 16.152, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Mg, Ca, Sr, Ba cùng nhóm IIA, từ trên xuống. Bán kính tăng nhanh, lực hút với electron ngoài cùng giảm, càng dễ nhường electron: Ba > Sr > Ca > Mg."}, "c20-hoi": {"d": 7.896, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Trong các nguyên tố oxygen, fluorine, chlorine, selenium, nguyên tố nào có tính phi kim mạnh nhất?"}, "c20-sai-1": {"d": 5.496, "s": "media/c20-sai-1.mp3", "loai": "am", "chu": "O và F cùng chu kì 2, F đứng sau O nên phi kim F mạnh hơn."}, "c20-sai-3": {"d": 6.048, "s": "media/c20-sai-3.mp3", "loai": "am", "chu": "Se ở chu kì 4, phía dưới O trong nhóm VIA, nên phi kim yếu hơn O."}, "c20-sai-4": {"d": 5.136, "s": "media/c20-sai-4.mp3", "loai": "am", "chu": "Cl ở dưới F trong nhóm VIIA, nên phi kim yếu hơn F."}, "c20-vi-sao": {"d": 10.584, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "F ở góc trên bên phải (chu kì 2, nhóm VIIA): đứng sau O trong chu kì, đứng trên Cl trong nhóm. Nên F có tính phi kim mạnh nhất."}, "c21-hoi": {"d": 7.704, "s": "media/c21-hoi.mp3", "loai": "am", "chu": "Theo chiều tăng của điện tích hạt nhân, bạn xếp mỗi xu hướng vào đúng chỗ: trong một chu kì, hay trong một nhóm A."}, "c21-sai": {"d": 9.864, "s": "media/c21-sai.mp3", "loai": "am", "chu": "Bạn nhớ một mẹo: trong chu kì, nguyên tử co lại nên hút electron mạnh hơn. Trong nhóm, nguyên tử phình to nên hút yếu hơn."}, "c21-vi-sao": {"d": 12.264, "s": "media/c21-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Trong chu kì: bán kính giảm, độ âm điện tăng, phi kim tăng. Trong nhóm A: bán kính tăng, độ âm điện giảm, kim loại tăng."}, "c22-hoi": {"d": 8.304, "s": "media/c22-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Nguyên nhân sâu xa khiến tính chất các nguyên tố biến đổi tuần hoàn là gì?"}, "c22-sai-2": {"d": 6.216, "s": "media/c22-sai-2.mp3", "loai": "am", "chu": "Khối lượng tăng đều chứ không lặp lại, nên không giải thích được sự lặp lại tuần hoàn của tính chất."}, "c22-sai-3": {"d": 5.592, "s": "media/c22-sai-3.mp3", "loai": "am", "chu": "Tính chất hoá học do electron lớp ngoài cùng quyết định, không phải số neutron."}, "c22-sai-4": {"d": 4.584, "s": "media/c22-sai-4.mp3", "loai": "am", "chu": "Số lớp electron tăng dần theo chu kì, không bằng nhau."}, "c22-vi-sao": {"d": 14.064, "s": "media/c22-vi-sao.mp3", "loai": "am", "chu": "Khi điện tích hạt nhân tăng, cấu hình electron lớp ngoài cùng lặp lại sau mỗi chu kì. Cùng với sự thay đổi lực hút giữa hạt nhân và electron ngoài cùng, các tính chất biến đổi theo xu hướng trong chu kì và trong nhóm."}, "c23-1": {"d": 4.2, "s": "media/c23-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại theo chiều tăng của điện tích hạt nhân nhé."}, "c23-2": {"d": 5.448, "s": "media/c23-2.mp3", "loai": "am", "chu": "Trong một chu kì: bán kính nguyên tử giảm dần, độ âm điện tăng dần."}, "c23-3": {"d": 9.24, "s": "media/c23-3.mp3", "loai": "am", "chu": "Trong một chu kì: tính kim loại giảm dần, tính phi kim tăng dần. Số electron hoá trị nhóm A tăng từ 1 đến 8."}, "c23-4": {"d": 8.16, "s": "media/c23-4.mp3", "loai": "am", "chu": "Trong một nhóm A: bán kính nguyên tử tăng dần, độ âm điện giảm dần, tính kim loại tăng dần và tính phi kim giảm dần."}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 7.896, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong xu hướng biến đổi tính chất trong bảng tuần hoàn. Bạn bấm Chép kết quả để gửi cô Thơi nhé!"}, "phim-c15": {"d": 145.792, "s": "media/phim-c15.mp4", "loai": "phim", "chu": "", "poster": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIA     const o = H("input", "ten-o", hang); o.id = "ten-hs"; o.placeholder = "Tên em (không bắt buộc)"; o.maxLength = 40; o.autocomplete = "off";
    const h2 = H("div", "hang", box);
    const bc = H("button", "nut-sk chinh", h2, "📋 Chép kết quả gửi cô"); bc.type = "button";
    const bl = H("button", "nut-sk", h2, "↺ Học lại từ đầu"); bl.type = "button";
    const tb = H("div", "bao dung", box, "");
    bc.onclick = () => { const ten = o.value.trim(), now = new Date(), dd = x => String(x).padStart(2, "0");
      const txt = [`Kết quả bài e-learning «${BAI.tieu_de}» (${[BAI.mon, BAI.lop && "lớp " + BAI.lop, BAI.bai].filter(Boolean).join(", ")})`, ten ? `Học sinh: ${ten}` : null,
        n ? `Điểm đúng ngay lần đầu: ${so1(d)}/${so1(n)}` : "Đã xem hết bài", ...NHOM_DIEM.map(([ma, t, ks]) => `${ks.every(k => P.diem[k] === true) ? "✓" : "○"} ${t}: ${ks.filter(k => P.diem[k] === true).length}/${ks.length}`),
        `Hoàn thành lúc ${dd(now.getHours())}:${dd(now.getMinutes())} ngày ${dd(now.getDate())}/${dd(now.getMonth() + 1)}/${now.getFullYear()}`].filter(Boolean).join("\n");
      const xong = () => { tb.textContent = "Đã chép. Mở Zalo, dán vào tin nhắn gửi cô."; };
      const du = () => { const ta = H("textarea", "", document.body); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; ta.select();
        let ok = false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); if (ok) xong(); else { tb.style.whiteSpace = "pre-line"; tb.style.fontSize = "1.5cqw"; tb.textContent = "Chưa chép được. Thầy cô chép đoạn này:\n" + txt; } };
      try { navigator.clipboard.writeText(txt).then(xong, du); } catch(e){ du(); } };
    bl.onclick = () => { P.diem = {}; P.xong = new Set(); P.mo = 0; luu(); moCanh(0); };
    SC.ket(d, n);
    return { bat(){ noi("ket"); }, nhacLai(){ noi("ket"); } };
  },
};

/* ---------- điểm ---------- */
function khoaCua(c){
  if (c.loai === "chon" || c.loai === "dien") return [c.ma];
  if (c.loai === "noi") return c.trai.map((_, i) => c.ma + "-" + i);
  if (c.loai === "keo-tha") return c.the.map((_, i) => c.ma + "-" + i);
  if (c.loai === "quay-kim") return c.cau.map((_, i) => c.ma + "-" + i);
  return [];
}
const NHOM_DIEM = BAI.canh.map(c => [c.ma, c.ten, khoaCua(c)]).filter(x => x[2].length);
const KHOA_DIEM = NHOM_DIEM.flatMap(x => x[2]);
// mỗi hoạt động 1 điểm (chia đều cho các ô); câu khó đặt "diem" riêng trong bai.json
const TRONG = {}; for (const c of BAI.canh){ const ks = khoaCua(c); for (const k of ks) TRONG[k] = (c.diem ?? 1) / ks.length; }
const TONG_DIEM = KHOA_DIEM.reduce((a, k) => a + TRONG[k], 0);
const demDiem = () => KHOA_DIEM.reduce((a, k) => a + (P.diem[k] === true ? TRONG[k] : 0), 0);
const so1 = x => { const r = Math.round(x * 10) / 10; return String(r).replace(".", ","); };

/* ---------- SCORM 1.2 khi chạy trong hệ thống học trực tuyến; không thì lưu trên trình duyệt ---------- */
const SC = { api: null,
  tim(){ let w = window; for (let n = 0; n < 12 && w; n++){ try { if (w.API) return w.API; } catch(e){ break; } if (w.parent === w) break; w = w.parent; }
    try { if (window.opener && window.opener.API) return window.opener.API; } catch(e){} return null; },
  bat(){ this.api = this.tim(); if (!this.api) return null; try { this.api.LMSInitialize("");
      const st = this.api.LMSGetValue("cmi.core.lesson_status"); if (!st || st === "not attempted") this.api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      const sd = this.api.LMSGetValue("cmi.suspend_data"); return sd ? JSON.parse(sd) : null; } catch(e){ return null; } },
  dat(k, v){ if (this.api) try { this.api.LMSSetValue(k, String(v)); } catch(e){} },
  luu(){ if (this.api) try { this.api.LMSCommit(""); } catch(e){} },
  ket(d, n){ if (!this.api) return; this.dat("cmi.core.score.min", 0); this.dat("cmi.core.score.max", 100); this.dat("cmi.core.score.raw", n ? Math.round(d / n * 100) : 100);
    this.dat("cmi.core.lesson_status", "completed"); this.luu(); },
  dong(){ if (!this.api) return; this.luu(); try { this.api.LMSFinish(""); } catch(e){} this.api = null; }
};
const KHOA_LUU = "triway-el-" + (BAI.ma || BAI.tieu_de);
function luu(){ const du = JSON.stringify({i: P.i, mo: P.mo, xong: [...P.xong], diem: P.diem});
  if (SC.api){ SC.dat("cmi.suspend_data", du); SC.dat("cmi.core.lesson_location", P.i); SC.luu(); }
  try { localStorage.setItem(KHOA_LUU, du); } catch(e){} }
function doc(){ const s = SC.bat(); if (s) return s; try { const x = localStorage.getItem(KHOA_LUU); return x ? JSON.parse(x) : null; } catch(e){ return null; } }

/* ---------- trình phát ---------- */
const CANH = BAI.canh;
const P = { i: -1, t: 0, chay: false, toc: 1, cc: true, mo: 0, xong: new Set(), diem: {}, coXem: false, rt: null, nhip: -2, hen: null };
const GIAN = .45;
function lich(c){ let s = .5; const B = c.dong.map(d => { const m = MEDIA[d.id], dd = m ? m.d : 2; const b = {id: d.id, s, d: dd, e: s + dd};
    // kim đang quay thì chờ quay xong mới sang câu sau
    const q = d.dong_ho && d.dong_ho.quay != null ? .5 + Math.min(3.2, 1.6 + Math.abs(Number(d.dong_ho.quay)) / 30) + .5 : 0;
    s += Math.max(dd + GIAN + (d.sau || 0), q); return b; }); return {B, tong: s + .4}; }
function ghiDiem(k, ok){ if (!(k in P.diem)) P.diem[k] = ok; }
function xongCanh(i = P.i){ P.xong.add(i); P.mo = Math.max(P.mo, i + 1); luu(); veMenu(); veCham(); capNut(); if (i === P.i && i < CANH.length - 1) nutTiep.hidden = false; }
function moCanh(i, tuChay = true){
  im(); try { speechSynthesis.cancel(); } catch(e){} clearTimeout(P.hen); P.i = i; P.t = 0; P.nhip = -2; datPhuDe("");
  nen.innerHTML = ""; lop.innerHTML = ""; tren.innerHTML = ""; nutTiep.hidden = true; DONG = []; stage.dataset.bc = "";
  const c = CANH[i], rt = {tt: []}; P.rt = rt;
  if (CANH_XEM[c.loai]){ const l = lich(c); rt.B = l.B; rt.tong = l.tong; Object.assign(rt, DUNG[c.loai](c, l.B, rt)); P.chay = tuChay; rt.ve(0); }
  else { Object.assign(rt, DUNG[c.loai](c, null, rt)); P.chay = false; if (rt.bat) rt.bat(); }
  if (P.xong.has(i) && !CANH_XEM[c.loai] && c.loai !== "ket-qua" && i < CANH.length - 1) nutTiep.hidden = false;
  stage.classList.toggle("toi", !!rt.toi);
  veMenu(); veCham(); capNut(); veThanh(); luu();
  if (window.XUONG) XUONG.sauCanh(i);
}
function capNut(){ const c = CANH[P.i];
  $("#b-lui").disabled = P.i <= 0; $("#b-toi").disabled = !(P.i < CANH.length - 1 && (P.xong.has(P.i) || P.coXem));
  const xem = c && (CANH_XEM[c.loai] || c.loai === "phim");
  $("#b-chay").textContent = xem && P.chay ? "⏸" : "▶"; $("#b-chay").setAttribute("aria-label", !xem ? "Nghe lại câu hỏi" : P.chay ? "Dừng" : "Phát"); }
function dongBo(){ const B = P.rt.B; let k = -1; for (let j = 0; j < B.length; j++) if (P.t >= B[j].s && P.t < B[j].e){ k = j; break; }
  if (k !== P.nhip){ P.nhip = k; if (k >= 0 && P.chay && B[k].e - P.t > .15) phat(B[k].id, P.t - B[k].s); else im(); }
  datPhuDe(k >= 0 ? LOI[B[k].id] : ""); }
let truoc = performance.now(), nhipN = 0, nhipT = 0;   // nhịp khung hình: chậm quá (máy yếu) thì tắt nền chuyển động
function khung(now){
  const dt = Math.min(.1, (now - truoc) / 1000); truoc = now; const c = CANH[P.i], rt = P.rt;
  if (c && rt && CANH_XEM[c.loai]){
    if (P.chay){ P.t += dt * P.toc; if (P.t >= rt.tong){ P.t = rt.tong; P.chay = false; im(); capNut();
        if (!P.xong.has(P.i)) xongCanh(); else nutTiep.hidden = P.i >= CANH.length - 1;
        clearTimeout(P.hen); const i0 = P.i; P.hen = setTimeout(() => { if (P.i === i0 && !P.chay && P.t >= rt.tong && P.i < CANH.length - 1) moCanh(P.i + 1); }, 1500); } }
    dongBo(); rt.ve(P.t);
  }
  if (c) veThanh();
  doMo(now / 1000);
  if (rt) for (const tt of rt.tt) tt.ve(now / 1000, dangPhat(), (rt.vui ? rt.vui(P.t) : false) || now < (P.vuiDen || 0));
  if (rt && stage.classList.contains("toi") !== !!rt.toi) stage.classList.toggle("toi", !!rt.toi);
  if (DONG.length && !tatDong){ nhipN++; nhipT += dt; if (nhipN >= 150){ if (nhipT / nhipN > .05 && !document.hidden){ tatDong = true; DONG.forEach(g => g.remove()); DONG = []; } nhipN = 0; nhipT = 0; } }
  requestAnimationFrame(khung);
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function veThanh(){ const c = CANH[P.i], th = $("#thanh"), nh = $("#nhan-thanh"), ray = th.querySelector(".ray"), rt = P.rt;
  if (!c || !rt) return;
  const dat = (p, a, b) => { ray.hidden = false; nh.hidden = true; th.classList.remove("khoa"); th.querySelector(".day").style.width = p * 100 + "%"; th.querySelector(".num").style.left = p * 100 + "%"; th.setAttribute("aria-valuenow", Math.round(p * 100)); $("#gio").textContent = `${fmt(a)} / ${fmt(b)}`; };
  if (CANH_XEM[c.loai]){ dat(P.t / rt.tong, P.t, rt.tong);
    if (ray.dataset.moc !== String(P.i)){ ray.querySelectorAll(".moc").forEach(x => x.remove()); ray.dataset.moc = P.i; rt.B.forEach(b => { const m = H("i", "moc", ray); m.style.left = b.s / rt.tong * 100 + "%"; }); } return; }
  ray.querySelectorAll(".moc").forEach(x => x.remove()); ray.dataset.moc = "";
  if (c.loai === "phim" && rt.phim){ const v = rt.phim, d = v.duration || MEDIA[c.phim_id].d || 1; dat(cl(v.currentTime / d), v.currentTime, d); return; }
  ray.hidden = true; nh.hidden = false; th.classList.add("khoa");
  nh.textContent = c.loai === "ket-qua" ? "Hoàn thành bài học" : P.xong.has(P.i) ? "Đã làm xong · bấm Tiếp tục" : "Hoạt động · em làm xong để đi tiếp"; $("#gio").textContent = `Cảnh ${P.i + 1}/${CANH.length}`; }
function tua(p){ const c = CANH[P.i]; if (!c) return;
  if (c.loai === "phim" && P.rt.phim){ const v = P.rt.phim; if (v.duration) v.currentTime = cl(p) * v.duration; return; }
  if (!CANH_XEM[c.loai]) return; clearTimeout(P.hen); nutTiep.hidden = !P.xong.has(P.i) || P.i >= CANH.length - 1; P.t = cl(p) * P.rt.tong; P.nhip = -2; }
function veMenu(){ const ds = $("#ds"); ds.innerHTML = "";
  CANH.forEach((c, i) => { const li = H("li", "", ds), b = H("button", i === P.i ? "nay" : "", li); b.type = "button"; const xem = CANH_XEM[c.loai] || c.loai === "phim";
    const dai = CANH_XEM[c.loai] ? fmt(lich(c).tong) : c.loai === "phim" ? fmt(MEDIA[c.phim_id].d || 0) : "";
    b.innerHTML = `<span class="kieu ${xem ? "" : "lam"}">${xem ? "▶" : c.loai === "ket-qua" ? "★" : "✋"}</span><span>${esc(c.ten)}</span><span class="tt ${P.xong.has(i) ? "ok" : ""}">${P.xong.has(i) ? "✓" : (i <= P.mo || P.coXem) ? dai : "🔒"}</span>`;
    b.disabled = !(i <= P.mo || P.coXem); if (i === P.i) b.setAttribute("aria-current", "step"); b.onclick = () => moCanh(i); }); }
function veCham(){ const ch = $("#cham"); ch.innerHTML = ""; CANH.forEach((c, i) => { const b = H("b", P.xong.has(i) ? "xong" : "", ch); if (i === P.i) b.className = "nay"; b.title = c.ten; }); }

/* ---------- màn mở ---------- */
function coPhu(e){ const n = (BAI.tieu_de_phu || "").length; if (n > 30) e.style.fontSize = n > 42 ? "2.2cqw" : "2.5cqw"; }   // tiêu đề phụ dài: một dòng, không chồng nhãn bên dưới
function manMo(){
  P.i = -1; nen.innerHTML = ""; lop.innerHTML = ""; tren.innerHTML = ""; DONG = []; stage.dataset.bc = ""; const rt = {tt: []}; P.rt = rt;
  const c0 = CANH[0] && CANH[0].loai === "mo-dau" ? CANH[0] : {};
  VeNen(c0.nen || "cam", 3, {sac: c0.sac, chuyen_dong: c0.chuyen_dong}, true); stage.classList.toggle("toi", !!rt.toi); NguoiDan(rt, 1210, 450, 470);
  { const ds = [BAI.mon, BAI.lop && "Lớp " + BAI.lop, BAI.bo_sach, BAI.bai].filter(Boolean); if (ds.join(" · ").length > 48) ds.splice(ds.indexOf(BAI.bo_sach), BAI.bo_sach ? 1 : 0); O("may", 110, 140, 860, esc(ds.join(" · "))); }
  const td = O("", 110, 190, 900, `<h2 class="tde" style="font-size:${(BAI.tieu_de || "").length > 18 ? 4.2 : (BAI.tieu_de || "").length > 12 ? 5 : 7}cqw">${esc(BAI.tieu_de)}</h2>`);
  coPhu(O("tde2", 110, 315, 860, esc(BAI.tieu_de_phu || "")));
  const so = CANH.filter(c => !CANH_XEM[c.loai] && c.loai !== "phim" && c.loai !== "ket-qua").length;
  O("hang tho", 110, 410, 860, [BAI.thoi_luong && `<span class="chip">⏱ ${esc(BAI.thoi_luong)}</span>`, `<span class="chip">🔊 nên mở loa</span>`, so && `<span class="chip">✋ ${so} hoạt động</span>`].filter(Boolean).join(""));
  const h = O("hang", 110, 560, 860, "");
  const cu = doc(), batDau = i => moCanh(i);
  if (cu && cu.mo > 0 && cu.mo < CANH.length){ P.mo = cu.mo; P.xong = new Set(cu.xong || []); P.diem = cu.diem || {};
    const b = H("button", "nut-sk chinh", h, `▶ Học tiếp: ${esc(CANH[cu.mo].ten)}`); b.type = "button"; b.style.fontSize = "3cqw"; b.onclick = () => batDau(cu.mo);
    const l = H("button", "nut-sk", h, "Học lại từ đầu"); l.type = "button"; l.style.fontSize = "2.4cqw"; l.onclick = () => { P.mo = 0; P.xong = new Set(); P.diem = {}; batDau(0); }; }
  else { const b = H("button", "nut-sk chinh", h, "▶ Bắt đầu học"); b.type = "button"; b.style.fontSize = "3.4cqw"; b.style.padding = "1.4cqw 3.4cqw"; b.onclick = () => batDau(0); }
  veMenu(); veCham(); $("#b-lui").disabled = true; $("#b-toi").disabled = true; $("#gio").textContent = "0:00 / 0:00";
  if (window.XUONG) XUONG.sauCanh(-1);
}

/* ---------- điều khiển ---------- */
$("#b-chay").onclick = () => { const c = CANH[P.i]; if (!c){ moCanh(0); return; }
  if (c.loai === "phim"){ const v = P.rt.phim; if (v.paused){ v.play(); P.chay = true; } else { v.pause(); P.chay = false; } capNut(); return; }
  if (!CANH_XEM[c.loai]){ P.rt.nhacLai && P.rt.nhacLai(); return; }
  if (P.chay){ P.chay = false; im(); P.nhip = -2; } else { if (P.t >= P.rt.tong - .05) P.t = 0; clearTimeout(P.hen); P.chay = true; P.nhip = -2; }
  capNut(); };
$("#b-lai").onclick = () => { if (P.i < 0) return; const c = CANH[P.i]; if (CANH_XEM[c.loai]){ tua(0); P.chay = true; capNut(); } else moCanh(P.i); };
$("#b-lui").onclick = () => { if (P.i > 0) moCanh(P.i - 1); };
$("#b-toi").onclick = () => { if (P.i < CANH.length - 1 && (P.xong.has(P.i) || P.coXem)) moCanh(P.i + 1); };
nutTiep.onclick = () => { if (P.i < CANH.length - 1) moCanh(P.i + 1); };
$("#b-cc").onclick = e => { P.cc = !P.cc; e.currentTarget.classList.toggle("bat", P.cc); e.currentTarget.setAttribute("aria-pressed", P.cc); phude.hidden = !pdHt || !P.cc; };
$("#b-toc").onclick = e => { const ds = [1, 1.25, .75]; P.toc = ds[(ds.indexOf(P.toc) + 1) % ds.length]; e.currentTarget.textContent = P.toc + "×"; if (dangNoi && dangNoi.a.playbackRate != null) dangNoi.a.playbackRate = P.toc; if (P.rt && P.rt.phim) P.rt.phim.playbackRate = P.toc; };
$("#b-man").onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else $("#khung").requestFullscreen().catch(() => {}); } catch(e){} };
$("#co-xem").onchange = e => { P.coXem = e.target.checked; veMenu(); capNut(); };
const th = $("#thanh");
function tuaChuot(e){ const r = th.getBoundingClientRect(); tua((e.clientX - r.left) / r.width); }
th.addEventListener("pointerdown", e => { const c = CANH[P.i]; if (!c || !(CANH_XEM[c.loai] || c.loai === "phim")) return; th.setPointerCapture(e.pointerId); tuaChuot(e);
  const mv = ev => tuaChuot(ev), up = () => { th.removeEventListener("pointermove", mv); th.removeEventListener("pointerup", up); };
  th.addEventListener("pointermove", mv); th.addEventListener("pointerup", up); });
th.addEventListener("keydown", e => { if (!P.rt || !P.rt.tong) return; if (e.key === "ArrowRight") tua((P.t + 5) / P.rt.tong); if (e.key === "ArrowLeft") tua((P.t - 5) / P.rt.tong); });
document.addEventListener("keydown", e => { if (e.key === " " && !/INPUT|TEXTAREA|BUTTON|SELECT/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")){ e.preventDefault(); $("#b-chay").click(); } });
addEventListener("pagehide", () => { luu(); SC.dong(); });

/* ---------- khung chữ quanh bài ---------- */
document.title = BAI.tieu_de + (BAI.mon ? " · " + BAI.mon + (BAI.lop ? " " + BAI.lop : "") : "");
$("#ten-bai").textContent = BAI.tieu_de + (BAI.tieu_de_phu ? ": " + BAI.tieu_de_phu : "");
(() => { const v = $("#ve-noi-dung"), dong = [];
  dong.push(`<p><b>Bài:</b> ${esc([BAI.mon, BAI.lop && "lớp " + BAI.lop, BAI.bo_sach, BAI.bai].filter(Boolean).join(", "))}${BAI.trang_sgk ? " (" + esc(BAI.trang_sgk) + ")" : ""}.</p>`);
  if (BAI.yeu_cau_can_dat) dong.push(`<p><b>Yêu cầu cần đạt:</b> ${esc(BAI.yeu_cau_can_dat)}</p>`);
  const li = [];
  li.push(`${CANH.length} cảnh: ${CANH.filter(c => CANH_XEM[c.loai]).length} cảnh xem, ${NHOM_DIEM.length} hoạt động tự chấm.`);
  if (BAI.giong_ghi) li.push(esc(BAI.giong_ghi));
  li.push("Không thu thập dữ liệu, không gửi đi đâu. Tên học sinh (nếu nhập) chỉ nằm trên máy.");
  li.push("Nộp lên hệ thống học trực tuyến (Moodle…) bằng gói SCORM 1.2 kèm theo: hệ thống nhận điểm và trạng thái hoàn thành.");
  dong.push(`<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>`);
  const ng = [...(BAI.nguon || []), ...Object.entries(ANH).filter(([, a]) => a.nguon).map(([t, a]) => `Ảnh «${t}»: ${a.nguon}`)];
  if (ng.length) dong.push(`<p><b>Nguồn:</b></p><ul>${ng.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
  v.innerHTML = dong.join(""); })();

window.__TRIWAY_EL = { P, CANH, MEDIA, DO_TO, moMieng: () => MO_MIENG, moCanh, tua, demDiem, KHOA_DIEM, TRONG, TONG_DIEM, khoaCua, im, xongCanh, THAY_CO, PC, tatDong: () => { tatDong = true; DONG.forEach(g => g.remove()); DONG = []; } };
// Xưởng hình: chỉ bản web mở kèm #thay-co (gói SCORM không có đoạn mã xuong-hinh.js, XD = null)
if (THAY_CO && typeof XuongHinh === "function"){ try { window.XUONG = XuongHinh(); } catch(e){ console.warn("Xưởng hình chưa mở được:", e); } }
