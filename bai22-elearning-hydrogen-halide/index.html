<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai22-elearning-hydrogen-halide bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai22-elearning-hydrogen-halide', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

, miệng hé", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat-m-he.png", "loai": "nhan-vat"}, "nhan-vat-m-mo": {"ve": "Bạn Hạt Muối, miệng mở", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat-m-mo.png", "loai": "nhan-vat"}, "nhan-vat-vui": {"ve": "Bạn Hạt Muối giơ hai tay, có ngôi sao", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat-vui.png", "loai": "nhan-vat"}, "nhan-vat-nghi": {"ve": "Bạn Hạt Muối suy nghĩ, có dấu hỏi", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat-nghi.png", "loai": "nhan-vat"}}, "phong_cach": "thi-nghiem", "bang_mau": {"nen": "#F7FBF2", "chu": "#1F2937", "a1": "#4D7C0F", "a2": "#6D28D9", "a3": "#0F766E", "a4": "#BE185D", "the": "#FFFFFF", "ma": "rieng", "ten": "Halogen (vàng lục chlorine, tím iodine)"}, "nguon": ["Giáo viên: cô Nguyễn Thị Thơi, Tổ Hoá học, Trường THPT Lạng Giang số 1.", "Nội dung bám SGK Hoá học 10 (tr. 112–116), bộ Kết nối tri thức với cuộc sống, NXB Giáo dục Việt Nam. Số liệu Bảng 22.1, 22.2. Bảng, biểu đồ, dụng cụ do người soạn vẽ lại. Nhân vật «Bạn Hạt Muối» do người soạn vẽ bằng máy (dùng chung Bài 21).", "Đáp án Câu 1–8 đối chiếu SGV Hoá học 10 tr. 149–150. Phương án nhiễu và lời giải thích do người soạn viết."], "ghi_chu_duyet": ["Màu kết tủa AgCl (trắng), AgBr (vàng nhạt), AgI (vàng) và AgF tan: SGK tr. 115 chỉ ghi AgCl, AgBr, AgI không tan, không ghi màu; SGV không có đáp án thí nghiệm này. Người soạn dùng theo kiến thức hoá học phổ thông — nhờ thầy cô soát.", "SGV tr. 150 Câu 6 viết phương trình tạo Na₂SO₄ (2NaBr + 2H₂SO₄ ⟶ Na₂SO₄ + …), còn SGK tr. 115 viết tạo NaHSO₄ (2NaBr + 3H₂SO₄ ⟶ 2NaHSO₄ + …) → bài theo SGK.", "Câu hỏi mở đầu và hai thí nghiệm HCl (với Zn, Cu; với NaHCO₃): đáp án do người soạn viết theo phần kiến thức SGK và SGV Câu 4, 5 (Cu không phản ứng với HCl loãng là kiến thức dãy hoạt động kim loại đã học ở THCS).", "Câu 8b: 1 lít nước muối coi như khoảng 1 000 g → 9 g NaCl, khớp SGV «khoảng 9 gam»."], "loi_ket": "Bạn đã học xong Bài 22 rồi! Bạn bấm Chép kết quả để gửi cô Thơi nhé!", "canh": [{"ma": "c1", "loai": "mo-dau", "ten": "Chào bạn", "sgk": ["MD"], "minh_hoa": [{"chu": "Hydrogen halide", "luc": 2}, {"chu": "Hydrohalic acid", "luc": 2}, {"chu": "Muối halide", "luc": 2}], "dong": [{"id": "c1-1"}, {"id": "c1-2"}, {"sau": 1, "id": "c1-3"}, {"id": "c1-4"}]}, {"ma": "c2", "loai": "trinh-bay", "ten": "Cấu tạo phân tử HX", "nen": "xanh-la", "bo_cuc": "trai-phai", "sgk": ["1"], "hinh": {"anh": "b22-hx.png", "chu": "Số liệu Bảng 22.1, SGK tr. 112"}, "dong": [{"the": "HX: **1 liên kết cộng hoá trị**", "id": "c2-1"}, {"the": "Phân tử **phân cực**", "id": "c2-2"}, {"the": "Bảng 22.1: độ dài · năng lượng liên kết", "id": "c2-3"}]}, {"ma": "c3", "loai": "chon", "ten": "Câu 1: độ dài liên kết", "muc": "hieu", "yccd": [2], "sgk": ["1"], "hoi": "Câu 1. Từ HF đến HI, độ dài liên kết H–X", "noi": "Câu một: từ hát ép đến hát i, độ dài liên kết hát ích biến đổi thế nào, và vì sao?", "lua": [{"chu": "Giảm dần vì độ âm điện giảm", "giai": "Số liệu 92 → 160 pm cho thấy độ dài tăng, không giảm.", "sai_id": "c3-sai-1"}, {"chu": "Tăng dần vì bán kính X tăng", "dung": true}, {"chu": "Không đổi vì đều có 1 liên kết", "giai": "Cùng 1 liên kết nhưng nguyên tử X lớn dần nên liên kết dài dần.", "sai_id": "c3-sai-3"}, {"chu": "Tăng dần vì H lớn dần", "giai": "Nguyên tử H giống nhau trong cả bốn phân tử.", "sai_id": "c3-sai-4"}], "vi_sao": "Độ dài liên kết tăng dần từ HF (92 pm) đến HI (160 pm), chủ yếu do bán kính nguyên tử halogen tăng dần. Liên kết dài hơn thì kém bền hơn: năng lượng liên kết giảm từ 569 xuống 299 kJ/mol.", "hoi_id": "c3-hoi", "vi_sao_id": "c3-vi-sao"}, {"ma": "c4", "loai": "trinh-bay", "ten": "Nhiệt độ sôi của HX", "nen": "cam", "bo_cuc": "chia-doi", "sgk": ["2"], "hinh": {"anh": "b22-ts.png", "chu": "Số liệu Bảng 22.2, SGK tr. 113"}, "dong": [{"the": "Khí · tan tốt → **hydrohalic acid**", "id": "c4-1"}, {"the": "HF **+19,5** · HCl −84,9 · HBr −66,7 · HI −35,8", "id": "c4-2"}, {"the": "HF **bất thường**?", "id": "c4-3"}]}, {"ma": "c5", "loai": "chon", "ten": "Câu 2: vì sao HF sôi cao?", "muc": "hieu", "yccd": [1], "sgk": ["2"], "hoi": "Vì sao HF có nhiệt độ sôi cao bất thường so với HCl, HBr, HI?", "noi": "Câu hai: vì sao hát ép có nhiệt độ sôi cao bất thường so với các hát ích khác?", "lua": [{"chu": "Phân tử HF nặng nhất", "giai": "HF nhẹ nhất dãy.", "sai_id": "c5-sai-1"}, {"chu": "Có liên kết hydrogen", "dung": true}, {"chu": "Liên kết H–F dài nhất", "giai": "H–F ngắn nhất (92 pm).", "sai_id": "c5-sai-3"}, {"chu": "HF là chất rắn", "giai": "HF là chất khí ở điều kiện thường.", "sai_id": "c5-sai-4"}], "vi_sao": "Phân tử HF phân cực mạnh, tạo được liên kết hydrogen giữa các phân tử (H–F···H–F). Cần nhiều năng lượng để phá các liên kết này, nên HF sôi ở nhiệt độ cao bất thường.", "hoi_id": "c5-hoi", "vi_sao_id": "c5-vi-sao"}, {"ma": "c6", "loai": "chon", "ten": "Câu 2: từ HCl đến HI", "muc": "hieu", "yccd": [1], "sgk": ["2"], "hoi": "Từ HCl đến HI, nhiệt độ sôi tăng dần vì", "noi": "Từ hát clo đến hát i, nhiệt độ sôi tăng dần. Vì sao?", "lua": [{"chu": "Liên kết hydrogen mạnh dần", "giai": "HCl, HBr, HI không tạo liên kết hydrogen như HF.", "sai_id": "c6-sai-1"}, {"chu": "Liên kết H–X bền dần", "giai": "Năng lượng liên kết H–X giảm dần; khi sôi không phá liên kết H–X.", "sai_id": "c6-sai-2"}, {"chu": "Tương tác van der Waals tăng, khối lượng phân tử tăng", "dung": true}, {"chu": "Độ phân cực tăng dần", "giai": "Độ âm điện của X giảm dần nên độ phân cực giảm, không tăng.", "sai_id": "c6-sai-4"}], "vi_sao": "Từ HCl đến HI, khối lượng và kích thước phân tử tăng, lực tương tác van der Waals giữa các phân tử tăng, nên nhiệt độ sôi tăng dần.", "hoi_id": "c6-hoi", "vi_sao_id": "c6-vi-sao"}, {"ma": "c7", "loai": "trinh-bay", "ten": "Tính acid của hydrohalic acid", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["HĐ-kim-loai", "HĐ-NaHCO3"], "hinh": {"anh": "b22-tn-hcl.png", "chu": "Theo thí nghiệm SGK tr. 113–114"}, "dong": [{"the": "Tính acid: HF **yếu** → HI **rất mạnh**", "id": "c7-1"}, {"the": "① HCl + **Zn** · HCl + **Cu**", "id": "c7-2"}, {"the": "② HCl + **NaHCO₃**", "id": "c7-3"}, {"the": "Dự đoán: ống nào **có phản ứng**?", "id": "c7-4"}]}, {"ma": "c8", "loai": "keo-tha", "ten": "Chất nào phản ứng với HCl?", "muc": "van-dung", "yccd": [2], "sgk": ["HĐ-kim-loai", "4"], "hoi": "Xếp mỗi chất vào đúng nhóm khi cho tác dụng với dung dịch HCl loãng.", "noi": "Bạn xếp mỗi chất vào nhóm có phản ứng hoặc không phản ứng với dung dịch hát clo loãng nhé.", "nhom": ["Có phản ứng", "Không phản ứng"], "the": [{"chu": "Zn", "nhom": 0}, {"chu": "Cu", "nhom": 1}, {"chu": "Fe", "nhom": 0}, {"chu": "MgO", "nhom": 0}, {"chu": "Cu(OH)₂", "nhom": 0}, {"chu": "AgNO₃", "nhom": 0}, {"chu": "NaHCO₃", "nhom": 0}], "giai": "Cu đứng sau H trong dãy hoạt động hoá học nên không phản ứng với HCl loãng.", "vi_sao": "Có phản ứng: Zn, Fe (sinh khí H₂), MgO, Cu(OH)₂, AgNO₃ (tạo AgCl kết tủa), NaHCO₃ (sinh khí CO₂). Không phản ứng: Cu.", "hoi_id": "c8-hoi", "sai_id": "c8-sai", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "chon", "ten": "Câu 3: thu vàng tinh khiết", "muc": "van-dung", "yccd": [2], "sgk": ["3"], "hoi": "Câu 3. Chất rắn gồm vàng và kẽm. Cách thu vàng tinh khiết là", "noi": "Câu ba: ở nhà máy sản xuất vàng, thu được chất rắn gồm vàng và kẽm. Bạn đề xuất cách thu vàng tinh khiết.", "lua": [{"chu": "Ngâm trong dung dịch HCl dư", "dung": true}, {"chu": "Ngâm trong nước", "giai": "Kẽm không tan trong nước.", "sai_id": "c9-sai-2"}, {"chu": "Đun nóng chảy hỗn hợp", "giai": "Đun chảy chỉ trộn đều kim loại, không tách được kẽm.", "sai_id": "c9-sai-3"}, {"chu": "Ngâm trong dung dịch NaCl", "giai": "NaCl không hoà tan được kẽm.", "sai_id": "c9-sai-4"}], "vi_sao": "Kẽm tan trong dung dịch HCl (Zn + 2HCl ⟶ ZnCl₂ + H₂), còn vàng không phản ứng. Lọc lấy phần rắn còn lại là vàng.", "hoi_id": "c9-hoi", "vi_sao_id": "c9-vi-sao"}, {"ma": "c10", "loai": "chon", "ten": "So sánh HCl và H₂CO₃", "muc": "hieu", "yccd": [2], "sgk": ["HĐ-NaHCO3"], "hoi": "HCl + NaHCO₃ ⟶ NaCl + CO₂↑ + H₂O. Phản ứng xảy ra chứng tỏ", "noi": "Hát clo tác dụng với na tri hi đờ rô các bô nát, sinh khí xê ô hai. Phản ứng xảy ra chứng tỏ điều gì?", "lua": [{"chu": "H₂CO₃ có tính acid mạnh hơn HCl", "giai": "Ngược rồi: acid mạnh đẩy acid yếu ra khỏi muối.", "sai_id": "c10-sai-1"}, {"chu": "HCl có tính acid mạnh hơn H₂CO₃", "dung": true}, {"chu": "HCl có tính khử mạnh", "giai": "Phản ứng này là phản ứng trao đổi, không có thay đổi số oxi hoá.", "sai_id": "c10-sai-3"}, {"chu": "NaHCO₃ là acid mạnh", "giai": "NaHCO₃ là muối.", "sai_id": "c10-sai-4"}], "vi_sao": "HCl đẩy được H₂CO₃ (phân huỷ thành CO₂ và H₂O) ra khỏi muối carbonate, chứng tỏ tính acid của HCl mạnh hơn H₂CO₃.", "hoi_id": "c10-hoi", "vi_sao_id": "c10-vi-sao"}, {"ma": "c11", "loai": "noi", "ten": "Câu 4: sản phẩm với HCl", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hoi": "Câu 4. Nối mỗi chất với muối tạo thành khi tác dụng với HCl.", "noi": "Câu bốn: bạn nối mỗi chất ở trên với muối tạo thành khi tác dụng với a xít clo hi đríc ở dưới nhé. Cẩn thận với sắt!", "giai": "Fe tác dụng với HCl chỉ tạo muối iron(II): FeCl₂, không tạo FeCl₃.", "vi_sao": "Fe + 2HCl ⟶ FeCl₂ + H₂; MgO + 2HCl ⟶ MgCl₂ + H₂O; Cu(OH)₂ + 2HCl ⟶ CuCl₂ + 2H₂O; AgNO₃ + HCl ⟶ AgCl↓ + HNO₃.", "phai": ["FeCl₃", "FeCl₂", "AgCl↓", "MgCl₂", "CuCl₂"], "trai": [{"chu": "Fe"}, {"chu": "MgO"}, {"chu": "Cu(OH)₂"}, {"chu": "AgNO₃"}], "dap": [1, 3, 4, 2], "hoi_id": "c11-hoi", "sai_id": "c11-sai", "vi_sao_id": "c11-vi-sao", "sai_rieng": {}}, {"ma": "c12", "loai": "trinh-bay", "ten": "Tính khử và ứng dụng", "nen": "kem", "bo_cuc": "chia-doi", "sgk": ["5"], "hinh": {"anh": "b22-ung-dung.png", "chu": "Theo SGK tr. 114–115"}, "dong": [{"the": "Còn có **tính khử**: HCl + KMnO₄ ⟶ … Cl₂", "id": "c12-1"}, {"the": "HF: **teflon** · ăn mòn **thuỷ tinh**", "id": "c12-2"}, {"the": "HCl: **tẩy gỉ**, sản xuất hoá chất", "id": "c12-3"}]}, {"ma": "c13", "loai": "chon", "ten": "Câu 5: tẩy gỉ dựa vào đâu?", "muc": "hieu", "yccd": [5], "sgk": ["5", "MD"], "hoi": "Câu 5. HCl đánh sạch lớp oxide, hydroxide, muối carbonate trên kim loại nhờ", "noi": "Câu năm: a xít clo hi đríc đánh sạch lớp ô xít, hi đờ rô xít, muối các bô nát bám trên bề mặt kim loại nhờ tính chất nào?", "lua": [{"chu": "Tính khử", "giai": "Oxide, hydroxide, carbonate bị hoà tan do phản ứng với acid, không phải bị khử.", "sai_id": "c13-sai-1"}, {"chu": "Tính acid mạnh", "dung": true}, {"chu": "Tính oxi hoá mạnh", "giai": "HCl không có tính oxi hoá mạnh.", "sai_id": "c13-sai-3"}, {"chu": "Dễ bay hơi", "giai": "Dễ bay hơi không giúp hoà tan lớp gỉ.", "sai_id": "c13-sai-4"}], "vi_sao": "HCl là acid mạnh, phản ứng với oxide, hydroxide, muối carbonate tạo muối chloride tan, nên lớp gỉ bị hoà tan, bề mặt kim loại sạch.", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Đựng HF trong bình gì?", "muc": "van-dung", "yccd": [5], "sgk": ["5"], "hoi": "Vì sao không đựng hydrofluoric acid trong chai thuỷ tinh?", "noi": "Vì sao không đựng a xít phờ lo hi đríc trong chai thuỷ tinh?", "lua": [{"chu": "Vì HF là acid rất mạnh", "giai": "HF là acid yếu nhất dãy.", "sai_id": "c14-sai-1"}, {"chu": "Vì HF phản ứng với SiO₂ trong thuỷ tinh", "dung": true}, {"chu": "Vì HF dễ cháy", "giai": "Lí do là HF ăn mòn thuỷ tinh.", "sai_id": "c14-sai-3"}, {"chu": "Vì HF làm thuỷ tinh đổi màu", "giai": "HF hoà tan thuỷ tinh chứ không chỉ đổi màu.", "sai_id": "c14-sai-4"}], "vi_sao": "HF ăn mòn thuỷ tinh do phản ứng SiO₂ + 4HF ⟶ SiF₄ + 2H₂O. Vì vậy hydrofluoric acid phải đựng trong bình nhựa.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "trinh-bay", "ten": "Muối halide, nhận biết ion halide", "nen": "tim", "bo_cuc": "trai-phai", "sgk": ["HĐ-nhan-biet"], "hinh": {"anh": "b22-agno3.png", "chu": "Theo thí nghiệm SGK tr. 115"}, "dong": [{"the": "AgCl, AgBr, AgI **không tan**", "id": "c15-1"}, {"the": "NaF · NaCl · NaBr · NaI + **AgNO₃**", "id": "c15-2"}, {"the": "Màu kết tủa **khác nhau**", "id": "c15-3"}]}, {"ma": "c16", "lo const MEDIA = /*__MEDIA__*/{"c1-1": {"d": 4.656, "s": "media/c1-1.mp3", "loai": "am", "chu": "Chào các bạn! Hạt Muối lại gặp các bạn rồi!"}, "c1-2": {"d": 6.048, "s": "media/c1-2.mp3", "loai": "am", "chu": "Hôm nay mình cùng cô Thơi học Bài 22: Hydrogen halide và muối halide."}, "c1-3": {"d": 12.312, "s": "media/c1-3.mp3", "loai": "am", "chu": "Trong nhà máy thép, người ta cho thép đi qua bể dung dịch HCl để tẩy sạch gỉ sét trước khi sơn, hàn, mạ. Việc này dựa vào tính chất quan trọng nào của hydrochloric acid?"}, "c1-4": {"d": 4.32, "s": "media/c1-4.mp3", "loai": "am", "chu": "Cuối bài, bạn sẽ tự trả lời được câu hỏi này nhé."}, "c2-1": {"d": 6.624, "s": "media/c2-1.mp3", "loai": "am", "chu": "Phân tử hydrogen halide HX gồm một liên kết cộng hoá trị giữa H và X."}, "c2-2": {"d": 8.712, "s": "media/c2-2.mp3", "loai": "am", "chu": "Halogen có độ âm điện lớn hơn H, cặp electron lệch về X, nên các phân tử HX là phân tử phân cực."}, "c2-3": {"d": 16.44, "s": "media/c2-3.mp3", "loai": "am", "chu": "Bảng 22.1 cho độ dài liên kết: 92, 127, 141, 160 pm; năng lượng liên kết: 569, 432, 366, 299 kJ/mol."}, "c3-hoi": {"d": 6.96, "s": "media/c3-hoi.mp3", "loai": "am", "chu": "Câu một: từ hát ép đến hát i, độ dài liên kết hát ích biến đổi thế nào, và vì sao?"}, "c3-sai-1": {"d": 5.736, "s": "media/c3-sai-1.mp3", "loai": "am", "chu": "Số liệu 92 → 160 pm cho thấy độ dài tăng, không giảm."}, "c3-sai-3": {"d": 4.608, "s": "media/c3-sai-3.mp3", "loai": "am", "chu": "Cùng 1 liên kết nhưng nguyên tử X lớn dần nên liên kết dài dần."}, "c3-sai-4": {"d": 3.696, "s": "media/c3-sai-4.mp3", "loai": "am", "chu": "Nguyên tử H giống nhau trong cả bốn phân tử."}, "c3-vi-sao": {"d": 18.288, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Độ dài liên kết tăng dần từ HF (92 pm) đến HI (160 pm), chủ yếu do bán kính nguyên tử halogen tăng dần. Liên kết dài hơn thì kém bền hơn: năng lượng liên kết giảm từ 569 xuống 299 kJ/mol."}, "c4-1": {"d": 7.608, "s": "media/c4-1.mp3", "loai": "am", "chu": "Ở điều kiện thường, hydrogen halide là chất khí, tan tốt trong nước tạo dung dịch hydrohalic acid."}, "c4-2": {"d": 10.608, "s": "media/c4-2.mp3", "loai": "am", "chu": "Nhiệt độ sôi: HF dương 19,5 độ; HCl âm 84,9; HBr âm 66,7; HI âm 35,8 độ C."}, "c4-3": {"d": 6.168, "s": "media/c4-3.mp3", "loai": "am", "chu": "Bạn thấy HF khác hẳn các chất còn lại không? Mình cùng giải thích nhé!"}, "c5-hoi": {"d": 5.904, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Câu hai: vì sao hát ép có nhiệt độ sôi cao bất thường so với các hát ích khác?"}, "c5-sai-1": {"d": 2.496, "s": "media/c5-sai-1.mp3", "loai": "am", "chu": "HF nhẹ nhất dãy."}, "c5-sai-3": {"d": 3.984, "s": "media/c5-sai-3.mp3", "loai": "am", "chu": "H–F ngắn nhất (92 pm)."}, "c5-sai-4": {"d": 3.408, "s": "media/c5-sai-4.mp3", "loai": "am", "chu": "HF là chất khí ở điều kiện thường."}, "c5-vi-sao": {"d": 13.536, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Phân tử HF phân cực mạnh, tạo được liên kết hydrogen giữa các phân tử (H–F···H–F). Cần nhiều năng lượng để phá các liên kết này, nên HF sôi ở nhiệt độ cao bất thường."}, "c6-hoi": {"d": 5.784, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Từ hát clo đến hát i, nhiệt độ sôi tăng dần. Vì sao?"}, "c6-sai-1": {"d": 5.736, "s": "media/c6-sai-1.mp3", "loai": "am", "chu": "HCl, HBr, HI không tạo liên kết hydrogen như HF."}, "c6-sai-2": {"d": 5.328, "s": "media/c6-sai-2.mp3", "loai": "am", "chu": "Năng lượng liên kết H–X giảm dần; khi sôi không phá liên kết H–X."}, "c6-sai-4": {"d": 4.92, "s": "media/c6-sai-4.mp3", "loai": "am", "chu": "Độ âm điện của X giảm dần nên độ phân cực giảm, không tăng."}, "c6-vi-sao": {"d": 9.192, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Từ HCl đến HI, khối lượng và kích thước phân tử tăng, lực tương tác van der Waals giữa các phân tử tăng, nên nhiệt độ sôi tăng dần."}, "c7-1": {"d": 10.176, "s": "media/c7-1.mp3", "loai": "am", "chu": "Trong dãy hydrohalic acid, tính acid tăng từ hydrofluoric acid, là acid yếu, đến hydroiodic acid, là acid rất mạnh."}, "c7-2": {"d": 7.824, "s": "media/c7-2.mp3", "loai": "am", "chu": "Thí nghiệm 1: cho vài hạt Zn vào ống 1, vài lá Cu vào ống 2, mỗi ống khoảng 2 mL HCl loãng."}, "c7-3": {"d": 7.512, "s": "media/c7-3.mp3", "loai": "am", "chu": "Thí nghiệm 2: cho một thìa nhỏ NaHCO₃ rắn vào ống nghiệm, thêm dung dịch HCl loãng."}, "c7-4": {"d": 3.648, "s": "media/c7-4.mp3", "loai": "am", "chu": "Bạn dự đoán xem ống nào có phản ứng nhé!"}, "c8-hoi": {"d": 5.688, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Bạn xếp mỗi chất vào nhóm có phản ứng hoặc không phản ứng với dung dịch hát clo loãng nhé."}, "c8-sai": {"d": 5.472, "s": "media/c8-sai.mp3", "loai": "am", "chu": "Cu đứng sau H trong dãy hoạt động hoá học nên không phản ứng với HCl loãng."}, "c8-vi-sao": {"d": 15.672, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Có phản ứng: Zn, Fe (sinh khí H₂), MgO, Cu(OH)₂, AgNO₃ (tạo AgCl kết tủa), NaHCO₃ (sinh khí CO₂). Không phản ứng: Cu."}, "c9-hoi": {"d": 8.568, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Câu ba: ở nhà máy sản xuất vàng, thu được chất rắn gồm vàng và kẽm. Bạn đề xuất cách thu vàng tinh khiết."}, "c9-sai-2": {"d": 2.376, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "Kẽm không tan trong nước."}, "c9-sai-3": {"d": 4.224, "s": "media/c9-sai-3.mp3", "loai": "am", "chu": "Đun chảy chỉ trộn đều kim loại, không tách được kẽm."}, "c9-sai-4": {"d": 3.36, "s": "media/c9-sai-4.mp3", "loai": "am", "chu": "NaCl không hoà tan được kẽm."}, "c9-vi-sao": {"d": 10.68, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Kẽm tan trong dung dịch HCl (Zn + 2HCl ⟶ ZnCl₂ + H₂), còn vàng không phản ứng. Lọc lấy phần rắn còn lại là vàng."}, "c10-hoi": {"d": 8.616, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Hát clo tác dụng với na tri hi đờ rô các bô nát, sinh khí xê ô hai. Phản ứng xảy ra chứng tỏ điều gì?"}, "c10-sai-1": {"d": 4.392, "s": "media/c10-sai-1.mp3", "loai": "am", "chu": "Ngược rồi: acid mạnh đẩy acid yếu ra khỏi muối."}, "c10-sai-3": {"d": 5.352, "s": "media/c10-sai-3.mp3", "loai": "am", "chu": "Phản ứng này là phản ứng trao đổi, không có thay đổi số oxi hoá."}, "c10-sai-4": {"d": 3.528, "s": "media/c10-sai-4.mp3", "loai": "am", "chu": "NaHCO₃ là muối."}, "c10-vi-sao": {"d": 10.488, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "HCl đẩy được H₂CO₃ (phân huỷ thành CO₂ và H₂O) ra khỏi muối carbonate, chứng tỏ tính acid của HCl mạnh hơn H₂CO₃."}, "c11-hoi": {"d": 9.072, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Câu bốn: bạn nối mỗi chất ở trên với muối tạo thành khi tác dụng với a xít clo hi đríc ở dưới nhé. Cẩn thận với sắt!"}, "c11-sai": {"d": 6.888, "s": "media/c11-sai.mp3", "loai": "am", "chu": "Fe tác dụng với HCl chỉ tạo muối iron(II): FeCl₂, không tạo FeCl₃."}, "c11-vi-sao": {"d": 15.312, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Fe + 2HCl ⟶ FeCl₂ + H₂; MgO + 2HCl ⟶ MgCl₂ + H₂O; Cu(OH)₂ + 2HCl ⟶ CuCl₂ + 2H₂O; AgNO₃ + HCl ⟶ AgCl↓ + HNO₃."}, "c12-1": {"d": 8.232, "s": "media/c12-1.mp3", "loai": "am", "chu": "Ngoài tính acid, hydrohalic acid còn có tính khử, ví dụ HCl đặc khử KMnO₄ giải phóng Cl₂."}, "c12-2": {"d": 9.936, "s": "media/c12-2.mp3", "loai": "am", "chu": "Hydrogen fluoride dùng sản xuất teflon chống dính. Hydrofluoric acid ăn mòn thuỷ tinh vì phản ứng với SiO₂."}, "c12-3": {"d": 8.208, "s": "media/c12-3.mp3", "loai": "am", "chu": "Hydrochloric acid dùng tẩy gỉ sắt thép, sản xuất nhiều hợp chất vô cơ, hữu cơ, tái sinh nhựa trao đổi ion."}, "c13-hoi": {"d": 8.544, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Câu năm: a xít clo hi đríc đánh sạch lớp ô xít, hi đờ rô xít, muối các bô nát bám trên bề mặt kim loại nhờ tính chất nào?"}, "c13-sai-1": {"d": 6.648, "s": "media/c13-sai-1.mp3", "loai": "am", "chu": "Oxide, hydroxide, carbonate bị hoà tan do phản ứng với acid, không phải bị khử."}, "c13-sai-3": {"d": 3.456, "s": "media/c13-sai-3.mp3", "loai": "am", "chu": "HCl không có tính oxi hoá mạnh."}, "c13-sai-4": {"d": 3.432, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Dễ bay hơi không giúp hoà tan lớp gỉ."}, "c13-vi-sao": {"d": 10.248, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "HCl là acid mạnh, phản ứng với oxide, hydroxide, muối carbonate tạo muối chloride tan, nên lớp gỉ bị hoà tan, bề mặt kim loại sạch."}, "c14-hoi": {"d": 4.44, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Vì sao không đựng a xít phờ lo hi đríc trong chai thuỷ tinh?"}, "c14-sai-1": {"d": 3.216, "s": "media/c14-sai-1.mp3", "loai": "am", "chu": "HF là acid yếu nhất dãy."}, "c14-sai-3": {"d": 3.456, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "Lí do là HF ăn mòn thuỷ tinh."}, "c14-sai-4": {"d": 3.792, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "HF hoà tan thuỷ tinh chứ không chỉ đổi màu."}, "c14-vi-sao": {"d": 10.32, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "HF ăn mòn thuỷ tinh do phản ứng SiO₂ + 4HF ⟶ SiF₄ + 2H₂O. Vì vậy hydrofluoric acid phải đựng trong bình nhựa."}, "c15-1": {"d": 9.768, "s": "media/c15-1.mp3", "loai": "am", "chu": "Hầu hết muối halide dễ tan trong nước, trừ silver chloride, silver bromide, silver iodide không tan, và một số muối ít tan như lead chloride."}, "c15-2": {"d": 11.448, "s": "media/c15-2.mp3", "loai": "am", "chu": "Thí nghiệm: cho 2 mL mỗi dung dịch NaF, NaCl, NaBr, NaI vào từng ống nghiệm, rồi nhỏ vài giọt AgNO₃."}, "c15-3": {"d": 6.552, "s": "media/c15-3.mp3", "loai": "am", "chu": "Ion halide kết hợp với ion bạc tạo kết tủa có màu khác nhau, nhờ đó ta phân biệt được."}, "c16-hoi": {"d": 5.616, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Bạn xếp mỗi dung dịch muối vào đúng hiện tượng quan sát được khi nhỏ bạc ni trát nhé."}, "c16-sai": {"d": 6.744, "s": "media/c16-sai.mp3", "loai": "am", "chu": "AgF tan; AgCl trắng; AgBr vàng nhạt; AgI vàng."}, "c16-vi-sao": {"d": 15.336, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "NaF: không có kết tủa (AgF tan). NaCl + AgNO₃ ⟶ AgCl↓ trắng + NaNO₃; NaBr tạo AgBr↓ vàng nhạt; NaI tạo AgI↓ vàng."}, "c17-hoi": {"d": 2.376, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Phương trình nào viết đúng?"}, "c17-sai-1": {"d": 4.248, "s": "media/c17-sai-1.mp3", "loai": "am", "chu": "AgF tan trong nước, không tạo kết tủa."}, "c17-sai-3": {"d": 3.888, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "Kết tủa là AgCl, còn NaNO₃ tan."}, "c17-sai-4": {"d": 5.928, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Ag có hoá trị I: công thức là AgI, hệ số 1 : 1."}, "c17-vi-sao": {"d": 8.664, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "NaX + AgNO₃ ⟶ AgX↓ + NaNO₃ với X là Cl, Br, I. Riêng NaF không phản ứng tạo kết tủa."}, "c18-1": {"d": 7.632, "s": "media/c18-1.mp3", "loai": "am", "chu": "NaCl tác dụng với sulfuric acid đặc chỉ xảy ra phản ứng trao đổi, tạo hydrogen chloride."}, "c18-2": {"d": 6.576, "s": "media/c18-2.mp3", "loai": "am", "chu": "Sodium bromide khử được sulfuric acid đặc thành sulfur dioxide, giải phóng Br₂."}, "c18-3": {"d": 6.984, "s": "media/c18-3.mp3", "loai": "am", "chu": "Sodium iodide khử được sulfuric acid đặc xuống tận hydrogen sulfide, giải phóng I₂."}, "c18-4": {"d": 7.008, "s": "media/c18-4.mp3", "loai": "am", "chu": "Vậy tính khử của các ion halide tăng dần theo thứ tự Cl⁻, Br⁻, I⁻."}, "c19-hoi": {"d": 7.56, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Câu sáu: khi phản ứng với a xít sun phu rích đặc, na tri brô mua và na tri i ốt đua đóng vai trò gì?"}, "c19-sai-2": {"d": 6.264, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "Br⁻ lên Br₂, I⁻ lên I₂: số oxi hoá tăng, nhường electron."}, "c19-sai-3": {"d": 5.736, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "NaBr, NaI bị biến đổi thành chất khác sau phản ứng."}, "c19-sai-4": {"d": 4.416, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Chúng trực tiếp nhường electron, không chỉ là môi trường."}, "c19-vi-sao": {"d": 17.256, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Br⁻ (−1) ⟶ Br₂ (0), I⁻ (−1) ⟶ I₂ (0): nhường electron nên NaBr, NaI là chất khử; H₂SO₄ đặc là chất oxi hoá (S +6 xuống +4 trong SO₂ hoặc −2 trong H₂S)."}, "c20-hoi": {"d": 7.2, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Muối nào khử được a xít sun phu rích đặc xuống hi đờ rô sun phua, là số oxi hoá thấp nhất của lưu huỳnh?"}, "c20-sai-1": {"d": 5.52, "s": "media/c20-sai-1.mp3", "loai": "am", "chu": "NaCl không khử được H₂SO₄ đặc, chỉ phản ứng trao đổi."}, "c20-sai-2": {"d": 5.016, "s": "media/c20-sai-2.mp3", "loai": "am", "chu": "NaBr chỉ khử H₂SO₄ đặc đến SO₂."}, "c20-sai-4": {"d": 2.904, "s": "media/c20-sai-4.mp3", "loai": "am", "chu": "Ion F⁻ có tính khử yếu nhất."}, "c20-vi-sao": {"d": 10.464, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "I⁻ có tính khử mạnh nhất trong dãy, khử được H₂SO₄ đặc xuống H₂S. Tính khử tăng dần Cl⁻ < Br⁻ < I⁻."}, "c21-1": {"d": 5.856, "s": "media/c21-1.mp3", "loai": "am", "chu": "Muối ăn giúp cơ thể cân bằng điện giải, dẫn truyền xung thần kinh, trao đổi chất."}, "c21-2": {"d": 9.624, "s": "media/c21-2.mp3", "loai": "am", "chu": "Muối ăn dùng bảo quản, chế biến thực phẩm; sản xuất nước muối sinh lí, dịch truyền; là nguyên liệu sản xuất xút, chlorine, nước Javel."}, "c21-3": {"d": 6.768, "s": "media/c21-3.mp3", "loai": "am", "chu": "Muối ăn thô từ ruộng muối lẫn muối của magnesium, calcium, nên phải kết tinh lại để tinh chế."}, "c22-hoi": {"d": 4.656, "s": "media/c22-hoi.mp3", "loai": "am", "chu": "Câu bảy: vì sao không dùng trực tiếp nước biển để tưới cây?"}, "c22-sai-1": {"d": 2.544, "s": "media/c22-sai-1.mp3", "loai": "am", "chu": "Màu không phải lí do."}, "c22-sai-3": {"d": 2.928, "s": "media/c22-sai-3.mp3", "loai": "am", "chu": "Nhiệt độ không phải lí do chính."}, "c22-sai-4": {"d": 4.68, "s": "media/c22-sai-4.mp3", "loai": "am", "chu": "Trong nước biển có ion chloride, không phải khí chlorine."}, "c22-vi-sao": {"d": 12.504, "s": "media/c22-vi-sao.mp3", "loai": "am", "chu": "Nước biển có khoảng 3% NaCl và các muối khác: dung dịch ưu trương. Do thẩm thấu, nước trong tế bào cây thoát ra ngoài, làm cây mất nước thay vì được bổ sung nước."}, "c23-hoi": {"d": 6.768, "s": "media/c23-hoi.mp3", "loai": "am", "chu": "Câu tám a: loại nước muối sinh lí nào cần vô trùng tuyệt đối và phải dùng theo chỉ định của bác sĩ?"}, "c23-sai-1": {"d": 2.928, "s": "media/c23-sai-1.mp3", "loai": "am", "chu": "Súc miệng không đưa thẳng vào máu."}, "c23-sai-3": {"d": 6.576, "s": "media/c23-sai-3.mp3", "loai": "am", "chu": "Vẫn cần sạch, nhưng loại đưa thẳng vào mạch máu mới cần vô trùng tuyệt đối, theo chỉ định bác sĩ."}, "c23-sai-4": {"d": 3.192, "s": "media/c23-sai-4.mp3", "loai": "am", "chu": "Nhỏ mũi không đi thẳng vào mạch máu."}, "c23-vi-sao": {"d": 7.368, "s": "media/c23-vi-sao.mp3", "loai": "am", "chu": "Nước muối dùng tiêm truyền tĩnh mạch đi thẳng vào máu, nên cần vô trùng tuyệt đối và phải dùng theo chỉ định của bác sĩ."}, "c24-hoi": {"d": 7.608, "s": "media/c24-hoi.mp3", "loai": "am", "chu": "Câu tám b: để pha một lít nước muối sinh lí không phẩy chín phần trăm dùng súc miệng, cần khoảng bao nhiêu gam muối ăn?"}, "c24-sai": {"d": 5.976, "s": "media/c24-sai.mp3", "loai": "am", "chu": "1 lít nước muối có khối lượng khoảng 1 000 g. Lấy 0,9% của 1 000 g."}, "c24-vi-sao": {"d": 6.096, "s": "media/c24-vi-sao.mp3", "loai": "am", "chu": "m(NaCl) ≈ 1 000 · 0,9 : 100 = 9 g."}, "c25-hoi": {"d": 6.624, "s": "media/c25-hoi.mp3", "loai": "am", "chu": "Quay lại câu hỏi đầu bài: bể a xít clo hi đríc tẩy gỉ sét trên thép dựa vào tính chất nào?"}, "c25-sai-2": {"d": 6.12, "s": "media/c25-sai-2.mp3", "loai": "am", "chu": "HCl không có tính oxi hoá mạnh; gỉ sét bị hoà tan do phản ứng acid – base."}, "c25-sai-3": {"d": 2.88, "s": "media/c25-sai-3.mp3", "loai": "am", "chu": "Dễ bay hơi không giúp tẩy gỉ."}, "c25-sai-4": {"d": 4.296, "s": "media/c25-sai-4.mp3", "loai": "am", "chu": "Đó là đặc điểm của HF, không liên quan tẩy gỉ."}, "c25-vi-sao": {"d": 9.936, "s": "media/c25-vi-sao.mp3", "loai": "am", "chu": "Gỉ sét gồm oxide, hydroxide của sắt. HCl là acid mạnh, hoà tan chúng thành muối chloride tan, làm sạch bề mặt thép."}, "c26-1": {"d": 2.736, "s": "media/c26-1.mp3", "loai": "am", "chu": "Mình cùng ch /* ---------- điểm ---------- */
function khoaCua(c){
  if (c.loai === "chon" || c.loai === "dien") return [c.ma];
  if (c.loai === "noi") return c.trai.map((_, i) => c.ma + "-" + i);
  if (c.loai === "keo-tha") return c.the.map((_, i) => c.ma + "-" + i);
  if (c.loai === "quay-kim") return c.cau.map((_, i) => c.ma + "-" + i);
  return [];
}
const NHOM_DIEM = BAI.canh.map(c => [c.ma, c.ten, khoaCua(c)]).filter(x => x[2].length);
const KHOA_DIEM = NHOM_DIEM.flatMap(x => x[2]);
// mỗi hoạt động 1 điểm (chia đều cho các ô); câu khó đặt "diem" riêng trong bai.json
const TRONG = {}; for (const c of BAI.canh){ const ks = khoaCua(c); for (const k of ks) TRONG[k] = (c.diem ?? 1) / ks.length; }
const TONG_DIEM = KHOA_DIEM.reduce((a, k) => a + TRONG[k], 0);
const demDiem = () => KHOA_DIEM.reduce((a, k) => a + (P.diem[k] === true ? TRONG[k] : 0), 0);
const so1 = x => { const r = Math.round(x * 10) / 10; return String(r).replace(".", ","); };

      const sd = this.api.LMSGetValue("cmi.suspend_data"); return sd ? JSON.parse(sd) : null; } catch(e){ return null; } },
  dat(k, v){ if (this.api) try { this.api.LMSSetValue(k, String(v)); } catch(e){} },

};
const KHOA_LUU = "triway-el-" + (BAI.ma || BAI.tieu_de);
function luu(){ const du = JSON.stringify({i: P.i, mo: P.mo, xong: [...P.xong], diem: P.diem});

  try { localStorage.setItem(KHOA_LUU, du); } catch(e){} }
function doc(){ const s = SC.bat(); if (s) return s; try { const x = localStorage.getItem(KHOA_LUU); return x ? JSON.parse(x) : null; } catch(e){ return null; } }

/* ---------- trình phát ---------- */
const CANH = BAI.canh;
const P = { i: -1, t: 0, chay: false, toc: 1, cc: true, mo: 0, xong: new Set(), diem: {}, coXem: false, rt: null, nhip: -2, hen: null };
const GIAN = .45;
function lich(c){ let s = .5; const B = c.dong.map(d => { const m = MEDIA[d.id], dd = m ? m.d : 2; const b = {id: d.id, s, d: dd, e: s + dd};
    // kim đang quay thì chờ quay xong mới sang câu sau
    const q = d.dong_ho && d.dong_ho.quay != null ? .5 + Math.min(3.2, 1.6 + Math.abs(Number(d.dong_ho.quay)) / 30) + .5 : 0;
    s += Math.max(dd + GIAN + (d.sau || 0), q); return b; }); return {B, tong: s + .4}; }
function ghiDiem(k, ok){ if (!(k in P.diem)) P.diem[k] = ok; }
function xongCanh(i = P.i){ P.xong.add(i); P.mo = Math.max(P.mo, i + 1); luu(); veMenu(); veCham(); capNut(); if (i === P.i && i < CANH.length - 1) nutTiep.hidden = false; }
function moCanh(i, tuChay = true){
  im(); try { speechSynthesis.cancel(); } catch(e){} clearTimeout(P.hen); P.i = i; P.t = 0; P.nhip = -2; datPhuDe("");
  nen.innerHTML = ""; lop.innerHTML = ""; tren.innerHTML = ""; nutTiep.hidden = true; DONG = []; stage.dataset.bc = "";
  const c = CANH[i], rt = {tt: []}; P.rt = rt;
  if (CANH_XEM[c.loai]){ const l = lich(c); rt.B = l.B; rt.tong = l.tong; Object.assign(rt, DUNG[c.loai](c, l.B, rt)); P.chay = tuChay; rt.ve(0); }
  else { Object.assign(rt, DUNG[c.loai](c, null, rt)); P.chay = false; if (rt.bat) rt.bat(); }

}

  const xem = c && (CANH_XEM[c.loai] || c.loai === "phim");
  $("#b-chay").textContent = xem && P.chay ? "⏸" : "▶"; $("#b-chay").setAttribute("aria-label", !xem ? "Nghe lại câu hỏi" : P.chay ? "Dừng" : "Phát"); }
function dongBo(){ const B = P.rt.B; let k = -1; for (let j = 0; j < B.length; j++) if (P.t >= B[j].s && P.t < B[j].e){ k = j; break; }
  if (k !== P.nhip){ P.nhip = k; if (k >= 0 && P.chay && B[k].e - P.t > .15) phat(B[k].id, P.t - B[k].s); else im(); }
  datPhuDe(k >= 0 ? LOI[B[k].id] : ""); }
let truoc = performance.now(), nhipN = 0, nhipT = 0;   // nhịp khung hình: chậm quá (máy yếu) thì tắt nền chuyển động
function khung(now){
  const dt = Math.min(.1, (now - truoc) / 1000); truoc = now; const c = CANH[P.i], rt = P.rt;
  if (c && rt && CANH_XEM[c.loai]){

        if (!P.xong.has(P.i)) xongCanh(); else nutTiep.hidden = P.i >= CANH.length - 1;
        clearTimeout(P.hen); const i0 = P.i; P.hen = setTimeout(() => { if (P.i === i0 && !P.chay && P.t >= rt.tong && P.i < CANH.length - 1) moCanh(P.i + 1); }, 1500); } }
    dongBo(); rt.ve(P.t);
  }
  if (c) veThanh();
  doMo(now / 1000);
  if (rt) for (const tt of rt.tt) tt.ve(now / 1000, dangPhat(), (rt.vui ? rt.vui(P.t) : false) || now < (P.vuiDen || 0));
  if (rt && stage.classList.contains("toi") !== !!rt.toi) stage.classList.toggle("toi", !!rt.toi);
  if (DONG.length && !tatDong){ nhipN++; nhipT += dt; if (nhipN >= 150){ if (nhipT / nhipN > .05 && !document.hidden){ tatDong = true; DONG.forEach(g => g.remove()); DONG = []; } nhipN = 0; nhipT = 0; } }

}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function veThanh(){ const c = CANH[P.i], th = $("#thanh"), nh = $("#nhan-thanh"), ray = th.querySelector(".ray"), rt = P.rt;
  if (!c || !rt) return;
  const dat = (p, a, b) => { ray.hidden = false; nh.hidden = true; th.classList.remove("khoa"); th.querySelector(".day").style.width = p * 100 + "%"; th.querySelector(".num").style.left = p * 100 + "%"; th.setAttribute("aria-valuenow", Math.round(p * 100)); $("#gio").textContent = `${fmt(a)} / ${fmt(b)}`; };
  if (CANH_XEM[c.loai]){ dat(P.t / rt.tong, P.t, rt.tong);
    if (ray.dataset.moc !== String(P.i)){ ray.querySelectorAll(".moc").forEach(x => x.remove()); ray.dataset.moc = P.i; rt.B.forEach(b => { const m = H("i", "moc", ray); m.style.left = b.s / rt.tong * 100 + "%"; }); } return; }
  ray.querySelectorAll(".moc").forEach(x => x.remove()); ray.dataset.moc = "";
  if (c.loai === "phim" && rt.phim){ const v = rt.phim, d = v.duration || MEDIA[c.phim_id].d || 1; dat(cl(v.currentTime / d), v.currentTime, d); return; }
  ray.hidden = true; nh.hidden = false; th.classList.add("khoa");
  nh.textContent = c.loai === "ket-qua" ? "Hoàn thành bài học" : P.xong.has(P.i) ? "Đã làm xong · bấm Tiếp tục" : "Hoạt động · em làm xong để đi tiếp"; $("#gio").textContent = `Cảnh ${P.i + 1}/${CANH.length}`; }
function tua(p){ const c = CANH[P.i]; if (!c) return;
  if (c.loai === "phim" && P.rt.phim){ const v = P.rt.phim; if (v.duration) v.currentTime = cl(p) * v.duration; return; }
  if (!CANH_XEM[c.loai]) return; clearTimeout(P.hen); nutTiep.hidden = !P.xong.has(P.i) || P.i >= CANH.length - 1; P.t = cl(p) * P.rt.tong; P.nhip = -2; }
function veMenu(){ const ds = $("#ds"); ds.innerHTML = "";
  CANH.forEach((c, i) => { const li = H("li", "", ds), b = H("button", i === P.i ? "nay" : "", li); b.type = "button"; const xem = CANH_XEM[c.loai] || c.loai === "phim";
    const dai = CANH_XEM[c.loai] ? fmt(lich(c).tong) : c.loai === "phim" ? fmt(MEDIA[c.phim_id].d || 0) : "";
    b.innerHTML = `<span class="kieu ${xem ? "" : "lam"}">${xem ? "▶" : c.loai === "ket-qua" ? "★" : "✋"}</span><span>${esc(c.ten)}</span><span class="tt ${P.xong.has(i) ? "ok" : ""}">${P.xong.has(i) ? "✓" : (i <= P.mo || P.coXem) ? dai : "🔒"}</span>`;
    b.disabled = !(i <= P.mo || P.coXem); if (i === P.i) b.setAttribute("aria-current", "step"); b.onclick = () => moCanh(i); }); }
function veCham(){ const ch = $("#cham"); ch.innerHTML = ""; CANH.forEach((c, i) => { const b = H("b", P.xong.has(i) ? "xong" : "", ch); if (i === P.i) b.className = "nay"; b.title = c.ten; }); }

/* ---------- màn mở ---------- */
function coPhu(e){ const n = (BAI.tieu_de_phu || "").length; if (n > 30) e.style.fontSize = n > 42 ? "2.2cqw" : "2.5cqw"; }   // tiêu đề phụ dài: một dòng, không chồng nhãn bên dưới
function manMo(){
  P.i = -1; nen.innerHTML = ""; lop.innerHTML = ""; tren.innerHTML = ""; DONG = []; stage.dataset.bc = ""; const rt = {tt: []}; P.rt = rt;

  { const ds = [BAI.mon, BAI.lop && "Lớp " + BAI.lop, BAI.bo_sach, BAI.bai].filter(Boolean); if (ds.join(" · ").length > 48) ds.splice(ds.indexOf(BAI.bo_sach), BAI.bo_sach ? 1 : 0); O("may", 110, 140, 860, esc(ds.join(" · "))); }
  const td = O("", 110, 190, 900, `<h2 class="tde" style="font-size:${(BAI.tieu_de || "").length > 18 ? 4.2 : (BAI.tieu_de || "").length > 12 ? 5 : 7}cqw">${esc(BAI.tieu_de)}</h2>`);
  coPhu(O("tde2", 110, 315, 860, esc(BAI.tieu_de_phu || "")));

  O("hang tho", 110, 410, 860, [BAI.thoi_luong && `<span class="chip">⏱ ${esc(BAI.thoi_luong)}</span>`, `<span class="chip">🔊 nên mở loa</span>`, so && `<span class="chip">✋ ${so} hoạt động</span>`].filter(Boolean).join(""));
  const h = O("hang", 110, 560, 860, "");

    const b = H("button", "nut-sk chinh", h, `▶ Học tiếp: ${esc(CANH[cu.mo].ten)}`); b.type = "button"; b.style.fontSize = "3cqw"; b.onclick = () => batDau(cu.mo);
    const l = H("button", "nut-sk", h, "Học lại từ đầu"); l.type = "button"; l.style.fontSize = "2.4cqw"; l.onclick = () => { P.mo = 0; P.xong = new Set(); P.diem = {}; batDau(0); }; }
  else { const b = H("button", "nut-sk chinh", h, "▶ Bắt đầu học"); b.type = "button"; b.style.fontSize = "3.4cqw"; b.style.padding = "1.4cqw 3.4cqw"; b.onclick = () => batDau(0); }
  veMenu(); veCham(); $("#b-lui").disabled = true; $("#b-toi").disabled = true; $("#gio").textContent = "0:00 / 0:00";
  if (window.XUONG) XUONG.sauCanh(-1);
}

/* ---------- điều khiển ---------- */
$("#b-chay").onclick = () => { const c = CANH[P.i]; if (!c){ moCanh(0); return; }
  if (c.loai === "phim"){ const v = P.rt.phim; if (v.paused){ v.play(); P.chay = true; } else { v.pause(); P.chay = false; } capNut(); return; }
  if (!CANH_XEM[c.loai]){ P.rt.nhacLai && P.rt.nhacLai(); return; }
  if (P.chay){ P.chay = false; im(); P.nhip = -2; } else { if (P.t >= P.rt.tong - .05) P.t = 0; clearTimeout(P.hen); P.chay = true; P.nhip = -2; }
  capNut(); };
$("#b-lai").onclick = () => { if (P.i < 0) return; const c = CANH[P.i]; if (CANH_XEM[c.loai]){ tua(0); P.chay = true; capNut(); } else moCanh(P.i); };
$("#b-lui").onclick = () => { if (P.i > 0) moCanh(P.i - 1); };

nutTiep.onclick = () => { if (P.i < CANH.length - 1) moCanh(P.i + 1); };
$("#b-cc").onclick = e => { P.cc = !P.cc; e.currentTarget.classList.toggle("bat", P.cc); e.currentTarget.setAttribute("aria-pressed", P.cc); phude.hidden = !pdHt || !P.cc; };
$("#b-toc").onclick = e => { const ds = [1, 1.25, .75]; P.toc = ds[(ds.indexOf(P.toc) + 1) % ds.length]; e.currentTarget.textContent = P.toc + "×"; if (dangNoi && dangNoi.a.playbackRate != null) dangNoi.a.playbackRate = P.toc; if (P.rt && P.rt.phim) P.rt.phim.playbackRate = P.toc; };
$("#b-man").onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else $("#khung").requestFullscreen().catch(() => {}); } catch(e){} };

const th = $("#thanh");
function tuaChuot(e){ const r = th.getBoundingClientRect(); tua((e.clientX - r.left) / r.width); }
th.addEventListener("pointerdown", e => { const c = CANH[P.i]; if (!c || !(CANH_XEM[c.loai] || c.loai === "phim")) return; th.setPointerCapture(e.pointerId); tuaChuot(e);
  const mv = ev => tuaChuot(ev), up = () => { th.removeEventListener("pointermove", mv); th.removeEventListener("pointerup", up); };

document.addEventListener("keydown", e => { if (e.key === " " && !/INPUT|TEXTAREA|BUTTON|SELECT/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")){ e.preventDefault(); $("#b-chay").click(); } });
addEventListener("pagehide", () => { luu(); SC.dong(); });

/* ---------- khung chữ quanh bài ---------- */
document.title = BAI.tieu_de + (BAI.mon ? " · " + BAI.mon + (BAI.lop ? " " + BAI.lop : "") : "");
$("#ten-bai").textContent = BAI.tieu_de + (BAI.tieu_de_phu ? ": " + BAI.tieu_de_phu : "");
(() => { const v = $("#ve-noi-dung"), dong = [];
  dong.push(`<p><b>Bài:</b> ${esc([BAI.mon, BAI.lop && "lớp " + BAI.lop, BAI.bo_sach, BAI.bai].filter(Boolean).join(", "))}${BAI.trang_sgk ? " (" + esc(BAI.trang_sgk) + ")" : ""}.</p>`);
  if (BAI.yeu_cau_can_dat) dong.push(`<p><b>Yêu cầu cần đạt:</b> ${esc(BAI.yeu_cau_can_dat)}</p>`);
  const li = [];
  li.push(`${CANH.length} cảnh: ${CANH.filter(c => CANH_XEM[c.loai]).length} cảnh xem, ${NHOM_DIEM.length} hoạt động tự chấm.`);
  if (BAI.giong_ghi) li.push(esc(BAI.giong_ghi));
  li.push("Không thu thập dữ liệu, không gửi đi đâu. Tên học sinh (nếu nhập) chỉ nằm trên máy.");
  li.push("Nộp lên hệ thống học trực tuyến (Moodle…) bằng gói SCORM 1.2 kèm theo: hệ thống nhận điểm và trạng thái hoàn thành.");
  dong.push(`<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>`);
  const ng = [...(BAI.nguon || []), ...Object.entries(ANH).filter(([, a]) => a.nguon).map(([t, a]) => `Ảnh «${t}»: ${a.nguon}`)];
  if (ng.length) dong.push(`<p><b>Nguồn:</b></p><ul>${ng.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
  v.innerHTML = dong.join(""); })();

window.__TRIWAY_EL = { P, CANH, MEDIA, DO_TO, moMieng: () => MO_MIENG, moCanh, tua, demDiem, KHOA_DIEM, TRONG, TONG_DIEM, khoaCua, im, xongCanh, THAY_CO, PC, tatDong: () => { tatDong = true; DONG.forEach(g => g.remove()); DONG = []; } };
