<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai23-elearning-on-tap-chuong-7 bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai23-elearning-on-tap-chuong-7', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

giai": "Đây là cấu hình của khí hiếm; halogen còn thiếu 1 electron.", "sai_id": "c3-sai-1"}, {"chu": "ns²np⁵", "dung": true}, {"chu": "ns²np³", "giai": "Đây là cấu hình nhóm VA (5 electron lớp ngoài cùng).", "sai_id": "c3-sai-3"}, {"chu": "ns¹", "giai": "Đây là cấu hình kim loại kiềm nhóm IA.", "sai_id": "c3-sai-4"}], "vi_sao": "Halogen thuộc nhóm VIIA, có 7 electron lớp ngoài cùng: ns²np⁵.", "hoi_id": "c3-hoi", "vi_sao_id": "c3-vi-sao"}, {"ma": "c4", "loai": "chon", "ten": "Khối 1: X + 1e ⟶ X⁻", "muc": "hieu", "yccd": [1], "sgk": ["HT"], "hoi": "Xu hướng X + 1e ⟶ X⁻ thể hiện tính chất nào của X?", "noi": "Xu hướng nhận một electron trở thành i on ha lai thể hiện tính chất nào của ha lô gien?", "lua": [{"chu": "Tính oxi hoá", "dung": true}, {"chu": "Tính khử", "giai": "Nhận electron là quá trình khử, chất nhận electron có tính oxi hoá.", "sai_id": "c4-sai-2"}, {"chu": "Tính acid", "giai": "Tính acid là tính chất của dung dịch HX, không phải của nguyên tử X.", "sai_id": "c4-sai-3"}, {"chu": "Tính kim loại", "giai": "Halogen là phi kim điển hình.", "sai_id": "c4-sai-4"}], "vi_sao": "Nguyên tử nhận electron là chất oxi hoá. Halogen dễ nhận 1 electron, nên có tính oxi hoá mạnh.", "hoi_id": "c4-hoi", "vi_sao_id": "c4-vi-sao"}, {"ma": "c5", "loai": "trinh-bay", "ten": "Khối 2: đơn chất halogen", "nen": "kem", "bo_cuc": "chia-doi", "sgk": ["HT", "3"], "hinh": {"anh": "b21-bang-21-2.png", "chu": "Số liệu Bảng 21.2, SGK tr. 107"}, "dong": [{"the": "F₂, Cl₂ khí · Br₂ lỏng · I₂ rắn", "id": "c5-1"}, {"the": "t°nc, t°s **tăng dần**", "id": "c5-2"}, {"the": "Vì sao?", "id": "c5-3"}]}, {"ma": "c6", "loai": "chon", "ten": "Khối 2: giải thích nhiệt độ", "muc": "hieu", "yccd": [2], "sgk": ["HT"], "hoi": "Nhiệt độ nóng chảy, sôi tăng từ F₂ đến I₂ vì", "noi": "Nhiệt độ nóng chảy, nhiệt độ sôi tăng từ ép hai đến i ốt vì sao?", "lua": [{"chu": "Liên kết X–X bền dần", "giai": "Năng lượng liên kết X–X không tăng đều; khi nóng chảy, sôi không phá liên kết X–X.", "sai_id": "c6-sai-1"}, {"chu": "Tương tác van der Waals, khối lượng phân tử tăng", "dung": true}, {"chu": "Có liên kết hydrogen", "giai": "Phân tử X₂ không tạo liên kết hydrogen.", "sai_id": "c6-sai-3"}, {"chu": "Độ âm điện tăng", "giai": "Độ âm điện giảm dần từ F đến I.", "sai_id": "c6-sai-4"}], "vi_sao": "Từ F₂ đến I₂, kích thước và khối lượng phân tử tăng, tương tác van der Waals giữa các phân tử tăng, nên nhiệt độ nóng chảy, nhiệt độ sôi tăng.", "hoi_id": "c6-hoi", "vi_sao_id": "c6-vi-sao"}, {"ma": "c7", "loai": "chon", "ten": "Câu 3: tính oxi hoá mạnh nhất", "muc": "biet", "yccd": [2], "sgk": ["3", "HT"], "hoi": "Câu 3. Trong dãy F₂ đến I₂, chất có tính oxi hoá mạnh nhất là", "noi": "Câu ba: trong dãy đơn chất từ ép hai đến i ốt, chất có tính oxi hoá mạnh nhất là chất nào?", "lua": [{"chu": "F₂", "dung": true}, {"chu": "Cl₂", "giai": "Cl₂ oxi hoá mạnh nhưng kém F₂.", "sai_id": "c7-sai-2"}, {"chu": "Br₂", "giai": "Tính oxi hoá giảm dần từ F₂ đến I₂.", "sai_id": "c7-sai-3"}, {"chu": "I₂", "giai": "I₂ có tính oxi hoá yếu nhất dãy.", "sai_id": "c7-sai-4"}], "vi_sao": "Tính oxi hoá giảm dần từ F₂ đến I₂ do bán kính nguyên tử tăng, độ âm điện giảm. F₂ có tính oxi hoá mạnh nhất.", "hoi_id": "c7-hoi", "vi_sao_id": "c7-vi-sao"}, {"ma": "c8", "loai": "noi", "ten": "Khối 2: điều chế chlorine", "muc": "biet", "yccd": [2], "sgk": ["HT"], "hoi": "Nối mỗi nơi với phản ứng điều chế chlorine.", "noi": "Bạn nối mỗi nơi điều chế với phản ứng điều chế clo rin tương ứng nhé.", "giai": "NaCl + H₂SO₄ đặc chỉ tạo HCl, không tạo Cl₂.", "vi_sao": "Công nghiệp: 2NaCl + 2H₂O điện phân có màng ngăn ⟶ 2NaOH + H₂ + Cl₂. Phòng thí nghiệm: MnO₂ (hoặc KMnO₄) + HCl đặc ⟶ … + Cl₂.", "phai": ["MnO₂ + HCl đặc", "NaCl + H₂SO₄", "Điện phân NaCl"], "trai": [{"chu": "Trong công nghiệp"}, {"chu": "Trong phòng thí nghiệm"}], "dap": [2, 0], "hoi_id": "c8-hoi", "sai_id": "c8-sai", "vi_sao_id": "c8-vi-sao", "sai_rieng": {}}, {"ma": "c9", "loai": "chon", "ten": "Câu 4: khử khí Cl₂ thừa", "muc": "van-dung", "yccd": [4], "sgk": ["4"], "hoi": "Câu 4. Để Cl₂ không thoát ra ngoài, đậy miệng bình thu khí bằng bông tẩm dung dịch", "noi": "Câu bốn: khi thu khí clo vào bình, để ngăn clo thoát ra ngoài gây độc, cần đậy miệng bình bằng bông tẩm dung dịch nào?", "lua": [{"chu": "NaCl", "giai": "NaCl không phản ứng với Cl₂.", "sai_id": "c9-sai-1"}, {"chu": "HCl", "giai": "HCl không giữ được Cl₂.", "sai_id": "c9-sai-2"}, {"chu": "NaOH", "dung": true}, {"chu": "KCl", "giai": "KCl không phản ứng với Cl₂.", "sai_id": "c9-sai-4"}], "vi_sao": "NaOH phản ứng với Cl₂: Cl₂ + 2NaOH ⟶ NaCl + NaClO + H₂O, giữ khí Cl₂ lại trong bông, không thoát ra ngoài.", "hoi_id": "c9-hoi", "vi_sao_id": "c9-vi-sao"}, {"ma": "c10", "loai": "trinh-bay", "ten": "Khối 3: hydrogen halide", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["HT", "1"], "hinh": {"anh": "b22-ts.png", "chu": "Số liệu Bảng 22.2, SGK tr. 113"}, "dong": [{"the": "HF **cao bất thường** · HCl → HI **tăng**", "id": "c10-1"}, {"the": "H–X **có cực**", "id": "c10-2"}, {"the": "Tính acid: HF < … < HI", "id": "c10-3"}]}, {"ma": "c11", "loai": "chon", "ten": "Câu 1: liên kết phân cực nhất", "muc": "hieu", "yccd": [3], "sgk": ["1"], "hoi": "Câu 1. Liên kết có độ phân cực lớn nhất là", "noi": "Câu một: liên kết trong phân tử nào có độ phân cực lớn nhất?", "lua": [{"chu": "H—F", "dung": true}, {"chu": "H—Cl", "giai": "Cl có độ âm điện 3,16, nhỏ hơn F (3,98).", "sai_id": "c11-sai-2"}, {"chu": "H—Br", "giai": "Br có độ âm điện 2,96.", "sai_id": "c11-sai-3"}, {"chu": "H—I", "giai": "I có độ âm điện nhỏ nhất (2,66), nên H–I phân cực ít nhất.", "sai_id": "c11-sai-4"}], "vi_sao": "Hiệu độ âm điện giữa H (2,20) và F (3,98) lớn nhất, nên liên kết H–F phân cực nhất.", "hoi_id": "c11-hoi", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "keo-tha", "ten": "Khối 3: sắp xếp", "muc": "hieu", "yccd": [3], "sgk": ["HT"], "hoi": "Xếp mỗi chất vào đúng nhóm.", "noi": "Bạn xếp mỗi hát ích vào nhóm: nhiệt độ sôi cao nhất, hoặc tính a xít mạnh nhất nhé.", "nhom": ["Sôi cao nhất dãy", "Acid mạnh nhất dãy", "Acid yếu"], "the": [{"chu": "HF (t°s)", "nhom": 0}, {"chu": "HI (acid)", "nhom": 1}, {"chu": "HF (acid)", "nhom": 2}], "giai": "HF sôi cao nhất (liên kết hydrogen) nhưng là acid yếu; HI là acid rất mạnh.", "vi_sao": "HF có nhiệt độ sôi cao nhất dãy do liên kết hydrogen, nhưng hydrofluoric acid là acid yếu. Hydroiodic acid là acid rất mạnh.", "hoi_id": "c12-hoi", "sai_id": "c12-sai", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "chon", "ten": "Câu 2: bán kính nguyên tử", "muc": "biet", "yccd": [1], "sgk": ["2"], "hoi": "Câu 2. Từ F đến I, bán kính nguyên tử", "noi": "Câu hai: trong nhóm ha lô gien, từ phờ lo rin đến i ốt, bán kính nguyên tử biến đổi theo chiều nào?", "lua": [{"chu": "Giảm dần", "giai": "Số lớp electron tăng nên bán kính phải tăng.", "sai_id": "c13-sai-1"}, {"chu": "Không đổi", "giai": "Bán kính thay đổi từ 72 đến 133 pm.", "sai_id": "c13-sai-2"}, {"chu": "Tăng dần", "dung": true}, {"chu": "Tuần hoàn", "giai": "Trong một nhóm A, bán kính biến đổi một chiều.", "sai_id": "c13-sai-4"}], "vi_sao": "Từ F đến I, số lớp electron tăng nên bán kính nguyên tử tăng dần (72, 100, 114, 133 pm).", "hoi_id": "c13-hoi", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Khối 4: phân biệt ion halide", "muc": "hieu", "yccd": [3], "sgk": ["HT"], "hoi": "Thuốc thử phân biệt các ion F⁻, Cl⁻, Br⁻, I⁻ trong dung dịch là", "noi": "Khối bốn: dùng thuốc thử nào để phân biệt các i on phờ lo rua, clo rua, brô mua, i ốt đua trong dung dịch?", "lua": [{"chu": "Dung dịch AgNO₃", "dung": true}, {"chu": "Quỳ tím", "giai": "Các muối NaX đều trung tính, quỳ tím không đổi màu.", "sai_id": "c14-sai-2"}, {"chu": "Dung dịch NaOH", "giai": "NaOH không tạo kết tủa với ion halide.", "sai_id": "c14-sai-3"}, {"chu": "Hồ tinh bột", "giai": "Hồ tinh bột nhận biết I₂, không phân biệt được bốn ion.", "sai_id": "c14-sai-4"}], "vi_sao": "Với AgNO₃: F⁻ không có kết tủa, Cl⁻ cho AgCl trắng, Br⁻ cho AgBr vàng nhạt, I⁻ cho AgI vàng.", "hoi_id": "c14-hoi", "vi_sao_id": "  9.144, "s": "media/c4-vi-sao.mp3", "loai": "am", "chu": "Nguyên tử nhận electron là chất oxi hoá. Halogen dễ nhận 1 electron, nên có tính oxi hoá mạnh."}, "c5-1": {"d": 7.128, "s": "media/c5-1.mp3", "loai": "am", "chu": "Nhớ lại Bảng 21.2: từ F₂ khí đến I₂ rắn, màu sắc đậm dần."}, "c5-2": {"d": 5.184, "s": "media/c5-2.mp3", "loai": "am", "chu": "Nhiệt độ nóng chảy, nhiệt độ sôi tăng dần từ F₂ đến I₂."}, "c5-3": {"d": 5.544, "s": "media/c5-3.mp3", "loai": "am", "chu": "Bạn giải thích được vì sao không? Mình cùng làm vài câu nhé!"}, "c6-hoi": {"d": 5.328, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Nhiệt độ nóng chảy, nhiệt độ sôi tăng từ ép hai đến i ốt vì sao?"}, "c6-sai-1": {"d": 6.24, "s": "media/c6-sai-1.mp3", "loai": "am", "chu": "Năng lượng liên kết X–X không tăng đều; khi nóng chảy, sôi không phá liên kết X–X."}, "c6-sai-3": {"d": 3.816, "s": "media/c6-sai-3.mp3", "loai": "am", "chu": "Phân tử X₂ không tạo liên kết hydrogen."}, "c6-sai-4": {"d": 3.576, "s": "media/c6-sai-4.mp3", "loai": "am", "chu": "Độ âm điện giảm dần từ F đến I."}, "c6-vi-sao": {"d": 9.96, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Từ F₂ đến I₂, kích thước và khối lượng phân tử tăng, tương tác van der Waals giữa các phân tử tăng, nên nhiệt độ nóng chảy, nhiệt độ sôi tăng."}, "c7-hoi": {"d": 6.864, "s": "media/c7-hoi.mp3", "loai": "am", "chu": "Câu ba: trong dãy đơn chất từ ép hai đến i ốt, chất có tính oxi hoá mạnh nhất là chất nào?"}, "c7-sai-2": {"d": 3.504, "s": "media/c7-sai-2.mp3", "loai": "am", "chu": "Cl₂ oxi hoá mạnh nhưng kém F₂."}, "c7-sai-3": {"d": 4.104, "s": "media/c7-sai-3.mp3", "loai": "am", "chu": "Tính oxi hoá giảm dần từ F₂ đến I₂."}, "c7-sai-4": {"d": 3.6, "s": "media/c7-sai-4.mp3", "loai": "am", "chu": "I₂ có tính oxi hoá yếu nhất dãy."}, "c7-vi-sao": {"d": 9.84, "s": "media/c7-vi-sao.mp3", "loai": "am", "chu": "Tính oxi hoá giảm dần từ F₂ đến I₂ do bán kính nguyên tử tăng, độ âm điện giảm. F₂ có tính oxi hoá mạnh nhất."}, "c8-hoi": {"d": 5.064, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Bạn nối mỗi nơi điều chế với phản ứng điều chế clo rin tương ứng nhé."}, "c8-sai": {"d": 5.736, "s": "media/c8-sai.mp3", "loai": "am", "chu": "NaCl + H₂SO₄ đặc chỉ tạo HCl, không tạo Cl₂."}, "c8-vi-sao": {"d": 13.032, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Công nghiệp: 2NaCl + 2H₂O điện phân có màng ngăn ⟶ 2NaOH + H₂ + Cl₂. Phòng thí nghiệm: MnO₂ (hoặc KMnO₄) + HCl đặc ⟶ … + Cl₂."}, "c9-hoi": {"d": 7.8, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Câu bốn: khi thu khí clo vào bình, để ngăn clo thoát ra ngoài gây độc, cần đậy miệng bình bằng bông tẩm dung dịch nào?"}, "c9-sai-1": {"d": 3.456, "s": "media/c9-sai-1.mp3", "loai": "am", "chu": "NaCl không phản ứng với Cl₂."}, "c9-sai-2": {"d": 2.784, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "HCl không giữ được Cl₂."}, "c9-sai-4": {"d": 3.024, "s": "media/c9-sai-4.mp3", "loai": "am", "chu": "KCl không phản ứng với Cl₂."}, "c9-vi-sao": {"d": 10.176, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "NaOH phản ứng với Cl₂: Cl₂ + 2NaOH ⟶ NaCl + NaClO + H₂O, giữ khí Cl₂ lại trong bông, không thoát ra ngoài."}, "c10-1": {"d": 7.776, "s": "media/c10-1.mp3", "loai": "am", "chu": "Nhớ lại Bảng 22.2: HF sôi cao bất thường, rồi từ HCl đến HI nhiệt độ sôi tăng dần."}, "c10-2": {"d": 7.032, "s": "media/c10-2.mp3", "loai": "am", "chu": "Liên kết H–X là liên kết cộng hoá trị có cực; độ âm điện của X càng lớn thì liên kết càng phân cực."}, "c10-3": {"d": 4.776, "s": "media/c10-3.mp3", "loai": "am", "chu": "Tính acid của dung dịch HX tăng dần từ HF đến HI."}, "c11-hoi": {"d": 4.656, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Câu một: liên kết trong phân tử nào có độ phân cực lớn nhất?"}, "c11-sai-2": {"d": 6.048, "s": "media/c11-sai-2.mp3", "loai": "am", "chu": "Cl có độ âm điện 3,16, nhỏ hơn F (3,98)."}, "c11-sai-3": {"d": 3.6, "s": "media/c11-sai-3.mp3", "loai": "am", "chu": "Br có độ âm điện 2,96."}, "c11-sai-4": {"d": 5.88, "s": "media/c11-sai-4.mp3", "loai": "am", "chu": "I có độ âm điện nhỏ nhất (2,66), nên H–I phân cực ít nhất."}, "c11-vi-sao": {"d": 8.76, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "Hiệu độ âm điện giữa H (2,20) và F (3,98) lớn nhất, nên liên kết H–F phân cực nhất."}, "c12-hoi": {"d": 6.072, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Bạn xếp mỗi hát ích vào nhóm: nhiệt độ sôi cao nhất, hoặc tính a xít mạnh nhất nhé."}, "c12-sai": {"d": 7.128, "s": "media/c12-sai.mp3", "loai": "am", "chu": "HF sôi cao nhất (liên kết hydrogen) nhưng là acid yếu; HI là acid rất mạnh."}, "c12-vi-sao": {"d": 10.608, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "HF có nhiệt độ sôi cao nhất dãy do liên kết hydrogen, nhưng hydrofluoric acid là acid yếu. Hydroiodic acid là acid rất mạnh."}, "c13-hoi": {"d": 7.44, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Câu hai: trong nhóm ha lô gien, từ phờ lo rin đến i ốt, bán kính nguyên tử biến đổi theo chiều nào?"}, "c13-sai-1": {"d": 3.792, "s": "media/c13-sai-1.mp3", "loai": "am", "chu": "Số lớp electron tăng nên bán kính phải tăng."}, "c13-sai-2": {"d": 4.752, "s": "media/c13-sai-2.mp3", "loai": "am", "chu": "Bán kính thay đổi từ 72 đến 133 pm."}, "c13-sai-4": {"d": 3.888, "s": "media/c13-sai-4.mp3", "loai": "am", "chu": "Trong một nhóm A, bán kính biến đổi một chiều."}, "c13-vi-sao": {"d": 10.464, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "Từ F đến I, số lớp electron tăng nên bán kính nguyên tử tăng dần (72, 100, 114, 133 pm)."}, "c14-hoi": {"d": 8.304, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Khối bốn: dùng thuốc thử nào để phân biệt các i on phờ lo rua, clo rua, brô mua, i ốt đua trong dung dịch?"}, "c14-sai-2": {"d": 4.248, "s": "media/c14-sai-2.mp3", "loai": "am", "chu": "Các muối NaX đều trung tính, quỳ tím không đổi màu."}, "c14-sai-3": {"d": 4.104, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "NaOH không tạo kết tủa với ion halide."}, "c14-sai-4": {"d": 4.608, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Hồ tinh bột nhận biết I₂, không phân biệt được bốn ion."}, "c14-vi-sao": {"d": 9.384, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "Với AgNO₃: F⁻ không có kết tủa, Cl⁻ cho AgCl trắng, Br⁻ cho AgBr vàng nhạt, I⁻ cho AgI vàng."}, "c15-hoi": {"d": 6.456, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Sắp xếp các i on clo rua, brô mua, i ốt đua theo thứ tự tính khử tăng dần."}, "c15-sai-1": {"d": 5.76, "s": "media/c15-sai-1.mp3", "loai": "am", "chu": "Ngược rồi: I⁻ khử được H₂SO₄ đặc xuống tận H₂S, mạnh nhất."}, "c15-sai-3": {"d": 5.016, "s": "media/c15-sai-3.mp3", "loai": "am", "chu": "Cl⁻ không khử được H₂SO₄ đặc, yếu hơn Br⁻."}, "c15-sai-4": {"d": 4.512, "s": "media/c15-sai-4.mp3", "loai": "am", "chu": "Ba ion khử H₂SO₄ đặc đến các mức khác nhau."}, "c15-vi-sao": {"d": 12.216, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "Tính khử tăng dần Cl⁻ < Br⁻ < I⁻: NaCl không khử được H₂SO₄ đặc, NaBr khử đến SO₂, NaI khử đến H₂S."}, "c16-1": {"d": 5.04, "s": "media/c16-1.mp3", "loai": "am", "chu": "Câu năm: làm muối là nghề phổ biến ở nhiều vùng ven biển Việt Nam."}, "c16-2": {"d": 8.544, "s": "media/c16-2.mp3", "loai": "am", "chu": "Một hộ gia đình làm muối trên ruộng chứa 200 000 L nước biển. Mỗi lít nước biển chứa 30 g NaCl."}, "c16-3": {"d": 8.016, "s": "media/c16-3.mp3", "loai": "am", "chu": "Hiệu suất quá trình làm muối thành phẩm đạt 60%. Bạn tính xem thu được bao nhiêu kg muối nhé!"}, "c17-hoi": {"d": 3.72, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Khối lượng muối hộ gia đình thu được là bao nhiêu?"}, "c17-sai-1": {"d": 6.264, "s": "media/c17-sai-1.mp3", "loai": "am", "chu": "Bạn đã nhân với 40% thay vì 60%? Hãy tính lại."}, "c17-sai-2": {"d": 3.72, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Kiểm tra lại phép nhân 30 · 200 000."}, "c17-sai-3": {"d": 5.784, "s": "media/c17-sai-3.mp3", "loai": "am", "chu": "Đây là khối lượng NaCl lí thuyết; còn phải nhân hiệu suất 60%."}, "c17-vi-sao": {"d": 7.848, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "m = 30 · 200 000 · 60 : 100 = 3 600 000 g = 3 600 kg."}, "c18-1": {"d": 6.336, "s": "media/c18-1.mp3", "loai": "am", "chu": "Câu sáu: X, Y là hai halogen có trong tự nhiên, ở hai chu kì liên tiếp."}, "c18-2": {"d": 8.496, "s": "media/c18-2.mp3", "loai": "am", "chu": "0,402 g hỗn hợp NaX và NaY tác dụng với AgNO₃ dư, thu được 0,574 g kết tủa."}, "c18-3": {"d": 14.28, "s": "media/c18-3.mp3", "loai": "am", "chu": "Lưu ý: AgF tan, không tạo kết tủa. Nếu cả hai muối đều tạo kết tủa, khối lượng mol trung bình của X tính ra khoảng 175,66 — lớn hơn mọi halogen trong tự nhiên."}, "c18-4": {"d": 5.64, "s": "media/c18-4.mp3", "loai": "am", "chu": "Vậy chỉ một muối tạo kết tủa. Bạn thử chọn đáp án nhé!"}, "c19-hoi": {"d": 4.008, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Kí hiệu của nguyên tố X và Y lần lượt là gì?"}, "c19-sai-2": {"d": 6.792, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "Nếu cả hai tạo kết tủa thì khối lượng mol trung bình vô lí (175,66)."}, "c19-sai-3": {"d": 5.064, "s": "media/c19-sai-3.mp3", "loai": "am", "chu": "Br và I đều tạo kết tủa, rơi vào trường hợp bị loại."}, "c19-sai-4": {"d": 3.912, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Cl và I không ở hai chu kì liên tiếp."}, "c19-vi-sao": {"d": 23.184, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Chỉ một muối tạo kết tủa, nên muối kia là NaF: X là F, Y là Cl. Kiểm tra: n(AgCl) = 0,574 : 143,5 = 0,004 mol, m(NaCl) = 0,234 g, m(NaF) = 0,168 g — hợp lí."}, "c20-hoi": {"d": 8.856, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Từ không phẩy năm trăm bảy mươi tư gam bạc clo rua, bạn tính khối lượng na tri clo rua trong hỗn hợp, làm tròn ba chữ số sau dấu phẩy."}, "c20-sai": {"d": 12.024, "s": "media/c20-sai.mp3", "loai": "am", "chu": "n(AgCl) = 0,574 : 143,5. Số mol NaCl bằng số mol AgCl, nhân với 58,5."}, "c20-vi-sao": {"d": 17.16, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "n(AgCl) = 0,574 : 143,5 = 0,004 mol = n(NaCl). m(NaCl) = 0,004 · 58,5 = 0,234 g."}, "c21-1": {"d": 3.408, "s": "media/c21-1.mp3", "loai": "am", "chu"
