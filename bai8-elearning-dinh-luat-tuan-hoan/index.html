<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai8-elearning-dinh-luat-tuan-hoan bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai8-elearning-dinh-luat-tuan-hoan', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}
.o{position:absolute}
/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */
.cot{display:flex;flex-direction:column;gap:1.2cqw}
.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}
.the.dai{font-size:calc(1.85cqw*var(--co,1))}
.the b{color:var(--a1)}
.dap{background:var(--a2);border-radius:1.6cqw;padding:1cqw 2cqw;font:800 calc(3.8cqw*var(--co,1))/1.1 var(--f-hien);color:var(--muc);box-shadow:0 .6cqw 0 var(--a2d);text-align:center}
.lcd{background:#1B2238;border-radius:1.2cqw;border:.5cqw solid #3A4566;color:#7CF2B2;font:800 4.6cqw/1 "Consolas","Courier New",monospace;letter-spacing:.2cqw;display:grid;place-items:center;text-shadow:0 0 1cqw rgba(124,242,178,.6);padding:1.2cqw 2cqw;align-self:flex-start;font-variant-numeric:tabular-nums}
.bong{background:var(--a1);color:#fff;border-radius:99px;padding:.5cqw 1.6cqw;font:800 2.8cqw/1.2 var(--f-hien);box-shadow:0 .4cqw 0 var(--a1d);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tde2{font:700 3cqw/1.15 var(--f-hien);color:var(--a1)}
.hoi{font:800 2.9cqw/1.2 var(--f-hien);color:var(--chu-nen);text-wrap:balance}
.hoi.dai{font-size:2.4cqw}
.chu-to.emo{background:transparent!important;box-shadow:none!important;border:0!important}
.chu-to{font:800 7cqw/1.1 var(--f-hien);color:var(--chu);text-align:center;display:grid;place-items:center;background:var(--the);border-radius:2cqw;box-shadow:0 .6cqw 0 var(--bong);padding:2cqw}
.khung-anh{overflow:hidden;border-radius:1.4cqw;background:var(--the);box-shadow:0 .6cqw 0 var(--bong)}
.anh-trong{position:absolute;transform-origin:0 0;transition:transform .9s cubic-bezier(.45,0,.2,1)}
.anh-trong img{width:100%;height:100%;display:block}
.anh-trong svg{position:absolute;inset:0;width:100%;height:100%}
.nguon-anh{position:absolute;right:.6cqw;bottom:.5cqw;font:700 1.05cqw/1.2 var(--f-chu);color:var(--chu2);background:rgba(255,255,255,.85);border-radius:.6cqw;padding:.2cqw .6cqw;max-width:90%}
.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}
.khung-co.noi{box-shadow:0 0 0 .6cqw var(--a2),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent)}
.khung-co video,.khung-co img{width:100%;height:100%;object-fit:cover;display:block}
.chon{display:flex;flex-direction:column;gap:1.3cqw}
.nut-chon{font:800 2.7cqw/1.1 var(--f-hien);color:var(--chu);background:var(--the);border:.35cqw solid var(--chu);border-radius:1.4cqw;padding:1.1cqw 1.8cqw;text-align:left;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;gap:1.4cqw}
.nut-chon.dai{font-size:2.1cqw}
.chon.gon{gap:.8cqw}.chon.gon .nut-chon{font-size:1.9cqw;padding:.7cqw 1.4cqw}.chon.gon .nut-chon .ky{width:3.2cqw;height:3.2cqw;font-size:1.8cqw}
.nut-chon .ky{width:4cqw;height:4cqw;border-radius:50%;background:var(--a2);display:grid;place-items:center;font-size:2.2cqw;flex:none;color:var(--muc)}
.nut-chon:hover{transform:translateY(-.2cqw)}
.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-chon:focus-visible,.nut-sk:focus-visible,.the-n:focus-visible,.o-phai:focus-visible,.the-k:focus-visible,.nhom:focus-visible{outline:.4cqw solid var(--a1);outline-offset:.3cqw}
.nut-chon.dung{background:var(--a3t);border-color:var(--a3);box-shadow:0 .5cqw 0 var(--a3);color:var(--a3d)}
.nut-chon.dung .ky{background:var(--a3);color:#fff}
.nut-chon.sai{background:var(--a4t);border-color:var(--a4);box-shadow:0 .5cqw 0 var(--a4);color:var(--a4d);cursor:default;opacity:.85}
.nut-chon.sai .ky{background:var(--a4);color:#fff}
.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}
.nut-sk{font:800 2.3cqw/1 var(--f-hien);border-radius:1.2cqw;padding:1.1cqw 1.8cqw;border:.3cqw solid var(--chu);background:var(--the);color:var(--chu);cursor:pointer;box-shadow:0 .45cqw 0 var(--chu)}
.nut-sk.chinh{background:var(--a1);border-color:var(--a1d);color:#fff;box-shadow:0 .45cqw 0 var(--a1d)}
.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}
.the-n svg.dh{width:11cqw;height:11cqw}
.the-n img{max-width:100%;max-height:11cqw;object-fit:contain;border-radius:.8cqw}
.the-n .hd{font:800 1.9cqw/1.15 var(--f-hien);text-align:center;color:var(--chu)}
.the-n.chon-roi,.the-k.chon-roi{border-color:var(--a1);transform:translateY(-.6cqw);box-shadow:0 1cqw 0 color-mix(in srgb,var(--a1) 35%,transparent)}
.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}
.o-phai.lcd-k.khop{color:var(--a3d)}
.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}
.phu.toi{background:#2E3A6B;color:#FFE7A3}.phu.chieu{background:var(--a1t);color:var(--a1d)}
.the-k{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3cqw;padding:.6cqw;cursor:grab;box-shadow:0 .45cqw 0 var(--chu);font:800 2cqw/1.15 var(--f-hien);color:var(--chu);text-align:center;touch-action:none;width:12cqw;min-height:8cqw}
.the-k svg.dh{width:7cqw;height:7cqw}
.the-k img{max-width:100%;max-height:7cqw;object-fit:contain}
.the-k.keo{cursor:grabbing;z-index:5;box-shadow:0 1.2cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent)}
.the-k.dat{cursor:default;border-color:var(--a3);box-shadow:0 .3cqw 0 var(--a3);width:10cqw;min-height:0;font-size:1.6cqw;padding:.4cqw}
.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}
.nhom .trong-nhom{display:flex;flex-wrap:wrap;gap:.4cqw;justify-content:center;align-content:flex-start;flex:1}
.nhom.sang{background:color-mix(in srgb,var(--a2) 35%,transparent)}
#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}
#tiep:focus-visible{outline:.4cqw solid var(--a2);outline-offset:.3cqw}
@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}
.dong-ket span:nth-child(even){font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.xoay{display:none}
@media (max-width:620px) and (orientation:portrait){.xoay{display:block;font:700 13px/1.4 var(--f-chu);color:var(--muted);text-align:center;padding:6px 0}}
#phude-dai{background:#0E1222;min-height:calc(2.7em + 18px);display:flex;align-items:center;justify-content:center;padding:8px 16px;font:700 clamp(14px,1.6vw,22px)/1.35 var(--f-chu)}
#phude{color:#FFF9EF;text-align:center;text-wrap:balance;max-width:60em}
#dk{background:var(--bar);color:var(--bar-fg);border-radius:0 0 14px 14px;display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap}
#dk button{background:transparent;color:inherit;border:0;font:800 16px/1 var(--f-chu);min-width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;padding:0 8px}
#dk button:hover:not([disabled]){background:rgba(255,255,255,.12)}
#dk button:focus-visible{outline:2px solid var(--sun)}
#dk button[disabled]{opacity:.35;cursor:default}
#dk button.bat{color:var(--sun)}
#thanh{flex:1 1 160px;min-width:120px;height:40px;display:flex;align-items:center;cursor:pointer;position:relative}
#thanh .ray{height:8px;width:100%;background:rgba(255,255,255,.18);border-radius:8px;position:relative}
#thanh .day{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:8px}
#thanh .num{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--coral)}
#thanh .moc{position:absolute;top:-3px;width:3px;height:14px;background:rgba(255,255,255,.45);border-radius:2px}
#thanh.khoa{cursor:default}
#nhan-thanh{font:700 13px/1.2 var(--f-chu);opacity:.85;position:absolute;left:0;top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#gio{font:700 13px/1 var(--f-chu);font-variant-numeric:tabular-nums;opacity:.85;min-width:84px;text-align:center}
.nho{font-size:13px!important}
@media (max-width:620px){#dk{gap:0;padding:4px 6px}#dk button{min-width:36px;height:38px;padding:0 6px}#gio{display:none}#thanh{flex:1 0 100%;order:9;height:30px}#nhan-thanh{font-size:12px}}
aside#ml{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
aside h2{font:800 15px/1.2 var(--f-hien);margin:0;letter-spacing:.02em}
#ds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#ds button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px;font:700 14px/1.25 var(--f-chu);color:var(--ink);cursor:pointer}
#ds button:hover:not([disabled]){background:color-mix(in srgb,var(--sun) 18%,transparent)}
#ds button:focus-visible{outline:2px solid var(--coral)}
#ds button.nay{background:color-mix(in srgb,var(--coral) 16%,transparent)}
#ds button[disabled]{opacity:.45;cursor:default}
#ds .kieu{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 12px/1 var(--f-chu);background:var(--paper);color:var(--muted)}
#ds .kieu.lam{background:color-mix(in srgb,var(--coral) 20%,transparent);color:var(--coral)}
#ds .tt{font:700 12px/1 var(--f-chu);color:var(--muted);font-variant-numeric:tabular-nums}
#ds .tt.ok{color:var(--mint)}
.cong[hidden]{display:none}
.cong{display:flex;align-items:center;gap:10px;font:700 13px/1.3 var(--f-chu);color:var(--muted);cursor:pointer}
.cong input{width:18px;height:18px;accent-color:var(--coral)}
details.ve{border-top:1px solid var(--line);padding-top:10px;font:500 13.5px/1.5 var(--f-chu);color:var(--ink)}
details.ve summary{font:800 14px/1.3 var(--f-hien);cursor:pointer}
details.ve p,details.ve ul{margin:8px 0}
details.ve ul{padding-left:18px}
details.ve b{font-weight:800}
.chan{font:700 12.5px/1.5 var(--f-chu);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:space-between}
.chan .nhap{color:var(--coral);letter-spacing:.06em;text-transform:uppercase;font-weight:800}
/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}
#stage.toi .tde2{color:color-mix(in srgb,var(--a1) 45%,#fff)}
#stage.toi .may{color:color-mix(in srgb,var(--chu-nen) 85%,transparent)!important;background:none!important}
.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}
.cot.kinh .trich{color:var(--chu);border-radius:1cqw;padding:1cqw 1.4cqw 1cqw 1.6cqw;text-shadow:none}
.trich{font:italic 400 calc(2.3cqw*var(--co,1))/1.4 var(--f-trich);color:var(--chu-nen);border-left:.5cqw solid var(--a1);padding:.3cqw 0 .3cqw 1.6cqw;text-shadow:0 0 .9cqw var(--halo)}
.trich b{color:var(--a1)}
.trich .ngoac{display:none}
.trich-nguon{font:700 calc(1.45cqw*var(--co,1))/1.3 var(--f-chu);font-style:normal;letter-spacing:.06em;margin-top:.8cqw;opacity:.8}
#stage[data-bc="trich-dan"] .trich{font-size:calc(3.5cqw*var(--co,1));line-height:1.35;border:0;padding:0 0 0 6.4cqw;position:relative;margin-bottom:1.2cqw}
#stage[data-bc="trich-dan"] .trich .ngoac{display:block;position:absolute;left:0;top:-1.4cqw;font:700 11cqw/1 var(--f-trich);font-style:normal;color:var(--a1);opacity:.85}
.tg-moc{text-align:center}
.tg-moc span{display:inline-block;background:var(--a1);color:#fff;border-radius:99px;padding:.45cqw 1.3cqw;font:800 calc(1.75cqw*var(--co,1))/1.2 var(--f-hien);box-shadow:0 .35cqw 0 var(--a1d);text-shadow:none}
.tg-cot .the{font-size:calc(1.75cqw*var(--co,1));text-align:center}
.tg-cot .dap{font-size:calc(2.4cqw*var(--co,1))}
.o-luoi{display:flex;flex-direction:column;gap:1cqw}
.o-luoi>.the,.o-luoi>.dap,.o-luoi>.lcd,.o-luoi>.trich{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.o-luoi>.the{font-size:calc(2.6cqw*var(--co,1));border-top:.7cqw solid var(--vien-o,var(--a1));padding:1.6cqw 2.2cqw}
.o-luoi>.dap{font-size:calc(3.4cqw*var(--co,1))}
.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}
.logo-truong img{height:3.6cqw;width:auto;display:block}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}
#stage[data-pc="so-tay"] .cot>.the{position:relative}
#stage[data-pc="so-tay"] .cot>.the::before{content:"";position:absolute;left:50%;top:-.8cqw;width:6.5cqw;height:1.6cqw;transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--a2) 55%,transparent);border-radius:.2cqw}
#stage[data-pc="so-tay"] .khung-anh{border-radius:.3cqw;border:.7cqw solid #fff;border-bottom-width:2.4cqw;box-shadow:0 .5cqw 1.4cqw var(--bong);transform:rotate(-1.4deg)}
#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}
#stage[data-pc="so-tay"] .dap{border-radius:.5cqw;transform:rotate(-1deg);box-shadow:0 .4cqw 1cqw var(--bong)}
#stage[data-pc="so-tay"] .nut-chon,#stage[data-pc="so-tay"] .nut-sk,#stage[data-pc="so-tay"] .o-phai,#stage[data-pc="so-tay"] .the-k{border-radius:.6cqw}
#stage[data-pc="so-tay"] .the-n{border-radius:.6cqw;box-shadow:0 .3cqw 1cqw var(--bong)}

/* --- Trang sách: giấy ngà, mực xanh, đỏ son, phẳng --- */
#stage[data-pc="trang-sach"] .the{background:color-mix(in srgb,var(--the) 55%,transparent);border-left:.45cqw solid var(--a1);border-radius:0 .5cqw .5cqw 0;box-shadow:none;font-weight:600}
#stage[data-pc="trang-sach"] .tde,#stage[data-pc="trang-sach"] .tieu-canh{font-weight:700;letter-spacing:-.01em}
#stage[data-pc="trang-sach"] .may{color:var(--a1);letter-spacing:.2em}
#stage[data-pc="trang-sach"] .dap{background:var(--chu);color:var(--nen);box-shadow:none;border-radius:.4cqw}
#stage[data-pc="trang-sach"] .khung-anh{border-radius:.3cqw;box-shadow:0 0 0 .5cqw var(--the),0 .5cqw 1.6cqw var(--bong)}
#stage[data-pc="trang-sach"] .chu-to{box-shadow:none;border:.2cqw solid var(--vien);border-radius:.4cqw;background:color-mix(in srgb,var(--the) 60%,transparent)}

const BAI = /*__BAI__*/{"ma": "hoa10-bai8-dinh-luat-tuan-hoan", "tieu_de": "Định luật tuần hoàn", "tieu_de_phu": "Ý nghĩa của bảng tuần hoàn: vị trí ⇄ tính chất", "mon": "Hoá học", "lop": "10", "cap": "thpt", "bo_sach": "Kết nối tri thức với cuộc sống", "bai": "Bài 8 · GV Nguyễn Thị Thơi", "trang_sgk": "SGK Hoá học 10, tr. 43–44", "yeu_cau_can_dat": ["Phát biểu được định luật tuần hoàn.", "Trình bày được ý nghĩa của bảng tuần hoàn các nguyên tố hoá học: mối liên hệ giữa vị trí (trong bảng tuần hoàn các nguyên tố hoá học) với tính chất và ngược lại."], "cau_sgk": {"MD": {"hoi": "Định luật tuần hoàn đóng vai trò như thế nào trong việc dự đoán tính chất của các chất?"}, "1": {"hoi": "Nêu một số tính chất của các đơn chất biến đổi tuần hoàn theo chu kì để minh hoạ nội dung của định luật tuần hoàn."}, "VD1": {"hoi": "Ví dụ 1: Nguyên tố sulfur (S) ở ô số 16, nhóm VIA, chu kì 3. Nêu cấu tạo nguyên tử và tính chất."}, "VD2": {"hoi": "Ví dụ 2: Cấu hình electron của nguyên tử phosphorus (P) là 1s²2s²2p⁶3s²3p³. Xác định vị trí và tính chất."}, "SS": {"hoi": "Ví dụ: So sánh tính phi kim của P (Z = 15) với N (Z = 7) và S (Z = 16)."}, "2": {"hoi": "Nguyên tố magnesium thuộc ô số 12, chu kì 3, nhóm IIA. a) Viết cấu hình electron, nêu một số tính chất cơ bản của đơn chất và oxide, hydroxide chứa magnesium. b) So sánh tính kim loại của magnesium với các nguyên tố lân cận."}, "3": {"hoi": "Potassium (Z = 19). a) Nêu vị trí của potassium trong bảng tuần hoàn. b) Nêu một số tính chất cơ bản của đơn chất và hợp chất chứa potassium."}, "EB": {"hoi": "Em có biết: Mendeleev dành chỗ trống và dự đoán tính chất của các nguyên tố chưa tìm ra."}}, "nguoi_dan": "nhan-vat", "nhan_vat": {"ten": "Bạn Ghim", "tinh_cach": "chiếc ghim định vị nhanh nhảu, ghim vào ô nào trong bảng tuần hoàn là đoán ngay tính chất nguyên tố ô đó", "ve": "chiếc ghim định vị hình giọt nước màu cam, mắt tròn to, má hồng, đeo thẻ «Z ?» trước ngực, chân đi giày xanh ngọc, phong cách hoạt hình 2D phẳng", "anh": "@nhan-vat", 0, Kết nối tri thức, tr. 43", "hinh": {"chu": "Định luật tuần hoàn"}, "dong": [{"sau": 20, "id": "c2-1"}, {"the": "Nguyên tố · đơn chất · **hợp chất**", "id": "c2-2"}, {"the": "Tuần hoàn = **lặp lại** theo chu kì", "id": "c2-3"}, {"the": "Theo chiều tăng **điện tích hạt nhân**", "id": "c2-4"}]}, {"ma": "c3", "loai": "chon", "ten": "Xếp theo đại lượng nào?", "muc": "biet", "yccd": [1], "sgk": ["MD"], "hoi": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của", "noi": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của đại lượng nào?", "lua": [{"chu": "khối lượng nguyên tử", "giai": "Khối lượng nguyên tử không dùng làm mốc: có nguyên tố nặng hơn vẫn đứng trước, ví dụ tellurium đứng trước iodine.", "sai_id": "c3-sai-1"}, {"chu": "điện tích hạt nhân nguyên tử", "dung": true}, {"chu": "số lớp electron", "giai": "Số lớp electron chỉ cho biết nguyên tố ở chu kì nào. Các nguyên tố trong cùng chu kì có cùng số lớp electron.", "sai_id": "c3-sai-3"}, {"chu": "số neutron trong hạt nhân", "giai": "Số neutron không quyết định vị trí. Các đồng vị của một nguyên tố khác số neutron mà vẫn ở cùng một ô.", "sai_id": "c3-sai-4"}], "vi_sao": "Định luật tuần hoàn: tính chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử, cũng là thứ tự xếp các ô trong bảng tuần hoàn.", "hoi_id": "c3-hoi", "vi_sao_id": "c3-vi-sao"}, {"ma": "c4", "loai": "trinh-bay", "ten": "«Tuần hoàn» là gì?", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["1"], "hinh": {"anh": "b08-rang-cua.png", "chu": "Độ âm điện các nguyên tố chu kì 2, 3 (vẽ theo Bảng 6.2 SGK)"}, "dong": [{"the": "Chu kì 2: Li → F **tăng**", "id": "c4-1"}, {"the": "Sang Na: **tụt xuống**, rồi lại tăng", "id": "c4-2"}, {"the": "Răng cưa = **tuần hoàn**", "id": "c4-3"}, {"the": "Bán kính · kim loại – phi kim · acid – base", "id": "c4-4"}]}, {"ma": "c5", "loai": "keo-tha", "ten": "Câu 1 SGK: kim loại hay phi kim?", "muc": "hieu", "yccd": [1], "sgk": ["1"], "diem": 2, "hoi": "Xếp mỗi đơn chất của chu kì 2 và chu kì 3 vào đúng nhóm.", "noi": "Bạn xếp mỗi đơn chất của chu kì hai và chu kì ba vào đúng nhóm: kim loại hay phi kim.", "nhom": ["Kim loại", "Phi kim"], "the": [{"chu": "Li", "nhom": 0}, {"chu": "Na", "nhom": 0}, {"chu": "Mg", "nhom": 0}, {"chu": "Al", "nhom": 0}, {"chu": "O", "nhom": 1}, {"chu": "S", "nhom": 1}, {"chu": "Cl", "nhom": 1}], "giai": "Trong một chu kì, đầu chu kì là kim loại, cuối chu kì là phi kim. Bạn nhìn vị trí nhóm của từng nguyên tố.", "vi_sao": "Đúng hết! Chu kì 2: Li, Be là kim loại; O, F là phi kim (B ở giữa là á kim). Chu kì 3: Na, Mg, Al là kim loại; S, Cl là phi kim. Hai chu kì lặp lại cùng một kiểu: tính kim loại giảm, tính phi kim tăng.", "hoi_id": "c5-hoi", "sai_id": "c5-sai", "vi_sao_id": "c5-vi-sao"}, {"ma": "c6", "loai": "chon", "ten": "Câu 1 SGK: lặp lại ở đâu?", "muc": "hieu", "yccd": [1], "sgk": ["1"], "hoi": "F ở cuối chu kì 2 là phi kim rất mạnh. Sang chu kì 3, Na đứng đầu chu kì. Na có tính chất giống nguyên tố nào ở chu kì 2 nhất?", "noi": "Flo ở cuối chu kì hai là phi kim rất mạnh. Sang chu kì ba, na-tri đứng đầu chu kì. Na-tri có tính chất giống nguyên tố nào ở chu kì hai nhất?", "lua": [{"chu": "F", "giai": "F là phi kim rất mạnh, còn Na là kim loại điển hình. Tính chất không nối tiếp mà quay về đầu.", "sai_id": "c6-sai-1"}, {"chu": "Li", "dung": true}, {"chu": "O", "giai": "O là phi kim mạnh ở cuối chu kì 2, không giống Na.", "sai_id": "c6-sai-3"}, {"chu": "Be", "giai": "Be là kim loại yếu, cùng nhóm với Mg. Na đứng đầu chu kì nên giống nguyên tố đứng đầu chu kì 2.", "sai_id": "c6-sai-4"}], "vi_sao": "Li và Na cùng đứng đầu chu kì, cùng nhóm IA, đều là kim loại mạnh. Tính chất quay về như đầu chu kì trước: đó là sự tuần hoàn.", "hoi_id": "c6-hoi", "vi_sao_id": "c6-vi-sao"}, {"ma": "c7", "loai": "trinh-bay", "ten": "Ý nghĩa của bảng tuần hoàn", "nen": "xanh-la", "bo_cuc": "trai-phai", "sgk": ["MD"], "hinh": {"anh": "b08-so-do.png", "chu": "Mối liên hệ: cấu hình electron, vị trí, tính chất (vẽ lại theo SGK tr. 43)"}, "dong": [{"the": "Vị trí → **cấu hình electron**", "id": "c7-1"}, {"the": "Cấu hình ⇄ vị trí", "id": "c7-2"}, {"the": "Cấu hình electron **quyết định** tính chất", "id": "c7-3"}, {"the": "Biết vị trí → **dự đoán** tính chất", "id": "c7-4"}]}, {"ma": "c8", "loai": "trinh-bay", "ten": "Ví dụ 1: từ vị trí đọc ra cấu tạo", "nen": "kem", "bo_cuc": "luoi-4", "sgk": ["VD1"], "hinh": {"anh": "b08-o-s.png", "chu": "Nguyên tố sulfur trong bảng tuần hoàn (theo Ví dụ 1, SGK tr. 43)"}, "dong": [{"id": "c8-1"}, {"the": "Số thứ tự ô = **Z**", "id": "c8-2"}, {"the": "Số thứ tự chu kì = **số lớp electron**", "id": "c8-3"}, {"the": "Số thứ tự nhóm A = **số e lớp ngoài cùng**", "id": "c8-4"}]}, {"ma": "c9", "loai": "noi", "ten": "Ví dụ 1: cấu tạo nguyên tử S", "muc": "hieu", "yccd": [2], "sgk": ["VD1"], "hoi": "Nối thông tin vị trí với cấu tạo nguyên tử S.", "noi": "Bạn nối mỗi thông tin vị trí của lưu huỳnh với điều nó cho biết về nguyên tử lưu huỳnh.", "giai": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng.", "vi_sao": "Đúng hết! Ô 16 → 16 proton, 16 electron; chu kì 3 → 3 lớp electron; nhóm VIA → 6 electron lớp ngoài cùng. Cấu hình electron của S: 1s²2s²2p⁶3s²3p⁴.", "phai": ["16 proton, 16 electron", "3 lớp electron", "6 lớp electron", "6 electron lớp ngoài cùng"], "trai": [{"chu": "Ô số 16"}, {"chu": "Chu kì 3"}, {"chu": "Nhóm VIA"}], "dap": [0, 1, 3], "hoi_id": "c9-hoi", "sai_id": "c9-sai", "vi_sao_id": "c9-vi-sao", "sai_rieng": {"2": "c9-sai-2"}}, {"ma": "c10", "loai": "trinh-bay", "ten": "Ví dụ 2: từ cấu hình tìm vị trí", "nen": "cam", "bo_cuc": "trai-phai", "sgk": ["VD1", "VD2"], "hinh": {"anh": "b08-o-p.png", "chu": "Từ cấu hình electron của phosphorus tìm vị trí (theo Ví dụ 2, SGK tr. 44)"}, "dong": [{"the": "S: phi kim · SO₃ · **H₂SO₄ acid mạnh**", "id": "c10-1"}, {"the": "P: 1s²2s²2p⁶3s²3p³", "id": "c10-2"}, {"the": "Tổng e = 15 → **ô 15**", "id": "c10-3"}, {"the": "3 lớp → **chu kì 3** · 5 e → **nhóm VA**", "id": "c10-4"}, {"the": "P₂O₅ · **H₃PO₄ acid trung bình**", "id": "c10-5"}]}, {"ma": "c11", "loai": "dien", "ten": "Luyện: tìm ô số", "muc": "van-dung", "yccd": [2], "sgk": ["VD2"], "hoi": "Nguyên tố X có cấu hình electron 1s²2s²2p⁶3s²3p⁵. X ở ô số mấy?", "noi": "Nguyên tố X có cấu hình electron một ét hai, hai ét hai, hai pê sáu, ba ét hai, ba pê năm. X ở ô số mấy? Bạn gõ số vào ô nhé.", "dap": ["17", "mười bảy", "muoi bay"], "giai": "Bạn cộng các số mũ: 2 + 2 + 6 + 2 + 5. Tổng số electron bằng Z, chính là số thứ tự ô.", "vi_sao": "2 + 2 + 6 + 2 + 5 = 17 electron, nên Z = 17: X ở ô số 17. Đó là chlorine (Cl).", "hoi_id": "c11-hoi", "sai_id": "c11-sai", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Luyện: vị trí và tính chất của X", "muc": "van-dung", "yccd": [2], "sgk": ["VD2"], "hoi": "X có cấu hình 1s²2s²2p⁶3s²3p⁵. Nhận định nào đúng về X?", "noi": "Vẫn nguyên tố X đó. Nhận định nào đúng về vị trí và tính chất của X?", "lua": [{"chu": "Chu kì 3, nhóm VA; là kim loại", "giai": "Lớp ngoài cùng 3s²3p⁵ có 2 + 5 = 7 electron, nên ở nhóm VIIA. Có 7 electron lớp ngoài cùng là phi kim.", "sai_id": "c12-sai-1"}, {"chu": "Chu kì 3, nhóm VIIA; là phi kim, hydroxide cao nhất HClO₄ là acid rất mạnh", "dung": true}, {"chu": "Chu kì 5, nhóm VIIA; là phi kim", "giai": "Chu kì bằng số lớp electron. Lớp ngoài cùng là lớp 3, nên X ở chu kì 3.", "sai_id": "c12-sai-3"}, {"chu": "Chu kì 3, nhóm VIIA; oxide cao nhất là basic oxide", "giai": "X là phi kim cuối chu kì 3, oxide cao nhất Cl₂O₇ là acidic oxide.", "sai_id": "c12-sai-4"}], "vi_sao": "3 lớp electron → chu kì 3; 7 electron lớp ngoài cùng → nhóm VIIA. X (Cl) là phi kim mạnh; Cl₂O₇ là acidic oxide, HClO₄ là acid rất mạnh (Bảng 7.2).", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "trinh-bay", "ten": "So sánh với nguyên tố xung quanh", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["SS"], "hinh": {"anh": "b08-lan-can-p.png", "chu": "P và hai nguyên tố xung quanh: N cùng nhóm, S cùng chu kì"}, "dong": [{"the": "So sánh với **nguyên tố xung quanh**", "id": "c13-1"}, {"the": "Cùng nhóm: **N > P**", "id": "c13-2"}, {"id": "c13-3"}, {"the": "Cùng chu kì: **P < S**", "id": "c13-4"}]}, {"ma": "c13b", "loai": "chon", "ten": "Luyện: so sánh tính phi kim của S", "muc": "van-dung", "yccd": [2], "sgk": ["SS"], "hoi": "S ở chu kì 3, nhóm VIA. So sánh tính phi kim của S với O (cùng nhóm, ở trên) và Cl (cùng chu kì, bên phải).", "noi": "Đến lượt bạn. Lưu huỳnh ở chu kì ba, nhóm sáu A. So sánh tính phi kim của lưu huỳnh với ô-xi ở ngay trên và clo ở bên phải nhé.", "lua": [{"chu": "O mạnh hơn S; Cl mạnh hơn S", "dung": true}, {"chu": "S mạnh hơn O; S mạnh hơn Cl", "giai": "Trong nhóm, đi lên trên tính phi kim mạnh hơn; trong chu kì, sang phải tính phi kim mạnh hơn. S ở dưới O và bên trái Cl.", "sai_id": "c13b-sai-2"}, {"chu": "S mạnh hơn O; Cl mạnh hơn S", "giai": "O và S cùng nhóm VIA, O ở trên nên O có tính phi kim mạnh hơn S.", "sai_id": "c13b-sai-3"}, {"chu": "O mạnh hơn S; S mạnh hơn Cl", "giai": "S và Cl cùng chu kì 3, Cl ở bên phải nên Cl có tính phi kim mạnh hơn S.", "sai_id": "c13b-sai-4"}], "vi_sao": "Cùng nhóm VIA: O ở trên nên phi kim mạnh hơn S. Cùng chu kì 3: Cl ở bên phải nên phi kim mạnh hơn S. Làm giống hệt ví dụ so sánh P với N và S.", "hoi_id": "c13b-hoi", "vi_sao_id": "c13b-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Câu 2a SGK: magnesium", "muc": "van-dung", "yccd": [2], "sgk": ["2"], "hinh": {"anh": "b08-lan-can-mg.png"}, "hoi": "Magnesium ở ô số 12, chu kì 3, nhóm IIA. Nhận định nào đúng?", "noi": "Ma-giê ở ô số mười hai, chu kì ba, nhóm hai A. Bạn viết nháp cấu hình electron, rồi chọn nhận định đúng.", "lua": [{"chu": "1s²2s²2p⁶3s²3p²; Mg là phi kim", "giai": "Ô 12 thì chỉ có 12 electron. Cấu hình này có 14 electron, của Si.", "sai_id": "c14-sai-1"}, {"chu": "1s²2s²2p⁶3s²; Mg là kim loại; MgO là basic oxide, Mg(OH)₂ là base", "dung": true}, {"chu": "1s²2s²2p⁶3s²; Mg là phi kim; MgO là acidic oxide", "giai": "Mg có 2 electron lớp ngoài cùng, dễ nhường electron, nên là kim loại. Oxide của kim loại này là basic oxide.", "sai_id": "c14-sai-3"}, {"chu": "1s²2s²2p⁶3s¹; Mg là kim loại", "giai": "Cấu hình này chỉ có 11 electron, của Na. Mg có 12 electron.", "sai_id": "c14-sai-4"}], "vi_sao": "Mg có 12 electron: 1s²2s²2p⁶3s², 2 electron lớp ngoài cùng nên là kim loại. MgO là basic oxide, Mg(OH)₂ là base.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "keo-tha", "ten": "Câu 2b SGK: so sánh tính kim loại", "muc": "van-dung", "yccd": [2], "sgk": ["2"], "diem": 2, "hoi": "So với Mg, mỗi nguyên tố lân cận có tính kim loại mạnh hơn hay yếu hơn?", "noi": "Quanh ma-giê có bốn nguyên tố: na-tri bên trái, nhôm bên phải, be-ri-li ở trên, can-xi ở dưới. So với ma-giê, mỗi nguyên tố có tính kim loại mạnh hơn hay yếu hơn?", "nhom": ["Mạnh hơn Mg", "Yếu hơn Mg"], "the": [{"chu": "Na", "nhom": 0}, {"chu": "Ca", "nhom": 0}, {"chu": "Al", "nhom": 1}, {"chu": "Be", "nhom": 1}], "giai": "Trong chu kì, từ trái sang phải tính kim loại giảm. Trong nhóm, từ trên xuống dưới tính kim loại tăng.", "vi_sao": "Đúng hết! Cùng chu kì 3: Na > Mg > Al. Cùng nhóm IIA: Be < Mg < Ca.", "hoi_id": "c15-hoi", "sai_id": "c15-sai", "vi_sao_id": "c15-vi-sao"}, {"ma": "c16", "loai": "chon", "ten": "Câu 3a SGK: vị trí của potassium", "muc": "van-dung", "yccd": [2], "sgk": ["3"], "hoi": "Potassium có Z = 19. Bạn viết nháp cấu hình electron, rồi chọn vị trí đúng của potassium.", "noi": "Ka-li có Z bằng mười chín. Bạn viết nháp cấu hình electron, rồi chọn vị trí đúng của ka-li.", "lua": [{"chu": "Ô 19, chu kì 3, nhóm VIIIA", "giai": "Lớp 3 có 3s²3p⁶ nhưng electron cuối cùng đã sang lớp 4 (4s¹). K có 4 lớp electron.", "sai_id": "c16-sai-1"}, {"chu": "Ô 19, chu kì 4, nhóm IIA", "giai": "Lớp ngoài cùng 4s¹ chỉ có 1 electron, nên ở nhóm IA.", "sai_id": "c16-sai-2"}, {"chu": "Ô 19, chu kì 4, nhóm IA", "dung": true}, {"chu": "Ô 19, chu kì 1, nhóm IVA", "giai": "Số chu kì là số lớp electron (4 lớp), không phải số electron lớp ngoài cùng.", "sai_id": "c16-sai-4"}], "vi_sao": "Cấu hình electron của K: 1s²2s²2p⁶3s²3p⁶4s¹. Có 4 lớp electron → chu kì 4; 1 electron lớp ngoài cùng → nhóm IA.", "hoi_id": "c16-hoi", "vi_sao_id": "c16-vi-sao"}, {"ma": "c17", "loai": "chon", "ten": "Câu 3b SGK: tính chất của potassium", "muc": "van-dung", "yccd": [2], "sgk": ["3"], "hoi": "Nhận định nào đúng về tính chất của potassium và hợp chất của nó?", "noi": "Ka-li đứng đầu chu kì bốn, ngay dưới na-tri. Nhận định nào đúng về tính chất của ka-li và hợp chất của nó?", "lua": [{"chu": "K là phi kim; K₂O là acidic oxide", "giai": "K có 1 electron lớp ngoài cùng, rất dễ nhường electron nên là kim loại.", "sai_id": "c17-sai-1"}, {"chu": "K là kim loại yếu hơn Na, vì K nằm dưới Na", "giai": "Trong một nhóm, đi từ trên xuống dưới tính kim loại tăng. K nằm dưới Na nên mạnh hơn Na.", "sai_id": "c17-sai-2"}, {"chu": "K là kim loại mạnh hơn Na; K₂O là basic oxide, tác dụng với nước tạo KOH là base mạnh", "dung": true}, {"chu": "K là kim loại; KOH là hydroxide lưỡng tính", "giai": "Hydroxide của kim loại nhóm IA là base mạnh, không lưỡng tính.", "sai_id": "c17-sai-4"}], "vi_sao": "K là kim loại kiềm (nhóm IA), mạnh hơn Na và Ca. K₂O là basic oxide, tác dụng với nước tạo KOH là base mạnh.", "hoi_id": "c17-hoi", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "trinh-bay", "ten": "Em có biết: dự đoán nguyên tố chưa tìm ra", "nen": "xanh-la", "bo_cuc": "trich-dan", "sac": "bi-an", "sgk": ["EB"], "trich": "Thứ nhất, ông đã dành chỗ trống cho các nguyên tố khi đó chưa được tìm ra và dự đoán tính chất của chúng (ví dụ: nguyên tố gallium và germanium).", "trich_nguon": "Mục Em có biết, SGK Hoá học 10, Kết nối tri thức, tr. 43", "hinh": {"chu": "Dự đoán từ vị trí"}, "dong": [{"id": "c18-1"}, {"sau": 20, "id": "c18-2"}, {"the": "Chỗ trống → **dự đoán** tính chất", "id": "c18-3"}, {"the": "Đến lượt bạn!", "id": "c18-4"}]}, {"ma": "c19", "loai": "chon", "ten": "Dự đoán nguyên tố số 87", "muc": "van-dung", "yccd": [2], "sgk": ["EB"], "hoi": "Nguyên tố số 87 không có trong tự nhiên. Biết nguyên tố số 86 là khí hiếm kết thúc chu kì 6. Dự đoán nào đúng về nguyên tố số 87?", "noi": "Nguyên tố số tám mươi bảy không có trong tự nhiên. Biết nguyên tố số tám mươi sáu là khí hiếm kết thúc chu kì sáu. Bạn dự đoán nguyên tố số tám mươi bảy nhé.", "lua": [{"chu": "Chu kì 6, nhóm VIIIA, là khí hiếm", "giai": "Chu kì 6 đã kết thúc ở nguyên tố số 86. Nguyên tố số 87 mở đầu chu kì mới.", "sai_id": "c19-sai-1"}, {"chu": "Chu kì 7, nhóm VIIA, là phi kim mạnh", "giai": "Mở đầu chu kì mới, lớp ngoài cùng mới có 1 electron, nên ở nhóm IA chứ không phải VIIA.", "sai_id": "c19-sai-2"}, {"chu": "Chu kì 7, nhóm IA, là kim loại mạnh", "dung": true}, {"chu": "Chu kì 8, nhóm IA, là kim loại mạnh", "giai": "Sau chu kì 6 là chu kì 7. Nguyên tố số 87 có 7 lớp electron.", "sai_id": "c19-sai-4"}], "vi_sao": "Sau khí hiếm số 86 là chu kì 7. Nguyên tố số 87 có 7 lớp electron, 1 electron lớp ngoài cùng → chu kì 7, nhóm IA, là kim loại kiềm, tính kim loại mạnh vì nằm ở cuối nhóm.", "hoi_id": "c19-hoi", "vi_sao_id": "c19-vi-sao"}, {"ma": "c20", "loai": "chon", "ten": "Trả lời câu hỏi đầu bài", "muc": "hieu", "yccd": [1, 2], "sgk": ["MD"], "hoi": "Định luật tuần hoàn giúp gì trong việc dự đoán tính chất của các chất?", "noi": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Định luật tuần hoàn giúp gì trong việc dự đoán tính chất của các chất?", "lua": [{"chu": "Biết vị trí hoặc cấu hình electron của nguyên tố, ta dự đoán được tính chất của nguyên tố, đơn chất, hợp chất và so sánh với nguyên tố xung quanh", "dung": true}, {"chu": "Chỉ giúp tính khối lượng nguyên tử của nguyên tố", "giai": "Định luật nói về tính chất của nguyên tố, đơn chất và hợp chất, không dùng để tính khối lượng nguyên tử.", "sai_id": "c20-sai-2"}, {"chu": "Chỉ dự đoán được tính chất của những nguyên tố đã tìm ra", "giai": "Mendeleev đã dự đoán tính chất của gallium, germanium khi chúng chưa được tìm ra.", "sai_id": "c20-sai-3"}, {"chu": "Không giúp gì, vì phải làm thí nghiệm mới biết tính chất", "giai": "Thí nghiệm để kiểm chứng. Nhưng nhờ quy luật tuần hoàn, ta dự đoán được trước tính chất.", "sai_id": "c20-sai-4"}], "vi_sao": "Vị trí ⇄ cấu hình electron → tính chất. Nhờ định luật tuần hoàn, biết vị trí hoặc cấu hình electron là dự đoán được tính chất, viết được công thức oxide, hydroxide và so sánh với các nguyên tố xung quanh.", "hoi_id": "c20-hoi", "vi_sao_id": "c20-vi-sao"}, {"ma": "c21", "loai": "ghi-nho", "ten": "Điều cần nhớ", "sgk": ["MD"], "y": [{"chu": "Định luật tuần hoàn", "dam": "theo chiều tăng Z"}, {"chu": "Ý nghĩa", "dam": "Cấu hình ⇄ Vị trí → Tính chất"}, {"chu": "Từ vị trí", "dam": "Cấu hình · Kim loại/phi kim · Oxide, hydroxide"}], "o_nha": "Câu 2, 3 SGK tr. 44: viết vào vở cấu hình electron, vị trí và tính chất của magnesium và potassium (đơn chất, oxide, hydroxide) để đối chiếu ở tiết sau.", "dong": [{"id": "c21-1"}, {"id": "c21-2"}, {"id": "c21-3"}, {"id": "c21-4"}]}, {"ma": "ket", "loai": "ket-qua", "ten": "Kết quả"}], "dan_hinh": {"nhan-vat": {"ve": "Bạn Ghim đứng thẳng, mỉm cười", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat.png", "loai": "nhan-vat"}, "ghim-ngam": {"ve": "Bạn Ghim, miệng ngậm", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "ghim-ngam.png", "loai": "nhan-vat"}, "ghim-he": {"ve": "Bạn Ghim, miệng hé", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "ghim-he.png", "loai": "nhan-vat"}, "ghim-mo": {"ve": "Bạn Ghim, miệng mở", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "ghim-mo.png", "loai": "nhan-vat"}, "nhan-vat-vui": {"ve": "Bạn Ghim giơ hai tay vui mừng, có ngôi sao", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat-vui.png", "loai": "nhan-vat"}, "nhan-vat-nghi": {"ve": "Bạn Ghim suy nghĩ", "nguon": "Hình vẽ của người soạn (vẽ bằng máy)", "tep": "nhan-vat-nghi.png", "loai": "nhan-vat"}}, "phong_cach": "thi-nghiem", "bang_mau": {"nen": "#F3FAF8", "chu": "#0B2E33", "a1": "#0F766E", "a2": "#EA580 const MEDIA = /*__MEDIA__*/{"c1-1": {"d": 5.88, "s": "media/c1-1.mp3", "loai": "am", "chu": "Chào các bạn lớp Mười! Mình là Ghim, một chiếc ghim định vị."}, "c1-2": {"d": 10.032, "s": "media/c1-2.mp3", "loai": "am", "chu": "Ghim vào ô nào trong bảng tuần hoàn, mình đoán ngay được tính chất của nguyên tố ô đó. Hôm nay mình cùng cô Thơi dẫn các bạn học Bài 8 nhé."}, "c1-3": {"d": 5.4, "s": "media/c1-3.mp3", "loai": "am", "chu": "Định luật tuần hoàn đóng vai trò như thế nào trong việc dự đoán tính chất của các chất?"}, "c1-4": {"d": 4.104, "s": "media/c1-4.mp3", "loai": "am", "chu": "Cuối bài, bạn sẽ tự trả lời được câu hỏi này."}, "c2-1": {"d": 6.36, "s": "media/c2-1.mp3", "loai": "am", "chu": "Đây là nội dung định luật tuần hoàn. Bạn đọc thầm hai lần trên màn hình nhé."}, "c2-2": {"d": 5.424, "s": "media/c2-2.mp3", "loai": "am", "chu": "Định luật nói về ba thứ: nguyên tố, đơn chất và hợp chất của chúng."}, "c2-3": {"d": 5.736, "s": "media/c2-3.mp3", "loai": "am", "chu": "Tính chất của chúng biến đổi tuần hoàn, nghĩa là cứ sau một chu kì lại lặp lại."}, "c2-4": {"d": 7.176, "s": "media/c2-4.mp3", "loai": "am", "chu": "Và mốc để xếp là chiều tăng của điện tích hạt nhân nguyên tử. Bạn nhớ kĩ cụm từ này nhé."}, "c3-hoi": {"d": 6.48, "s": "media/c3-hoi.mp3", "loai": "am", "chu": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của đại lượng nào?"}, "c3-sai-1": {"d": 7.368, "s": "media/c3-sai-1.mp3", "loai": "am", "chu": "Khối lượng nguyên tử không dùng làm mốc: có nguyên tố nặng hơn vẫn đứng trước, ví dụ tellurium đứng trước iodine."}, "c3-sai-3": {"d": 8.688, "s": "media/c3-sai-3.mp3", "loai": "am", "chu": "Số lớp electron chỉ cho biết nguyên tố ở chu kì nào. Các nguyên tố trong cùng chu kì có cùng số lớp electron."}, "c3-sai-4": {"d": 8.136, "s": "media/c3-sai-4.mp3", "loai": "am", "chu": "Số neutron không quyết định vị trí. Các đồng vị của một nguyên tố khác số neutron mà vẫn ở cùng một ô."}, "c3-vi-sao": {"d": 8.64, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Định luật tuần hoàn: tính chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử, cũng là thứ tự xếp các ô trong bảng tuần hoàn."}, "c4-1": {"d": 7.104, "s": "media/c4-1.mp3", "loai": "am", "chu": "Bạn nhìn đồ thị độ âm điện. Từ Li đến F, độ âm điện tăng dần."}, "c4-2": {"d": 6.696, "s": "media/c4-2.mp3", "loai": "am", "chu": "Sang Na, bắt đầu chu kì mới, độ âm điện tụt xuống, rồi lại tăng dần đến Cl."}, "c4-3": {"d": 6.864, "s": "media/c4-3.mp3", "loai": "am", "chu": "Đồ thị như răng cưa: hết một chu kì lại lặp lại. Đó chính là tuần hoàn."}, "c4-4": {"d": 9.096, "s": "media/c4-4.mp3", "loai": "am", "chu": "Bán kính nguyên tử, tính kim loại, tính phi kim, tính acid và base cũng lặp lại như vậy, bạn đã gặp ở Bài 6 và Bài 7."}, "c5-hoi": {"d": 6.36, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Bạn xếp mỗi đơn chất của chu kì hai và chu kì ba vào đúng nhóm: kim loại hay phi kim."}, "c5-sai": {"d": 8.856, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Trong một chu kì, đầu chu kì là kim loại, cuối chu kì là phi kim. Bạn nhìn vị trí nhóm của từng nguyên tố."}, "c5-vi-sao": {"d": 21.6, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Chu kì 2: Li, Be là kim loại; O, F là phi kim (B ở giữa là á kim). Chu kì 3: Na, Mg, Al là kim loại; S, Cl là phi kim. Hai chu kì lặp lại cùng một kiểu: tính kim loại giảm, tính phi kim tăng."}, "c6-hoi": {"d": 11.832, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Flo ở cuối chu kì hai là phi kim rất mạnh. Sang chu kì ba, na-tri đứng đầu chu kì. Na-tri có tính chất giống nguyên tố nào ở chu kì hai nhất?"}, "c6-sai-1": {"d": 7.704, "s": "media/c6-sai-1.mp3", "loai": "am", "chu": "F là phi kim rất mạnh, còn Na là kim loại điển hình. Tính chất không nối tiếp mà quay về đầu."}, "c6-sai-3": {"d": 4.56, "s": "media/c6-sai-3.mp3", "loai": "am", "chu": "O là phi kim mạnh ở cuối chu kì 2, không giống Na."}, "c6-sai-4": {"d": 7.176, "s": "media/c6-sai-4.mp3", "loai": "am", "chu": "Be là kim loại yếu, cùng nhóm với Mg. Na đứng đầu chu kì nên giống nguyên tố đứng đầu chu kì 2."}, "c6-vi-sao": {"d": 10.392, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Li và Na cùng đứng đầu chu kì, cùng nhóm IA, đều là kim loại mạnh. Tính chất quay về như đầu chu kì trước: đó là sự tuần hoàn."}, "c7-1": {"d": 5.4, "s": "media/c7-1.mp3", "loai": "am", "chu": "Vị trí của nguyên tố trong bảng tuần hoàn cho biết cấu hình electron nguyên tử."}, "c7-2": {"d": 7.752, "s": "media/c7-2.mp3", "loai": "am", "chu": "Ngược lại, biết cấu hình electron, ta tìm được vị trí. Hai mũi tên đi cả hai chiều."}, "c7-3": {"d": 3.984, "s": "media/c7-3.mp3", "loai": "am", "chu": "Cấu hình electron quyết định tính chất của nguyên tố."}, "c7-4": {"d": 6.84, "s": "media/c7-4.mp3", "loai": "am", "chu": "Vì vậy, biết vị trí hoặc cấu hình electron, ta dự đoán được tính chất hoá học của nguyên tố."}, "c8-1": {"d": 6.288, "s": "media/c8-1.mp3", "loai": "am", "chu": "Mình ghim vào ô của sulfur: ô số 16, chu kì 3, nhóm VIA."}, "c8-2": {"d": 7.608, "s": "media/c8-2.mp3", "loai": "am", "chu": "Bạn nhớ ba quy tắc ở Bài 5. Số thứ tự ô bằng số proton và bằng số electron."}, "c8-3": {"d": 3.912, "s": "media/c8-3.mp3", "loai": "am", "chu": "Số thứ tự chu kì bằng số lớp electron."}, "c8-4": {"d": 7.8, "s": "media/c8-4.mp3", "loai": "am", "chu": "Số thứ tự nhóm A bằng số electron lớp ngoài cùng. Giờ bạn thử đọc cấu tạo của S nhé!"}, "c9-hoi": {"d": 5.784, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Bạn nối mỗi thông tin vị trí của lưu huỳnh với điều nó cho biết về nguyên tử lưu huỳnh."}, "c9-sai": {"d": 7.056, "s": "media/c9-sai.mp3", "loai": "am", "chu": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng."}, "c9-vi-sao": {"d": 15.528, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Ô 16 → 16 proton, 16 electron; chu kì 3 → 3 lớp electron; nhóm VIA → 6 electron lớp ngoài cùng. Cấu hình electron của S: 1s²2s²2p⁶3s²3p⁴."}, "c9-sai-2": {"d": 8.328, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "Số 6 của nhóm VIA là số electron lớp ngoài cùng. Số lớp electron lấy theo chu kì: 3 lớp."}, "c10-1": {"d": 12.024, "s": "media/c10-1.mp3", "loai": "am", "chu": "Có cấu tạo rồi, ta suy ra tính chất. S là phi kim, oxide cao nhất SO₃ là acidic oxide, acid tương ứng H₂SO₄ là acid mạnh."}, "c10-2": {"d": 9.912, "s": "media/c10-2.mp3", "loai": "am", "chu": "Bây giờ đi chiều ngược lại. Phosphorus có cấu hình 1s²2s²2p⁶3s²3p³."}, "c10-3": {"d": 6.648, "s": "media/c10-3.mp3", "loai": "am", "chu": "Đếm tổng số electron được 15, vậy Z bằng 15, P ở ô số 15."}, "c10-4": {"d": 7.92, "s": "media/c10-4.mp3", "loai": "am", "chu": "Có 3 lớp electron nên ở chu kì 3. Có 5 electron lớp ngoài cùng nên ở nhóm VA."}, "c10-5": {"d": 9.696, "s": "media/c10-5.mp3", "loai": "am", "chu": "P là phi kim. Oxide cao nhất P₂O₅ là acidic oxide, acid tương ứng H₃PO₄ là acid trung bình."}, "c11-hoi": {"d": 12.888, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Nguyên tố X có cấu hình electron một ét hai, hai ét hai, hai pê sáu, ba ét hai, ba pê năm. X ở ô số mấy? Bạn gõ số vào ô nhé."}, "c11-sai": {"d": 9.408, "s": "media/c11-sai.mp3", "loai": "am", "chu": "Bạn cộng các số mũ: 2 + 2 + 6 + 2 + 5. Tổng số electron bằng Z, chính là số thứ tự ô."}, "c11-vi-sao": {"d": 11.016, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "2 + 2 + 6 + 2 + 5 = 17 electron, nên Z = 17: X ở ô số 17. Đó là chlorine (Cl)."}, "c12-hoi": {"d": 6.264, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Vẫn nguyên tố X đó. Nhận định nào đúng về vị trí và tính chất của X?"}, "c12-sai-1": {"d": 9.984, "s": "media/c12-sai-1.mp3", "loai": "am", "chu": "Lớp ngoài cùng 3s²3p⁵ có 2 + 5 = 7 electron, nên ở nhóm VIIA. Có 7 electron lớp ngoài cùng là phi kim."}, "c12-sai-3": {"d": 7.368, "s": "media/c12-sai-3.mp3", "loai": "am", "chu": "Chu kì bằng số lớp electron. Lớp ngoài cùng là lớp 3, nên X ở chu kì 3."}, "c12-sai-4": {"d": 5.928, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "X là phi kim cuối chu kì 3, oxide cao nhất Cl₂O₇ là acidic oxide."}, "c12-vi-sao": {"d": 14.736, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "3 lớp electron → chu kì 3; 7 electron lớp ngoài cùng → nhóm VIIA. X (Cl) là phi kim mạnh; Cl₂O₇ là acidic oxide, HClO₄ là acid rất mạnh (Bảng 7.2)."}, "c13-1": {"d": 6.144, "s": "media/c13-1.mp3", "loai": "am", "chu": "Dựa vào định luật tuần hoàn, ta còn so sánh được một nguyên tố với các nguyên tố xung quanh."}, "c13-2": {"d": 9.264, "s": "media/c13-2.mp3", "loai": "am", "chu": "So sánh tính phi kim của P với N và S. P và N cùng nhóm VA, N ở trên."}, "c13-3": {"d": 7.56, "s": "media/c13-3.mp3", "loai": "am", "chu": "Trong nhóm, đi lên trên tính phi kim mạnh hơn. Nên N có tính phi kim mạnh hơn P."}, "c13-4": {"d": 8.568, "s": "media/c13-4.mp3", "loai": "am", "chu": "P và S cùng chu kì 3, S ở bên phải. Nên P có tính phi kim yếu hơn S."}, "c13b-hoi": {"d": 10.056, "s": "media/c13b-hoi.mp3", "loai": "am", "chu": "Đến lượt bạn. Lưu huỳnh ở chu kì ba, nhóm sáu A. So sánh tính phi kim của lưu huỳnh với ô-xi ở ngay trên và clo ở bên phải nhé."}, "c13b-sai-2": {"d": 10.224, "s": "media/c13b-sai-2.mp3", "loai": "am", "chu": "Trong nhóm, đi lên trên tính phi kim mạnh hơn; trong chu kì, sang phải tính phi kim mạnh hơn. S ở dưới O và bên trái Cl."}, "c13b-sai-3": {"d": 5.616, "s": "media/c13b-sai-3.mp3", "loai": "am", "chu": "O và S cùng nhóm VIA, O ở trên nên O có tính phi kim mạnh hơn S."}, "c13b-sai-4": {"d": 7.176, "s": "media/c13b-sai-4.mp3", "loai": "am", "chu": "S và Cl cùng chu kì 3, Cl ở bên phải nên Cl có tính phi kim mạnh hơn S."}, "c13b-vi-sao": {"d": 11.232, "s": "media/c13b-vi-sao.mp3", "loai": "am", "chu": "Cùng nhóm VIA: O ở trên nên phi kim mạnh hơn S. Cùng chu kì 3: Cl ở bên phải nên phi kim mạnh hơn S. Làm giống hệt ví dụ so sánh P với N và S."}, "c14-hoi": {"d": 8.256, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Ma-giê ở ô số mười hai, chu kì ba, nhóm hai A. Bạn viết nháp cấu hình electron, rồi chọn nhận định đúng."}, "c14-sai-1": {"d": 7.752, "s": "media/c14-sai-1.mp3", "loai": "am", "chu": "Ô 12 thì chỉ có 12 electron. Cấu hình này có 14 electron, của Si."}, "c14-sai-3": {"d": 10.008, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "Mg có 2 electron lớp ngoài cùng, dễ nhường electron, nên là kim loại. Oxide của kim loại này là basic oxide."}, "c14-sai-4": {"d": 7.392, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Cấu hình này chỉ có 11 electron, của Na. Mg có 12 electron."}, "c14-vi-sao": {"d": 12.576, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "Mg có 12 electron: 1s²2s²2p⁶3s², 2 electron lớp ngoài cùng nên là kim loại. MgO là basic oxide, Mg(OH)₂ là base."}, "c15-hoi": {"d": 13.056, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Quanh ma-giê có bốn nguyên tố: na-tri bên trái, nhôm bên phải, be-ri-li ở trên, can-xi ở dưới. So với ma-giê, mỗi nguyên tố có tính kim loại mạnh hơn hay yếu hơn?"}, "c15-sai": {"d": 8.016, "s": "media/c15-sai.mp3", "loai": "am", "chu": "Trong chu kì, từ trái sang phải tính kim loại giảm. Trong nhóm, từ trên xuống dưới tính kim loại tăng."}, "c15-vi-sao": {"d": 9.24, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Cùng chu kì 3: Na > Mg > Al. Cùng nhóm IIA: Be < Mg < Ca."}, "c16-hoi": {"d": 8.016, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Ka-li có Z bằng mười chín. Bạn viết nháp cấu hình electron, rồi chọn vị trí đúng của ka-li."}, "c16-sai-1": {"d": 8.904, "s": "media/c16-sai-1.mp3", "loai": "am", "chu": "Lớp 3 có 3s²3p⁶ nhưng electron cuối cùng đã sang lớp 4 (4s¹). K có 4 lớp electron."}, "c16-sai-2": {"d": 5.184, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "Lớp ngoài cùng 4s¹ chỉ có 1 electron, nên ở nhóm IA."}, "c16-sai-4": {"d": 6.576, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Số chu kì là số lớp electron (4 lớp), không phải số electron lớp ngoài cùng."}, "c16-vi-sao": {"d": 11.328, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "Cấu hình electron của K: 1s²2s²2p⁶3s²3p⁶4s¹. Có 4 lớp electron → chu kì 4; 1 electron lớp ngoài cùng → nhóm IA."}, "c17-hoi": {"d": 8.712, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Ka-li đứng đầu chu kì bốn, ngay dưới na-tri. Nhận định nào đúng về tính chất của ka-li và hợp chất của nó?"}, "c17-sai-1": {"d": 5.856, "s": "media/c17-sai-1.mp3", "loai": "am", "chu": "K có 1 electron lớp ngoài cùng, rất dễ nhường electron nên là kim loại."}, "c17-sai-2": {"d": 7.392, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Trong một nhóm, đi từ trên xuống dưới tính kim loại tăng. K nằm dưới Na nên mạnh hơn Na."}, "c17-sai-4": {"d": 4.704, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Hydroxide của kim loại nhóm IA là base mạnh, không lưỡng tính."}, "c17-vi-sao": {"d": 10.08, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "K là kim loại kiềm (nhóm IA), mạnh hơn Na và Ca. K₂O là basic oxide, tác dụng với nước tạo KOH là base mạnh."}, "c18-1": {"d": 5.592, "s": "media/c18-1.mp3", "loai": "am", "chu": "Mendeleev đã dùng chính ý nghĩa của bảng tuần hoàn để làm một việc rất táo bạo."}, "c18-2": {"d": 3.264, "s": "media/c18-2.mp3", "loai": "am", "chu": "Bạn đọc thầm đoạn trích trên màn hình nhé."}, "c18-3": {"d": 6.816, "s": "media/c18-3.mp3", "loai": "am", "chu": "Chưa ai tìm ra gallium và germanium, nhưng nhìn vào chỗ trống, ông đoán được tính chất của chúng."}, "c18-4": {"d": 3.912, "s": "media/c18-4.mp3", "loai": "am", "chu": "Bây giờ đến lượt bạn thử làm nhà dự đoán nhé!"}, "c19-hoi": {"d": 11.856, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Nguyên tố số tám mươi bảy không có trong tự nhiên. Biết nguyên tố số tám mươi sáu là khí hiếm kết thúc chu kì sáu. Bạn dự đoán nguyên tố số tám mươi bảy nhé."}, "c19-sai-1": {"d": 7.848, "s": "media/c19-sai-1.mp3", "loai": "am", "chu": "Chu kì 6 đã kết thúc ở nguyên tố số 86. Nguyên tố số 87 mở đầu chu kì mới."}, "c19-sai-2": {"d": 7.392, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "Mở đầu chu kì mới, lớp ngoài cùng mới có 1 electron, nên ở nhóm IA chứ không phải VIIA."}, "c19-sai-4": {"d": 7.104, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Sau chu kì 6 là chu kì 7. Nguyên tố số 87 có 7 lớp electron."}, "c19-vi-sao": {"d": 14.592, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Sau khí hiếm số 86 là chu kì 7. Nguyên tố số 87 có 7 lớp electron, 1 electron lớp ngoài cùng → chu kì 7, nhóm IA, là kim loại kiềm, tính kim loại mạnh vì nằm ở cuối nhóm."}, "c20-hoi": {"d": 8.016, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Định luật tuần hoàn giúp gì trong việc dự đoán tính chất của các chất?"}, "c20-sai-2": {"d": 6.744, "s": "media/c20-sai-2.mp3", "loai": "am", "chu": "Định luật nói về tính chất của nguyên tố, đơn chất và hợp chất, không dùng để tính khối lượng nguyên tử."}, "c20-sai-3": {"d": 5.976, "s": "media/c20-sai-3.mp3", "loai": "am", "chu": "Mendeleev đã dự đoán tính chất của gallium, germanium khi chúng chưa được tìm ra."}, "c20-sai-4": {"d": 6.888, "s": "media/c20-sai-4.mp3", "loai": "am", "chu": "Thí nghiệm để kiểm chứng. Nhưng nhờ quy luật tuần hoàn, ta dự đoán được trước tính chất."}, "c20-vi-sao": {"d": 13.512, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "Vị trí ⇄ cấu hình electron → tính chất. Nhờ định luật tuần hoàn, biết vị trí hoặc cấu hình electron là dự đoán được tính chất, viết được công thức oxide, hydroxide và so sánh với các nguyên tố xung quanh."}, "c21-1": {"d": 3.384, "s": "media/c21-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại ba ý của bài nhé."}, "c21-2": {"d": 7.608, "s": "media/c21-2.mp3", "loai": "am", "chu": "Tính chất của nguyên tố, đơn chất, thành phần và tính chất hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân."}, "c21-3": {"d": 6.48, "s": "media/c21-3.mp3", "loai": "am", "chu": "Cấu hình electron và vị trí suy ra được cho nhau, và cùng quyết định tính chất của nguyên tố."}, "c21-4": {"d": 11.304, "s": "media/c21-4.mp3", "loai": "am", "chu": "Từ vị trí, bạn viết được cấu hình, dự đoán kim loại hay phi kim, viết công thức oxide, hydroxide. Ghim vào ô nào, đoán ngay ô đó nhé!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 7.992, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong định luật tuần hoàn và ý nghĩa của bảng tuần hoàn. Bạn bấm Chép kết quả để gửi cô nhé!"}}/*__MEDIA_HET__*/;

        let ok = false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); if (ok) xong(); else { tb.style.whiteSpace = "pre-line"; tb.style.fontSize = "1.5cqw"; tb.textContent = "Chưa chép được. Thầy cô chép đoạn này:\n" + txt; } };
      try { navigator.clipboard.writeText(txt).then(xong, du); } catch(e){ du(); } };
    bl.onclick = () => { P.diem = {}; P.xong = new Set(); P.mo = 0; luu(); moCanh(0); };
    SC.ket(d, n);
    return { bat(){ noi("ket"); }, nhacLai(){ noi("ket"); } };
  },
};

/* ---------- điểm ---------- */
function khoaCua(c){
  if (c.loai === "chon" || c.loai === "dien") return [c.ma];
  if (c.loai === "noi") return c.trai.map((_, i) => c.ma + "-" + i);
  if (c.loai === "keo-tha") return c.the.map((_, i) => c.ma + "-" + i);
  if (c.loai === "quay-kim") return c.cau.map((_, i) => c.ma + "-" + i);
  return [];
}
const NHOM_DIEM = BAI.canh.map(c => [c.ma, c.ten, khoaCua(c)]).filter(x => x[2].length);
const KHOA_DIEM = NHOM_DIEM.flatMap(x => x[2]);
// mỗi hoạt động 1 điểm (chia đều cho các ô); câu khó đặt "diem" riêng trong bai.json
const TRONG = {}; for (const c of BAI.canh){ const ks = khoaCua(c); for (const k of ks) TRONG[k] = (c.diem ?? 1) / ks.length; }
const TONG_DIEM = KHOA_DIEM.reduce((a, k) => a + TRONG[k], 0);
const demDiem = () => KHOA_DIEM.reduce((a, k) => a + (P.diem[k] === true ? TRONG[k] : 0), 0);
const so1 = x => { const r = Math.round(x * 10) / 10; return String(r).replace(".", ","); };

/* ---------- SCORM 1.2 khi chạy trong hệ thống học trực tuyến; không thì lưu trên trình duyệt ---------- */
const SC = { api: null,
  tim(){ let w = window; for (let n = 0; n < 12 && w; n++){ try { if (w.API) return w.API; } catch(e){ break; } if (w.parent === w) break; w = w.parent; }
    try { if (window.opener && window.opener.API) return window.opener.API; } catch(e){} return null; },
  bat(){ this.api = this.tim(); if (!this.api) return null; try { this.api.LMSInitialize("");
      const st = this.api.LMSGetValue("cmi.core.lesson_status"); if (!st || st === "not attempted") this.api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      const sd = this.api.LMSGetValue("cmi.suspend_data"); return sd ? JSON.parse(sd) : null; } catch(e){ return null; } },
  dat(k, v){ if (this.api) try { this.api.LMSSetValue(k, String(v)); } catch(e){} },
  luu(){ if (this.api) try { this.api.LMSCommit(""); } catch(e){} },
  ket(d, n){ if (!this.api) return; this.dat("cmi.core.score.min", 0); this.dat("cmi.core.score.max", 100); this.dat("cmi.core.score.raw", n ? Math.round(d / n * 100) : 100);
    this.dat("cmi.core.lesson_status", "completed"); this.luu(); },
  dong(){ if (!this.api) return; this.luu(); try { this.api.LMSFinish(""); } catch(e){} this.api = null; }
};
const KHOA_LUU = "triway-el-" + (BAI.ma || BAI.tieu_de);
function luu(){ const du = JSON.stringify({i: P.i, mo: P.mo, xong: [...P.xong], diem: P.diem});
  if (SC.api){ SC.dat("cmi.suspend_data", du); SC.dat("cmi.core.lesson_location", P.i); SC.luu(); }
  try { localStorage.setItem(KHOA_LUU, du); } catch(e){} }
function doc(){ const s = SC.bat(); if (s) return s; try { const x = localStorage.getItem(KHOA_LUU); return x ? JSON.parse(x) : null; } catch(e){ return null; } }

/* ---------- trình phát ---------- */
const CANH = BAI.canh;
const P = { i: -1, t: 0, chay: false, toc: 1, cc: true, mo: 0, xong: new Set(), diem: {}, coXem: false, rt: null, nhip: -2, hen: null };
const GIAN = .45;
function lich(c){ let s = .5; const B = c.dong.map(d => { const m = MEDIA[d.id], dd = m ? m.d : 2; const b = {id: d.id, s, d: dd, e: s + dd};
    // kim đang quay thì chờ quay xong mới sang câu sau
    const q = d.dong_ho && d.dong_ho.quay != null ? .5 + Math.min(3.2, 1.6 + Math.abs(Number(d.dong_ho.quay)) / 30) + .5 : 0;
    s += Math.max(dd + GIAN + (d.sau || 0), q); return b; }); return {B, tong: s + .4}; }
function ghiDiem(k, ok){ if (!(k in P.diem)) P.diem[k] = ok; }
function xongCanh(i = P.i){ P.xong.add(i); P.mo = Math.max(P.mo, i + 1); luu(); veMenu(); veCham(); capNut(); if (i === P.i && i < CANH.length - 1) nutTiep.hidden = false; }
function moCanh(i, tuChay = true){
  im(); try { speechSynthesis.cancel(); } catch(e){} clearTimeout(P.hen); P.i = i; P.t = 0; P.nhip = -2; datPhuDe("");
  nen.innerHTML = ""; lop.innerHTML = ""; tren.innerHTML = ""; nutTiep.hidden = true; DONG = []; stage.dataset.bc = "";
  const c = CANH[i], rt = {tt: []}; P.rt = rt;
  if (CANH_XEM[c.loai]){ const l = lich(c); rt.B = l.B; rt.tong = l.tong; Object.assign(rt, DUNG[c.loai](c, l.B, rt)); P.chay = tuChay; rt.ve(0); }
  else { Object.assign(rt, DUNG[c.loai](c, null, rt)); P.chay = false; if (rt.bat) rt.bat(); }
  if (P.xong.has(i) && !CANH_XEM[c.loai] && c.loai !== "ket-qua" && i < CANH.length - 1) nutTiep.hidden = false;
  stage.classList.toggle("toi", !!rt.toi);
  veMenu(); veCham(); capNut(); veThanh(); luu();
  if (window.XUONG) XUONG.sauCanh(i);
}
function capNut(){ const c = CANH[P.i];
  $("#b-lui").disabled = P.i <= 0; $("#b-toi").disabled = !(P.i < CANH.length - 1 && (P.xong.has(P.i) || P.coXem));
  const xem = c && (CANH_XEM[c.loai] || c.loai === "phim");
  $("#b-chay").textContent = xem && P.chay ? "⏸" : "▶"; $("#b-chay").setAttribute("aria-label", !xem ? "Nghe lại câu hỏi" : P.chay ? "Dừng" : "Phát"); }
function dongBo(){ const B = P.rt.B; let k = -1; for (let j = 0; j < B.length; j++) if (P.t >= B[j].s && P.t < B[j].e){ k = j; break; }
  if (k !== P.nhip){ P.nhip = k; if (k >= 0 && P.chay && B[k].e - P.t > .15) phat(B[k].id, P.t - B[k].s); else im(); }
  datPhuDe(k >= 0 ? LOI[B[k].id] : ""); }
let truoc = performance.now(), nhipN = 0, nhipT = 0;   // nhịp khung hình: chậm quá (máy yếu) thì tắt nền chuyển động
function khung(now){
  const dt = Math.min(.1, (now - truoc) / 1000); truoc = now; const c = CANH[P.i], rt = P.rt;
  if (c && rt && CANH_XEM[c.loai]){
    if (P.chay){ P.t += dt * P.toc; if (P.t >= rt.tong){ P.t = rt.tong; P.chay = false; im(); capNut();
        if (!P.xong.has(P.i)) xongCanh(); else nutTiep.hidden = P.i >= CANH.length - 1;
        clearTimeout(P.hen); const i0 = P.i; P.hen = setTimeout(() => { if (P.i === i0 && !P.chay && P.t >= rt.tong && P.i < CANH.length - 1) moCanh(P.i + 1); }, 1500); } }
    dongBo(); rt.ve(P.t);
  }
  if (c) veThanh();
  doMo(now / 1000);
  if (rt) for (const tt of rt.tt) tt.ve(now / 1000, dangPhat(), (rt.vui ? rt.vui(P.t) : false) || now < (P.vuiDen || 0));
  if (rt && stage.classList.contains("toi") !== !!rt.toi) stage.classList.toggle("toi", !!rt.toi);
  if (DONG.length && !tatDong){ nhipN++; nhipT += dt; if (nhipN >= 150){ if (nhipT / nhipN > .05 && !document.hidden){ tatDong = true; DONG.forEach(g => g.remove()); DONG = []; } nhipN = 0; nhipT = 0; } }
  requestAnimationFrame(khung);
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function veThanh(){ const c = CANH[P.i], th = $("#thanh"), nh = $("#nhan-thanh"), ray = th.querySelector(".ray"), rt = P.rt;
  if (!c || !rt) return;
  const dat = (p, a, b) => { ray.hidden = false; nh.hidden = true; th.classList.remove("khoa"); th.querySelector(".day").style.width = p * 100 + "%"; th.querySelector(".num").style.left = p * 100 + "%"; th.setAttribute("aria-valuenow", Math.round(p * 100)); $("#gio").textContent = `${fmt(a)} / ${fmt(b)}`; };
  if (CANH_XEM[c.loai]){ dat(P.t / rt.tong, P.t, rt.tong);
    if (ray.dataset.moc !== String(P.i)){ ray.querySelectorAll(".moc").forEach(x => x.remove()); ray.dataset.moc = P.i; rt.B.forEach(b => { const m = H("i", "moc", ray); m.style.left = b.s / rt.tong * 100 + "%"; }); } return; }
  ray.querySelectorAll(".moc").forEach(x => x.remove()); ray.dataset.moc = "";
  if (c.loai === "phim" && rt.phim){ const v = rt.phim, d = v.duration || MEDIA[c.phim_id].d || 1; dat(cl(v.currentTime / d), v.currentTime, d); return; }
  ray.hidden = true; nh.hidden = false; th.classList.add("khoa");
  nh.textContent = c.loai === "ket-qua" ? "Hoàn thành bài học" : P.xong.has(P.i) ? "Đã làm xong · bấm Tiếp tục" : "Hoạt động · em làm xong để đi tiếp"; $("#gio").textContent = `Cảnh ${P.i + 1}/${CANH.length}`; }
function tua(p){ const c = CANH[P.i]; if (!c) return;
  if (c.loai === "phim" && P.rt.phim){ const v = P.rt.phim; if (v.duration) v.currentTime = cl(p) * v.duration; return; }
  if (!CANH_XEM[c.loai]) return; clearTimeout(P.hen); nutTiep.hidden = !P.xong.has(P.i) || P.i >= CANH.length - 1; P.t = cl(p) * P.rt.tong; P.nhip = -2; }
function veMenu(){ const ds = $("#ds"); ds.innerHTML = "";
  CANH.forEach((c, i) => { const li = H("li", "", ds), b = H("button", i === P.i ? "nay" : "", li); b.type = "button"; const xem = CANH_XEM[c.loai] || c.loai === "phim";
    const dai = CANH_XEM[c.loai] ? fmt(lich(c).tong) : c.loai === "phim" ? fmt(MEDIA[c.phim_id].d || 0) : "";
    b.innerHTML = `<span class="kieu ${xem ? "" : "lam"}">${xem ? "▶" : c.loai === "ket-qua" ? "★" : "✋"}</span><span>${esc(c.ten)}</span><span class="tt ${P.xong.has(i) ? "ok" : ""}">${P.xong.has(i) ? "✓" : (i <= P.mo || P.coXem) ? dai : "🔒"}</span>`;
    b.disabled = !(i <= P.mo || P.coXem); if (i === P.i) b.setAttribute("aria-current", "step"); b.onclick = () => moCanh(i); }); }
function veCham(){ const ch = $("#cham"); ch.innerHTML = ""; CANH.forEach((c, i) => { const b = H("b", P.xong.has(i) ? "xong" : "", ch); if (i === P.i) b.className = "nay"; b.title = c.ten; }); }

/* ---------- màn mở ---------- */
function coPhu(e){ const n = (BAI.tieu_de_phu || "").length; if (n > 30) e.style.fontSize = n > 42 ? "2.2cqw" : "2.5cqw"; }   // tiêu đề phụ dài: một dòng, không chồng nhãn bên dưới
function manMo(){
  P.i = -1; nen.innerHTML = ""; lop.innerHTML = ""; tren.innerHTML = ""; DONG = []; stage.dataset.bc = ""; const rt = {tt: []}; P.rt = rt;
  const c0 = CANH[0] && CANH[0].loai === "mo-dau" ? CANH[0] : {};
  VeNen(c0.nen || "cam", 3, {sac: c0.sac, chuyen_dong: c0.chuyen_dong}, true); stage.classList.toggle("toi", !!rt.toi); NguoiDan(rt, 1210, 450, 470);
  O("may", 110, 140, 860, esc([BAI.mon, BAI.lop && "Lớp " + BAI.lop, BAI.bo_sach, BAI.bai].filter(Boolean).join(" · ")));
  const td = O("", 110, 190, 900, `<h2 class="tde" style="font-size:${(BAI.tieu_de || "").length > 18 ? 5.2 : 7}cqw">${esc(BAI.tieu_de)}</h2>`);
  coPhu(O("tde2", 110, 315, 860, esc(BAI.tieu_de_phu || "")));
  const so = CANH.filter(c => !CANH_XEM[c.loai] && c.loai !== "phim" && c.loai !== "ket-qua").length;
  O("hang tho", 110, 410, 860, [BAI.thoi_luong && `<span class="chip">⏱ ${esc(BAI.thoi_luong)}</span>`, `<span class="chip">🔊 nên mở loa</span>`, so && `<span class="chip">✋ ${so} hoạt động</span>`].filter(Boolean).join(""));
  const h = O("hang", 110, 560, 860, "");
  const cu = doc(), batDau = i => moCanh(i);
  if (cu && cu.mo > 0 && cu.mo < CANH.length){ P.mo = cu.mo; P.xong = new Set(cu.xong || []); P.diem = cu.diem || {};
    const b = H("button", "nut-sk chinh", h, `▶ Học tiếp: ${esc(CANH[cu.mo].ten)}`); b.type = "button"; b.style.fontSize = "3cqw"; b.onclick = () => batDau(cu.mo);
    const l = H("button", "nut-sk", h, "Học lại từ đầu"); l.type = "button"; l.style.fontSize = "2.4cqw"; l.onclick = () => { P.mo = 0; P.xong = new Set(); P.diem = {}; batDau(0); }; }
  else { const b = H("button", "nut-sk chinh", h, "▶ Bắt đầu học"); b.type = "button"; b.style.fontSize = "3.4cqw"; b.style.padding = "1.4cqw 3.4cqw"; b.onclick = () => batDau(0); }
  veMenu(); veCham(); $("#b-lui").disabled = true; $("#b-toi").disabled = true; $("#gio").textContent = "0:00 / 0:00";
  if (window.XUONG) XUONG.sauCanh(-1);
}

/* ---------- điều khiển ---------- */
$("#b-chay").onclick = () => { const c = CANH[P.i]; if (!c){ moCanh(0); return; }
  if (c.loai === "phim"){ const v = P.rt.phim; if (v.paused){ v.play(); P.chay = true; } else { v.pause(); P.chay = false; } capNut(); return; }
  if (!CANH_XEM[c.loai]){ P.rt.nhacLai && P.rt.nhacLai(); return; }
  if (P.chay){ P.chay = false; im(); P.nhip = -2; } else { if (P.t >= P.rt.tong - .05) P.t = 0; clearTimeout(P.hen); P.chay = true; P.nhip = -2; }
  capNut(); };
$("#b-lai").onclick = () => { if (P.i < 0) return; const c = CANH[P.i]; if (CANH_XEM[c.loai]){ tua(0); P.chay = true; capNut(); } else moCanh(P.i); };
$("#b-lui").onclick = () => { if (P.i > 0) moCanh(P.i - 1); };
$("#b-toi").onclick = () => { if (P.i < CANH.length - 1 && (P.xong.has(P.i) || P.coXem)) moCanh(P.i + 1); };
nutTiep.onclick = () => { if (P.i < CANH.length - 1) moCanh(P.i + 1); };
$("#b-cc").onclick = e => { P.cc = !P.cc; e.currentTarget.classList.toggle("bat", P.cc); e.currentTarget.setAttribute("aria-pressed", P.cc); phude.hidden = !pdHt || !P.cc; };
$("#b-toc").onclick = e => { const ds = [1, 1.25, .75]; P.toc = ds[(ds.indexOf(P.toc) + 1) % ds.length]; e.currentTarget.textContent = P.toc + "×"; if (dangNoi && dangNoi.a.playbackRate != null) dangNoi.a.playbackRate = P.toc; if (P.rt && P.rt.phim) P.rt.phim.playbackRate = P.toc; };
$("#b-man").onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else $("#khung").requestFullscreen().catch(() => {}); } catch(e){} };
$("#co-xem").onchange = e => { P.coXem = e.target.checked; veMenu(); capNut(); };
const th = $("#thanh");
function tuaChuot(e){ const r = th.getBoundingClientRect(); tua((e.clientX - r.left) / r.width); }
th.addEventListener("pointerdown", e => { const c = CANH[P.i]; if (!c || !(CANH_XEM[c.loai] || c.loai === "phim")) return; th.setPointerCapture(e.pointerId); tuaChuot(e);
  const mv = ev => tuaChuot(ev), up = () => { th.removeEventListener("pointermove", mv); th.removeEventListener("pointerup", up); };
  th.addEventListener("pointermove", mv); th.addEventListener("pointerup", up); });
th.addEventListener("keydown", e => { if (!P.rt || !P.rt.tong) return; if (e.key === "ArrowRight") tua((P.t + 5) / P.rt.tong); if (e.key === "ArrowLeft") tua((P.t - 5) / P.rt.tong); });
document.addEventListener("keydown", e => { if (e.key === " " && !/INPUT|TEXTAREA|BUTTON|SELECT/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")){ e.preventDefault(); $("#b-chay").click(); } });
addEventListener("pagehide", () => { luu(); SC.dong(); });

/* ---------- khung chữ quanh bài ---------- */
document.title = BAI.tieu_de + (BAI.mon ? " · " + BAI.mon + (BAI.lop ? " " + BAI.lop : "") : "");
$("#ten-bai").textContent = BAI.tieu_de + (BAI.tieu_de_phu ? ": " + BAI.tieu_de_phu : "");
if (BAI.ban_nhap === false) $("#nhap").textContent = "Thầy cô đã duyệt bài này";
(() => { const v = $("#ve-noi-dung"), dong = [];
  dong.push(`<p><b>Bài:</b> ${esc([BAI.mon, BAI.lop && "lớp " + BAI.lop, BAI.bo_sach, BAI.bai].filter(Boolean).join(", "))}${BAI.trang_sgk ? " (" + esc(BAI.trang_sgk) + ")" : ""}.</p>`);
  if (BAI.yeu_cau_can_dat) dong.push(`<p><b>Yêu cầu cần đạt:</b> ${esc(BAI.yeu_cau_can_dat)}</p>`);
  const li = [];
  li.push(`${CANH.length} cảnh: ${CANH.filter(c => CANH_XEM[c.loai]).length} cảnh xem, ${NHOM_DIEM.length} hoạt động tự chấm.`);
  if (BAI.giong_ghi) li.push(esc(BAI.giong_ghi));
  li.push("Không thu thập dữ liệu, không gửi đi đâu. Tên học sinh (nếu nhập) chỉ nằm trên máy.");
  li.push("Nộp lên hệ thống học trực tuyến (Moodle…) bằng gói SCORM 1.2 kèm theo: hệ thống nhận điểm và trạng thái hoàn thành.");
  dong.push(`<ul>${li.map(x => `<li>${x}</li>`).join("")}</ul>`);
  const ng = [...(BAI.nguon || []), ...Object.entries(ANH).filter(([, a]) => a.nguon).map(([t, a]) => `Ảnh «${t}»: ${a.nguon}`)];
  if (ng.length) dong.push(`<p><b>Nguồn:</b></p><ul>${ng.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
  v.innerHTML = dong.join(""); })();

window.__TRIWAY_EL = { P, CANH, MEDIA, DO_TO, moMieng: () => MO_MIENG, moCanh, tua, demDiem, KHOA_DIEM, TRONG, TONG_DIEM, khoaCua, im, xongCanh, THAY_CO, PC, tatDong: () => { tatDong = true; DONG.forEach(g => g.remove()); DONG = []; } };
// Xưởng hình: chỉ bản web mở kèm #thay-co (gói SCORM không có đoạn mã xuong-hinh.js, XD = null)
if (THAY_CO && typeof XuongHinh === "function"){ try { window.XUONG = XuongHinh(); } catch(e){ console.warn("Xưởng hình chưa mở được:", e); } }
