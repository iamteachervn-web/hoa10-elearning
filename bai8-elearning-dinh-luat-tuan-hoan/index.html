<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai8-elearning-dinh-luat-tuan-hoan bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai8-elearning-dinh-luat-tuan-hoan', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}

.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}

.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}

#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}

.xoay{display:none}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}

.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}

#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}

ính chất của các hợp chất tạo nên từ các nguyên tố đó biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 43", "hinh": {"chu": "Định luật tuần hoàn"}, "dong": [{"sau": 20, "id": "c2-1"}, {"the": "Nguyên tố · đơn chất · **hợp chất**", "id": "c2-2"}, {"the": "Tuần hoàn = **lặp lại** theo chu kì", "id": "c2-3"}, {"the": "Theo chiều tăng **điện tích hạt nhân**", "id": "c2-4"}]}, {"ma": "c3", "loai": "chon", "ten": "Xếp theo đại lượng nào?", "muc": "biet", "yccd": [1], "sgk": ["MD"], "hoi": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của", "noi": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của đại lượng nào?", "lua": [{"chu": "khối lượng nguyên tử", "giai": "Khối lượng nguyên tử không dùng làm mốc: có nguyên tố nặng hơn vẫn đứng trước, ví dụ tellurium đứng trước iodine.", "sai_id": "c3-sai-1"}, {"chu": "điện tích hạt nhân nguyên tử", "dung": true}, {"chu": "số lớp electron", "giai": "Số lớp electron chỉ cho biết nguyên tố ở chu kì nào. Các nguyên tố trong cùng chu kì có cùng số lớp electron.", "sai_id": "c3-sai-3"}, {"chu": "số neutron trong hạt nhân", "giai": "Số neutron không quyết định vị trí. Các đồng vị của một nguyên tố khác số neutron mà vẫn ở cùng một ô.", "sai_id": "c3-sai-4"}], "vi_sao": "Định luật tuần hoàn: tính chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử, cũng là thứ tự xếp các ô trong bảng tuần hoàn.", "hoi_id": "c3-hoi", "vi_sao_id": "c3-vi-sao"}, {"ma": "c4", "loai": "trinh-bay", "ten": "«Tuần hoàn» là gì?", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["1"], "hinh": {"anh": "b08-rang-cua.png", "chu": "Độ âm điện các nguyên tố chu kì 2, 3 (vẽ theo Bảng 6.2 SGK)"}, "dong": [{"the": "Chu kì 2: Li → F **tăng**", "id": "c4-1"}, {"the": "Sang Na: **tụt xuống**, rồi lại tăng", "id": "c4-2"}, {"the": "Răng cưa = **tuần hoàn**", "id": "c4-3"}, {"the": "Bán kính · kim loại – phi kim · acid – base", "id": "c4-4"}]}, {"ma": "c5", "loai": "keo-tha", "ten": "Câu 1 SGK: kim loại hay phi kim?", "muc": "hieu", "yccd": [1], "sgk": ["1"], "diem": 2, "hoi": "Xếp mỗi đơn chất của chu kì 2 và chu kì 3 vào đúng nhóm.", "noi": "Bạn xếp mỗi đơn chất của chu kì hai và chu kì ba vào đúng nhóm: kim loại hay phi kim.", "nhom": ["Kim loại", "Phi kim"], "the": [{"chu": "Li", "nhom": 0}, {"chu": "Na", "nhom": 0}, {"chu": "Mg", "nhom": 0}, {"chu": "Al", "nhom": 0}, {"chu": "O", "nhom": 1}, {"chu": "S", "nhom": 1}, {"chu": "Cl", "nhom": 1}], "giai": "Trong một chu kì, đầu chu kì là kim loại, cuối chu kì là phi kim. Bạn nhìn vị trí nhóm của từng nguyên tố.", "vi_sao": "Đúng hết! Chu kì 2: Li, Be là kim loại; O, F là phi kim (B ở giữa là á kim). Chu kì 3: Na, Mg, Al là kim loại; S, Cl là phi kim. Hai chu kì lặp lại cùng một kiểu: tính kim loại giảm, tính phi kim tăng.", "hoi_id": "c5-hoi", "sai_id": "c5-sai", "vi_sao_id": "c5-vi-sao"}, {"ma": "c6", "loai": "chon", "ten": "Câu 1 SGK: lặp lại ở đâu?", "muc": "hieu", "yccd": [1], "sgk": ["1"], "hoi": "F ở cuối chu kì 2 là phi kim rất mạnh. Sang chu kì 3, Na đứng đầu chu kì. Na có tính chất giống nguyên tố nào ở chu kì 2 nhất?", "noi": "Fluorine ở cuối chu kì hai là phi kim rất mạnh. Sang chu kì ba, sodium đứng đầu chu kì. Sodium có tính chất giống nguyên tố nào ở chu kì hai nhất?", "lua": [{"chu": "F", "giai": "F là phi kim rất mạnh, còn Na là kim loại điển hình. Tính chất không nối tiếp mà quay về đầu.", "sai_id": "c6-sai-1"}, {"chu": "Li", "dung": true}, {"chu": "O", "giai": "O là phi kim mạnh ở cuối chu kì 2, không giống Na.", "sai_id": "c6-sai-3"}, {"chu": "Be", "giai": "Be là kim loại yếu, cùng nhóm với Mg. Na đứng đầu chu kì nên giống nguyên tố đứng đầu chu kì 2.", "sai_id": "c6-sai-4"}], "vi_sao": "Li và Na cùng đứng đầu chu kì, cùng nhóm IA, đều là kim loại mạnh. Tính chất quay về như đầu chu kì trước: đó là sự tuần hoàn.", "hoi_id": "c6-hoi", "vi_sao_id": "c6-vi-sao"}, {"ma": "c7", "loai": "trinh-bay", "ten": "Ý nghĩa của bảng tuần hoàn", "nen": "xanh-la", "bo_cuc": "trai-phai", "sgk": ["MD"], "hinh": {"anh": "b08-so-do.png", "chu": "Mối liên hệ: cấu hình electron, vị trí, tính chất (vẽ lại theo SGK tr. 43)"}, "dong": [{"the": "Vị trí → **cấu hình electron**", "id": "c7-1"}, {"the": "Cấu hình ⇄ vị trí", "id": "c7-2"}, {"the": "Cấu hình electron **quyết định** tính chất", "id": "c7-3"}, {"the": "Biết vị trí → **dự đoán** tính chất", "id": "c7-4"}]}, {"ma": "c8", "loai": "trinh-bay", "ten": "Ví dụ 1: từ vị trí đọc ra cấu tạo", "nen": "kem", "bo_cuc": "luoi-4", "sgk": ["VD1"], "hinh": {"anh": "b08-o-s.png", "chu": "Nguyên tố sulfur trong bảng tuần hoàn (theo Ví dụ 1, SGK tr. 43)"}, "dong": [{"id": "c8-1"}, {"the": "Số thứ tự ô = **Z**", "id": "c8-2"}, {"the": "Số thứ tự chu kì = **số lớp electron**", "id": "c8-3"}, {"the": "Số thứ tự nhóm A = **số e lớp ngoài cùng**", "id": "c8-4"}]}, {"ma": "c9", "loai": "noi", "ten": "Ví dụ 1: cấu tạo nguyên tử S", "muc": "hieu", "yccd": [2], "sgk": ["VD1"], "hoi": "Nối thông tin vị trí với cấu tạo nguyên tử S.", "noi": "Bạn nối mỗi thông tin vị trí của sulfur với điều nó cho biết về nguyên tử sulfur.", "giai": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng.", "vi_sao": "Đúng hết! Ô 16 → 16 proton, 16 electron; chu kì 3 → 3 lớp electron; nhóm VIA → 6 electron lớp ngoài cùng. Cấu hình electron của S: 1s²2s²2p⁶3s²3p⁴.", "phai": ["16 proton, 16 electron", "3 lớp electron", "6 lớp electron", "6 electron lớp ngoài cùng"], "trai": [{"chu": "Ô số 16"}, {"chu": "Chu kì 3"}, {"chu": "Nhóm VIA"}], "dap": [0, 1, 3], "hoi_id": "c9-hoi", "sai_id": "c9-sai", "vi_sao_id": "c9-vi-sao", "sai_rieng": {"2": "c9-sai-2"}}, {"ma": "c10", "loai": "trinh-bay", "ten": "Ví dụ 2: từ cấu hình tìm vị trí", "nen": "cam", "bo_cuc": "trai-phai", "sgk": ["VD1", "VD2"], "hinh": {"anh": "b08-o-p.png", "chu": "Từ cấu hình electron của phosphorus tìm vị trí (theo Ví dụ 2, SGK tr. 44)"}, "dong": [{"the": "S: phi kim · SO₃ · **H₂SO₄ acid mạnh**", "id": "c10-1"}, {"the": "P: 1s²2s²2p⁶3s²3p³", "id": "c10-2"}, {"the": "Tổng e = 15 → **ô 15**", "id": "c10-3"}, {"the": "3 lớp → **chu kì 3** · 5 e → **nhóm VA**", "id": "c10-4"}, {"the": "P₂O₅ · **H₃PO₄ acid trung bình**", "id": "c10-5"}]}, {"ma": "c11", "loai": "dien", "ten": "Luyện: tìm ô số", "muc": "van-dung", "yccd": [2], "sgk": ["VD2"], "hoi": "Nguyên tố X có cấu hình electron 1s²2s²2p⁶3s²3p⁵. X ở ô số mấy?", "noi": "Nguyên tố X có cấu hình electron một ét hai, hai ét hai, hai pê sáu, ba ét hai, ba pê năm. X ở ô số mấy? Bạn gõ số vào ô nhé.", "dap": ["17", "mười bảy", "muoi bay"], "giai": "Bạn cộng các số mũ: 2 + 2 + 6 + 2 + 5. Tổng số electron bằng Z, chính là số thứ tự ô.", "vi_sao": "2 + 2 + 6 + 2 + 5 = 17 electron, nên Z = 17: X ở ô số 17. Đó là chlorine (Cl).", "hoi_id": "c11-hoi", "sai_id": "c11-sai", "vi_sao_id": "c11-vi-sao"}, {"ma": "c12", "loai": "chon", "ten": "Luyện: vị trí và tính chất của X", "muc": "van-dung", "yccd": [2], "sgk": ["VD2"], "hoi": "X có cấu hình 1s²2s²2p⁶3s²3p⁵. Nhận định nào đúng về X?", "noi": "Vẫn nguyên tố X đó. Nhận định nào đúng về vị trí và tính chất của X?", "lua": [{"chu": "Chu kì 3, nhóm VA; là kim loại", "giai": "Lớp ngoài cùng 3s²3p⁵ có 2 + 5 = 7 electron, nên ở nhóm VIIA. Có 7 electron lớp ngoài cùng là phi kim.", "sai_id": "c12-sai-1"}, {"chu": "Chu kì 3, nhóm VIIA; là phi kim, hydroxide cao nhất HClO₄ là acid rất mạnh", "dung": true}, {"chu": "Chu kì 5, nhóm VIIA; là phi kim", "giai": "Chu kì bằng số lớp electron. Lớp ngoài cùng là lớp 3, nên X ở chu kì 3.", "sai_id": "c12-sai-3"}, {"chu": "Chu kì 3, nhóm VIIA; oxide cao nhất là basic oxide", "giai": "X là phi kim cuối chu kì 3, oxide cao nhất Cl₂O₇ là acidic oxide.", "sai_id": "c12-sai-4"}], "vi_sao": "3 lớp electron → chu kì 3; 7 electron lớp ngoài cùng → nhóm VIIA. X (Cl) là phi kim mạnh; Cl₂O₇ là acidic oxide, HClO₄ là acid rất mạnh (Bảng 7.2).", "hoi_id": "c12-hoi", "vi_sao_id": "c12-vi-sao"}, {"ma": "c13", "loai": "trinh-bay", "ten": "So sánh với nguyên tố xung quanh", "nen": "xanh-duong", "bo_cuc": "trai-phai", "sgk": ["SS"], "hinh": {"anh": "b08-lan-can-p.png", "chu": "P và hai nguyên tố xung quanh: N cùng nhóm, S cùng chu kì"}, "dong": [{"the": "So sánh với **nguyên tố xung quanh**", "id": "c13-1"}, {"the": "Cùng nhóm: **N > P**", "id": "c13-2"}, {"id": "c13-3"}, {"the": "Cùng chu kì: **P < S**", "id": "c13-4"}]}, {"ma": "c13b", "loai": "chon", "ten": "Luyện: so sánh tính phi kim của S", "muc": "van-dung", "yccd": [2], "sgk": ["SS"], "hoi": "S ở chu kì 3, nhóm VIA. So sánh tính phi kim của S với O (cùng nhóm, ở trên) và Cl (cùng chu kì, bên phải).", "noi": "Đến lượt bạn. Sulfur ở chu kì ba, nhóm sáu A. So sánh tính phi kim của sulfur với oxygen ở ngay trên và chlorine ở bên phải nhé.", "lua": [{"chu": "O mạnh hơn S; Cl mạnh hơn S", "dung": true}, {"chu": "S mạnh hơn O; S mạnh hơn Cl", "giai": "Trong nhóm, đi lên trên tính phi kim mạnh hơn; trong chu kì, sang phải tính phi kim mạnh hơn. S ở dưới O và bên trái Cl.", "sai_id": "c13b-sai-2"}, {"chu": "S mạnh hơn O; Cl mạnh hơn S", "giai": "O và S cùng nhóm VIA, O ở trên nên O có tính phi kim mạnh hơn S.", "sai_id": "c13b-sai-3"}, {"chu": "O mạnh hơn S; S mạnh hơn Cl", "giai": "S và Cl cùng chu kì 3, Cl ở bên phải nên Cl có tính phi kim mạnh hơn S.", "sai_id": "c13b-sai-4"}], "vi_sao": "Cùng nhóm VIA: O ở trên nên phi kim mạnh hơn S. Cùng chu kì 3: Cl ở bên phải nên phi kim mạnh hơn S. Làm giống hệt ví dụ so sánh P với N và S.", "hoi_id": "c13b-hoi", "vi_sao_id": "c13b-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Câu 2a SGK: magnesium", "muc": "van-dung", "yccd": [2], "sgk": ["2"], "hoi": "Magnesium ở ô số 12, chu kì 3, nhóm IIA. Nhận định nào đúng?", "noi": "Magnesium ở ô số mười hai, chu kì ba, nhóm hai A. Bạn viết nháp cấu hình electron, rồi chọn nhận định đúng.", "lua": [{"chu": "1s²2s²2p⁶3s²3p²; Mg là phi kim", "giai": "Ô 12 thì chỉ có 12 electron. Cấu hình này có 14 electron, của Si.", "sai_id": "c14-sai-1"}, {"chu": "1s²2s²2p⁶3s²; Mg là kim loại; MgO là basic oxide, Mg(OH)₂ là base", "dung": true}, {"chu": "1s²2s²2p⁶3s²; Mg là phi kim; MgO là acidic oxide", "giai": "Mg có 2 electron lớp ngoài cùng, dễ nhường electron, nên là kim loại. Oxide của kim loại này là basic oxide.", "sai_id": "c14-sai-3"}, {"chu": "1s²2s²2p⁶3s¹; Mg là kim loại", "giai": "Cấu hình này chỉ có 11 electron, của Na. Mg có 12 electron.", "sai_id": "c14-sai-4"}], "vi_sao": "Mg có 12 electron: 1s²2s²2p⁶3s², 2 electron lớp ngoài cùng nên là kim loại. MgO là basic oxide, Mg(OH)₂ là base.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "keo-tha", "ten": "Câu 2b SGK: so sánh tính kim loại", "muc": "van-dung", "yccd": [2], "sgk": ["2"], "diem": 2, "hoi": "So với Mg, mỗi nguyên tố lân cận có tính kim loại mạnh hơn hay yếu hơn?", "noi": "Quanh magnesium có bốn nguyên tố: sodium bên trái, aluminium bên phải, beryllium ở trên, calcium ở dưới. So với magnesium, mỗi nguyên tố có tính kim loại mạnh hơn hay yếu hơn?", "nhom": ["Mạnh hơn Mg", "Yếu hơn Mg"], "the": [{"chu": "Na", "nhom": 0}, {"chu": "Ca", "nhom": 0}, {"chu": "Al", "nhom": 1}, {"chu": "Be", "nhom": 1}], "giai": "Trong chu kì, từ trái sang phải tính kim loại giảm. Trong nhóm, từ trên xuống dưới tính kim loại tăng.", "vi_sao": "Đúng hết! Cùng chu kì 3: Na > Mg > Al. Cùng nhóm IIA: Be < Mg < Ca.", "hoi_id": "c15-hoi", "sai_id": "c15-sai", "vi_sao_id": "c15-vi-sao"}, {"ma": "c16", "loai": "chon", "ten": "Câu 3a SGK: vị trí của potassium", "muc": "van-dung", "yccd": [2], "sgk": ["3"], "hoi": "Potassium có Z = 19. Bạn viết nháp cấu hình electron, rồi chọn vị trí đúng của potassium.", "noi": "Potassium có Z bằng mười chín. Bạn viết nháp cấu hình electron, rồi chọn vị trí đúng của potassium.", "lua": [{"chu": "Ô 19, chu kì 3, nhóm VIIIA", "giai": "Lớp 3 có 3s²3p⁶ nhưng electron cuối cùng đã sang lớp 4 (4s¹). K có 4 lớp electron.", "sai_id": "c16-sai-1"}, {"chu": "Ô 19, chu kì 4, nhóm IIA", "giai": "Lớp ngoài cùng 4s¹ chỉ có 1 electron, nên ở nhóm IA.", "sai_id": "c16-sai-2"}, {"chu": "Ô 19, chu kì 4, nhóm IA", "dung": true}, {"chu": "Ô 19, chu kì 1, nhóm IVA", "giai": "Số chu kì là số lớp electron (4 lớp), không phải số electron lớp ngoài cùng.", "sai_id": "c16-sai-4"}], "vi_sao": "Cấu hình electron của K: 1s²2s²2p⁶3s²3p⁶4s¹. Có 4 lớp electron → chu kì 4; 1 electron lớp ngoài cùng → nhóm IA.", "hoi_id": "c16-hoi", "vi_sao_id": "c16-vi-sao"}, {"ma": "c17", "loai": "chon", "ten": "Câu 3b SGK: tính chất của potassium", "muc": "van-dung", "yccd": [2], "sgk": ["3"], "hoi": "Nhận định nào đúng về tính chất của potassium và hợp chất của nó?", "noi": "Potassium đứng đầu chu kì bốn, ngay dưới sodium. Nhận định nào đúng về tính chất của potassium và hợp chất của nó?", "lua": [{"chu": "K là phi kim; K₂O là acidic oxide", "giai": "K có 1 electron lớp ngoài cùng, rất dễ nhường electron nên là kim loại.", "sai_id": "c17-sai-1"}, {"chu": "K là kim loại yếu hơn Na, vì K nằm dưới Na", "giai": "Trong một nhóm, đi từ trên xuống dưới tính kim loại tăng. K nằm dưới Na nên mạnh hơn Na.", "sai_id": "c17-sai-2"}, {"chu": "K là kim loại mạnh hơn Na; K₂O là basic oxide, tác dụng với nước tạo KOH là base mạnh", "dung": true}, {"chu": "K là kim loại; KOH là hydroxide lưỡng tính", "giai": "Hydroxide của kim loại nhóm IA là base mạnh, không lưỡng tính.", "sai_id": "c17-sai-4"}], "vi_sao": "K là kim loại kiềm (nhóm IA), mạnh hơn Na và Ca. K₂O là basic oxide, tác dụng với nước tạo KOH là base mạnh.", "hoi_id": "c17-hoi", "vi_sao_id": "c17-vi-sao"}, {"ma": "c18", "loai": "trinh-bay", "ten": "Em có biết: dự đoán nguyên tố chưa tìm ra", "nen": "xanh-la", "bo_cuc": "trich-dan", "sac": "bi-an", "sgk": ["EB"], "trich": "Thứ nhất, ông đã dành chỗ trống cho các nguyên tố khi đó chưa được tìm ra và dự đoán tính chất của chúng (ví dụ: nguyên tố gallium và germanium).", "trich_nguon": "Mục Em có biết, SGK Hoá học 10, Kết nối tri thức, tr. 43", "hinh": {"chu": "Dự đoán từ vị trí"}, "dong": [{"id": "c18-1"}, {"sau": 20, "id": "c18-2"}, {"the": "Chỗ trống → **dự đoán** tính chất", "id": "c18-3"}, {"the": "Đến lượt bạn!", "id": "c18-4"}]}, {"ma": "c19", "loai": "chon", "ten": "Dự đoán nguyên tố số 87", "muc": "van-dung", "yccd": [2], "sgk": ["EB"], "hoi": "Nguyên tố số 87 không có trong tự nhiên. Biết nguyên tố số 86 là khí hiếm kết thúc chu kì 6. Dự đoán nào đúng về nguyên tố số 87?", "noi": "Nguyên tố số tám mươi bảy không có trong tự nhiên. Biết nguyên tố số tám mươi sáu là khí hiếm kết thúc chu kì sáu. Bạn dự đoán nguyên tố số tám mươi bảy nhé.", "lua": [{"chu": "Chu kì 6, nhóm VIIIA, là khí hiếm", "giai": "Chu kì 6 đã kết thúc ở nguyên tố số 86. Nguyên tố số 87 mở đầu chu kì mới.", "sai_id": "c19-sai-1"}, {"chu": "Chu kì 7, nhóm VIIA, là phi kim mạnh", "giai": "Mở đầu chu kì mới, lớp ngoài cùng mới có 1 electron, nên ở nhóm IA chứ không phải VIIA.", "sai_id": "c19-sai-2"}, {"chu": "Chu kì 7, nhóm IA, là kim loại mạnh", "dung": true}, {"chu": "Chu kì 8, nhóm IA, là kim loại mạnh", "giai": "Sau chu kì 6 là chu kì 7. Nguyên tố số 87 có 7 lớp electron.", "sai_id": "c19-sai-4"}], "vi_sao": "Sau khí hiếm số 86 là chu kì 7. Nguyên tố số 87 có 7 lớp electron, 1 electron lớp ngoài cùng → chu kì 7, nhóm IA, là kim loại kiềm, tính kim loại mạnh vì nằm ở cuối nhóm.", "hoi_id": "c19-hoi", "vi_sao_id": "c19-vi-sao"}, {"ma": "c20", "loai": "chon", "ten": "Trả lời câu hỏi đầu bài", "muc": "hieu", "yccd": [1, 2], "sgk": ["MD"], "hoi": "Định luật tuần hoàn giúp gì trong việc dự đoán tính chất của các chất?", "noi": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Định luật tuần hoàn giúp gì trong việc dự đoán tính chất của các chất?", "lua": [{"chu": "Dự đoán được tính chất từ vị trí, cấu hình e", "dung": true}, {"chu": "Chỉ để tính khối lượng nguyên tử", "giai": "Định luật nói về tính chất của nguyên tố, đơn chất và hợp chất, không dùng để tính khối lượng nguyên tử.", "sai_id": "c20-sai-2"}, {"chu": "Chỉ cho nguyên tố đã tìm ra", "giai": "Mendeleev đã dự đoán tính chất của gallium, germanium khi chúng chưa được tìm ra.", "sai_id": "c20-sai-3"}, {"chu": "Không giúp gì, phải làm thí nghiệm", "giai": "Thí nghiệm để kiểm chứng. Nhưng nhờ quy luật tuần hoàn, ta dự đoán được trước tính chất.", "sai_id": "c20-sai-4"}], "vi_sao": "Vị trí ⇄ cấu hình electron → tính chất. Nhờ định luật tuần hoàn, biết vị trí hoặc cấu hình electron là dự đoán được tính chất, viết được công thức oxide, hydroxide và so sánh với các nguyên tố xung quanh.", "hoi_id": "c20-hoi", "vi_sao_id": "c20-vi-sao"}, {"ma": "c21", "loai": "ghi-nho", "ten": "Điều cần nhớ", "sgk": ["MD"], "y": [{"chu": "Định luật tuần hoàn", "dam": "theo chiều tăng Z"}, {"chu": "Ý nghĩa", "dam": "Cấu hình ⇄ Vị trí → Tính chất"}, {"chu": "Từ vị trí", "dam": "Cấu hình · Kim loại/phi kim · Oxide, hydroxide"}], "o_nha": "Câu 2, 3 SGK tr. 44: viết vào vở cấu hình electron, vị trí và tính chất của magnesium và potassium (đơn chất, oxide, hydroxide) để đối chiếu ở tiết sau.", "dong": [{"id": "c21-1"}, {"id": "c21-2"}, {"id": "c21-3"}, {"id": "c21-4"}]}, {"ma": "ket", "loai": "ket-qua", "ten": "Kết quả"}], "dan_hinh": {"nhan-vat": {"ve": "Bạn Ghim — đứng thẳng, mỉm cười", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat.png", "loai": "nhan-vat"}, "nhan-vat-m-ngam": {"ve": "Bạn Ghim — miệng ngậm", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat-m-ngam.png", "loai": "nhan-vat"}, "nhan-vat-m-he": {"ve": "Bạn Ghim — miệng hé", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat-m-he.png", "loai": "nhan-vat"}, "nhan-vat-m-mo": {"ve": "Bạn Ghim — miệng mở", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat-m-mo.png", "loai": "nhan-vat"}, "nhan-vat-vui": {"ve": "Bạn Ghim — vui, có sao", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat-vui.png", "loai": "nhan-vat"}, "nhan-vat-nghi": {"ve": "Bạn Ghim — suy nghĩ, dấu hỏi", "nguon": "Tranh minh hoạ AI (Gemini), người soạn chỉnh khung miệng", "tep": "nhan-vat-nghi.png" const MEDIA = /*__MEDIA__*/{"c1-1": {"d": 5.88, "s": "media/c1-1.mp3", "loai": "am", "chu": "Chào các bạn lớp Mười! Mình là Ghim, một chiếc ghim định vị."}, "c1-2": {"d": 10.032, "s": "media/c1-2.mp3", "loai": "am", "chu": "Ghim vào ô nào trong bảng tuần hoàn, mình đoán ngay được tính chất của nguyên tố ô đó. Hôm nay mình cùng cô Thơi dẫn các bạn học Bài 8 nhé."}, "c1-3": {"d": 5.4, "s": "media/c1-3.mp3", "loai": "am", "chu": "Định luật tuần hoàn đóng vai trò như thế nào trong việc dự đoán tính chất của các chất?"}, "c1-4": {"d": 4.104, "s": "media/c1-4.mp3", "loai": "am", "chu": "Cuối bài, bạn sẽ tự trả lời được câu hỏi này."}, "c2-1": {"d": 6.36, "s": "media/c2-1.mp3", "loai": "am", "chu": "Đây là nội dung định luật tuần hoàn. Bạn đọc thầm hai lần trên màn hình nhé."}, "c2-2": {"d": 5.424, "s": "media/c2-2.mp3", "loai": "am", "chu": "Định luật nói về ba thứ: nguyên tố, đơn chất và hợp chất của chúng."}, "c2-3": {"d": 5.736, "s": "media/c2-3.mp3", "loai": "am", "chu": "Tính chất của chúng biến đổi tuần hoàn, nghĩa là cứ sau một chu kì lại lặp lại."}, "c2-4": {"d": 7.176, "s": "media/c2-4.mp3", "loai": "am", "chu": "Và mốc để xếp là chiều tăng của điện tích hạt nhân nguyên tử. Bạn nhớ kĩ cụm từ này nhé."}, "c3-hoi": {"d": 6.48, "s": "media/c3-hoi.mp3", "loai": "am", "chu": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của đại lượng nào?"}, "c3-sai-1": {"d": 7.632, "s": "media/c3-sai-1.mp3", "loai": "am", "chu": "Khối lượng nguyên tử không dùng làm mốc: có nguyên tố nặng hơn vẫn đứng trước, ví dụ tellurium đứng trước iodine."}, "c3-sai-3": {"d": 8.76, "s": "media/c3-sai-3.mp3", "loai": "am", "chu": "Số lớp electron chỉ cho biết nguyên tố ở chu kì nào. Các nguyên tố trong cùng chu kì có cùng số lớp electron."}, "c3-sai-4": {"d": 8.16, "s": "media/c3-sai-4.mp3", "loai": "am", "chu": "Số neutron không quyết định vị trí. Các đồng vị của một nguyên tố khác số neutron mà vẫn ở cùng một ô."}, "c3-vi-sao": {"d": 8.64, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "Định luật tuần hoàn: tính chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử, cũng là thứ tự xếp các ô trong bảng tuần hoàn."}, "c4-1": {"d": 7.392, "s": "media/c4-1.mp3", "loai": "am", "chu": "Bạn nhìn đồ thị độ âm điện. Từ Li đến F, độ âm điện tăng dần."}, "c4-2": {"d": 7.152, "s": "media/c4-2.mp3", "loai": "am", "chu": "Sang Na, bắt đầu chu kì mới, độ âm điện tụt xuống, rồi lại tăng dần đến Cl."}, "c4-3": {"d": 6.864, "s": "media/c4-3.mp3", "loai": "am", "chu": "Đồ thị như răng cưa: hết một chu kì lại lặp lại. Đó chính là tuần hoàn."}, "c4-4": {"d": 9.096, "s": "media/c4-4.mp3", "loai": "am", "chu": "Bán kính nguyên tử, tính kim loại, tính phi kim, tính acid và base cũng lặp lại như vậy, bạn đã gặp ở Bài 6 và Bài 7."}, "c5-hoi": {"d": 6.36, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Bạn xếp mỗi đơn chất của chu kì hai và chu kì ba vào đúng nhóm: kim loại hay phi kim."}, "c5-sai": {"d": 8.856, "s": "media/c5-sai.mp3", "loai": "am", "chu": "Trong một chu kì, đầu chu kì là kim loại, cuối chu kì là phi kim. Bạn nhìn vị trí nhóm của từng nguyên tố."}, "c5-vi-sao": {"d": 21.792, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Chu kì 2: Li, Be là kim loại; O, F là phi kim (B ở giữa là á kim). Chu kì 3: Na, Mg, Al là kim loại; S, Cl là phi kim. Hai chu kì lặp lại cùng một kiểu: tính kim loại giảm, tính phi kim tăng."}, "c6-hoi": {"d": 12.504, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Fluorine ở cuối chu kì hai là phi kim rất mạnh. Sang chu kì ba, sodium đứng đầu chu kì. Sodium có tính chất giống nguyên tố nào ở chu kì hai nhất?"}, "c6-sai-1": {"d": 7.92, "s": "media/c6-sai-1.mp3", "loai": "am", "chu": "F là phi kim rất mạnh, còn Na là kim loại điển hình. Tính chất không nối tiếp mà quay về đầu."}, "c6-sai-3": {"d": 4.8, "s": "media/c6-sai-3.mp3", "loai": "am", "chu": "O là phi kim mạnh ở cuối chu kì 2, không giống Na."}, "c6-sai-4": {"d": 8.616, "s": "media/c6-sai-4.mp3", "loai": "am", "chu": "Be là kim loại yếu, cùng nhóm với Mg. Na đứng đầu chu kì nên giống nguyên tố đứng đầu chu kì 2."}, "c6-vi-sao": {"d": 11.232, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Li và Na cùng đứng đầu chu kì, cùng nhóm IA, đều là kim loại mạnh. Tính chất quay về như đầu chu kì trước: đó là sự tuần hoàn."}, "c7-1": {"d": 5.352, "s": "media/c7-1.mp3", "loai": "am", "chu": "Vị trí của nguyên tố trong bảng tuần hoàn cho biết cấu hình electron nguyên tử."}, "c7-2": {"d": 7.824, "s": "media/c7-2.mp3", "loai": "am", "chu": "Ngược lại, biết cấu hình electron, ta tìm được vị trí. Hai mũi tên đi cả hai chiều."}, "c7-3": {"d": 4.008, "s": "media/c7-3.mp3", "loai": "am", "chu": "Cấu hình electron quyết định tính chất của nguyên tố."}, "c7-4": {"d": 6.84, "s": "media/c7-4.mp3", "loai": "am", "chu": "Vì vậy, biết vị trí hoặc cấu hình electron, ta dự đoán được tính chất hoá học của nguyên tố."}, "c8-1": {"d": 6.384, "s": "media/c8-1.mp3", "loai": "am", "chu": "Mình ghim vào ô của sulfur: ô số 16, chu kì 3, nhóm VIA."}, "c8-2": {"d": 7.608, "s": "media/c8-2.mp3", "loai": "am", "chu": "Bạn nhớ ba quy tắc ở Bài 5. Số thứ tự ô bằng số proton và bằng số electron."}, "c8-3": {"d": 3.936, "s": "media/c8-3.mp3", "loai": "am", "chu": "Số thứ tự chu kì bằng số lớp electron."}, "c8-4": {"d": 7.848, "s": "media/c8-4.mp3", "loai": "am", "chu": "Số thứ tự nhóm A bằng số electron lớp ngoài cùng. Giờ bạn thử đọc cấu tạo của S nhé!"}, "c9-hoi": {"d": 5.928, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Bạn nối mỗi thông tin vị trí của sulfur với điều nó cho biết về nguyên tử sulfur."}, "c9-sai": {"d": 7.008, "s": "media/c9-sai.mp3", "loai": "am", "chu": "Ô cho biết Z, chu kì cho biết số lớp electron, nhóm A cho biết số electron lớp ngoài cùng."}, "c9-vi-sao": {"d": 18.528, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Ô 16 → 16 proton, 16 electron; chu kì 3 → 3 lớp electron; nhóm VIA → 6 electron lớp ngoài cùng. Cấu hình electron của S: 1s²2s²2p⁶3s²3p⁴."}, "c9-sai-2": {"d": 8.64, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "Số 6 của nhóm VIA là số electron lớp ngoài cùng. Số lớp electron lấy theo chu kì: 3 lớp."}, "c10-1": {"d": 12.12, "s": "media/c10-1.mp3", "loai": "am", "chu": "Có cấu tạo rồi, ta suy ra tính chất. S là phi kim, oxide cao nhất SO₃ là acidic oxide, acid tương ứng H₂SO₄ là acid mạnh."}, "c10-2": {"d": 10.08, "s": "media/c10-2.mp3", "loai": "am", "chu": "Bây giờ đi chiều ngược lại. Phosphorus có cấu hình 1s²2s²2p⁶3s²3p³."}, "c10-3": {"d": 6.792, "s": "media/c10-3.mp3", "loai": "am", "chu": "Đếm tổng số electron được 15, vậy Z bằng 15, P ở ô số 15."}, "c10-4": {"d": 7.824, "s": "media/c10-4.mp3", "loai": "am", "chu": "Có 3 lớp electron nên ở chu kì 3. Có 5 electron lớp ngoài cùng nên ở nhóm VA."}, "c10-5": {"d": 10.032, "s": "media/c10-5.mp3", "loai": "am", "chu": "P là phi kim. Oxide cao nhất P₂O₅ là acidic oxide, acid tương ứng H₃PO₄ là acid trung bình."}, "c11-hoi": {"d": 12.84, "s": "media/c11-hoi.mp3", "loai": "am", "chu": "Nguyên tố X có cấu hình electron một ét hai, hai ét hai, hai pê sáu, ba ét hai, ba pê năm. X ở ô số mấy? Bạn gõ số vào ô nhé."}, "c11-sai": {"d": 9.456, "s": "media/c11-sai.mp3", "loai": "am", "chu": "Bạn cộng các số mũ: 2 + 2 + 6 + 2 + 5. Tổng số electron bằng Z, chính là số thứ tự ô."}, "c11-vi-sao": {"d": 11.136, "s": "media/c11-vi-sao.mp3", "loai": "am", "chu": "2 + 2 + 6 + 2 + 5 = 17 electron, nên Z = 17: X ở ô số 17. Đó là chlorine (Cl)."}, "c12-hoi": {"d": 6.264, "s": "media/c12-hoi.mp3", "loai": "am", "chu": "Vẫn nguyên tố X đó. Nhận định nào đúng về vị trí và tính chất của X?"}, "c12-sai-1": {"d": 10.08, "s": "media/c12-sai-1.mp3", "loai": "am", "chu": "Lớp ngoài cùng 3s²3p⁵ có 2 + 5 = 7 electron, nên ở nhóm VIIA. Có 7 electron lớp ngoài cùng là phi kim."}, "c12-sai-3": {"d": 7.392, "s": "media/c12-sai-3.mp3", "loai": "am", "chu": "Chu kì bằng số lớp electron. Lớp ngoài cùng là lớp 3, nên X ở chu kì 3."}, "c12-sai-4": {"d": 6.144, "s": "media/c12-sai-4.mp3", "loai": "am", "chu": "X là phi kim cuối chu kì 3, oxide cao nhất Cl₂O₇ là acidic oxide."}, "c12-vi-sao": {"d": 13.128, "s": "media/c12-vi-sao.mp3", "loai": "am", "chu": "3 lớp electron → chu kì 3; 7 electron lớp ngoài cùng → nhóm VIIA. X (Cl) là phi kim mạnh; Cl₂O₇ là acidic oxide, HClO₄ là acid rất mạnh (Bảng 7.2)."}, "c13-1": {"d": 6.144, "s": "media/c13-1.mp3", "loai": "am", "chu": "Dựa vào định luật tuần hoàn, ta còn so sánh được một nguyên tố với các nguyên tố xung quanh."}, "c13-2": {"d": 10.92, "s": "media/c13-2.mp3", "loai": "am", "chu": "So sánh tính phi kim của P với N và S. P và N cùng nhóm VA, N ở trên."}, "c13-3": {"d": 8.136, "s": "media/c13-3.mp3", "loai": "am", "chu": "Trong nhóm, đi lên trên tính phi kim mạnh hơn. Nên N có tính phi kim mạnh hơn P."}, "c13-4": {"d": 9.216, "s": "media/c13-4.mp3", "loai": "am", "chu": "P và S cùng chu kì 3, S ở bên phải. Nên P có tính phi kim yếu hơn S."}, "c13b-hoi": {"d": 10.56, "s": "media/c13b-hoi.mp3", "loai": "am", "chu": "Đến lượt bạn. Sulfur ở chu kì ba, nhóm sáu A. So sánh tính phi kim của sulfur với oxygen ở ngay trên và chlorine ở bên phải nhé."}, "c13b-sai-2": {"d": 10.104, "s": "media/c13b-sai-2.mp3", "loai": "am", "chu": "Trong nhóm, đi lên trên tính phi kim mạnh hơn; trong chu kì, sang phải tính phi kim mạnh hơn. S ở dưới O và bên trái Cl."}, "c13b-sai-3": {"d": 5.76, "s": "media/c13b-sai-3.mp3", "loai": "am", "chu": "O và S cùng nhóm VIA, O ở trên nên O có tính phi kim mạnh hơn S."}, "c13b-sai-4": {"d": 6.648, "s": "media/c13b-sai-4.mp3", "loai": "am", "chu": "S và Cl cùng chu kì 3, Cl ở bên phải nên Cl có tính phi kim mạnh hơn S."}, "c13b-vi-sao": {"d": 13.368, "s": "media/c13b-vi-sao.mp3", "loai": "am", "chu": "Cùng nhóm VIA: O ở trên nên phi kim mạnh hơn S. Cùng chu kì 3: Cl ở bên phải nên phi kim mạnh hơn S. Làm giống hệt ví dụ so sánh P với N và S."}, "c14-hoi": {"d": 8.664, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Magnesium ở ô số mười hai, chu kì ba, nhóm hai A. Bạn viết nháp cấu hình electron, rồi chọn nhận định đúng."}, "c14-sai-1": {"d": 7.704, "s": "media/c14-sai-1.mp3", "loai": "am", "chu": "Ô 12 thì chỉ có 12 electron. Cấu hình này có 14 electron, của Si."}, "c14-sai-3": {"d": 10.032, "s": "media/c14-sai-3.mp3", "loai": "am", "chu": "Mg có 2 electron lớp ngoài cùng, dễ nhường electron, nên là kim loại. Oxide của kim loại này là basic oxide."}, "c14-sai-4": {"d": 6.12, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Cấu hình này chỉ có 11 electron, của Na. Mg có 12 electron."}, "c14-vi-sao": {"d": 14.784, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "Mg có 12 electron: 1s²2s²2p⁶3s², 2 electron lớp ngoài cùng nên là kim loại. MgO là basic oxide, Mg(OH)₂ là base."}, "c15-hoi": {"d": 15.048, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Quanh magnesium có bốn nguyên tố: sodium bên trái, aluminium bên phải, beryllium ở trên, calcium ở dưới. So với magnesium, mỗi nguyên tố có tính kim loại mạnh hơn hay yếu hơn?"}, "c15-sai": {"d": 8.016, "s": "media/c15-sai.mp3", "loai": "am", "chu": "Trong chu kì, từ trái sang phải tính kim loại giảm. Trong nhóm, từ trên xuống dưới tính kim loại tăng."}, "c15-vi-sao": {"d": 10.8, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Cùng chu kì 3: Na > Mg > Al. Cùng nhóm IIA: Be < Mg < Ca."}, "c16-hoi": {"d": 8.976, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Potassium có Z bằng mười chín. Bạn viết nháp cấu hình electron, rồi chọn vị trí đúng của potassium."}, "c16-sai-1": {"d": 10.248, "s": "media/c16-sai-1.mp3", "loai": "am", "chu": "Lớp 3 có 3s²3p⁶ nhưng electron cuối cùng đã sang lớp 4 (4s¹). K có 4 lớp electron."}, "c16-sai-2": {"d": 5.76, "s": "media/c16-sai-2.mp3", "loai": "am", "chu": "Lớp ngoài cùng 4s¹ chỉ có 1 electron, nên ở nhóm IA."}, "c16-sai-4": {"d": 6.528, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Số chu kì là số lớp electron (4 lớp), không phải số electron lớp ngoài cùng."}, "c16-vi-sao": {"d": 14.952, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "Cấu hình electron của K: 1s²2s²2p⁶3s²3p⁶4s¹. Có 4 lớp electron → chu kì 4; 1 electron lớp ngoài cùng → nhóm IA."}, "c17-hoi": {"d": 9.648, "s": "media/c17-hoi.mp3", "loai": "am", "chu": "Potassium đứng đầu chu kì bốn, ngay dưới sodium. Nhận định nào đúng về tính chất của potassium và hợp chất của nó?"}, "c17-sai-1": {"d": 5.736, "s": "media/c17-sai-1.mp3", "loai": "am", "chu": "K có 1 electron lớp ngoài cùng, rất dễ nhường electron nên là kim loại."}, "c17-sai-2": {"d": 7.872, "s": "media/c17-sai-2.mp3", "loai": "am", "chu": "Trong một nhóm, đi từ trên xuống dưới tính kim loại tăng. K nằm dưới Na nên mạnh hơn Na."}, "c17-sai-4": {"d": 5.328, "s": "media/c17-sai-4.mp3", "loai": "am", "chu": "Hydroxide của kim loại nhóm IA là base mạnh, không lưỡng tính."}, "c17-vi-sao": {"d": 10.608, "s": "media/c17-vi-sao.mp3", "loai": "am", "chu": "K là kim loại kiềm (nhóm IA), mạnh hơn Na và Ca. K₂O là basic oxide, tác dụng với nước tạo KOH là base mạnh."}, "c18-1": {"d": 5.592, "s": "media/c18-1.mp3", "loai": "am", "chu": "Mendeleev đã dùng chính ý nghĩa của bảng tuần hoàn để làm một việc rất táo bạo."}, "c18-2": {"d": 3.264, "s": "media/c18-2.mp3", "loai": "am", "chu": "Bạn đọc thầm đoạn trích trên màn hình nhé."}, "c18-3": {"d": 6.816, "s": "media/c18-3.mp3", "loai": "am", "chu": "Chưa ai tìm ra gallium và germanium, nhưng nhìn vào chỗ trống, ông đoán được tính chất của chúng."}, "c18-4": {"d": 3.912, "s": "media/c18-4.mp3", "loai": "am", "chu": "Bây giờ đến lượt bạn thử làm nhà dự đoán nhé!"}, "c19-hoi": {"d": 11.856, "s": "media/c19-hoi.mp3", "loai": "am", "chu": "Nguyên tố số tám mươi bảy không có trong tự nhiên. Biết nguyên tố số tám mươi sáu là khí hiếm kết thúc chu kì sáu. Bạn dự đoán nguyên tố số tám mươi bảy nhé."}, "c19-sai-1": {"d": 7.848, "s": "media/c19-sai-1.mp3", "loai": "am", "chu": "Chu kì 6 đã kết thúc ở nguyên tố số 86. Nguyên tố số 87 mở đầu chu kì mới."}, "c19-sai-2": {"d": 7.344, "s": "media/c19-sai-2.mp3", "loai": "am", "chu": "Mở đầu chu kì mới, lớp ngoài cùng mới có 1 electron, nên ở nhóm IA chứ không phải VIIA."}, "c19-sai-4": {"d": 7.08, "s": "media/c19-sai-4.mp3", "loai": "am", "chu": "Sau chu kì 6 là chu kì 7. Nguyên tố số 87 có 7 lớp electron."}, "c19-vi-sao": {"d": 14.664, "s": "media/c19-vi-sao.mp3", "loai": "am", "chu": "Sau khí hiếm số 86 là chu kì 7. Nguyên tố số 87 có 7 lớp electron, 1 electron lớp ngoài cùng → chu kì 7, nhóm IA, là kim loại kiềm, tính kim loại mạnh vì nằm ở cuối nhóm."}, "c20-hoi": {"d": 8.016, "s": "media/c20-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Định luật tuần hoàn giúp gì trong việc dự đoán tính chất của các chất?"}, "c20-sai-2": {"d": 6.744, "s": "media/c20-sai-2.mp3", "loai": "am", "chu": "Định luật nói về tính chất của nguyên tố, đơn chất và hợp chất, không dùng để tính khối lượng nguyên tử."}, "c20-sai-3": {"d": 6.096, "s": "media/c20-sai-3.mp3", "loai": "am", "chu": "Mendeleev đã dự đoán tính chất của gallium, germanium khi chúng chưa được tìm ra."}, "c20-sai-4": {"d": 6.888, "s": "media/c20-sai-4.mp3", "loai": "am", "chu": "Thí nghiệm để kiểm chứng. Nhưng nhờ quy luật tuần hoàn, ta dự đoán được trước tính chất."}, "c20-vi-sao": {"d": 13.872, "s": "media/c20-vi-sao.mp3", "loai": "am", "chu": "Vị trí ⇄ cấu hình electron → tính chất. Nhờ định luật tuần hoàn, biết vị trí hoặc cấu hình electron là dự đoán được tính chất, viết được công thức oxide, hydroxide và so sánh với các nguyên tố xung quanh."}, "c21-1": {"d": 3.384, "s": "media/c21-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại ba ý của bài nhé."}, "c21-2": {"d": 7.608, "s": "media/c21-2.mp3", "loai": "am", "chu": "Tính chất của nguyên tố, đơn chất, thành phần và tính chất hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân."}, "c21-3": {"d": 6.504, "s": "media/c21-3.mp3", "loai": "am", "chu": "Cấu hình electron và vị trí suy ra được cho nhau, và cùng quyết định tính chất của nguyên tố."}, "c21-4": {"d": 11.856, "s": "media/c21-4.mp3", "loai": "am", "chu": "Từ vị trí, bạn viết được cấu hình, dự đoán kim loại hay phi kim, viết công thức oxide, hydroxide. Ghim vào ô nào, đoán ngay ô đó nhé!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "chon-the": {"d": 4.176, "s": "media/chon-the.mp3", "loai": "am", "chu": "Bạn bấm vào một thẻ trước, rồi bấm vào nhóm nhé."}, "ket": {"d": 8.136, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong định luật tuần hoàn và ý nghĩa của bảng tuần hoàn. Bạn bấm Chép kết quả để gửi cô Thơi nhé!"}}/*__MEDIA_HET__*/;
