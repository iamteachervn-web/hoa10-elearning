<script id="loa-chung">
/* MỘT LOA CHUNG CHO CẢ BÀI — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (17/11/2026).
   Lỗi gặp: trình phát tạo một thẻ <audio> mới cho từng câu đọc rồi tự phát theo dòng thời gian (không do bấm tay).
   Điện thoại (nhất là iPhone, Safari) chỉ cho phát thẻ âm thanh nào đã được "mở" bằng một lần chạm → câu đầu
   (ngay sau khi chạm) có tiếng, các câu sau bị chặn: im lặng, nhân vật không mấp máy môi.
   Cách sửa: cả bài dùng MỘT thẻ âm thanh, mở nó ngay lần chạm đầu tiên, rồi chỉ đổi tệp tiếng cho từng câu.
   Mỗi câu vẫn có "tay cầm" riêng (__LOA) giống thẻ <audio> cũ: play, pause, paused, currentTime, playbackRate,
   onended, sự kiện ended/pause — nên trình phát của bài không phải sửa gì khác. */
(function () {
  var a = null, chu = null, daMo = false;
  function loa() {
    if (a) return a;
    a = document.createElement('audio'); a.preload = 'auto'; a.setAttribute('playsinline', '');
    a.addEventListener('ended', function () { var h = chu; if (!h || h._dung) return; h._het = true; if (typeof h.onended === 'function') try { h.onended(); } catch (e) {} h.dispatchEvent(new Event('ended')); });
    return a;
  }
  function im() {   // tệp WAV im lặng rất ngắn, chỉ để "mở loa" trong lần chạm đầu
    var n = 400, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = function (o, s) { for (var i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (var i = 0; i < n; i++) b[44 + i] = 128;
    var s = ''; for (var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]); return 'data:audio/wav;base64,' + btoa(s);
  }
  function moLoa() {
    if (daMo) return; var x = loa(); if (chu) { daMo = true; return; }
    try {
      x.src = im(); x.dataset.id = '';
      var p = x.play(); daMo = true;
      if (p && p.then) p.then(function () { if (!chu) x.pause(); }, function () { daMo = false; });
    } catch (e) { daMo = false; }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (k) { window.addEventListener(k, moLoa, true); });

  class TayCam extends EventTarget {   // phải kế thừa thật (class), không thì addEventListener báo lỗi
    constructor(src) { super(); this._src = src; this._tu = 0; this._toc = 1; this._dung = true; this._het = false; this.onended = null; this.preload = 'auto'; }
  }
  Object.defineProperty(TayCam.prototype, 'paused', { get: function () { return this._dung || this._het || chu !== this || !a || a.paused; } });
  Object.defineProperty(TayCam.prototype, 'currentTime', {
    get: function () { return chu === this && a ? a.currentTime : this._tu; },
    set: function (t) { this._tu = +t || 0; if (chu === this && a && a.readyState >= 1) try { a.currentTime = this._tu; } catch (e) {} }
  });
  Object.defineProperty(TayCam.prototype, 'playbackRate', {
    get: function () { return this._toc; },
    set: function (r) { this._toc = +r || 1; if (chu === this && a) try { a.playbackRate = this._toc; } catch (e) {} }
  });
  TayCam.prototype.play = function () {
    var x = loa(), h = this, tu = this._tu;
    if (chu && chu !== h && !chu._dung) chu.pause();
    chu = h; h._dung = false; h._het = false;
    if (x.dataset.id !== h._src) { x.src = h._src; x.dataset.id = h._src; }
    try { x.playbackRate = h._toc; } catch (e) {}
    if (x.readyState >= 1) { try { x.currentTime = tu; } catch (e) {} }
    else x.addEventListener('loadedmetadata', function () { if (chu === h) try { x.currentTime = tu; x.playbackRate = h._toc; } catch (e) {} }, { once: true });
    var p = x.play();
    return p && p.then ? p : Promise.resolve();
  };
  TayCam.prototype.pause = function () {
    if (this._dung) return; this._dung = true;
    if (chu === this && a) { this._tu = a.currentTime; try { a.pause(); } catch (e) {} }
    this.dispatchEvent(new Event('pause'));   // báo ngay cho câu đang chờ (như thẻ <audio> cũ báo "pause")
  };
  window.__LOA = function (src) { return new TayCam(src); };
})();
</script>
<script id="cau-noi-web">
/* CẦU NỐI BÁO ĐIỂM — máy đóng gói chèn đoạn này vào đầu mỗi bài e-learning (thay bai2-elearning-nguyen-to-hoa-hoc bằng mã bài).
   Bài e-learning mở trong khung của web lớp (xem.html). Khi kho bài nằm ở tên miền khác web lớp,
   trình duyệt không cho bài gọi thẳng web lớp, nên bài báo điểm bằng cách "gửi thư" (postMessage) ra khung ngoài.
   - Mở trong khung: tạo API kiểu SCORM 1.2 ngay trong bài; mỗi lần bài ghi điểm / tiến độ thì gửi ra web lớp.
   - Tiến độ học dở: web lớp gửi vào qua phần #tw=… của địa chỉ (web lớp giữ hộ), không có thì lấy bản bài tự lưu.
   - Mở riêng (không có khung ngoài): không làm gì, bài chạy như bản gửi học sinh.
   Không gửi mã học sinh, mật mã hay thông tin cá nhân nào — chỉ mã bài, trạng thái, % đúng, tiến độ. */
(function () {
  if (window.parent === window) return;
  var ID = 'bai2-elearning-nguyen-to-hoa-hoc', K = 'hoa10_el_' + ID, v = {};
  try { v = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) {}
  try {
    var m = /[#&]tw=([^&]*)/.exec(location.hash);
    if (m) { var ngoai = JSON.parse(decodeURIComponent(m[1])); for (var k in ngoai) v[k] = String(ngoai[k]); }
  } catch (e) {}
  function luu() { try { localStorage.setItem(K, JSON.stringify(v)); } catch (e) {} }
  function gui(viec, n, x) { try { window.parent.postMessage({ nguon: 'triway-el', id: ID, viec: viec, n: n, v: x }, '*'); } catch (e) {} }
  window.API = {
    LMSInitialize: function () { gui('mo'); return 'true'; },
    LMSGetValue: function (n) { return v[n] == null ? '' : v[n]; },
    LMSSetValue: function (n, x) { v[n] = String(x); gui('dat', n, String(x)); return 'true'; },
    LMSCommit: function () { luu(); gui('luu'); return 'true'; },
    LMSFinish: function () { luu(); gui('xong'); return 'true'; },
    LMSGetLastError: function () { return '0'; }, LMSGetErrorString: function () { return ''; }, LMSGetDiagnostic: function () { return ''; }
  };
})();
</script>

<style>
/* Trình phát bài e-learning Triway — khuôn chung (lam_elearning.py ghép bài vào). Sân khấu 16:9 co giãn theo cqw,
   thanh điều khiển như video, dải phụ đề dưới sân khấu, mục lục cảnh bên phải. */
:root{
  --ink:#23305E; --coral:#F2603D; --sun:#FFC53D; --mint:#1E9E6A; --rose:#D9434B;
  --paper:#FFF9EF; --card:#FFFFFF; --muted:#5E6785; --line:#E7DFD0; --bar:#23305E; --bar-fg:#FFF9EF;
  --f-hien:"Baloo 2","Segoe UI Rounded","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --f-trich:var(--f-hien);
  --f-chu:"Nunito","Segoe UI",system-ui,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E9ECF8;--paper:#151A2E;--card:#1F2640;--muted:#A9B0CB;--line:#2E3656;--bar:#0E1222;--bar-fg:#F3EEE3;--mint:#3CC48A;--rose:#F07178;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-chu);margin:0}
#app{max-width:1440px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header.dau{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hieu{font:800 13px/1 var(--f-chu);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.hieu i{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--sun)}
header h1{font:800 clamp(20px,2.4vw,28px)/1.1 var(--f-hien);margin:0;text-wrap:balance;flex:1 1 auto;min-width:0}
.cham{display:flex;gap:5px;flex-wrap:wrap}
.cham b{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.cham b.xong{background:var(--mint)}
.cham b.nay{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 30%,transparent)}
.than{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.than{grid-template-columns:minmax(0,1fr)}}
.trai{min-width:0;display:flex;flex-direction:column}
#khung{border-radius:14px 14px 0 0;overflow:hidden;background:#0E1222}
#stage{--nen:#FFF9EF;--chu:#23305E;--a1:#F2603D;--a2:#FFC53D;--a3:#1E9E6A;--a4:#D9434B;--the:#FFFFFF;--muc:#23305E;--chu-sang:#FFF8EC;
  --chu-nen:var(--chu);--halo:rgba(255,253,247,.55);--bong:color-mix(in srgb,var(--muc) 15%,transparent);
  --chu2:color-mix(in srgb,var(--chu) 72%,var(--the));--vien:color-mix(in srgb,var(--chu) 22%,var(--the));
  --a1d:color-mix(in srgb,var(--a1) 70%,#000);--a2d:color-mix(in srgb,var(--a2) 70%,#000);--a3d:color-mix(in srgb,var(--a3) 62%,#000);--a4d:color-mix(in srgb,var(--a4) 62%,#000);
  --a1t:color-mix(in srgb,var(--a1) 22%,#fff);--a2t:color-mix(in srgb,var(--a2) 22%,#fff);--a3t:color-mix(in srgb,var(--a3) 16%,#fff);--a4t:color-mix(in srgb,var(--a4) 14%,#fff);
  position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;background:#FFF3DC;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#khung:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
#khung:fullscreen #stage{width:min(100vw,calc((100vh - 5em) * 16 / 9));margin:0 auto}
#nen,#tren{position:absolute;inset:0;width:100%;height:100%;display:block}
#tren{pointer-events:none}
#nen text{font-family:var(--f-hien)}
#lop{position:absolute;inset:0;pointer-events:none;font-family:var(--f-chu);color:var(--chu-nen)}
#lop *{pointer-events:auto}
#lop .tho,#lop .tho *{pointer-events:none}

/* nội dung trên sân khấu luôn tông sáng như tranh minh hoạ */

.the{background:var(--the);border-radius:1.4cqw;padding:1.1cqw 1.5cqw;box-shadow:0 .5cqw 0 var(--bong);font-size:calc(2.2cqw*var(--co,1));line-height:1.3;font-weight:700;color:var(--chu)}

.chip{display:inline-block;font-size:calc(2cqw*var(--co,1));border-radius:99px;padding:.4cqw 1.4cqw;font:800 2cqw/1.3 var(--f-hien);background:var(--the);color:var(--chu);white-space:nowrap}
.may{font:800 1.5cqw/1.2 var(--f-chu);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--chu-nen) 80%,transparent)}
.tde{font:800 6.2cqw/1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}

.khung-co{border-radius:50%;overflow:hidden;background:var(--chu);border:.5cqw solid #fff;box-shadow:0 0 0 .35cqw var(--a1),0 .8cqw 1.6cqw color-mix(in srgb,var(--muc) 30%,transparent);transition:box-shadow .2s}

.chon{display:flex;flex-direction:column;gap:1.3cqw}

.nut-chon:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 var(--chu)}

.lac{animation:lac .45s}
@keyframes lac{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.6cqw)}}

.nut-sk:active{transform:translateY(.35cqw);box-shadow:0 .1cqw 0 var(--chu)}
.nut-sk[disabled]{opacity:.45;cursor:default}
.hang{display:flex;gap:1.2cqw;flex-wrap:wrap;align-items:center}
.bao{font:800 2.2cqw/1.3 var(--f-hien);min-height:3cqw}
.bao.dung{color:var(--a3)}.bao.sai{color:var(--a4)}
.o-dien{font:800 4cqw/1 var(--f-hien);width:16cqw;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:.4cqw solid var(--chu);color:var(--chu);background:var(--the);text-align:center}
.don-vi{font:800 3cqw/1 var(--f-hien);color:var(--chu-nen)}
.the-n{background:var(--the);color:var(--chu);border:.35cqw solid var(--vien);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8cqw;gap:.4cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--bong);transition:transform .1s}

.the-n.khop,.o-phai.khop{border-color:var(--a3);background:var(--a3t);cursor:default}
.o-phai{background:var(--the);border:.35cqw solid var(--chu);border-radius:1.2cqw;font:800 2.3cqw/1.15 var(--f-hien);color:var(--chu);display:grid;place-items:center;text-align:center;padding:.6cqw;cursor:pointer;box-shadow:0 .5cqw 0 var(--chu)}
.o-phai.lcd-k{background:#1B2238;color:#7CF2B2;border-color:#3A4566;font:800 3.4cqw/1 "Consolas","Courier New",monospace;box-shadow:0 .5cqw 0 #0E1222;font-variant-numeric:tabular-nums}

.phu{font:800 1.5cqw/1 var(--f-chu);padding:.35cqw 1cqw;border-radius:99px;background:var(--a2t);color:var(--a2d)}

.the-k.dat svg.dh{width:5cqw;height:5cqw}.the-k.dat img{max-height:5cqw}
.nhom{background:color-mix(in srgb,var(--the) 78%,transparent);border:.35cqw dashed var(--chu);border-radius:1.6cqw;display:flex;flex-direction:column;gap:.6cqw;padding:.8cqw;cursor:pointer}
.nhom .ten-nhom{font:800 2.3cqw/1.1 var(--f-hien);text-align:center;color:var(--chu)}

#tiep{position:absolute;right:2cqw;bottom:2cqw;font:800 2.6cqw/1 var(--f-hien);background:var(--a1);color:#fff;border:0;border-radius:99px;padding:1.2cqw 2.6cqw;box-shadow:0 .5cqw 0 var(--a1d);cursor:pointer;animation:nhun 1.4s infinite;z-index:6}

@keyframes nhun{50%{transform:translateY(-.5cqw)}}
#phim{position:absolute;inset:0;width:100%;height:100%;background:#0E1222;object-fit:contain}
.ten-o{font:700 2.2cqw/1 var(--f-chu);padding:1cqw 1.4cqw;border-radius:1cqw;border:.3cqw solid var(--chu);width:100%;color:var(--chu);background:var(--the)}
.sao{display:flex;gap:1.2cqw}
.sao svg{width:8cqw;height:8cqw}
.dong-ket{color:var(--chu);display:grid;grid-template-columns:1fr auto;gap:.5cqw 2cqw;font:700 2cqw/1.25 var(--f-chu);background:var(--the);border-radius:1.4cqw;padding:1.2cqw 1.8cqw}

.xoay{display:none}

/* ===== 2b · nền tối tự nhận · bố cục · phong cách theo cấp/môn (08/11/2026) ===== */
#stage.toi{--chu-nen:var(--chu-sang);--halo:rgba(6,10,24,.5)}

.may,.tde,.tde2,.hoi,.bao,.tieu-canh,.don-vi,.trich{transition:color .6s}
.tde,.hoi,.tieu-canh,.may,.tde2{text-shadow:0 0 .9cqw var(--halo)}
.tieu-canh{font:800 calc(3.6cqw*var(--co,1))/1.1 var(--f-hien);color:var(--chu-nen);margin:0;text-wrap:balance}
.tren-anh{color:#fff!important;text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.55)!important}
.anh-tran{overflow:hidden}
.anh-tran .anh-trong{transition:none}
.man-che{background:linear-gradient(90deg,rgba(8,14,28,.66) 0%,rgba(8,14,28,.36) 42%,rgba(8,14,28,0) 64%)}
.man-che.kb{background:linear-gradient(180deg,rgba(8,14,28,.55) 0%,rgba(8,14,28,0) 24%,rgba(8,14,28,0) 46%,rgba(8,14,28,.62) 100%)}
.cot.kinh .the,.cot.kinh .trich{background:color-mix(in srgb,var(--the) 86%,transparent);-webkit-backdrop-filter:blur(.5cqw);backdrop-filter:blur(.5cqw)}

.logo-truong{display:flex;align-items:center;gap:.8cqw;font:800 1.3cqw/1.2 var(--f-chu);color:var(--chu-nen);white-space:nowrap}

/* --- Sổ tay khám phá: giấy kẻ, băng dính, ảnh dán --- */
#stage[data-pc="so-tay"] .the,#stage[data-pc="so-tay"] .chu-to{border-radius:.5cqw;box-shadow:0 .25cqw .9cqw var(--bong)}

#stage[data-pc="so-tay"] .may{width:max-content!important;max-width:60%;color:var(--muc);background:linear-gradient(transparent 50%,color-mix(in srgb,var(--a2) 70%,transparent) 50%);padding:0 .4cqw;text-shadow:none}

 proton, nên các đồng vị có cùng số electron.", "sai_id": "c8-sai-2"}, {"chu": "số neutron, nên khác số khối", "dung": true}, {"chu": "tính chất hoá học", "giai": "Electron quyết định tính chất hoá học; các đồng vị cùng số electron nên tính chất hoá học giống nhau.", "sai_id": "c8-sai-4"}], "vi_sao": "Đồng vị cùng số proton, cùng số electron, chỉ khác số neutron, nên khác số khối và khối lượng.", "hoi_id": "c8-hoi", "vi_sao_id": "c8-vi-sao"}, {"ma": "c9", "loai": "noi", "ten": "Câu 4a SGK: đồng vị Si", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hoi": "Silicon có Z = 14. Nối mỗi đồng vị với thành phần nguyên tử.", "noi": "Silicon có Z bằng mười bốn. Bạn nối mỗi đồng vị với số proton, neutron, electron của nó.", "giai": "Ba đồng vị cùng Z = 14 nên cùng 14 proton và 14 electron; số neutron = A − 14.", "vi_sao": "Đúng hết! Cùng 14 p và 14 e; số neutron: 28 − 14 = 14; 29 − 14 = 15; 30 − 14 = 16.", "phai": ["14 p, 15 n, 14 e", "14 p, 16 n, 14 e", "14 p, 14 n, 14 e", "15 p, 14 n, 15 e"], "trai": [{"chu": "{{28|14|Si}}"}, {"chu": "{{29|14|Si}}"}, {"chu": "{{30|14|Si}}"}], "dap": [2, 0, 1], "hoi_id": "c9-hoi", "sai_id": "c9-sai", "vi_sao_id": "c9-vi-sao", "sai_rieng": {"3": "c9-sai-2"}}, {"ma": "c10", "loai": "dien", "ten": "Câu 4b SGK: đồng vị Fe", "muc": "van-dung", "yccd": [2], "sgk": ["4"], "hoi": "Iron có Z = 26. Đồng vị {{57|26|Fe}} có bao nhiêu neutron?", "noi": "Sắt có Z bằng hai mươi sáu. Đồng vị sắt năm mươi bảy có bao nhiêu neutron? Bạn gõ số vào ô nhé.", "dap": ["31", "ba mươi mốt"], "don_vi": "neutron", "giai": "Số neutron N = A − Z.", "vi_sao": "N = 57 − 26 = 31. Tương tự {{54|26|Fe}} có 28, {{56|26|Fe}} có 30, {{58|26|Fe}} có 32 neutron; cả bốn đồng vị đều có 26 p và 26 e.", "hoi_id": "c10-hoi", "sai_id": "c10-sai", "vi_sao_id": "c10-vi-sao"}, {"ma": "c11", "loai": "trinh-bay", "ten": "Nguyên tử khối", "nen": "cam", "bo_cuc": "trich-dan", "sgk": ["5"], "trich": "Nguyên tử khối là khối lượng tương đối của nguyên tử.", "trich_nguon": "SGK Hoá học 10, Kết nối tri thức, tr. 19", "dong": [{"sau": 5, "id": "c11-1"}, {"the": "Nặng gấp bao nhiêu lần **1 amu**", "id": "c11-2"}, {"the": "Nguyên tử khối ≈ **số khối**", "id": "c11-3"}, {"the": "K: 19 + 20 = **39**", "id": "c11-4"}]}, {"ma": "c12", "loai": "trinh-bay", "ten": "Nguyên tử khối trung bình", "nen": "kem", "bo_cuc": "trai-phai", "sgk": ["5", "6"], "hinh": {"anh": "b02-pho-cl.png", "chu": "Phổ khối lượng của chlorine (vẽ lại theo Hình 2.3 SGK)"}, "dong": [{"the": "Nguyên tử khối = **trung bình** các đồng vị", "id": "c12-1"}, {"the": "{{35|17|Cl}} **75,77%** · {{37|17|Cl}} **24,23%**", "id": "c12-2"}, {"the": "Ā = (X·a + Y·b + …) : 100", "id": "c12-3"}, {"the": "Cl: Ā = **35,48**", "id": "c12-4"}]}, {"ma": "c13", "loai": "dien", "ten": "Câu 5 SGK: neon", "muc": "van-dung", "yccd": [3], "sgk": ["5"], "diem": 2, "hinh": {"anh": "b02-pho-ne.png"}, "hoi": "Dựa vào phổ khối lượng, tính nguyên tử khối trung bình của Ne (lấy 2 chữ số sau dấu phẩy).", "noi": "Bạn đọc phổ khối lượng của neon, rồi tính nguyên tử khối trung bình. Gõ kết quả với hai chữ số sau dấu phẩy nhé.", "dap": ["20,19", "20.19"], "giai": "Ā = (20 × 90,0 + 21 × 1,0 + 22 × 9,0) : 100. Bạn nhớ nhân mỗi số khối với phần trăm của chính nó.", "vi_sao": "Ā = (20 × 90 + 21 × 1 + 22 × 9) : 100 = 20,19.", "hoi_id": "c13-hoi", "sai_id": "c13-sai", "vi_sao_id": "c13-vi-sao"}, {"ma": "c14", "loai": "chon", "ten": "Câu 6 SGK: chromium", "muc": "hieu", "yccd": [2, 3], "sgk": ["6"], "hoi": "Vì sao nguyên tử khối của chromium là 51,996, không phải số nguyên?", "noi": "Vì sao nguyên tử khối của crôm trong bảng tuần hoàn là năm mươi mốt phẩy chín chín sáu, không phải số nguyên?", "lua": [{"chu": "Vì cân đo bị sai số", "giai": "Đây không phải sai số đo. Giá trị lẻ có lí do: nguyên tố gồm nhiều đồng vị.", "sai_id": "c14-sai-1"}, {"chu": "Vì electron có khối lượng lẻ", "giai": "Khối lượng electron rất nhỏ, không làm nguyên tử khối lẻ như vậy.", "sai_id": "c14-sai-2"}, {"chu": "Vì là trung bình của các đồng vị", "dung": true}, {"chu": "Vì Cr có số proton không nguyên", "giai": "Số proton luôn là số nguyên (Cr có 24 proton).", "sai_id": "c14-sai-4"}], "vi_sao": "51,996 là giá trị trung bình số khối các đồng vị Cr theo tỉ lệ phần trăm số nguyên tử (đo bằng phổ khối lượng), nên không phải số nguyên.", "hoi_id": "c14-hoi", "vi_sao_id": "c14-vi-sao"}, {"ma": "c15", "loai": "dien", "ten": "Câu 7 SGK: copper", "muc": "van-dung", "yccd": [3], "sgk": ["7"], "diem": 2, "hoi": "Ā(Cu) = 63,546; copper có hai đồng vị {{63|29|Cu}} và {{65|29|Cu}}. Phần trăm số nguyên tử {{63|29|Cu}} là bao nhiêu? (1 chữ số sau dấu phẩy)", "noi": "Nguyên tử khối trung bình của đồng là sáu mươi ba phẩy năm bốn sáu. Đồng có hai đồng vị sáu mươi ba và sáu mươi lăm. Bạn tính phần trăm số nguyên tử của đồng vị sáu mươi ba nhé.", "dap": ["72,7", "72.7", "72,7%", "72.7%"], "don_vi": "%", "giai": "Gọi phần trăm {{63|29|Cu}} là x, thì {{65|29|Cu}} là 100 − x. Giải: 63x + 65(100 − x) = 6354,6.", "vi_sao": "63x + 65(100 − x) = 6354,6 → 6500 − 2x = 6354,6 → x = 72,7. Vậy {{63|29|Cu}} chiếm 72,7%.", "hoi_id": "c15-hoi", "sai_id": "c15-sai", "vi_sao_id": "c15-vi-sao"}, {"ma": "c16", "loai": "chon", "ten": "Trả lời câu hỏi đầu bài", "muc": "hieu", "yccd": [1], "sgk": ["MD"], "hoi": "Các nguyên tử có cùng số đơn vị điện tích hạt nhân thì", "noi": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Các nguyên tử có cùng số đơn vị điện tích hạt nhân thì có đặc điểm gì chung?", "lua": [{"chu": "cùng số khối", "giai": "Cùng Z nhưng số neutron có thể khác, nên số khối có thể khác (ví dụ các đồng vị).", "sai_id": "c16-sai-1"}, {"chu": "cùng nguyên tố, tính chất hoá học giống", "dung": true}, {"chu": "cùng số neutron", "giai": "Các đồng vị cùng Z nhưng khác số neutron.", "sai_id": "c16-sai-3"}, {"chu": "khác số electron", "giai": "Số electron bằng số đơn vị điện tích hạt nhân, nên cùng Z thì cùng số electron.", "sai_id": "c16-sai-4"}], "vi_sao": "Cùng số đơn vị điện tích hạt nhân thì thuộc cùng một nguyên tố, có tính chất hoá học giống nhau. Số đơn vị điện : "D có Z = 9, khác L và E (Z = 8), nên không cùng nguyên tố."}, "c3-vi-sao": {"d": 6.888, "s": "media/c3-vi-sao.mp3", "loai": "am", "chu": "L và E cùng có Z = 8 nên cùng một nguyên tố (oxygen), dù số khối khác nhau."}, "c4-1": {"d": 5.52, "s": "media/c4-1.mp3", "loai": "am", "chu": "Số hiệu nguyên tử Z và số khối A là hai đặc trưng cơ bản của một nguyên tử."}, "c4-2": {"d": 7.536, "s": "media/c4-2.mp3", "loai": "am", "chu": "Khi viết kí hiệu nguyên tử, ta đặt hai số ở bên trái kí hiệu nguyên tố: Z ở dưới, A ở trên."}, "c4-3": {"d": 8.304, "s": "media/c4-3.mp3", "loai": "am", "chu": "Ví dụ, kí hiệu {{4|2|He}}: Z bằng 2 nên có 2 proton và 2 electron."}, "c4-4": {"d": 5.04, "s": "media/c4-4.mp3", "loai": "am", "chu": "Số khối bằng 4 nên số neutron bằng 4 trừ 2, bằng 2."}, "c5-hoi": {"d": 8.856, "s": "media/c5-hoi.mp3", "loai": "am", "chu": "Kí hiệu nguyên tử potassium có số khối ba mươi chín, số hiệu mười chín. Nguyên tử này có bao nhiêu hạt mỗi loại?"}, "c5-sai-1": {"d": 7.44, "s": "media/c5-sai-1.mp3", "loai": "am", "chu": "39 là số khối A = Z + N. Số neutron N = 39 − 19 = 20."}, "c5-sai-3": {"d": 5.976, "s": "media/c5-sai-3.mp3", "loai": "am", "chu": "Số ở dưới là Z = số proton = 19; số ở trên mới là số khối."}, "c5-sai-4": {"d": 7.824, "s": "media/c5-sai-4.mp3", "loai": "am", "chu": "Z = 19 nên có 19 proton, 19 electron. Số neutron là 20."}, "c5-vi-sao": {"d": 11.016, "s": "media/c5-vi-sao.mp3", "loai": "am", "chu": "Kí hiệu cho biết: tên nguyên tố (K), Z = số p = số e = 19, số khối 39, suy ra số neutron = 39 − 19 = 20."}, "c6-hoi": {"d": 6.144, "s": "media/c6-hoi.mp3", "loai": "am", "chu": "Bạn tính số khối bằng proton cộng neutron, rồi nối mỗi nguyên tử với kí hiệu đúng."}, "c6-sai": {"d": 7.44, "s": "media/c6-sai.mp3", "loai": "am", "chu": "Số khối A = số proton + số neutron, viết ở trên; số proton là Z, viết ở dưới."}, "c6-vi-sao": {"d": 12.168, "s": "media/c6-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! N: A = 7 + 7 = 14; P: A = 15 + 16 = 31; Cu: A = 29 + 34 = 63."}, "c6-sai-2": {"d": 5.952, "s": "media/c6-sai-2.mp3", "loai": "am", "chu": "Số ở dưới là Z = số proton = 15, không phải số neutron 16."}, "c7-1": {"d": 7.752, "s": "media/c7-1.mp3", "loai": "am", "chu": "Có những nguyên tử cùng số proton nhưng khác số neutron. Chúng gọi là các đồng vị của một nguyên tố."}, "c7-2": {"d": 9.312, "s": "media/c7-2.mp3", "loai": "am", "chu": "Ví dụ hydrogen có ba đồng vị: protium không có neutron, mình là deuterium có 1 neutron, còn tritium có 2 neutron."}, "c7-3": {"d": 5.736, "s": "media/c7-3.mp3", "loai": "am", "chu": "Khác số neutron nên các đồng vị khác nhau về khối lượng và một số tính chất vật lí."}, "c7-4": {"d": 6.984, "s": "media/c7-4.mp3", "loai": "am", "chu": "Các đồng vị không bền gọi là đồng vị phóng xạ, được dùng trong y học, nông nghiệp, nghiên cứu khoa học."}, "c8-hoi": {"d": 4.2, "s": "media/c8-hoi.mp3", "loai": "am", "chu": "Các đồng vị của cùng một nguyên tố khác nhau về điều gì?"}, "c8-sai-1": {"d": 3.744, "s": "media/c8-sai-1.mp3", "loai": "am", "chu": "Cùng một nguyên tố thì phải cùng số proton."}, "c8-sai-2": {"d": 5.856, "s": "media/c8-sai-2.mp3", "loai": "am", "chu": "Số electron bằng số proton, nên các đồng vị có cùng số electron."}, "c8-sai-4": {"d": 6.72, "s": "media/c8-sai-4.mp3", "loai": "am", "chu": "Electron quyết định tính chất hoá học; các đồng vị cùng số electron nên tính chất hoá học giống nhau."}, "c8-vi-sao": {"d": 7.824, "s": "media/c8-vi-sao.mp3", "loai": "am", "chu": "Đồng vị cùng số proton, cùng số electron, chỉ khác số neutron, nên khác số khối và khối lượng."}, "c9-hoi": {"d": 8.904, "s": "media/c9-hoi.mp3", "loai": "am", "chu": "Silicon có Z bằng mười bốn. Bạn nối mỗi đồng vị với số proton, neutron, electron của nó."}, "c9-sai": {"d": 7.896, "s": "media/c9-sai.mp3", "loai": "am", "chu": "Ba đồng vị cùng Z = 14 nên cùng 14 proton và 14 electron; số neutron = A − 14."}, "c9-vi-sao": {"d": 11.832, "s": "media/c9-vi-sao.mp3", "loai": "am", "chu": "Đúng hết! Cùng 14 p và 14 e; số neutron: 28 − 14 = 14; 29 − 14 = 15; 30 − 14 = 16."}, "c9-sai-2": {"d": 6.552, "s": "media/c9-sai-2.mp3", "loai": "am", "chu": "Si luôn có 14 proton. Đồng vị chỉ khác nhau ở số neutron."}, "c10-hoi": {"d": 9.192, "s": "media/c10-hoi.mp3", "loai": "am", "chu": "Sắt có Z bằng hai mươi sáu. Đồng vị sắt năm mươi bảy có bao nhiêu neutron? Bạn gõ số vào ô nhé."}, "c10-sai": {"d": 3.336, "s": "media/c10-sai.mp3", "loai": "am", "chu": "Số neutron N = A − Z."}, "c10-vi-sao": {"d": 15.648, "s": "media/c10-vi-sao.mp3", "loai": "am", "chu": "N = 57 − 26 = 31. Tương tự {{54|26|Fe}} có 28, {{56|26|Fe}} có 30, {{58|26|Fe}} có 32 neutron; cả bốn đồng vị đều có 26 p và 26 e."}, "c11-1": {"d": 2.664, "s": "media/c11-1.mp3", "loai": "am", "chu": "Bạn đọc thầm định nghĩa nhé."}, "c11-2": {"d": 6.168, "s": "media/c11-2.mp3", "loai": "am", "chu": "Nguyên tử khối cho biết nguyên tử đó nặng gấp bao nhiêu lần đơn vị khối lượng nguyên tử amu."}, "c11-3": {"d": 7.296, "s": "media/c11-3.mp3", "loai": "am", "chu": "Proton và neutron đều khoảng 1 amu, electron rất nhẹ, nên nguyên tử khối xấp xỉ số khối."}, "c11-4": {"d": 6.888, "s": "media/c11-4.mp3", "loai": "am", "chu": "Ví dụ potassium có 19 proton và 20 neutron, nên nguyên tử khối là 39."}, "c12-1": {"d": 9.528, "s": "media/c12-1.mp3", "loai": "am", "chu": "Hầu hết các nguyên tố trong tự nhiên là hỗn hợp nhiều đồng vị. Nguyên tử khối của nguyên tố là nguyên tử khối trung bình của hỗn hợp đó."}, "c12-2": {"d": 10.008, "s": "media/c12-2.mp3", "loai": "am", "chu": "Phổ khối lượng cho biết chlorine có hai đồng vị: chlorine 35 chiếm 75,77%, chlorine 37 chiếm 24,23%."}, "c12-3": {"d": 5.856, "s": "media/c12-3.mp3", "loai": "am", "chu": "Ta nhân mỗi số khối với phần trăm của nó, cộng lại, rồi chia cho 100."}, "c12-4": {"d": 4.752, "s": "media/c12-4.mp3", "loai": "am", "chu": "Nguyên tử khối trung bình của chlorine bằng 35,48."}, "c13-hoi": {"d": 9.0, "s": "media/c13-hoi.mp3", "loai": "am", "chu": "Bạn đọc phổ khối lượng của neon, rồi tính nguyên tử khối trung bình. Gõ kết quả với hai chữ số sau dấu phẩy nhé."}, "c13-sai": {"d": 11.448, "s": "media/c13-sai.mp3", "loai": "am", "chu": "Ā = (20 × 90,0 + 21 × 1,0 + 22 × 9,0) : 100. Bạn nhớ nhân mỗi số khối với phần trăm của chính nó."}, "c13-vi-sao": {"d": 7.296, "s": "media/c13-vi-sao.mp3", "loai": "am", "chu": "Ā = (20 × 90 + 21 × 1 + 22 × 9) : 100 = 20,19."}, "c14-hoi": {"d": 6.696, "s": "media/c14-hoi.mp3", "loai": "am", "chu": "Vì sao nguyên tử khối của crôm trong bảng tuần hoàn là năm mươi mốt phẩy chín chín sáu, không phải số nguyên?"}, "c14-sai-1": {"d": 7.128, "s": "media/c14-sai-1.mp3", "loai": "am", "chu": "Đây không phải sai số đo. Giá trị lẻ có lí do: nguyên tố gồm nhiều đồng vị."}, "c14-sai-2": {"d": 5.112, "s": "media/c14-sai-2.mp3", "loai": "am", "chu": "Khối lượng electron rất nhỏ, không làm nguyên tử khối lẻ như vậy."}, "c14-sai-4": {"d": 5.352, "s": "media/c14-sai-4.mp3", "loai": "am", "chu": "Số proton luôn là số nguyên (Cr có 24 proton)."}, "c14-vi-sao": {"d": 10.248, "s": "media/c14-vi-sao.mp3", "loai": "am", "chu": "51,996 là giá trị trung bình số khối các đồng vị Cr theo tỉ lệ phần trăm số nguyên tử (đo bằng phổ khối lượng), nên không phải số nguyên."}, "c15-hoi": {"d": 12.864, "s": "media/c15-hoi.mp3", "loai": "am", "chu": "Nguyên tử khối trung bình của đồng là sáu mươi ba phẩy năm bốn sáu. Đồng có hai đồng vị sáu mươi ba và sáu mươi lăm. Bạn tính phần trăm số nguyên tử của đồng vị sáu mươi ba nhé."}, "c15-sai": {"d": 11.208, "s": "media/c15-sai.mp3", "loai": "am", "chu": "Gọi phần trăm {{63|29|Cu}} là x, thì {{65|29|Cu}} là 100 − x. Giải: 63x + 65(100 − x) = 6354,6."}, "c15-vi-sao": {"d": 15.456, "s": "media/c15-vi-sao.mp3", "loai": "am", "chu": "63x + 65(100 − x) = 6354,6 → 6500 − 2x = 6354,6 → x = 72,7. Vậy {{63|29|Cu}} chiếm 72,7%."}, "c16-hoi": {"d": 8.712, "s": "media/c16-hoi.mp3", "loai": "am", "chu": "Bây giờ bạn trả lời câu hỏi đầu bài nhé. Các nguyên tử có cùng số đơn vị điện tích hạt nhân thì có đặc điểm gì chung?"}, "c16-sai-1": {"d": 6.672, "s": "media/c16-sai-1.mp3", "loai": "am", "chu": "Cùng Z nhưng số neutron có thể khác, nên số khối có thể khác (ví dụ các đồng vị)."}, "c16-sai-3": {"d": 3.624, "s": "media/c16-sai-3.mp3", "loai": "am", "chu": "Các đồng vị cùng Z nhưng khác số neutron."}, "c16-sai-4": {"d": 6.336, "s": "media/c16-sai-4.mp3", "loai": "am", "chu": "Số electron bằng số đơn vị điện tích hạt nhân, nên cùng Z thì cùng số electron."}, "c16-vi-sao": {"d": 11.112, "s": "media/c16-vi-sao.mp3", "loai": "am", "chu": "Cùng số đơn vị điện tích hạt nhân thì thuộc cùng một nguyên tố, có tính chất hoá học giống nhau. Số đơn vị điện tích hạt nhân = số proton = số electron."}, "c17-1": {"d": 3.384, "s": "media/c17-1.mp3", "loai": "am", "chu": "Mình cùng chốt lại ba ý của bài nhé."}, "c17-2": {"d": 10.32, "s": "media/c17-2.mp3", "loai": "am", "chu": "Nguyên tố hoá học là tập hợp các nguyên tử cùng số đơn vị điện tích hạt nhân. Kí hiệu nguyên tử ghi số khối A ở trên, số hiệu Z ở dưới."}, "c17-3": {"d": 4.848, "s": "media/c17-3.mp3", "loai": "am", "chu": "Đồng vị là các nguyên tử cùng số proton nhưng khác số neutron."}, "c17-4": {"d": 10.44, "s": "media/c17-4.mp3", "loai": "am", "chu": "Nguyên tử khối của nguyên tố là trung bình các đồng vị theo phần trăm. Như mình và anh Protium đấy, khác cân nặng nhưng vẫn là hydrogen!"}, "khen-1": {"d": 3.552, "s": "media/khen-1.mp3", "loai": "am", "chu": "Đúng rồi! Bạn giỏi quá!"}, "khen-2": {"d": 3.144, "s": "media/khen-2.mp3", "loai": "am", "chu": "Chính xác! Tuyệt vời!"}, "khen-3": {"d": 2.856, "s": "media/khen-3.mp3", "loai": "am", "chu": "Đúng rồi, làm tốt lắm!"}, "chon-truoc": {"d": 3.528, "s": "media/chon-truoc.mp3", "loai": "am", "chu": "Bạn bấm vào một ô ở hàng trên trước nhé."}, "ket": {"d": 6.528, "s": "media/ket.mp3", "loai": "am", "chu": "Bạn đã học xong nguyên tố hoá học. Bạn bấm Chép kết quả để gửi cô Thơi nhé!"}}/*__MEDIA_HET__*/;

const hex2 = h => { h = String(h || "#000000").replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
